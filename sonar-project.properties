# SonarCloud project configuration (CI-based analysis).
# Migrated off Automatic Analysis so the scanner runs in GitHub Actions,
# producing real, greppable logs on every run. See #1525.

sonar.projectKey=ima-jin_imajin-ai
sonar.organization=ima-jin

# Pin encoding explicitly. Stops the scanner's charset heuristic from raising
# vague "problems with file encoding" warnings on clean ASCII/UTF-8 files;
# a genuinely non-UTF-8 file now fails as a hard, named error instead.
sonar.sourceEncoding=UTF-8

# Binaries are not source. Also exclude SQL migrations: SonarCloud analyzes
# .sql as Oracle PL/SQL, but ours is Postgres — it "can't fully parse" them and
# raised the vague file-encoding-family warning. See #1525.
sonar.exclusions=**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.webp,**/*.woff,**/*.woff2,**/*.ttf,**/*.eot,**/*.pdf,**/*.sql,migrations/**

# Coverage. The CI Test job runs `pnpm test:coverage` and hands the report to the
# SonarCloud job as an artifact. Without this the scanner sees no coverage data at
# all and reports new_coverage=0.0, which fails the quality gate on any PR that
# adds code — regardless of how well tested it actually is.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Files that should not count toward the coverage requirement. Tests describe
# behaviour rather than being behaviour under test; config and operational scripts
# are not meaningfully unit-testable. Kept deliberately narrow — every entry here
# is a line of source the gate stops protecting.
sonar.coverage.exclusions=**/__tests__/**,**/*.test.ts,**/*.config.js,**/*.config.ts,**/*.config.mjs,scripts/**,deploy/**
