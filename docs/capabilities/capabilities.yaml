    entry_points:
      ui:
        - /
        - /project
        - /whitepaper
        - /developer-guide
        - /registry/docs
      api: []
      sdk: []
    audience:
      value: business buyer
      rationale: "business buyer: Understand the platform, read its integration contracts and decide whether to sign
        up or request a demo. The cited entrypoints identify the acting role, not an observed user count."
      paths:
        - apps/kernel/app/page.tsx
        - apps/kernel/app/register/page.tsx
        - apps/kernel/app/registry/docs/page.tsx
    maturity:
      value: partial
      rationale: The landing page still leads with the protocol matrix; /register redirects to /subscribe. API docs
        exist, but a business demo and direct sign-up journey are not demonstrated.
