capabilities:
  - id: agent-provision
    name: Give each agent its own identity
    action: Create or adopt an agent DID for a personal or organization principal.
    apps:
      - kernel
    services:
      - auth
    packages:
      - auth
    entry_points:
      ui:
        - /auth/agents
      api:
        - /auth/api/agents
        - /auth/api/agents/provision
        - /auth/api/agents/adopt
      sdk:
        - "@imajin/auth"
      specs:
        - apps/kernel/api-spec/auth.yaml
    audience: org admin
    maturity: live
    business_weight: core
    pillars:
      - agent identity
      - delegated authority
    grade_reason: Provisioning and acting-org ownership are implemented and tested; hosted instance lifecycle is
      separate unfinished work.
    evidence:
      code:
        - apps/kernel/src/lib/auth/agent-provisioner.ts
        - apps/kernel/src/lib/auth/agent-adoption.ts
        - apps/kernel/app/auth/agents/page.tsx
        - packages/auth/src/index.ts
