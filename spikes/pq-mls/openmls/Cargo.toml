[package]
name = "pq-mls-openmls-spike"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { git = "https://github.com/openmls/openmls", rev = "8a8f83b4b61fc45f28facec25e914992b3465de6", features = ["js", "draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "8a8f83b4b61fc45f28facec25e914992b3465de6", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_libcrux_crypto = { git = "https://github.com/openmls/openmls", rev = "8a8f83b4b61fc45f28facec25e914992b3465de6", features = ["draft-ietf-mls-pq-ciphersuites"] }
wasm-bindgen = "=0.2.129"
serde_json = "1"
zeroize = "1"

[profile.release]
opt-level = "s"
lto = true
