    <text x="140" y="112" fill="#e5e7eb" font-size="40" font-weight="600">Imajin</text>
    <text x="1128" y="108" fill="#f97316" font-size="26" text-anchor="end">Alpha</text>
    <text x="72" y="275" fill="#e5e7eb" font-size="68" font-weight="600">
      <tspan x="72">identity and authority</tspan>
      <tspan x="72" dy="84">for AI agents.</tspan>
    </text>
    <text x="72" y="463" fill="#9ca3af" font-size="28">
      <tspan x="72">your agents act as themselves, on your authority,</tspan>
      <tspan x="72" dy="40">and every action is signed.</tspan>
