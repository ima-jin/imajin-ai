openapi: "3.1.0"
info:
  title: imajin notify
  version: "2.0.0"
  description: Centralized notifications, preferences, event broadcasts, and interest subscriptions. Runs as a kernel service at /{service}/api/... on a shared node domain. Port 3008/7008, schema notify.
servers:
  - url: https://{node}.imajin.ai/{service}
    description: production node
    variables:
      node:
        default: jin
      service:
        default: notify
  - url: http://localhost:3000/{service}
    description: local development

tags:
  - name: notify
    description: imajin notify service

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: imajin_session
    bearerAuth:
      type: http
      scheme: bearer
      description: "Registered app-service JWT with endpoint scope and current operator approval, or vault-sourced internal Bearer key. User/session tokens and legacy webhook secrets are not accepted by send/broadcast/interest."
  schemas:
    Notification:
      type: object
      properties:
        id: { type: string }
        did: { type: string, description: "Recipient DID" }
        type: { type: string, description: "Notification type (e.g. connection_request, message, payment)" }
        title: { type: string }
        body: { type: string }
        data: { type: object, description: "Additional payload data" }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
        deliveredAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this notification last reached a live WebSocket frame (a
            live push or a backlog replay on reconnect). Null means it has
            never been delivered yet. Distinct from `read`, which the
            recipient controls (#2044).
    NotificationPreference:
      type: object
      properties:
        scope: { type: string }
        enabled: { type: boolean }
        channels:
          type: array
          items:
            type: string
            enum: [push, email, in-app]
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

paths:
  /api/health:
    get:
      tags: [notify]
      operationId: healthCheck
      summary: Service health check
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
                  timestamp: { type: string, format: date-time }

  /api/notifications:
    get:
      tags: [notify]
      operationId: listNotifications
      summary: List notifications for the current identity
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: unread
          in: query
          schema: { type: boolean }
          description: Filter to unread only
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  total: { type: integer }
                  unread: { type: integer }
        "401":
          description: Unauthorized

  /api/notifications/{id}/read:
    post:
      tags: [notify]
      operationId: markNotificationRead
      summary: Mark a specific notification as read
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Notification ID
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  read: { type: boolean }
        "404":
          description: Notification not found
        "401":
          description: Unauthorized

  /api/notifications/read-all:
    post:
      tags: [notify]
      operationId: markAllNotificationsRead
      summary: Mark all notifications as read for the current identity
      security:
        - cookieAuth: []
      responses:
        "200":
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer, description: "Number of notifications marked read" }
        "401":
          description: Unauthorized

  /api/notifications/unread:
    get:
      tags: [notify]
      operationId: getUnreadCount
      summary: Get unread notification count for the current identity
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer }
        "401":
          description: Unauthorized

  /api/preferences:
    get:
      tags: [notify]
      operationId: listPreferences
      summary: Get all notification preferences for the current identity
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotificationPreference" }
        "401":
          description: Unauthorized
    put:
      tags: [notify]
      operationId: updatePreferences
      summary: Update notification preferences (bulk)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/NotificationPreference" }
      responses:
        "200":
          description: Preferences updated
        "401":
          description: Unauthorized

  /api/preferences/{scope}:
    get:
      tags: [notify]
      operationId: getPreferenceScope
      summary: Get notification preference for a specific scope
      security:
        - cookieAuth: []
      parameters:
        - name: scope
          in: path
          required: true
          schema: { type: string }
          description: Notification scope (e.g. chat.message, pay.received, connection.request)
      responses:
        "200":
          description: Preference for scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreference" }
        "404":
          description: Scope preference not found
    put:
      tags: [notify]
      operationId: setPreferenceScope
      summary: Set notification preference for a specific scope
      security:
        - cookieAuth: []
      parameters:
        - name: scope
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreference" }
      responses:
        "200":
          description: Preference updated
        "401":
          description: Unauthorized

  /api/send:
    post:
      tags: [notify]
      operationId: sendNotification
      summary: Send a notification
      description: Requires notify:send in an app-service token and the active app's approvedServiceScopes, or the vault internal Bearer key. Registration and approval are checked on every request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, scope]
              properties:
                to: { type: string, description: Recipient DID }
                scope: { type: string, description: Notification template scope }
                title: { type: string }
                body: { type: string }
                data: { type: object }
                urgency: { type: string, enum: [low, normal, urgent] }
      responses:
        "200":
          description: Notification stored; sent reflects delivery outcome when email was attempted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  sent: { type: boolean }
        "400":
          description: Invalid request
        "401":
          description: Missing or invalid Bearer credential
        "403":
          description: Not an active approved app-service token, or missing notify:send

  /api/broadcast:
    post:
      tags: [notify]
      operationId: broadcastNotification
      summary: Broadcast to an interest audience
      description: Requires notify:broadcast in an app-service token and the active app's approvedServiceScopes, or the vault internal Bearer key. Registry calls use the kernel's own vault credential, never the caller token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, subject]
              anyOf:
                - required: [html]
                - required: [markdown]
              properties:
                scope: { type: string }
                dids: { type: array, items: { type: string } }
                subject: { type: string }
                html: { type: string }
                markdown: { type: string }
                text: { type: string }
                channels: { type: array, items: { type: string, enum: [email, inapp, chat] } }
                eventContext: { type: object }
                replyTo: { type: string }
      responses:
        "200":
          description: Broadcast processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: integer }
                  skipped: { type: integer }
                  errors: { type: integer }
        "400":
          description: Invalid request
        "401":
          description: Missing or invalid Bearer credential
        "403":
          description: Not an active approved app-service token, or missing notify:broadcast

  /api/interest:
    post:
      tags: [notify]
      operationId: registerInterest
      summary: Record an interest signal for a DID from an attestation type
      description: Requires notify:interest in an app-service token and the active app's approvedServiceScopes, or the vault internal Bearer key. The registry catalog maps attestationType to an interest scope; auto-subscribe preferences govern defaults.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [did, attestationType]
              properties:
                did: { type: string }
                attestationType: { type: string }
      responses:
        "200":
          description: Interest created, already present, or no matching catalog scope
        "400":
          description: Invalid request
        "401":
          description: Missing or invalid Bearer credential
        "403":
          description: Not an active approved app-service token, or missing notify:interest

  /api/unsubscribe:
    get:
      tags: [notify]
      operationId: unsubscribeEmail
      summary: One-click email unsubscribe (linked from notification emails)
      description: No auth required. Uses a signed token in query params to identify the recipient and scope.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: Signed unsubscribe token from email link
        - name: scope
          in: query
          schema: { type: string }
          description: Specific scope to unsubscribe from (omit to unsubscribe all email)
      responses:
        "200":
          description: Unsubscribed successfully
          content:
            text/html:
              schema: { type: string }
        "400":
          description: Invalid or expired token

  /api/spec:
    get:
      tags: [notify]
      operationId: getSpec
      summary: Serve the OpenAPI spec YAML
      responses:
        "200":
          description: OpenAPI YAML
          content:
            text/yaml:
              schema: { type: string }
