openapi: "3.1.0"
info:
  title: imajin vault
  version: "1.0.0"
  description: |
    Kernel-side sealed-secret vault. Unlike every other spec in this
    directory, vault routes are NOT served under `/{service}/api/...` — they
    are top-level kernel routes at `/api/vault/**`. Paths below are given as
    the real, absolute routes for that reason; the `servers` entries below
    resolve to the kernel root, not `/vault`.

    This spec currently documents `vault.mint` (#2242): generating an
    Ed25519 keypair INSIDE the vault and revoking a minted key. The private
    key is sealed the same way any other vault secret is sealed and is
    never returned by any route here — only `{ did, publicKey }`. It is
    delivered to its intended recipient (`requesterDid`) as a one-time,
    purpose-bound delegation grant, fetchable through the PRE-EXISTING
    (#2231) `POST /api/vault/delegation/grants/{grantId}/fetch` route — no
    new fetch surface exists for minted keys.

    The broader pre-existing vault surface (`/api/vault/delegation/**`,
    `/api/vault/set`, `/api/vault/rotate`, `/api/vault/grants/**`, etc.) is
    not yet backfilled into this spec.
servers:
  - url: https://{node}.imajin.ai
    description: production node
    variables:
      node:
        default: jin
  - url: http://localhost:3000
    description: local development

tags:
  - name: vault-mint
    description: vault.mint (#2242) — Ed25519 keypairs born inside the vault
  - name: vault-import
    description: Third-party credentials sealed once for an identity and purpose-bound consumer (#2260)

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: imajin_session
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

paths:
  /api/vault/import:
    get:
      tags: [vault-import]
      operationId: vaultImportCards
      summary: Authorized owning identities and imported-credential timeline cards
      description: >-
        Returns the authenticated human's identity and groups they currently
        administer, the preferred owning DID (including an authorized acting-as
        group), and imported credential metadata across those owners. No
        plaintext, ciphertext or wrapped keys are returned. Imported provenance
        is projected from the existing approval record and v2 grants, not a
        parallel credential store. Consumer fetch/ack timestamps use the
        existing #2231 delegation path.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: query
          name: ownerDid
          schema: { type: string }
          description: Optionally narrow cards to an authorized owning identity.
      responses:
        "200":
          description: Metadata only; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [ownerDid, owners, cards]
                properties:
                  ownerDid: { type: string }
                  owners:
                    type: array
                    items:
                      type: object
                      required: [did, name]
                      properties:
                        did: { type: string }
                        name: { type: string }
                  cards:
                    type: array
                    items:
                      type: object
                      required: [field, ownerDid, consumerDid, purpose, fingerprint, grantId, provenance, status, timeline]
                      properties:
                        field: { type: string }
                        ownerDid: { type: string }
                        consumerDid: { type: string }
                        purpose: { type: string }
                        label: { type: [string, "null"] }
                        fingerprint: { type: string, description: SHA-256 digest; never credential bytes or last4 }
                        grantId: { type: [string, "null"] }
                        provenance: { type: string, const: imported }
                        status: { type: string }
                        timeline:
                          type: array
                          items:
                            type: object
                            required: [type, at]
                            properties:
                              type: { type: string, enum: [imported, granted, fetched, acked, rotated, revoked] }
                              at: { type: string, format: date-time }
                              alert: { type: boolean, description: Fetched without a matching acknowledgment }
        "401":
          description: Authentication required
        "403":
          description: Delegated agent or unauthorized owning identity
        "503":
          description: Metadata unavailable; generic error without credential material
    post:
      tags: [vault-import]
      operationId: vaultImport
      summary: Paste once and propose an identity-owned static-secret import or rotation
      description: |
        The real authenticated human may target themselves or an org/group
        where they hold an active owner/admin role. The owning DID is explicit
        and checked server-side; a borrowed or agent identity cannot approve.
        Acting-as a group selects custody, not who signs the decision.

        Input is immediately sealed using the existing vault staging path.
        The returned proposal carries owner, consumer, purpose, expiry and a
        fingerprint only; it never carries the submitted credential. Approve
        via the existing `/jin/api/operator-approvals/{proposalId}/decision`
        route as the real human, with their verified countersignature. The node
        rechecks ownership authority and executes `sealAndGrantStaticSecret`
        with principalDid = ownerDid and granteeDid = consumerDid, attesting
        `vault.key.imported`. This reuses v2 delegation custody, not a new store.

        Consumers discover the purpose-bound grant through `imajin_vault`
        `list_grants` and resolve it with `fetch`; services can use the existing
        `loadFromVault` boot helper and acknowledgment path. The card timeline
        shows imported → granted → fetched → acked. After migrating a service,
        remove its old credential line from `.env.local`; the kernel does not
        modify remote consumer files.

        `replacesField` proposes re-import → grant → revoke old as one signed
        rotation. The old owner must match; old access remains until successful
        replacement. External-issuer auto-rotation is out of scope. The
        synchronous import executor fails closed under external Tier-1 custody.
        Plaintext is never echoed, logged, returned, or persisted unsealed.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ownerDid, purpose, consumerDid, secret]
              properties:
                ownerDid:
                  type: string
                  description: Identity that owns the sealed field, including an administered group DID.
                purpose: { type: string, minLength: 1, maxLength: 200 }
                consumerDid:
                  type: string
                  description: Agent or service DID receiving the purpose-bound v2 grant.
                secret:
                  type: string
                  writeOnly: true
                  minLength: 1
                  description: At most 65536 UTF-8 bytes. Paste field is cleared on submission; no reveal.
                label: { type: string, maxLength: 200 }
                expiresAt: { type: [string, "null"], format: date-time }
                replacesField:
                  type: string
                  description: An existing imported field owned by ownerDid; revoke only after replacement succeeds.
      responses:
        "201":
          description: Sealed pending a real human countersignature; metadata only, Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [status, proposalId, fingerprint, purpose]
                properties:
                  status: { type: string, const: pending }
                  proposalId: { type: string }
                  fingerprint: { type: string }
                  purpose: { type: string }
        "400":
          description: Invalid body, DID, purpose, size or expiry
        "401":
          description: Authentication required
        "403":
          description: Caller is not the real owner or active group administrator
        "409":
          description: Unsupported custody or invalid replacement
        "503":
          description: Import unavailable; generic error without credential material
  /api/vault/mint:
    post:
      tags: [vault-mint]
      operationId: vaultMint
      summary: Generate an Ed25519 keypair INSIDE the vault
      description: >-
        The private key is sealed via the same v2 delegation-grant custody
        path every other vault secret uses, and is never present in this
        response. Auth: the caller's resolved acting DID
        (requireAuth + X-Acting-For) must be the vault's own node signing
        identity, self or delegated — see
        `apps/kernel/src/lib/vault/mint-authority.ts`. Emits a signed
        `vault.key.minted` attestation (issuer = acting principal, subject =
        the new DID) and a `vault.key.minted` bus event for the audit log.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, requesterDid]
              properties:
                purpose:
                  type: string
                  maxLength: 200
                  description: Free-form label naming what the minted key will be used for.
                requesterDid:
                  type: string
                  description: >-
                    The DID that should receive the one-time delegation
                    grant for the sealed private key (e.g. a service's own
                    pre-existing bootstrap identity). Distinct from the
                    authenticated caller.
                expiresAt:
                  type: [string, "null"]
                  format: date-time
                  description: Optional expiry for the resulting delegation grant.
      responses:
        "201":
          description: Keypair minted
          content:
            application/json:
              schema:
                type: object
                required: [did, publicKey]
                properties:
                  did: { type: string, description: "The newly minted DID (did:imajin:...)" }
                  publicKey: { type: string, description: "Hex-encoded Ed25519 public key" }
        "400":
          description: Missing or invalid purpose/requesterDid/expiresAt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Authenticated, but not the vault node identity (or its delegate)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/vault/mint/revoke:
    post:
      tags: [vault-mint]
      operationId: vaultMintRevoke
      summary: Tombstone a previously minted key
      description: >-
        Soft tombstone (v1): the minted-key record is marked revoked
        (surviving as the record that a key existed and was withdrawn), and
        the delegation grant's wrapped key material is erased so a
        subsequent fetch of that grant fails closed. The underlying vault
        field entry itself is left in place. Idempotent: revoking an
        already-revoked key returns `{ ok: true, alreadyRevoked: true }`
        rather than erroring. Emits a signed `vault.key.revoked` attestation
        and a matching bus event.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [did]
              properties:
                did:
                  type: string
                  description: The minted DID to revoke.
      responses:
        "200":
          description: Revoked (or already revoked)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  did: { type: string }
                  mintId: { type: string }
                  alreadyRevoked: { type: boolean }
        "400":
          description: Missing did
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Authenticated, but not the vault node identity (or its delegate)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No minted key found for this DID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/vault/mint/cards:
    get:
      tags: [vault-mint]
      operationId: vaultMintCards
      summary: Vault key cards read model for the /jin Vault section (#2247)
      description: >-
        One timeline card per minted key (minted/granted/fetched/acked/
        revoked rows, never a value — there is no reveal/copy affordance
        anywhere in this codebase's mint-in-vault path), plus the
        "hand-provisioned" filter list: vault entries whose field name was
        never produced by `mintKeypair` (derived by elimination from the
        `vault-minted-key:` field-name prefix, not a stored provenance
        flag — see `apps/kernel/src/lib/vault/key-cards.ts`).
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        did: { type: string }
                        publicKey: { type: string }
                        purpose: { type: string }
                        requestedBy: { type: string }
                        mintedBy: { type: string }
                        status: { type: string, enum: [active, revoked] }
                        createdAt: { type: string, format: date-time }
                        revokedAt: { type: [string, "null"], format: date-time }
                        revokedBy: { type: [string, "null"] }
                        grant:
                          type: [object, "null"]
                          description: The mint-time grant this key's sealed value was originally delivered through, whatever its current status.
                          properties:
                            grantId: { type: string }
                            grantedTo: { type: string }
                            purpose: { type: [string, "null"] }
                            oneTime: { type: boolean }
                            status: { type: string }
                            expiresAt: { type: [string, "null"], format: date-time }
                            consumedAt: { type: [string, "null"], format: date-time }
                            lastFetchedAt: { type: [string, "null"], format: date-time }
                            ackedAt: { type: [string, "null"], format: date-time }
                            ackOutcome: { type: [string, "null"] }
                            ackEvidence: { type: [object, "null"] }
                            createdAt: { type: string, format: date-time }
                        grants:
                          type: array
                          description: >-
                            Every currently ACTIVE consumer grant for this key's field
                            (#2298) — not just `grant` above. A field can carry more than
                            one active grant once a second consumer is granted access via
                            the "Grant access" action, which never updates `grant`/`grantId`.
                          items:
                            type: object
                            properties:
                              grantId: { type: string }
                              grantedTo: { type: string }
                              purpose: { type: [string, "null"] }
                              oneTime: { type: boolean }
                              status: { type: string }
                              expiresAt: { type: [string, "null"], format: date-time }
                              consumedAt: { type: [string, "null"], format: date-time }
                              lastFetchedAt: { type: [string, "null"], format: date-time }
                              ackedAt: { type: [string, "null"], format: date-time }
                              ackOutcome: { type: [string, "null"] }
                              ackEvidence: { type: [object, "null"] }
                              createdAt: { type: string, format: date-time }
                        timeline:
                          type: array
                          items:
                            type: object
                            properties:
                              type: { type: string, enum: [minted, granted, fetched, acked, rotated, revoked] }
                              at: { type: string, format: date-time }
                              alert:
                                type: boolean
                                description: "True for a 'fetched' row with no matching ack yet — the honest-record red line."
                              detail: { type: object }
                        heldBy: { type: [string, "null"] }
                        lastAckAt: { type: [string, "null"], format: date-time }
                        fetchWithoutAck: { type: boolean }
                  handProvisioned:
                    type: array
                    items:
                      type: object
                      properties:
                        field: { type: string }
                        senderDid: { type: string }
                        timestamp: { type: string, format: date-time }
                        custodyScheme: { type: string }
                        status: { type: string, enum: [active, deleted] }
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
