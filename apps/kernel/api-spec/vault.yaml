openapi: "3.1.0"
info:
  title: imajin vault
  version: "1.0.0"
  description: |
    Kernel-side sealed-secret vault. Unlike every other spec in this
    directory, vault routes are NOT served under `/{service}/api/...` — they
    are top-level kernel routes at `/api/vault/**`. Paths below are given as
    the real, absolute routes for that reason; the `servers` entries below
    resolve to the kernel root, not `/vault`.

    This spec currently documents `vault.mint` (#2242): generating an
    Ed25519 keypair INSIDE the vault and revoking a minted key. The private
    key is sealed the same way any other vault secret is sealed and is
    never returned by any route here — only `{ did, publicKey }`. It is
    delivered to its intended recipient (`requesterDid`) as a one-time,
    purpose-bound delegation grant, fetchable through the PRE-EXISTING
    (#2231) `POST /api/vault/delegation/grants/{grantId}/fetch` route — no
    new fetch surface exists for minted keys.

    The broader pre-existing vault surface (`/api/vault/delegation/**`,
    `/api/vault/set`, `/api/vault/rotate`, `/api/vault/grants/**`, etc.) is
    not yet backfilled into this spec.
servers:
  - url: https://{node}.imajin.ai
    description: production node
    variables:
      node:
        default: jin
  - url: http://localhost:3000
    description: local development

tags:
  - name: vault-mint
    description: vault.mint (#2242) — Ed25519 keypairs born inside the vault
  - name: vault-import
    description: Third-party credentials sealed once for an identity and purpose-bound consumer (#2260)

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: imajin_session
    bearerAuth:
      type: http
      scheme: bearer
    githubOidc:
      type: apiKey
      in: header
      name: x-github-oidc-token
      description: GitHub Actions RS256 OIDC token, audience urn:imajin:vault:ssh-cert
  schemas:
    SshCaPurpose:
      type: string
      pattern: "^[a-z][a-z0-9._-]{0,63}$"
      description: Canonical reusable purpose; not tied to a particular consumer.
    SshCa:
      type: object
      additionalProperties: false
      required: [caId, purpose, status, publicKey, fingerprint]
      properties:
        caId: { type: string }
        purpose: { $ref: "#/components/schemas/SshCaPurpose" }
        status: { type: string, const: active }
        publicKey: { type: string, description: OpenSSH ssh-ed25519 line with comment }
        fingerprint: { type: string, description: OpenSSH SHA256 fingerprint of the public wire blob }
    CloudflareAuthority:
      type: object
      additionalProperties: false
      required: [domain, zoneId, granteeDid, capabilities]
      properties:
        domain: { type: string, description: Exact canonical verified zone domain }
        zoneId: { type: string, pattern: "^[a-f0-9]{32}$" }
        granteeDid: { type: string, description: Any DID; never receives the token }
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: ["cloudflare:read", "cloudflare:dns", "cloudflare:cache", "cloudflare:ssl", "cloudflare:custom-hostnames"] }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

paths:
  /vault/api/spec:
    get:
      tags: [vault-mint]
      operationId: vaultApiSpec
      summary: Read the public vault OpenAPI contract advertised by the spec catalogue
      security: []
      responses:
        "200":
          description: Vault OpenAPI source, including every SSH CA route
          content:
            text/yaml:
              schema: { type: string }
        "503": { description: Vault spec unavailable }
  /api/vault/ssh-ca:
    post:
      tags: [vault-mint]
      operationId: vaultSshCaMint
      summary: Mint a kernel-custodied SSH CA through vault.mint
      description: |
        Uses the existing mintKeypair path. The private key is sealed with a
        node-only grant in a protected namespace: no generic fetch, grant,
        rotation export or plaintext route may disclose it, even to the node.
        The resolved acting DID must be the vault node or its authorized delegate.
        Tier-1 external custody is refused before generation. One active signer
        per purpose; repeated mint returns 409. Sign with the separate sign route.
        Commits a node-signed vault.ssh-ca.minted attestation with CA id,
        purpose, actor, composedBy and fingerprint, never key material.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose]
              properties:
                purpose: { $ref: "#/components/schemas/SshCaPurpose" }
      responses:
        "201":
          description: Public metadata only; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SshCa" }
        "400": { description: Invalid JSON, purpose or unexpected property }
        "401": { description: Authentication required }
        "403": { description: Not the vault node or its delegate }
        "409": { description: Active CA already exists or unsupported custody }
        "503": { description: CA unavailable; generic error without secret details }
  /api/vault/ssh-ca/rotate:
    post:
      tags: [vault-mint]
      operationId: vaultSshCaRotate
      summary: Mint a replacement signer and overlap public trust
      description: |
        Same authority as mint. Serializes per purpose with mint, revoke and
        signing. Public trusted reads are lock-free. Mints through vault.mint, then atomically withdraws the
        previous private signing grant and marks its mint record retiring.
        revokedAt records the signing withdrawal instant. Both public keys stay
        trusted for SSH_CA_MAX_CERT_TTL_SECONDS (900 seconds) after that instant.
        The default certificate TTL for phase 2 is 600 seconds; phase 2 must
        enforce the cap and use the same purpose lock, never cache a signer.
        Further rotations preserve each older key's original deadline.
        Emits signed minted and rotated attestations; rotated binds old/new
        ids and fingerprints, actor, purpose and previousTrustedUntil.
        No rows or sealed history are deleted. Host trust changes require deploy.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose]
              properties:
                purpose: { $ref: "#/components/schemas/SshCaPurpose" }
      responses:
        "201":
          description: Replacement signer public metadata; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SshCa" }
        "400": { description: Invalid JSON, purpose or unexpected property }
        "401": { description: Authentication required }
        "403": { description: Not the vault node or its delegate }
        "404": { description: No active signer for this purpose }
        "409": { description: Unsupported custody }
        "503": { description: Rotation unavailable; old signer unchanged on rollback }
  /api/vault/ssh-ca/revoke:
    post:
      tags: [vault-mint]
      operationId: vaultSshCaRevoke
      summary: Immediately withdraw a particular CA from public trust
      description: |
        Same authority as mint. Revokes an active or overlapping key by CA id
        AND purpose. Atomically revokes its signing grant, marks the mint row
        revoked and stores a signed vault.ssh-ca.revoked attestation with
        CA id, purpose, actor, composedBy and fingerprint. History survives.
        Already-revoked keys are successful no-ops with no duplicate attestation.
        The next trusted read excludes the key immediately; one host deploy
        removes it from TrustedUserCAKeys. Does not mint a replacement.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose, caId]
              properties:
                purpose: { $ref: "#/components/schemas/SshCaPurpose" }
                caId: { type: string, pattern: "^vmk_[a-zA-Z0-9_-]{1,100}$" }
      responses:
        "200":
          description: Revoked or already revoked; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [caId, alreadyRevoked]
                properties:
                  caId: { type: string }
                  alreadyRevoked: { type: boolean }
        "400": { description: Invalid JSON, purpose, CA id or unexpected property }
        "401": { description: Authentication required }
        "403": { description: Not the vault node or its delegate }
        "404": { description: No CA with this id and purpose }
        "503": { description: Revocation unavailable; generic error without secret details }
  /api/vault/ssh-ca/trusted-keys:
    get:
      tags: [vault-mint]
      operationId: vaultSshCaTrustedKeys
      summary: Public OpenSSH TrustedUserCAKeys contents for one purpose
      description: |
        Anonymous public-only route, Cache-Control no-store. Returns newline-
        terminated ssh-ed25519 lines (or an empty file for unknown/revoked
        purposes). Reads are lock-free projections with no writes:
        once the signing-withdrawal instant plus the 900-second maximum cert
        TTL is reached, the old key drops off automatically. On the next
        mutation or signing operation a signed
        vault.ssh-ca.retired attestation records CA id, purpose, node actor and
        fingerprint. No scheduler is required to exclude expired public trust.
        Retirement and lifecycle changes commit with their signed attestations.
        A deploy consumer ships these contents to its host; host configuration
        is separate from certificate issuance.
      security: []
      parameters:
        - in: query
          name: purpose
          required: true
          schema: { $ref: "#/components/schemas/SshCaPurpose" }
      responses:
        "200":
          description: Public CA lines only; never private or wrapped key material
          content:
            text/plain:
              schema: { type: string }
        "400": { description: Missing or invalid purpose }
        "503": { description: Trust projection unavailable; generic error without secret details }
  /api/vault/ssh-ca/sign:
    post:
      tags: [vault-mint]
      operationId: vaultSshCertSign
      summary: Sign a restricted throwaway Ed25519 user public key
      description: |
        Authenticated credential DID must hold the named live vault grant.
        Alternatively x-github-oidc-token authenticates a GitHub Actions job:
        RS256 verified against the fixed token.actions.githubusercontent.com
        issuer/JWKS, audience urn:imajin:vault:ssh-cert, exp/iat/nbf/sub/jti,
        max age 10 minutes. Requires repository, environment, workflow_ref,
        run_id and run_attempt; subject must bind that repository/environment.
        Workflow must belong to the repository and a heads/tags ref.
        GitHub grants bind the exact case-sensitive repository + environment.
        OIDC requests MUST OMIT job: it is derived from verified claims.
        Invalid OIDC never falls back to cookie/DID auth. did:github principals
        cannot use cookie/DID auth. Issuance additionally records githubJob
        (repository, workflow, environment, runId, runAttempt), never the token.
        Acting-for is not substituted for the grantee. Under the CA purpose
        lock the vault rechecks the active CA, operation scope, and live private
        custody grant. The caller provides only its public key, never its seed.
        Returns one granted principal, the grant's force-command and NO
        extensions: no port/agent/X11 forwarding, pty or user-rc.
        Host is checked against allowedHosts at issuance; OpenSSH user certs
        do not bind destination hosts, so hosts must enforce CA/principal trust.
        TTL defaults to 600, accepts 1–900 integer seconds, refuses larger
        requests, and validity cannot outlive either grant lease.
        Signed vault.ssh-cert.issued commits before returning, binding job,
        grantee, principal, host, TTL, unique serial, keyId, caId, grantId and
        publicKeyFingerprint (OpenSSH SHA256 fingerprint of the caller's public
        wire key, never key material). Each grant is limited to 10 issuances
        in a rolling 60-second window, counting existing issued events inside
        the signing transaction/lock. Over-budget requests return 429 and no cert.
        Only authenticated refusals commit vault.ssh-cert.refused with grantee and HTTP status,
        never raw request bytes. Audit failure returns 503 and no certificate.
        Anonymous requests return 401 without signing or storing any audit record.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }, { githubOidc: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose, caId, grantId, publicKey, principal, host]
              properties:
                purpose: { $ref: "#/components/schemas/SshCaPurpose" }
                caId: { type: string }
                grantId: { type: string }
                publicKey: { type: string, description: Canonical ssh-ed25519 public key line }
                principal: { type: string, pattern: "^[a-z_][a-z0-9_-]{0,63}$" }
                host: { type: string, description: Exact canonical host from the grant }
                job: { type: string, minLength: 1, maxLength: 200, description: Required for DID auth; forbidden for GitHub OIDC }
                ttl: { type: integer, minimum: 1, maximum: 900, default: 600 }
      responses:
        "201":
          description: Certificate and public issuance metadata only; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [certificate, serial, keyId, caId, grantId, job, grantee, principal, host, ttl, purpose, validAfter, validBefore, publicKeyFingerprint]
                properties:
                  certificate: { type: string, pattern: "^ssh-ed25519-cert-v01@openssh.com " }
                  serial: { type: string, description: Unsigned 64-bit integer encoded as decimal }
                  keyId: { type: string }
                  caId: { type: string }
                  grantId: { type: string }
                  job: { type: string }
                  githubJob:
                    type: object
                    required: [repository, workflow, environment, runId, runAttempt]
                    properties:
                      repository: { type: string }
                      workflow: { type: string }
                      environment: { type: string }
                      runId: { type: string }
                      runAttempt: { type: string }
                  grantee: { type: string }
                  principal: { type: string }
                  host: { type: string }
                  purpose: { type: string }
                  ttl: { type: integer, maximum: 900 }
                  validAfter: { type: integer, description: Unix seconds inclusive }
                  validBefore: { type: integer, description: Unix seconds exclusive }
                  publicKeyFingerprint: { type: string, description: OpenSSH SHA256 fingerprint of the caller public wire key }
        "400": { description: Invalid public key, principal, TTL, job or unexpected option }
        "401": { description: Authentication required }
        "403": { description: No matching live grant or active signer }
        "429": { description: Grant has already issued 10 certificates in the last 60 seconds; signed authenticated refusal, no certificate }
        "503": { description: Signing or signed audit unavailable; no certificate }
  /api/vault/ssh-ca/grants:
    post:
      tags: [vault-mint]
      operationId: vaultSshCertGrant
      summary: Grant scoped SSH signing authority on an active CA
      description: |
        Node or its authorized delegate only, same authority as CA mint.
        Uses vault_delegation_grants with signed SSH scope and no wrapped
        private key. Grant binds CA, grantee, principals, force-command,
        allowedHosts and expiry. Rotation requires a grant for the new CA.
        Emits signed vault.ssh-cert.grant-issued. No wildcards or empty policy.
        For GitHub Actions supply repository + environment instead of grantee.
        The kernel derives did:github:SHA256(JSON([repository, environment]));
        this deterministic identity is bound by the existing owner signature.
        Grant response and signed grant-issued event name both GitHub fields.
        Raw did:github grantees and mixed DID/GitHub inputs are refused.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose, caId, principals, forceCommand, allowedHosts, expiresAt]
              oneOf:
                - required: [grantee]
                  not:
                    anyOf:
                      - required: [repository]
                      - required: [environment]
                - required: [repository, environment]
                  not: { required: [grantee] }
              properties:
                purpose: { $ref: "#/components/schemas/SshCaPurpose" }
                caId: { type: string }
                grantee: { type: string, description: Credential DID, not the node custody identity }
                repository: { type: string, description: Exact case-sensitive owner/repository for GitHub OIDC }
                environment: { type: string, minLength: 1, maxLength: 128, description: Exact GitHub job environment; no control characters }
                principals:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items: { type: string, pattern: "^[a-z_][a-z0-9_-]{0,63}$" }
                forceCommand: { type: string, minLength: 1, maxLength: 2048 }
                allowedHosts:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items: { type: string, maxLength: 253, pattern: "^[a-z0-9]+(?:[.-][a-z0-9]+)*$" }
                expiresAt: { type: string, format: date-time }
      responses:
        "201": { description: Grant id and public policy; Cache-Control no-store }
        "400": { description: Invalid or empty policy or expiry }
        "401": { description: Authentication required }
        "403": { description: Not authorized or CA inactive }
        "503": { description: Grant or audit unavailable }
  /api/vault/ssh-ca/grants/revoke:
    post:
      tags: [vault-mint]
      operationId: vaultSshCertGrantRevoke
      summary: Withdraw SSH signing authority without deleting history
      description: |
        Same authority as grant creation. Serializes with signing, tombstones
        the existing vault grant, and commits vault.ssh-cert.grant-revoked.
        Repeating revocation is an idempotent no-op. Existing certs retain
        their bounded lifetime; emergency CA revocation removes public trust.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose, grantId]
              properties:
                purpose: { $ref: "#/components/schemas/SshCaPurpose" }
                grantId: { type: string }
      responses:
        "200": { description: Grant id and alreadyRevoked boolean; Cache-Control no-store }
        "400": { description: Invalid purpose or grant id }
        "401": { description: Authentication required }
        "403": { description: Not authorized }
        "404": { description: SSH grant not found for purpose }
        "503": { description: Revocation or audit unavailable }
  /api/vault/import:
    get:
      tags: [vault-import]
      operationId: vaultImportCards
      summary: Authorized owning identities and imported-credential timeline cards
      description: >-
        Returns the authenticated human's identity and groups they currently
        administer, the preferred owning DID (including an authorized acting-as
        group), and imported credential metadata across those owners. No
        plaintext, ciphertext or wrapped keys are returned. Imported provenance
        is projected from the existing approval record and v2 grants, not a
        parallel credential store. Consumer fetch/ack timestamps use the
        existing #2231 delegation path.
        Cloudflare metadata also includes verified domains, the node DID,
        and cloudflare scope metadata on imported zone cards.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: query
          name: ownerDid
          schema: { type: string }
          description: Optionally narrow cards to an authorized owning identity.
      responses:
        "200":
          description: Metadata only; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [ownerDid, owners, cards]
                properties:
                  ownerDid: { type: string }
                  owners:
                    type: array
                    items:
                      type: object
                      required: [did, name]
                      properties:
                        did: { type: string }
                        name: { type: string }
                  cards:
                    type: array
                    items:
                      type: object
                      required: [field, ownerDid, consumerDid, purpose, fingerprint, grantId, provenance, status, timeline]
                      properties:
                        field: { type: string }
                        ownerDid: { type: string }
                        consumerDid: { type: string }
                        purpose: { type: string }
                        label: { type: [string, "null"] }
                        fingerprint: { type: string, description: SHA-256 digest; never credential bytes or last4 }
                        grantId: { type: [string, "null"] }
                        provenance: { type: string, const: imported }
                        status: { type: string }
                        timeline:
                          type: array
                          items:
                            type: object
                            required: [type, at]
                            properties:
                              type: { type: string, enum: [imported, granted, fetched, acked, rotated, revoked] }
                              at: { type: string, format: date-time }
                              alert: { type: boolean, description: Fetched without a matching acknowledgment }
        "401":
          description: Authentication required
        "403":
          description: Delegated agent or unauthorized owning identity
        "503":
          description: Metadata unavailable; generic error without credential material
    post:
      tags: [vault-import]
      operationId: vaultImport
      summary: Paste once and propose an identity-owned static-secret import or rotation
      description: |
        The real authenticated human may target themselves or an org/group
        where they hold an active owner/admin role. The owning DID is explicit
        and checked server-side; a borrowed or agent identity cannot approve.
        Acting-as a group selects custody, not who signs the decision.

        Input is immediately sealed using the existing vault staging path.
        The returned proposal carries owner, consumer, purpose, expiry and a
        fingerprint only; it never carries the submitted credential. Approve
        via the existing `/jin/api/operator-approvals/{proposalId}/decision`
        route as the real human, with their verified countersignature. The node
        rechecks ownership authority and executes `sealAndGrantStaticSecret`
        with principalDid = ownerDid and granteeDid = consumerDid, attesting
        `vault.key.imported`. This reuses v2 delegation custody, not a new store.

        Consumers discover the purpose-bound grant through `imajin_vault`
        `list_grants` and resolve it with `fetch`; services can use the existing
        `loadFromVault` boot helper and acknowledgment path. The card timeline
        shows imported → granted → fetched → acked. After migrating a service,
        remove its old credential line from `.env.local`; the kernel does not
        modify remote consumer files.

        `replacesField` proposes re-import → grant → revoke old as one signed
        rotation. The old owner must match; old access remains until successful
        replacement. External-issuer auto-rotation is out of scope. The
        synchronous import executor fails closed under external Tier-1 custody.
        Coarse acting-for agent delegation cannot read or submit imports.
        Imported fields are excluded from the legacy plaintext rotation sweep;
        use this countersigned re-import rail for replacement credentials.
        Plaintext is never echoed, logged, returned, or persisted unsealed.

        Cloudflare mode supplies cloudflare instead of a generic consumer and
        purpose. The server forces consumerDid to its own node DID and purpose
        to dns.cloudflare:<zoneId>. After countersignature the kernel verifies
        the token against the exact verified Cloudflare zone, then atomically
        issues a node-only credential grant and separate operation grant to
        any grantee DID with audience did:imajin:cloudflare-<zoneId>.
        Public vault fetch refuses this token even to a node agent; only
        resolveDomainCredential uses it in-process. No env or shell handoff.
        An existing active zone requires explicit replacesField rotation.
        Manage zone grants on /jin adds, renews and revokes operation grants
        without re-importing. Action leases default to 24 hours, maximum 30 days.
        Cloudflare token permissions remain the outer authority bound; include
        Zone Read, DNS Read/Edit, Zone Settings Read, Cache Rules Read/Edit and
        SSL/Certificates permissions only as needed.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ownerDid, secret]
              anyOf:
                - required: [purpose, consumerDid]
                - required: [cloudflare]
              properties:
                cloudflare: { $ref: "#/components/schemas/CloudflareAuthority" }
                ownerDid:
                  type: string
                  description: Identity that owns the sealed field, including an administered group DID.
                purpose: { type: string, minLength: 1, maxLength: 200 }
                consumerDid:
                  type: string
                  description: Agent or service DID receiving the purpose-bound v2 grant.
                secret:
                  type: string
                  writeOnly: true
                  minLength: 1
                  description: At most 65536 UTF-8 bytes. Paste field is cleared on submission; no reveal.
                label: { type: string, maxLength: 200 }
                expiresAt: { type: [string, "null"], format: date-time }
                replacesField:
                  type: string
                  description: An existing imported field owned by ownerDid; revoke only after replacement succeeds.
      responses:
        "201":
          description: Sealed pending a real human countersignature; metadata only, Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [status, proposalId, fingerprint, purpose]
                properties:
                  status: { type: string, const: pending }
                  proposalId: { type: string }
                  fingerprint: { type: string }
                  purpose: { type: string }
        "400":
          description: Invalid body, DID, purpose, size or expiry
        "401":
          description: Authentication required
        "403":
          description: Caller is not the real owner or active group administrator
        "409":
          description: Unsupported custody or invalid replacement
        "503":
          description: Import unavailable; generic error without credential material
  /api/vault/mint:
    post:
      tags: [vault-mint]
      operationId: vaultMint
      summary: Generate an Ed25519 keypair INSIDE the vault
      description: >-
        The private key is sealed via the same v2 delegation-grant custody
        path every other vault secret uses, and is never present in this
        response. Auth: the caller's resolved acting DID
        (requireAuth + X-Acting-For) must be the vault's own node signing
        identity, self or delegated — see
        `apps/kernel/src/lib/vault/mint-authority.ts`. Emits a signed
        `vault.key.minted` attestation (issuer = acting principal, subject =
        the new DID) and a `vault.key.minted` bus event for the audit log.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, requesterDid]
              properties:
                purpose:
                  type: string
                  maxLength: 200
                  description: Free-form label naming what the minted key will be used for.
                requesterDid:
                  type: string
                  description: >-
                    The DID that should receive the one-time delegation
                    grant for the sealed private key (e.g. a service's own
                    pre-existing bootstrap identity). Distinct from the
                    authenticated caller.
                expiresAt:
                  type: [string, "null"]
                  format: date-time
                  description: Optional expiry for the resulting delegation grant.
      responses:
        "201":
          description: Keypair minted
          content:
            application/json:
              schema:
                type: object
                required: [did, publicKey]
                properties:
                  did: { type: string, description: "The newly minted DID (did:imajin:...)" }
                  publicKey: { type: string, description: "Hex-encoded Ed25519 public key" }
        "400":
          description: Missing or invalid purpose/requesterDid/expiresAt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Authenticated, but not the vault node identity (or its delegate)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/vault/mint/revoke:
    post:
      tags: [vault-mint]
      operationId: vaultMintRevoke
      summary: Tombstone a previously minted key
      description: >-
        Soft tombstone (v1): the minted-key record is marked revoked
        (surviving as the record that a key existed and was withdrawn), and
        the delegation grant's wrapped key material is erased so a
        subsequent fetch of that grant fails closed. The underlying vault
        field entry itself is left in place. Idempotent: revoking an
        already-revoked key returns `{ ok: true, alreadyRevoked: true }`
        rather than erroring. Emits a signed `vault.key.revoked` attestation
        and a matching bus event.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [did]
              properties:
                did:
                  type: string
                  description: The minted DID to revoke.
      responses:
        "200":
          description: Revoked (or already revoked)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  did: { type: string }
                  mintId: { type: string }
                  alreadyRevoked: { type: boolean }
        "400":
          description: Missing did
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Authenticated, but not the vault node identity (or its delegate)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No minted key found for this DID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/vault/mint/cards:
    get:
      tags: [vault-mint]
      operationId: vaultMintCards
      summary: Vault key cards read model for the /jin Vault section (#2247)
      description: >-
        One timeline card per minted key (minted/granted/fetched/acked/
        revoked rows, never a value — there is no reveal/copy affordance
        anywhere in this codebase's mint-in-vault path), plus the
        "hand-provisioned" filter list: vault entries whose field name was
        never produced by `mintKeypair` (derived by elimination from the
        `vault-minted-key:` field-name prefix, not a stored provenance
        flag — see `apps/kernel/src/lib/vault/key-cards.ts`).
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        did: { type: string }
                        publicKey: { type: string }
                        purpose: { type: string }
                        requestedBy: { type: string }
                        mintedBy: { type: string }
                        status: { type: string, enum: [active, revoked] }
                        createdAt: { type: string, format: date-time }
                        revokedAt: { type: [string, "null"], format: date-time }
                        revokedBy: { type: [string, "null"] }
                        grant:
                          type: [object, "null"]
                          description: The mint-time grant this key's sealed value was originally delivered through, whatever its current status.
                          properties:
                            grantId: { type: string }
                            grantedTo: { type: string }
                            purpose: { type: [string, "null"] }
                            oneTime: { type: boolean }
                            status: { type: string }
                            expiresAt: { type: [string, "null"], format: date-time }
                            consumedAt: { type: [string, "null"], format: date-time }
                            lastFetchedAt: { type: [string, "null"], format: date-time }
                            ackedAt: { type: [string, "null"], format: date-time }
                            ackOutcome: { type: [string, "null"] }
                            ackEvidence: { type: [object, "null"] }
                            createdAt: { type: string, format: date-time }
                        grants:
                          type: array
                          description: >-
                            Every currently ACTIVE consumer grant for this key's field
                            (#2298) — not just `grant` above. A field can carry more than
                            one active grant once a second consumer is granted access via
                            the "Grant access" action, which never updates `grant`/`grantId`.
                          items:
                            type: object
                            properties:
                              grantId: { type: string }
                              grantedTo: { type: string }
                              purpose: { type: [string, "null"] }
                              oneTime: { type: boolean }
                              status: { type: string }
                              expiresAt: { type: [string, "null"], format: date-time }
                              consumedAt: { type: [string, "null"], format: date-time }
                              lastFetchedAt: { type: [string, "null"], format: date-time }
                              ackedAt: { type: [string, "null"], format: date-time }
                              ackOutcome: { type: [string, "null"] }
                              ackEvidence: { type: [object, "null"] }
                              createdAt: { type: string, format: date-time }
                        timeline:
                          type: array
                          items:
                            type: object
                            properties:
                              type: { type: string, enum: [minted, granted, fetched, acked, rotated, revoked] }
                              at: { type: string, format: date-time }
                              alert:
                                type: boolean
                                description: "True for a 'fetched' row with no matching ack yet — the honest-record red line."
                              detail: { type: object }
                        heldBy: { type: [string, "null"] }
                        lastAckAt: { type: [string, "null"], format: date-time }
                        fetchWithoutAck: { type: boolean }
                  handProvisioned:
                    type: array
                    items:
                      type: object
                      properties:
                        field: { type: string }
                        senderDid: { type: string }
                        timestamp: { type: string, format: date-time }
                        custodyScheme: { type: string }
                        status: { type: string, enum: [active, deleted] }
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
