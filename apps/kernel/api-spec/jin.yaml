openapi: "3.1.0"
info:
  title: imajin jin
  version: "2.1.0"
  description: |
    The `/jin` kernel dashboard's own API surface — the operator-approvals
    confirm-card rail (#2059, generalized to an open source/kind vocabulary
    by #2152). A source (e.g. the OpenClaw plugin's system-agent or
    skill-workshop adapter) stages a proposal via `POST /notify/api/send`
    (scope `operator.approval.requested`, documented in notify.yaml); these
    two routes are how the node operator lists and decides them from /jin.
    Runs as a kernel service at /{service}/api/... on a shared node domain.

    Also documents the kernel loop registry (#2295, epic #2288/#2290):
    `POST /api/loops` is the signed ingest publishers (Warp's own dispatch
    loop, the OpenClaw plugin translating gateway-side lifecycle hooks, a
    review sub-agent) use to report a `loop.started|progress|blocked|finished`
    lifecycle transition; `GET /api/loops` and `GET /api/loops/{loopId}` are
    the per-principal read the /jin Runs lane and the orchestrator's MCP
    tools (#2297) both consume. `GET /api/loops/spend` attributes metered USD
    to registered runs and their signed issue/PR refs (#2290).
servers:
  - url: https://{node}.imajin.ai/{service}
    description: production node
    variables:
      node:
        default: jin
      service:
        default: jin
  - url: http://localhost:3000/{service}
    description: local development

tags:
  - name: jin
    description: /jin kernel dashboard — operator approvals
  - name: loops
    description: Kernel loop registry (#2295) — signed lifecycle ingest + per-principal read
  - name: apps
    description: >-
      apps.provision (#2375) — kernel-authoritative repo + registry +
      sealed-credential provisioning for apps being extracted into their own
      standalone repos (registered as tier: 'third_party'), riding the
      operator-approvals rail

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: imajin_session
    bearerAuth:
      type: http
      scheme: bearer
    internalKeyAuth:
      type: apiKey
      in: header
      name: x-internal-key
  schemas:
    RegistryProvenancePoint:
      type: object
      required: [at, by]
      additionalProperties: false
      properties:
        at: { type: [string, "null"], format: date-time }
        by: { type: [string, "null"], description: "Recorded actor DID, or null when not recorded." }
    MailSenderInput:
      type: object
      additionalProperties: false
      required: [purpose, domain, localPart, displayName]
      properties:
        purpose: { type: string, enum: [signin, receipts, notifications, contact] }
        appDid: { type: string, maxLength: 256, description: "Empty or absent means owner default; otherwise an active registered app owned by this group." }
        domain: { type: string, maxLength: 253, description: "Bare DNS domain; normalized to lowercase. Verification is separate." }
        localPart: { type: string, minLength: 1, maxLength: 64 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        replyTo: { type: [string, "null"], format: email, maxLength: 254 }
    ApprovalStatus:
      type: string
      enum: [pending, approved, denied, withdrawn, applied, expired]
    OperatorApprovalCard:
      type: object
      description: >-
        One proposal's lifecycle record. `kind` is namespaced
        "<source>:<subkind>" (#2152) — legacy bare kinds (`restart` |
        `config-mutation` | `other`) are normalized onto `system-agent:*`
        at ingest, so `kind` here is always namespaced regardless of which
        vocabulary the source used when it published the proposal.
      properties:
        proposalId: { type: string }
        operatorDid: { type: string }
        source: { type: string, example: "skill-workshop", description: "Open vocabulary namespace." }
        kind: { type: string, example: "skill-workshop:update", description: "'<source>:<subkind>'." }
        summary: { type: string }
        keysTouched: { type: array, items: { type: string } }
        detail:
          type: object
          nullable: true
          description: "Optional, bounded (<=16KB) per-source structured payload — e.g. skill-workshop's diff summary."
        contentHash:
          type: string
          description: >-
            sha256 hex digest covering {proposalId,source,kind,summary,keysTouched,detail}
            (#2082: always present — the effective hash, recomputed on the
            fly for a legacy row that never stored one — since this is what
            an operator countersignature signs over).
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        decision:
          type: object
          nullable: true
          properties:
            decidedBy: { type: string }
            decidedAt: { type: string, format: date-time }
            reason: { type: string }
            operatorSignature:
              $ref: "#/components/schemas/OperatorCountersignature"
        outcome:
          type: object
          nullable: true
          description: >-
            Post-exec outcome follow-up (#2221, `gateway-exec:command` only)
            — null until the bridge reports the gateway's exec-finished
            event back via the internal `.../operator-approvals/outcome`
            webhook.
          properties:
            exitCode: { type: integer }
            durationMs: { type: integer }
            outputHash: { type: string }
        appliedAt: { type: string, format: date-time, nullable: true }
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            This real session principal's Inbox archive timestamp (#2694),
            or null. Only decided decision:card proposals support archiving.
            Other principals' markers are never returned, including in outcome.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        sessionBinding:
          allOf: [{ $ref: "#/components/schemas/SessionApprovalBinding" }]
          nullable: true
          description: "Verified native approval-to-loop association; never inferred from harness refs."
        sessionOutcome:
          type: object
          nullable: true
          description: "Read projection of a correlated, verified agent result; completed means approval resolved, not process execution finished."
          required: [commandId, outcome, at]
          properties:
            commandId: { type: string }
            outcome: { type: string, enum: [completed, failed] }
            at: { type: string, format: date-time }
            reason: { type: string }
    SessionApprovalBinding:
      type: object
      additionalProperties: false
      required: [loopId, principalDid, agentDid, approvalId]
      properties:
        loopId: { type: string }
        principalDid: { type: string }
        agentDid: { type: string }
        approvalId: { type: string }
    SessionCommandSignature:
      type: object
      additionalProperties: false
      required: [keyId, alg, sig]
      properties:
        keyId: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
        alg: { type: string, enum: [ed25519] }
        sig: { type: string, pattern: "^[a-fA-F0-9]{128}$" }
    SessionCommand:
      type: object
      description: >-
        Plugin #77 command frame. Kernel grant and principal wish both sign
        canonicalize({type,commandId,to,principal,issuer,issuedAt,expiresAt,payload}).
        Prepare returns the grant; dispatch requires the full countersignature.
        Payload is strictly allowlisted per command and never contains harness keys.
      required: [type, commandId, to, principal, issuer, issuedAt, expiresAt, payload, signature]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [session.send, session.abort, session.spawn, session.approve, session.deny]
        commandId: { type: string }
        to: { type: string, description: "Verified owning agent DID, never a gateway address." }
        principal: { type: string }
        issuer: { type: string }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        payload:
          type: object
          description: >-
            Send: {loopId,message,agentId?}; abort: {loopId,runId?};
            spawn: {parentLoopId,task,label?,agentId?,group?,model?};
            approve/deny: {loopId,approvalId,kind?}. Target must match the
            route loop. Approval dispatch uses the existing decision route only.
          additionalProperties: { type: string }
        signature: { $ref: "#/components/schemas/SessionCommandSignature" }
        countersignature: { $ref: "#/components/schemas/SessionCommandSignature" }
    OperatorCountersignature:
      type: object
      nullable: true
      description: >-
        The operator's OWN countersignature (#2082) over
        canonicalize({contentHash, decision, decidedAt}), produced
        client-side on /jin with the same Ed25519 key already used for
        login/registration. Verified by the kernel against the operator
        DID's current registered key before the decision is persisted;
        stored and republished alongside (never replacing) the kernel's own
        node-key witness signature.
      required: [keyId, alg, sig]
      properties:
        keyId: { type: string, description: "Hex-encoded Ed25519 public key that produced sig." }
        alg: { type: string, enum: [ed25519] }
        sig: { type: string, description: "Hex-encoded Ed25519 signature." }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    ActAsContext:
      type: object
      nullable: true
      description: >-
        Who is signed in vs. who this session is currently acting as
        (#2359). Non-null only while the acting DID (`X-Acting-For`, or the
        `x-acting-as` cookie the /jin IdentitySwitcher sets) differs from
        the real authenticated session DID. The confirm rail is self-only,
        so a non-null value means every decision control is read-only for
        this session.
      required: [sessionDid, actingDid]
      properties:
        sessionDid: { type: string, description: "The real authenticated session DID — the only identity that may countersign." }
        actingDid: { type: string, description: "The DID this request would otherwise be attributed to." }
    ActAsNotPermittedError:
      type: object
      description: "403 body returned by every write-approval endpoint on the confirm rail when called under act-as (#2359)."
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string, enum: [act_as_not_permitted] }
        sessionDid: { type: string }
        actingDid: { type: string }
    LoopRefs:
      type: object
      description: "Bare ids/numbers in the referenced system's own vocabulary — the kernel never resolves or validates these."
      properties:
        issue: { type: string, description: "GitHub issue number, e.g. '2295'." }
        pr: { type: string, description: "GitHub PR number." }
        runId: { type: string, description: "Warp run id." }
        sessionKey: { type: string, description: "OpenClaw gateway session key." }
        sessionId: { type: string, description: "Original source session id." }
        conflictingLoopId: { type: string, description: "Holder loop named by a surface.conflicted warning; never an exclusive refusal." }
        conflictingHolderDid: { type: string, description: "Holder DID in same-principal surface conflict warnings only." }
    RegistryRunCost:
      type: object
      required: [runId, loopId, refs, summary, state, startedAt, lastSeenAt, metered]
      additionalProperties: false
      properties:
        runId: { type: string, description: "Signed refs.runId, or loopId for a session-only loop." }
        loopId: { type: string, description: "Representative loop for this deduplicated run (warp.run preferred, then most recently seen)." }
        refs:
          type: object
          additionalProperties: true
          description: >-
            Registry refs, with issue/pr retained only when each has one
            distinct non-empty signed value across the run's loops.
        summary: { type: string }
        state: { type: string, description: "Publisher-defined state label." }
        startedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        metered:
          type: [object, "null"]
          description: >-
            Null when no non-error usage rows match this run in the window.
            An object with usd=null means usage exists but at least one
            matched row has unknown cost; a known zero remains 0.
          required: [usd, turns]
          additionalProperties: false
          properties:
            usd: { type: [number, "null"], description: "Sum in USD, or null if any matched usage cost is unknown." }
            turns: { type: integer, minimum: 1, description: "Number of matched non-error usage rows." }
    RegistrySubjectCost:
      type: object
      required: [ref, runCount, meteredUsd]
      additionalProperties: false
      properties:
        ref: { type: string, description: "Signed issue or PR ref, in the publisher's vocabulary." }
        runCount: { type: integer, minimum: 1 }
        meteredUsd:
          type: [number, "null"]
          description: Sum of run USD, or null if any grouped run has no metering or unknown USD (never substituted with 0).
    RegistrySpend:
      type: object
      required: [currency, windowFrom, windowTo, runs, issues, prs]
      additionalProperties: false
      properties:
        currency: { type: string, enum: [USD] }
        windowFrom: { type: string, format: date-time, description: "Inclusive UTC lower bound." }
        windowTo: { type: string, format: date-time, description: "Exclusive UTC upper bound." }
        runs:
          type: array
          description: >-
            Deduplicated registered runs with runId or sessionKey refs whose
            lifetime overlaps the window, or that have matched usage in it.
            Ordered by lastSeenAt descending, then runId.
          items: { $ref: "#/components/schemas/RegistryRunCost" }
        issues:
          type: array
          description: Runs grouped by non-empty string issue ref, sorted by ref.
          items: { $ref: "#/components/schemas/RegistrySubjectCost" }
        prs:
          type: array
          description: Runs grouped by non-empty string PR ref, sorted by ref.
          items: { $ref: "#/components/schemas/RegistrySubjectCost" }
    LoopOutput:
      oneOf:
        - $ref: "#/components/schemas/LoopTextOutput"
        - $ref: "#/components/schemas/LoopToolCallOutput"
        - $ref: "#/components/schemas/LoopToolResultOutput"
        - $ref: "#/components/schemas/LoopArtifactOutput"
        - $ref: "#/components/schemas/LoopDecisionOutput"
        - $ref: "#/components/schemas/LoopApprovalRequestOutput"
        - $ref: "#/components/schemas/LoopSpawnOutput"
        - $ref: "#/components/schemas/LoopModelChangeOutput"
      discriminator:
        propertyName: kind
    LoopTextOutput:
      type: object
      required: [kind, text]
      properties:
        kind: { const: text }
        text: { type: string }
        role: { type: string }
    LoopToolCallOutput:
      type: object
      required: [kind, callId, name, args]
      properties:
        kind: { const: tool_call }
        callId: { type: string }
        name: { type: string }
        args: { description: "Full JSON arguments, redacted before persistence." }
    LoopToolResultOutput:
      type: object
      required: [kind, callId, result]
      properties:
        kind: { const: tool_result }
        callId: { type: string }
        result: { description: "Full JSON result, redacted before persistence." }
        isError: { type: boolean }
    LoopArtifactOutput:
      type: object
      required: [kind, ref]
      properties:
        kind: { const: artifact }
        ref: { type: string }
        name: { type: string }
        mediaType: { type: string }
    LoopDecisionOutput:
      type: object
      required: [kind, decision]
      properties:
        kind: { const: decision }
        decision: { type: string }
        reason: { type: string }
    LoopApprovalRequestOutput:
      type: object
      required: [kind, approvalId, action]
      properties:
        kind: { const: approval_request }
        approvalId: { type: string }
        action: { type: string }
        details: { description: "Full JSON approval details, not an executable command." }
    LoopSpawnOutput:
      type: object
      required: [kind, loopId]
      properties:
        kind: { const: spawn }
        loopId: { type: string }
        principal: { type: string }
    LoopModelChangeOutput:
      type: object
      required: [kind, model]
      properties:
        kind: { const: model_change }
        model: { type: string }
        previousModel: { type: string }
        provider: { type: string }
    LoopOutputArtifactRef:
      type: object
      required: [id, sha256, byteLength, mediaType]
      properties:
        id: { type: string }
        sha256: { type: string }
        byteLength: { type: integer }
        mediaType: { const: application/json }
    StoredLoopOutput:
      type: object
      description: "Server-only overflow representation; publishers submit original typed output, never this wrapper."
      required: [kind, artifactRef, preview, truncated]
      properties:
        kind: { type: string, enum: [text, tool_call, tool_result, artifact, decision, approval_request, spawn, model_change] }
        artifactRef: { $ref: "#/components/schemas/LoopOutputArtifactRef" }
        preview: { type: string }
        truncated: { const: true }
    StepExitCondition:
      oneOf:
        - type: object
          required: [id, kind]
          additionalProperties: false
          properties:
            id: { type: string, minLength: 1, maxLength: 2000 }
            kind: { type: string, enum: [issue_closed, release_contains, deployed] }
        - type: object
          required: [id, kind, attestorDid]
          additionalProperties: false
          properties:
            id: { type: string, minLength: 1, maxLength: 2000 }
            kind: { const: attestation }
            attestorDid: { type: string, pattern: '^did:[^\s:]+:\S+$', maxLength: 512 }
    StepDeclaration:
      type: object
      required: [stepKind, intention, rank, exitConditions]
      additionalProperties: false
      description: >-
        Immutable earliest queued declaration. Code requires repository and exactly one
        issue_closed, release_contains and deployed condition. Human/ops requires exactly
        one attestation condition naming the completing DID. Condition ids are distinct.
      properties:
        stepKind: { type: string, enum: [code, human, ops] }
        intention: { type: string, minLength: 1, maxLength: 2000 }
        rank: { type: number, description: "Finite, lower first; ties use stepId. Zero and negative ranks are valid." }
        repository: { type: string, pattern: '^[\w.-]+/[\w.-]+$', maxLength: 256 }
        exitConditions:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/StepExitCondition" }
    StepUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        rank: { type: number }
        intention: { type: string, minLength: 1, maxLength: 2000 }
        issue:
          type: object
          required: [ref]
          additionalProperties: false
          description: "Ref-only binding counts for issue_closed exactly like ref+OUTCOME but stays tail until closure (past) or a real OUTCOME. Middle/near sharpening requires OUTCOME, which is never invented."
          properties:
            ref: { type: string, minLength: 1, maxLength: 2000 }
            outcome: { type: string, pattern: '^OUTCOME\b', maxLength: 2000 }
        briefRef: { type: string, minLength: 1, maxLength: 2000 }
        provisionRef: { type: string, minLength: 1, maxLength: 2000 }
        designRef: { type: string, minLength: 1, maxLength: 2000 }
    StepClaim:
      type: object
      required: [leaseId, holderDid, expiresAt]
      additionalProperties: false
      description: "Signed historical claim reference only; cannot acquire a lease or override the live horizon claim. holderDid must equal publisherDid."
      properties:
        leaseId: { type: string, minLength: 1, maxLength: 2000 }
        holderDid: { type: string, pattern: '^did:[^\s:]+:\S+$', maxLength: 512 }
        expiresAt: { type: string, format: date-time }
    StepEvidence:
      oneOf:
        - type: object
          required: [kind, issue]
          additionalProperties: false
          properties:
            kind: { const: issue_closed }
            issue: { type: string, minLength: 1, maxLength: 2000 }
        - type: object
          required: [kind, repository, issue, mergeCommit, tag]
          additionalProperties: false
          properties:
            kind: { const: release_contains }
            repository: { type: string, pattern: '^[\w.-]+/[\w.-]+$', maxLength: 256 }
            issue: { type: string, minLength: 1, maxLength: 2000 }
            mergeCommit: { type: string, pattern: '^[0-9a-fA-F]{40}$' }
            tag: { type: string, minLength: 1, maxLength: 2000 }
        - type: object
          required: [kind, repository, tag, environment]
          additionalProperties: false
          properties:
            kind: { const: deployed }
            repository: { type: string, pattern: '^[\w.-]+/[\w.-]+$', maxLength: 256 }
            tag: { type: string, minLength: 1, maxLength: 2000 }
            environment: { const: prod }
    StepAttestation:
      type: object
      required: [conditionId, did, statement]
      additionalProperties: false
      description: "Must be signed by did, which must also match the declaration's attestorDid to exit."
      properties:
        conditionId: { type: string, minLength: 1, maxLength: 2000 }
        did: { type: string, pattern: '^did:[^\s:]+:\S+$', maxLength: 512 }
        statement: { type: string, minLength: 1, maxLength: 2000 }
    StepEnvelope:
      allOf:
        - $ref: "#/components/schemas/LoopEnvelope"
        - type: object
          required: [stepId]
          description: >-
            Exactly the block appropriate to the outer event type is allowed:
            queued=step (state queued), updated=update, claimed=claim,
            observed=observation, attested=attestation. started/progress/blocked/finished
            have none of these blocks. Zone/depth/output and state exited are forbidden.
            All text is nonblank. Step observations must remain inline and credential-free
            so their exact publisherProof can be retained.
          properties:
            stepId: { type: string, minLength: 1, maxLength: 2000 }
            step: { $ref: "#/components/schemas/StepDeclaration" }
            update: { $ref: "#/components/schemas/StepUpdate" }
            claim: { $ref: "#/components/schemas/StepClaim" }
            observation:
              type: object
              required: [conditionId, evidence]
              additionalProperties: false
              properties:
                conditionId: { type: string, minLength: 1, maxLength: 2000 }
                evidence: { $ref: "#/components/schemas/StepEvidence" }
            attestation: { $ref: "#/components/schemas/StepAttestation" }
    HorizonClaim:
      type: object
      readOnly: true
      required: [leaseId, holderDid, acquiredAt, expiresAt]
      additionalProperties: false
      description: "Live, unreleased kernel.surface_lease holding scoped to this loop and principal. Omitted after release/TTL expiry."
      properties:
        leaseId: { type: string, description: "Existing surface key step:<stepId>." }
        holderDid: { type: string, description: "Verified acquisition publisher DID." }
        acquiredAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    SurfaceEnvelope:
      allOf:
        - $ref: "#/components/schemas/LoopEnvelope"
        - type: object
          required: [surface]
          description: >-
            Signed surface.acquired/released/conflicted fact. Acquisition TTL is
            fifteen minutes from at; re-acquire renews. Step surfaces require their
            owning loop and a prior step declaration. Different-DID step claims
            warn via surface.conflicted, even within one loop; never a 409 for
            contention. Explicit conflicts require refs.conflictingLoopId.
          properties:
            surface:
              type: string
              maxLength: 2048
              description: "Exact case-sensitive repo:<org>/<repo>#branch:<branch>, service:<app>@env:<env>, device:<id>, issue:#<N>, or step:<stepId>; no whitespace or NUL."
    HorizonStep:
      allOf:
        - type: object
          required: [stepId, stepKind, intention, rank, exitConditions, state, zone, conditions, openExitConditions]
          properties:
            stepId: { type: string }
            stepKind: { type: string, enum: [code, human, ops] }
            intention: { type: string }
            rank: { type: number }
            repository: { type: string }
            exitConditions: { type: array, items: { $ref: "#/components/schemas/StepExitCondition" } }
            state: { type: string, enum: [queued, claimed, running, blocked, finished, exited], readOnly: true }
            zone: { type: string, enum: [tail, middle, near, head, past, done], readOnly: true, description: "Middle requires issue ref + OUTCOME; near additionally requires brief/provision/design refs. Ref-only stays tail, but matching issue_closed gives past and all exit conditions give done; live leases give head." }
            issue: { type: object, properties: { ref: { type: string }, outcome: { type: string } } }
            briefRef: { type: string }
            provisionRef: { type: string }
            designRef: { type: string }
            claim: { $ref: "#/components/schemas/HorizonClaim" }
            conditions:
              type: array
              items:
                type: object
                required: [declaration, satisfied, evidence]
                properties:
                  declaration: { $ref: "#/components/schemas/StepExitCondition" }
                  satisfied: { type: boolean, readOnly: true }
                  evidence:
                    type: [object, "null"]
                    properties:
                      eventId: { type: string }
                      issuer: { type: string }
                      at: { type: string, format: date-time }
                      fact:
                        oneOf:
                          - $ref: "#/components/schemas/StepEvidence"
                          - $ref: "#/components/schemas/StepAttestation"
            openExitConditions: { type: array, items: { type: string }, readOnly: true }
    Horizon:
      type: object
      required: [steps, depth, targetDepth]
      properties:
        steps:
          type: array
          description: "Rank-ordered non-done steps by default. includeExited=true opts into done/exited audit projections."
          items: { $ref: "#/components/schemas/HorizonStep" }
        depth: { type: integer, minimum: 0, readOnly: true, description: "All non-done items, not truncated to 12." }
        targetDepth: { const: 12, readOnly: true }
    LoopEnvelope:
      type: object
      description: >-
        The common envelope every `loop.started|progress|blocked|finished`
        bus event carries (#2295, epic #2288/#2290), regardless of `kind`.
      required: [loopId, kind, principal, state, summary, at]
      properties:
        loopId: { type: string }
        kind: { type: string, example: "warp.run", description: "Open vocabulary, e.g. warp.run | openclaw.subagent | openclaw.automation | openclaw.keeper | bus.chain | review | pr. The kernel never branches on it." }
        principal: { type: string, description: "onBehalfOf DID this loop is scoped to — the GET /api/loops authz boundary." }
        parentLoopId: { type: string, nullable: true, description: "Lineage — the loop this one was spawned from, when known." }
        refs: { $ref: "#/components/schemas/LoopRefs" }
        state: { type: string, example: "running", description: "Publisher-defined state label." }
        summary: { type: string, maxLength: 2000 }
        at: { type: string, format: date-time, description: "When the publisher observed this transition. Bounded at ingest for clock skew." }
        output: { $ref: "#/components/schemas/LoopOutput" }
    StoredLoopEnvelope:
      type: object
      description: "Sanitized envelope retaining loop metadata and optional inline output or private artifact wrapper."
      required: [loopId, kind, principal, state, summary, at]
      properties:
        loopId: { type: string }
        kind: { type: string }
        principal: { type: string }
        parentLoopId: { type: [string, "null"] }
        refs: { $ref: "#/components/schemas/LoopRefs" }
        state: { type: string }
        summary: { type: string }
        at: { type: string, format: date-time }
        output:
          oneOf:
            - $ref: "#/components/schemas/LoopOutput"
            - $ref: "#/components/schemas/StoredLoopOutput"
      additionalProperties: true
    LoopPublisherSignature:
      type: object
      description: >-
        The publishing agent's own Ed25519 signature over
        canonicalize({type, payload}) — verified against the publisher
        DID's currently registered key (same pattern as
        OperatorCountersignature above; forged or unsigned events are
        rejected with 400 before anything is persisted).
      required: [keyId, alg, sig]
      properties:
        keyId: { type: string, description: "Hex-encoded Ed25519 public key that produced sig — must equal publisherDid's current registered key." }
        alg: { type: string, enum: [ed25519] }
        sig: { type: string, description: "Hex-encoded Ed25519 signature." }
    LoopReceiptRequest:
      type: object
      required: [type, payload, publisherDid, signature]
      properties:
        type: { const: loop.receipt }
        publisherDid: { type: string, description: "Original publishing DID; authenticated with its current key, not a session." }
        signature: { $ref: "#/components/schemas/LoopPublisherSignature" }
        payload:
          type: object
          additionalProperties: false
          required: [loopId, principal, envelopeHash, at]
          properties:
            loopId: { type: string, minLength: 1, maxLength: 2000 }
            principal: { type: string, description: "Owning principal; current loops:publish authority required." }
            envelopeHash:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: >-
                SHA-256 of UTF-8 canonicalize({type,payload,publisherDid,signature})
                for the original parsed ingest request, with signature.keyId/sig
                lowercase and exact original wire payload. Not a hash of raw HTTP
                bytes, redacted data or this lookup. Stored id is signed-loop:<hash>.
            at:
              type: string
              format: date-time
              description: "Fresh lookup timestamp within SIGNED_MESSAGE_MAX_AGE (5 minutes) and FUTURE_TOLERANCE; original envelope at is never changed."
    LoopReceipt:
      type: object
      additionalProperties: false
      required: [status, eventId]
      properties:
        status: { const: accepted }
        eventId: { type: string, description: "Immutable kernel.loop_events.id; this rail has no seq." }
    LoopReceiptNotFound:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { const: not_found }
    LoopRecord:
      type: object
      description: Current-state-per-loopId projection row.
      properties:
        loopId: { type: string }
        kind: { type: string }
        principal: { type: string }
        parentLoopId: { type: string, nullable: true }
        refs: { $ref: "#/components/schemas/LoopRefs" }
        state: { type: string }
        summary: { type: string }
        lastEventType: { type: string, enum: [loop.started, loop.progress, loop.blocked, loop.finished] }
        startedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LoopEventRecord:
      type: object
      description: One immutable row from a loop's event history.
      properties:
        id: { type: string }
        loopId: { type: string }
        type: { type: string, enum: [loop.started, loop.progress, loop.blocked, loop.finished, surface.acquired, surface.released, surface.conflicted, step.queued, step.updated, step.claimed, step.started, step.progress, step.blocked, step.finished, step.observed, step.attested] }
        issuer: { type: string, description: "The verified publisher DID." }
        principal: { type: string }
        payload: { $ref: "#/components/schemas/StoredLoopEnvelope" }
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ApprovalRef:
      type: object
      description: >-
        Present on a signed event authorized by an operator approval,
        joined from `operator.approvals` on `payload->>'proposalId'`
        (#2289) — the Record lane can click event -> approval card.
      required: [proposalId, source, kind]
      properties:
        proposalId: { type: string }
        source: { type: string, example: "vault" }
        kind: { type: string, example: "vault:mint" }
    RecordEvent:
      type: object
      description: One row off the signed event stream (`registry.system_events`), scoped to the caller (#2289).
      properties:
        id: { type: string }
        service: { type: string }
        action: { type: string }
        did: { type: string, nullable: true, description: "The event's issuer." }
        correlationId: { type: string, nullable: true }
        parentEventId: { type: string, nullable: true }
        payload: { type: object, nullable: true }
        status: { type: string, nullable: true }
        durationMs: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        approvalRef:
          allOf: [{ $ref: "#/components/schemas/ApprovalRef" }]
          nullable: true
        hasOperatorSignature:
          type: boolean
          description: "Presence of `payload.operatorSignature` (#2082) — lets the lane render the wish-and-grant chain state (#2084)."
        modeCountersign:
          type: string
          enum: [countersigned, not-countersigned, not-applicable, invalid]
          description: >-
            Whether the operator's signature covers a decided approval's
            chosen `mode` (#2693). `not-countersigned` = a decision signed
            before #2693 whose `mode` the operator did not sign (shown as
            "letter not countersigned" — not invalid); `invalid` = the
            signature verifies against neither shape.
        modeCountersignLabel:
          type: string
          nullable: true
          description: "\"letter not countersigned\" when `modeCountersign` is `not-countersigned`, else null."
    AppProvisionRequest:
      type: object
      description: >-
        Body for `POST /api/apps/provision` (#2375). Raises an
        `apps:provision` proposal on the operator-approvals rail — nothing
        external happens until the operator countersigns an 'approve'
        decision (`executeAppsProvisionApproval`).
      required: [slug, displayName]
      properties:
        slug:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,38}$"
          example: dykil
          description: "Short, URL/repo-safe identifier. Unless sourceRepo is set, the repo is created as ima-jin/<slug>; the idempotency key this whole call is keyed on."
        displayName: { type: string, maxLength: 200, example: dykil }
        signInAudience:
          type: string
          enum: [members, anyone]
          default: members
          description: |
            Private-app sign-in eligibility, independent of directory visibility.
            members permits only the owner/current members; anyone permits any
            authenticated direct-link consent without membership or discovery.
            Fresh proposals bind this setting (including the default) into the
            summary, detail and operator-countersigned hash. Registration persists
            exactly the approved value. Invalid/null values are rejected.
            A pending proposal with a different audience returns 409.
            Retries cannot change the registered audience. Omission on a succeeded
            run preserves the live value; an explicit different value returns 409.
            Must be omitted entirely on claim reissue, which never resets it.
        visibility:
          type: string
          enum: [public, unlisted, private, internal]
          default: public
          description: |
            Directory/add visibility (#2897), shown in and covered by the
            operator-countersigned proposal. Private apps are visible/addable
            only to the owning identity and its members; public web pages
            remain public. The owner may be an unclaimed organization stub
            with no members. Reissuing a claim cannot set or change visibility.
        template:
          type: string
          maxLength: 200
          default: ima-jin/imajin-app-template
          description: "owner/repo of the template to generate the app repo from. Ignored when sourceRepo is set."
        sourceRepo:
          type: string
          maxLength: 140
          example: gbscontracting/website
          description: >-
            Optional existing GitHub owner/name repository, not a URL. Owner
            must be 1–39 letters/digits/hyphens with alphanumeric ends; name
            must be 1–100 letters/digits/underscores/dots/hyphens, not . or ...
            No repository is created. Reads this repository's own
            imajin.app.json without template fallback, anonymously for public
            repositories or with an installation token where available.
            The exact value is shown on the proposal and included in its
            countersigned content hash. Recorded as source lineage with
            joined=false. Must be omitted entirely on claim reissue; an
            already-succeeded app cannot change its repository, including
            during domain retry.
        attestationTypes:
          type: array
          maxItems: 20
          items: { type: string, example: "dykil/survey-response" }
          description: >-
            Optional `<slug>/<type>` attestation types to seed via the
            existing attestation-type registry (#1885). Refused (per-type,
            never failing the whole call) when the prefix is not exactly
            `slug`.
        siteOwnerDid:
          type: string
          pattern: "^did:imajin:"
          description: |
            Optional authoritative site owner for the newly registered app.
            Defaults to the approving operator, not the proposing agent or node.
            Covered by the operator's countersigned provision proposal.
            The identity must exist but need not be claimed or have members.
            Cannot change ownership during reissue.
        domain:
          type: string
          maxLength: 253
          description: |
            Optional direct subdomain of imajin.ai (for example dev-gbs.imajin.ai).
            Defaults to <slug>.imajin.ai for domain issuance. Covered by the
            operator's countersign. When explicitly set, registers callbackUrl
            as https://<domain>/api/auth/callback and allowedRedirectHosts as
            [<domain>]. When omitted, preserves the node-origin/<slug> callback
            and [<slug>] redirect hosts.
            Provisioning issues signed domain evidence as the actual Imajin
            organization through its domain.issue grant, never a self-asserted
            node identity. Missing organization identity or signing grant defers
            domain issuance without blocking the claim code. Cannot change a
            domain during reissue.
        reissueClaim:
          type: boolean
          default: false
          description: Reissue a claim code for an already-succeeded app only; preserves ownership, visibility, sign-in audience, callback URL, redirect hosts, source repository and domain bindings. Any provided sourceRepo or signInAudience is refused.
    AppServiceScopesMetadata:
      type: object
      required: [appDid, requestedScopes, approvedServiceScopes, approvalId, approvedAt]
      properties:
        appDid: { type: string }
        requestedScopes: { type: array, items: { type: string }, readOnly: true, description: "Normalized registry requests; not approvals." }
        approvedServiceScopes: { type: array, items: { type: string } }
        approvalId: { type: string, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
    AppServiceScopesRequest:
      type: object
      description: >-
        Body for `POST /api/apps/service-scopes` (#2711). Raises an
        `apps:service-scopes` proposal on the operator-approvals rail — the
        app's approved service-scope set only changes once the operator
        countersigns an 'approve' decision (`executeAppsServiceScopesApproval`).
      required: [appDid, scopes]
      properties:
        appDid: { type: string, example: "did:imajin:CtdP4azTs7d7avoPorZSs9DMJyGkbnw8xRU8cEsooZQU" }
        scopes:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, example: "identity:write" }
        action:
          type: string
          enum: [grant, revoke]
          default: grant
          description: "`grant` adds vocabulary scopes to the approved set; `revoke` removes currently-approved scopes."
    AppProvisionResult:
      type: object
      description: The terminal (or cached) result of an apps.provision run.
      required: [status]
      properties:
        status: { type: string, enum: [pending, succeeded, failed] }
        proposalId: { type: string, description: "Present when status is 'pending'." }
        slug: { type: string }
        appDid: { type: string, nullable: true }
        repoUrl: { type: string, nullable: true }
        secretsSet:
          type: array
          items: { type: string }
          description: "Actions secret NAMES only — never values. Always empty for runs after #2437: the app's signing key is never pushed to GitHub Actions secrets (vault/claim path only). Older ledger rows may still list a name."
        attestationTypes:
          type: array
          items: { type: string }
        failedStep: { type: string, nullable: true, description: "Present when status is 'failed' — names the step that failed." }
        errorMessage: { type: string, nullable: true }

paths:
  /jin/api/registered-apps:
    get:
      tags: [jin, apps]
      summary: Read registered app lifecycle and provenance (node operator only)
      description: >-
        Read-only engine-bay inventory; never writes registry rows. Includes every
        registry app, including legacy zero-consent apps, first-party seeds,
        provisioned apps, and expired/revoked history. Kind is MCP/DCR client,
        delegated app, or first-party seed. Status is active, dormant, expired,
        or revoked; dormant is display-only for consented/provisioned/claimed or
        first-party apps with no recorded mint/refresh/validate for 90 days.
        Without activity, age starts at the latest creation/consent/provision/claim.
        First consent includes historical revoked/expired consents; the count is
        distinct currently consenting principals (unrevoked, unexpired).
        Last seen is the maximum refresh-token creation/rotation, successful
        token mint, or authorization validation. Successful delegated/service/
        session mints and validations record metadata-only registry.system_events
        (app DID, action, time), not registry.apps writes. Existing mint logs
        supply historical activity where available; missing history is null,
        not an invented timestamp. Registrar uses the registration attestation
        issuer with owner_did fallback for older rows. Terminal actor comes from
        the matching registry.app.revoked/expired attestation. Expired apps are
        returned normally; the UI groups them in a collapsed expired disclosure.
        No credential, bearer, hash, claim code, or attestation payload is returned.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Metadata only; Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                required: [apps]
                properties:
                  apps:
                    type: array
                    items:
                      type: object
                      required: [id, appDid, name, kind, status, created, firstConsent, consentingPrincipals, lastSeen, ended]
                      properties:
                        id: { type: string }
                        appDid: { type: string }
                        name: { type: string }
                        kind: { type: string, enum: ["MCP/DCR client", "delegated app", "first-party seed"] }
                        status: { type: string, enum: [active, dormant, expired, revoked] }
                        created: { $ref: "#/components/schemas/RegistryProvenancePoint" }
                        firstConsent: { $ref: "#/components/schemas/RegistryProvenancePoint" }
                        consentingPrincipals: { type: integer, minimum: 0 }
                        lastSeen: { type: [string, "null"], format: date-time }
                        ended: { $ref: "#/components/schemas/RegistryProvenancePoint" }
        "401": { description: Authentication required. }
        "403": { description: Node operator required; no metadata returned. }
        "503": { description: Metadata unavailable; provider detail is redacted. }
  /api/cloudflare-grants:
    get:
      tags: [jin]
      operationId: cloudflareOwnerGrants
      summary: List the controlled verified zone's operation grants
      description: >-
        Real human owner or current group owner/admin with vault access only.
        Not limited to the node operator. Acting-for agents and stale group
        membership are refused. No token is read or returned.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: ownerDid, in: query, required: true, schema: { type: string } }
        - { name: domain, in: query, required: true, schema: { type: string } }
        - { name: zoneId, in: query, required: true, schema: { type: string, pattern: "^[a-f0-9]{32}$" } }
      responses:
        "200": { description: "Metadata envelope {grants}; Cache-Control no-store" }
        "403": { description: Current human zone owner authority required }
        "503": { description: Metadata unavailable }
    post:
      tags: [jin]
      operationId: cloudflareOwnerDelegate
      summary: Delegate zone operations to another DID without repasting the token
      description: >-
        Same human and verified owner gate as GET. Reuses issueGrant, never
        grants credential fetch access. Manage zone grants also calls existing
        POST /auth/api/grants/{grantId}/renew and DELETE /auth/api/grants/{grantId}.
        Both verify the real current owner/controller. Revocation prevents
        the next operation and pending bulk execution.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ownerDid, domain, zoneId, granteeDid, capabilities]
              properties:
                ownerDid: { type: string }
                domain: { type: string }
                zoneId: { type: string, pattern: "^[a-f0-9]{32}$" }
                granteeDid: { type: string }
                capabilities:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, enum: ["cloudflare:read", "cloudflare:dns", "cloudflare:cache", "cloudflare:ssl", "cloudflare:custom-hostnames"] }
                ttlMs: { type: integer, minimum: 1, maximum: 2592000000, default: 86400000 }
      responses:
        "201": { description: "Delegation envelope {grant}, exact zone-DID audience" }
        "400": { description: Invalid scope or lease }
        "403": { description: Current human zone owner authority required }
        "503": { description: Delegation unavailable }
  /api/orgs/{ownerDid}/mail-senders:
    parameters:
      - { name: ownerDid, in: path, required: true, schema: { type: string } }
    get:
      tags: [jin]
      operationId: listOrganizationMailSenders
      summary: Read organization and per-app send-only sender settings
      description: >-
        Requires a real session cookie and active owner/admin membership of
        this exact business, community, or family identity. Bearer credentials
        and app tokens (including app tokens moved into cookies) are refused.
        Readiness is keyed by configured domain and is server-authoritative;
        until ownership and mail verification are implemented it is always false.
        Saving configuration never enables custom-domain delivery.
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Configured senders, four kernel defaults and domain readiness
          content:
            application/json:
              schema:
                type: object
                required: [senders, defaults, readiness]
                properties:
                  senders:
                    type: array
                    items:
                      type: object
                      required: [ownerDid, purpose, appDid, domain, localPart, displayName, replyTo]
                      properties:
                        ownerDid: { type: string }
                        purpose: { type: string, enum: [signin, receipts, notifications, contact] }
                        appDid: { type: string }
                        domain: { type: string }
                        localPart: { type: string }
                        displayName: { type: string }
                        replyTo: { type: [string, "null"] }
                  defaults:
                    type: object
                    description: Fixed imajin.ai fallback sender for each kernel purpose.
                    required: [signin, receipts, notifications, contact]
                    properties:
                      signin: { const: "Signin <signin@imajin.ai>" }
                      receipts: { const: "Receipts <receipts@imajin.ai>" }
                      notifications: { const: "Notifications <notifications@imajin.ai>" }
                      contact: { const: "Imajin <info@imajin.ai>" }
                  readiness: { type: object, additionalProperties: { type: boolean } }
        "401": { description: A real user session is required }
        "403": { description: Not an active owner/admin of the exact group identity }
        "500": { description: Settings unavailable }
    put:
      tags: [jin]
      operationId: saveOrganizationMailSender
      summary: Save one fixed-purpose organization sender or per-app override
      description: >-
        Same session-only, exact-group owner/admin gate as GET. appDid is
        optional; empty means the owner default. A nonempty appDid must belong
        to this exact owner in the registry and be active. Unknown fields
        (including readiness or mailReady) and arbitrary purposes are refused.
        Domain is a bare DNS name, not a URL, IP address, port or mailbox.
        Local part is a dot-separated ASCII email atom (maximum 64 characters).
        Header control characters and address delimiters are refused.
        No mailbox, DNS or Postal provisioning is performed.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailSenderInput" }
      responses:
        "200":
          description: Saved (does not establish mail readiness)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
        "400": { description: Invalid JSON, fields or sender values }
        "401": { description: A real user session is required }
        "403": { description: Not an active owner/admin, or app not active and owned by this group }
        "500": { description: Settings unavailable }
  /api/internal/session-events:
    post:
      tags: [jin, loops]
      operationId: ingestSessionCommandEvent
      summary: Internal authenticated-socket handoff for signed plugin observations
      description: >-
        Called by the local WebSocket dispatcher only. The internal API key
        authenticates the handoff; socketDid is taken from the authenticated
        socket metadata. Independently verifies the current agent signature
        and principal/loop/command correlation before persisting signed
        loop.approval.bound or loop.session.*.completed/failed evidence.
        No unsigned result, unknown command or client-selected destination is
        accepted. This is not a public approval or command dispatch endpoint.
      security: [{ internalKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [socketDid, frame]
              properties:
                socketDid: { type: string }
                frame:
                  type: object
                  required: [type, attestation]
                  properties:
                    type: { type: string }
                    attestation:
                      type: object
                      required: [from, type, timestamp, payload, signature]
                      properties:
                        from: { type: string }
                        type: { type: string, const: agent }
                        timestamp: { type: integer }
                        payload: { type: object }
                        signature: { type: string }
      responses:
        "200": { description: Accepted correlated evidence, or an identical duplicate }
        "400": { description: Invalid or oversized envelope }
        "401": { description: Internal key required }
        "403": { description: Publisher, current key, authority or command correlation mismatch }
        "404": { description: Unknown command or principal-owned loop }
        "409": { description: Conflicting binding/result, or command not dispatched }
        "500": { description: Observation unavailable }
  /api/runs/{loopId}/commands:
    post:
      tags: [jin, loops]
      operationId: commandRun
      summary: Prepare or dispatch a principal-signed loop command
      description: >-
        Self-only node operator, no acting-as or delegated identity. Prepare
        binds the originating verified agent and adds a five-minute kernel
        grant. Dispatch rechecks that grant, the full principal wish, the
        current key and serving relationship before durably claiming the
        command ID and attempting delivery to one own-agent DID socket.
        Delivery is not execution: only a correlated signed plugin outcome
        establishes completed/failed. Native approve/deny may be prepared
        here but must be dispatched through the shared approval decision
        endpoint, which atomically chooses one execution rail.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: loopId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, type, payload]
                  properties:
                    action: { type: string, const: prepare }
                    type:
                      type: string
                      enum: [session.send, session.abort, session.spawn, session.approve, session.deny]
                    payload: { type: object, additionalProperties: { type: string } }
                - type: object
                  additionalProperties: false
                  required: [action, command]
                  properties:
                    action: { type: string, const: dispatch }
                    command: { $ref: "#/components/schemas/SessionCommand" }
      responses:
        "200":
          description: "Prepared {command}, or dispatched {commandId,delivered}; neither is an execution receipt."
        "400": { description: Invalid JSON, command shape, payload or unexpected fields }
        "401": { description: Authentication required }
        "403": { description: Not the direct operator, invalid wish/grant, changed authority or wrong execution rail }
        "404": { description: Run not found within principal scope }
        "409": { description: Inactive run, unavailable origin proof or consumed command ID }
        "500": { description: Command unavailable }
        "503": { description: Command signer unavailable }
  /api/reach:
    get:
      tags: [jin]
      operationId: listReachInbox
      summary: List the signed-in principal's Reach Inbox
      description: |
        Direct human session only; acting-as and acting-for are refused.
        Returns {principalDid,envelopes}. Messages and onBehalfOf claims are
        untrusted content; claims remain UNVERIFIED. Replying does not accept
        a connection, create a chat thread, or invoke a harness.
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Principal-scoped private envelopes, including any signed reply }
        "401": { description: A human session is required }
        "403": { description: Delegated or acting-as contexts cannot use the human reply surface }
  /api/reach/{reachId}/reply:
    post:
      tags: [jin]
      operationId: replyToReach
      summary: Store and publish the principal's signed reply
      description: |
        One-tap Reply on the Reach card signs agent.reach.replied with the
        principal's browser-held key; the kernel verifies its current registered
        public key and never substitutes a node signature. The unsigned event
        contract is documented at /auth/api/spec under reachStatusSigned.
        One immutable reply is stored in the existing reach envelope. An exact
        signed retry recovers pending publication; a replacement conflicts.
        Signed recipients can also receive this exact event through the existing
        #1884 live/cursor subscription path, scoped to the original requester.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: reachId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, issuedAt, signature]
              properties:
                message: { type: string, minLength: 1, maxLength: 16000 }
                issuedAt: { type: string, format: date-time }
                signature:
                  type: object
                  required: [keyId, alg, sig]
                  properties:
                    keyId: { type: string, pattern: "^[0-9a-fA-F]{64}$" }
                    alg: { type: string, enum: [ed25519] }
                    sig: { type: string, pattern: "^[0-9a-fA-F]{128}$" }
      responses:
        "200": { description: "{reply} containing the exact principal-signed event" }
        "400": { description: Invalid reply body }
        "401": { description: A human session is required, or the principal signature/timestamp is invalid }
        "403": { description: Acting-as, delegated replies, or replies to a blocked sender are refused }
        "404": { description: Unknown or non-owned reachId }
        "409": { description: Reach already has a different immutable reply }
  /api/reach/{reachId}/block:
    post:
      tags: [jin]
      operationId: blockReachSender
      summary: Block the sender of a Reach card in one tap
      description: |
        Direct human session only. Resolves the sender from the principal-owned
        envelope, never from a caller-supplied DID. Blocks future delivery,
        replies and reply reads, including signed subscription delivery.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: reachId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{blocked:true}; the Inbox refresh retains blocked state" }
        "401": { description: A human session is required }
        "403": { description: Acting-as or delegated contexts are refused }
        "404": { description: Unknown or non-owned reachId }
  /api/events:
    get:
      tags: [jin]
      operationId: listRecordEvents
      summary: List the authenticated principal's signed events (Record lane, #2289)
      description: >-
        Per-principal read over the signed event stream
        (`registry.system_events`) — the same table `GET /api/admin/events`
        reads (requireAdmin only). Scoped here to `requireAuth` +
        `X-Acting-For` instead: a principal sees an event when they are its
        issuer, when the issuer is an agent that acts for them (legacy
        `identity_members` role='agent' membership or a #1882 delegation
        grant they issued), or when the event was authorized by an operator
        approval they decided (`operator.approvals`, joined on
        `payload->>'proposalId'`). `agent`/`grant` only ever narrow this
        scope, never widen it.
      security:
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: false
          schema: { type: string }
          description: "Exact match on the bus event type, e.g. 'operator.approval.decided'."
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: "Lower bound (inclusive) on createdAt."
        - name: agent
          in: query
          required: false
          schema: { type: string }
          description: "Narrow to one DID already within scope."
        - name: grant
          in: query
          required: false
          schema: { type: string }
          description: "Match payload.grantId, e.g. a vault.delegation.revoked event."
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/RecordEvent" }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/operator-approvals:
    get:
      tags: [jin]
      operationId: listOperatorApprovals
      summary: List operator approval proposals across every connected source
      description: >-
        Each principal sees only proposals addressed to their own Inbox
        (#2723), including their own connector proposals, never another
        principal's. A delegated agent gets `{isOperator: false, approvals: []}`.
        Reach messages and pending agent knocks appear as source reach / kind
        reach:message and source knock / kind knock:request, including safe
        evidence but no gate rules. A verified human owner/admin acting as a
        principal additionally sees that principal's Reach/knock cards, never
        their unrelated proposals.
        Optional `?source=` scopes the list to
        one source (#2152) — a view filter only, never a security boundary.
        This READ surface keeps listing under act-as (#2359) — hiding the
        queue would only make the act-as state harder to notice — and
        reports the act-as overlay as `actAs` so the panel can render its
        decision controls read-only instead of offering a tap the confirm
        rail will refuse with 403 `act_as_not_permitted`.
        `?view=acting` (#2952) opts into the validated acting organization's
        read-only Inbox, enforcing owner/admin membership of a genuine group
        and controller access to service `jin`. Agent/maintainer roles cannot
        use this projection to read a personal principal's Inbox. Without
        an acting organization it reads the session Inbox. It additionally
        returns `canAccess`: true for the node operator, an authorized group
        controller, or a principal with addressed cards; false for delegated
        agents or other empty Inboxes. `?count=true` returns a read-only
        aggregate `pending` instead of hydrated approvals. While acting as
        a different identity, an authenticated human also receives
        `personalInbox: {pending, handle}` if their own Inbox has pending cards
        (#3017). This is only a count and the session's personal handle, never
        card contents, IDs, other members' counts or shared Reach cards. It
        ignores the source filter so personal attention cannot be hidden by
        an org filter. The shared nav adds this count to the org pending count;
        the org list and its pending field stay isolated. No query parameter selects a DID.
        Decisions remain self-only; this read view grants no write authority.
        The one exception is Reach/knock cards: `reachActAsAllowed` permits
        their actions for a live owner/admin acting as the principal. All
        other sources remain self-only.
      security:
        - cookieAuth: []
      parameters:
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [acting] }
          description: "Read the validated acting principal's Inbox; default is the real session Inbox."
        - name: source
          in: query
          required: false
          schema: { type: string }
          description: "Filter to one open-vocabulary source, e.g. 'skill-workshop'."
        - name: count
          in: query
          required: false
          schema: { type: boolean }
          description: Return pending count without hydrating cards or running recovery writes.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  isOperator: { type: boolean }
                  canAccess: { type: boolean, description: "Present only for view=acting; shared nav and Inbox visibility." }
                  pending: { type: integer, minimum: 0, description: "Count-only projection; organization-only under act-as." }
                  personalInbox:
                    type: object
                    additionalProperties: false
                    required: [pending, handle]
                    description: Only for a validated acting human with pending personal approvals; never another member's attention.
                    properties:
                      pending: { type: integer, minimum: 1 }
                      handle: { type: [string, "null"] }
                  reachActAsAllowed: { type: boolean, description: Live owner/admin membership verified for the acting principal; applies only to Reach/knock cards. }
                  approvals:
                    type: array
                    items: { $ref: "#/components/schemas/OperatorApprovalCard" }
                  actAs:
                    $ref: "#/components/schemas/ActAsContext"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/operator-approvals/{proposalId}/decision:
    post:
      tags: [jin]
      operationId: decideOperatorApproval
      summary: Approve, reject, or withdraw a pending operator approval proposal
      description: >-
        Requires the proposal's addressee, never a delegated agent.
        All sources remain self-only except reach:message and knock:request:
        these allow a human session acting as the principal only after a
        fresh active owner/admin membership check. The real actor's key
        signs, and decidedBy records that actor, not the borrowed identity.
        Reach/knock require decision approve and mode reply, accept, decline
        or block, with a mandatory operatorSignature regardless of the node
        flag. Reply additionally signs replyMessage (nonblank, max 16000).
        Only accept creates a chat thread; block persists and prevents
        future knocks/delivery. Domain mutation and signed decision commit
        atomically; exact signed retries are idempotent. No grants are issued.
        `decision` is
        the open, source-agnostic vocabulary (#2152): the kernel never
        interprets it, only witnesses it and republishes it — together
        with the proposal's own `source` + `kind` — on the
        `operator.approval.decided` bus event. `mode` (#2693) is the
        operator's chosen option — a decision-card option letter (required
        on `approve` for `decision:card`), exec `allow-once`/`deny`, or a
        github TTL `single`/`5m`/`24h` — and is refused with 400 when the
        approval's kind does not offer it.
        `operatorSignature` + `decidedAt` (#2082): the operator's own
        countersignature over `{contentHash, decision, decidedAt}` plus
        `mode` whenever the decision carries one (#2693) and replyMessage
        when replying to Reach/knock, produced
        client-side; required
        (400 otherwise) once the per-node `OPERATOR_COUNTERSIGN_REQUIRED`
        flag is on, verified whenever supplied regardless of the flag.
        Native loop-bound approvals (#2404) additionally require
        `sessionCommand`: a kernel-granted session.approve/session.deny
        frame with the complete principal-signed wish. The shared service
        atomically records decision and command correlation, suppresses all
        legacy executable fan-out, and waits for the signed plugin result.
        A stale binding or missing wish never falls back to the legacy rail.
      security:
        - cookieAuth: []
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject, withdrawn] }
                mode: { type: string, minLength: 1, maxLength: 128, description: "The chosen option: decision-card letter | exec allow-once/deny | github TTL | Reach/knock reply/accept/decline/block. Covered by operatorSignature." }
                replyMessage: { type: string, minLength: 1, maxLength: 16000, description: Required and countersigned only for Reach/knock mode reply; forbidden otherwise. }
                reason: { type: string }
                operatorSignature:
                  $ref: "#/components/schemas/OperatorCountersignature"
                sessionCommand:
                  $ref: "#/components/schemas/SessionCommand"
                decidedAt:
                  type: string
                  format: date-time
                  description: "Required when operatorSignature is present — the exact decidedAt the client signed over. Verified for clock skew."
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval: { $ref: "#/components/schemas/OperatorApprovalCard" }
                  executionError:
                    type: string
                    description: >-
                      Present only when `approval.source` is `vault` (#2247),
                      `decision` was `approve`, and the resulting vault
                      mutation (mint/grant/rotate/revoke) failed. The
                      decision itself is still recorded regardless — this
                      never causes a non-2xx response, since the operator's
                      signed decision is durable independent of execution
                      outcome.
        "400":
          description: Malformed body, or decision not one of approve | reject | withdrawn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: >-
            Caller is not the node operator, or is calling under act-as
            (#2359, `code: act_as_not_permitted`). Neither case reveals
            whether proposalId exists.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ActAsNotPermittedError"
                  - $ref: "#/components/schemas/Error"
        "404":
          description: Proposal not found (or not addressed to this operator)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Proposal is not in the status this decision requires
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failed to record decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/operator-approvals/{proposalId}/archive:
    post:
      tags: [jin]
      operationId: archiveOperatorApproval
      summary: Archive a decided decision card in the addressee's Inbox
      description: >-
        Self-only: requires the real authenticated session DID, refuses
        delegated and borrowed identities through the same act-as guard as
        the decision rail, and verifies the proposal's resolved addressee.
        Only source decision, kind decision:card, with status approved,
        denied, withdrawn, applied, or expired may be archived.
        Persists an idempotent per-principal timestamp in unsigned outcome
        metadata without deleting the proposal, changing its signed decision,
        content, status, or appliedAt, or executing anything.
        No request body is required. After success, reload GET
        /api/operator-approvals for this reader's archivedAt.
      security:
        - cookieAuth: []
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Archived, including an already-archived card
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not the proposal addressee, delegated, or under act-as
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ActAsNotPermittedError"
                  - $ref: "#/components/schemas/Error"
        "404":
          description: Proposal not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Not a decided decision card, or proposal changed before the write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Failed to archive proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/vault-proposals:
    post:
      tags: [jin]
      operationId: raiseVaultProposal
      summary: Raise a vault action as a canvas-native operator-approval card
      description: >-
        Canvas-native counterpart to an agent proposing in chat via
        `POST /notify/api/send` (#2247). Only the node operator may call
        this route — same gate as the decision endpoint above. Creates a
        `source: 'vault'`, `kind: 'vault:<action>'` row on the SAME
        operator-approvals table `GET /api/operator-approvals` already
        lists and `POST /api/operator-approvals/{proposalId}/decision`
        already decides — no new approval rail. Approving the resulting
        card is the signing event; the actual vault mutation runs
        server-side at that point (`src/lib/vault/approvals-execution.ts`).
        Self-only too (#2359): a session under act-as is refused with 403
        `act_as_not_permitted` before anything is written.
        Group custody (#2934) accepts identifiers only: `custody-group-key`
        and `revoke-group-key` require {groupDid,purpose}. The configured node
        DID is resolved server-side and included in the signed proposal.
        Both require the real node operator's cryptographic countersignature
        and current group owner/admin membership with vault access, rechecked
        at execution. Custody authenticates the existing server-encrypted key
        in process, matches its public key, seals a unique vault-group-key field
        and issues one reusable group-to-node purpose grant. Existing
        fetchPurposeCredential is the internal consumer; HTTP fetch/export and
        generic mutation paths refuse this namespace. Revoke erases the grant's
        wrapped material and stops future fetches, not previously loaded keys.
        It does not rotate/delete the group's original stored key. Both actions
        atomically persist a node-signed audit binding purpose, public key,
        group, node, field, grant and countersigned approval reference.
        Unsupported ciphertext, absent/mismatched existing encryption secret,
        Tier-1 custody or duplicate purpose grants fail closed without fallback.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, detail]
              properties:
                kind: { type: string, enum: [mint, grant, rotate, revoke, custody-group-key, revoke-group-key] }
                detail:
                  type: object
                  description: >-
                    Shape depends on `kind`: mint needs {purpose,
                    requesterDid, expiresAt?}; grant needs {did, grantedTo,
                    purpose?, oneTime?, expiresAt?}; rotate needs {did,
                    purpose?, requesterDid?, expiresAt?}; revoke needs
                    {did, tier?: withdraw|tombstone|destroy}; custody-group-key
                    and revoke-group-key accept only {groupDid,purpose},
                    e.g. purpose domain.issue. Never submit a key or nodeDid.
      responses:
        "201":
          description: Proposal raised
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposalId: { type: string }
        "400":
          description: Missing/invalid kind or detail for that kind
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: >-
            Caller is not the node operator, or is calling under act-as
            (#2359, `code: act_as_not_permitted`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ActAsNotPermittedError"
                  - $ref: "#/components/schemas/Error"

  /api/apps/provision:
    post:
      tags: [apps]
      operationId: proposeAppsProvision
      summary: Propose apps.provision (#2375) — create/register/seal an extracted (third_party) app
      description: >-
        Any authenticated identity may propose (mirrors the GitHub
        connector's "agent proposes, operator approves" posture, NOT
        `/api/vault-proposals`'s operator-only raise) — stages an
        `apps:provision` proposal on the SAME operator-approvals table
        `GET /api/operator-approvals` lists and
        `POST /api/operator-approvals/{proposalId}/decision` decides. The
        repo/mint/register/seal pipeline (`src/lib/apps/provision.ts`) only
        runs once the operator countersigns an 'approve' decision —
        provisioning is operator-authority, never self-service.
        Optional sourceRepo selects an existing owner/name repository in any
        organization instead of generating ima-jin/<slug> from a template.
        Its own manifest is required and its source is visible on the signed
        proposal. Default behavior is unchanged when sourceRepo is omitted.
        New app ownership is registry.apps.ownerDid (siteOwnerDid or approving
        operator), separate from DNS zone ownership. Provisioning attempts to
        issue the selected Imajin subdomain as the actual Imajin organization;
        unavailable issuer/grant/key defers the binding without blocking the
        signing-key grant or claim code. An explicit domain on a succeeded app
        stages a countersigned host retry. Plain claim reissue changes neither
        domain, owner, visibility, callback URL nor redirect hosts.
        New registrations use the countersigned visibility (default public).
        An explicit approved domain registers https://<domain>/api/auth/callback
        with that domain as its allowed redirect host; no domain preserves
        the node-path callback. Existing registrations are never rewritten by
        retry or claim reissue.
        A failed-step retry that conflicts with already-registered visibility
        or callbacks fails closed rather than reporting success with different
        settings; re-propose with the existing settings.
        Optional imajin.app.json profileWidget ({path,label,icon?}) is a
        validated link-only contribution on the registered entryUrl origin,
        snapshotted on the signed operator card and rechecked for drift at
        execution. It never adds anyone's apps: rendering requires the profile
        owner's enabledApps or forest enabled_services. See registry.yaml
        ProfileWidget for the declaration contract.
        Idempotent on `slug`: absent an explicit host retry or claim reissue,
        an already-succeeded slug returns the cached
        result immediately (status 200, no proposal); an already-pending
        proposal for the same slug is reused rather than duplicated.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppProvisionRequest" }
      responses:
        "200":
          description: Already succeeded (cached) or an existing pending proposal was reused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppProvisionResult" }
        "201":
          description: New proposal raised
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [pending] }
                  proposalId: { type: string }
        "400":
          description: Malformed slug/displayName/template/sourceRepo/attestationTypes/siteOwnerDid/domain/visibility, or forbidden owner/domain/visibility/sourceRepo input on reissue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: No succeeded app exists for claim reissue, or sourceRepo would change an already-succeeded app's repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: No node operator configured, or failed to raise the proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [apps]
      operationId: getAppsProvisionStatus
      summary: Poll the current apps.provision ledger row for a slug
      description: >-
        Lets the proposing agent retrieve the eventual result without
        needing the operator's decision response — reads
        `kernel.app_provisions` (`src/lib/apps/provision.ts`).
      security:
        - cookieAuth: []
      parameters:
        - name: slug
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppProvisionResult" }
        "400":
          description: Missing slug query parameter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No apps.provision run found for this slug
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/apps/featured:
    post:
      tags: [apps]
      operationId: proposeAppFeatured
      summary: Propose directory featuring for a registered app (#2871)
      description: >-
        The real node operator, without act-as or delegation, stages an
        apps:featured proposal on the existing operator-approvals rail.
        Nothing changes until the operator countersigns an approve decision
        through POST /jin/api/operator-approvals/{proposalId}/decision.
        Execution always requires a verified operator countersignature,
        independent of the node-wide optional countersign flag. No decision
        mode is accepted. The proposal content hash binds appDid and featured.
        Changes only registry.apps.featured (NOT NULL, default false);
        never installs, adds enabledApps, issues authorization, changes scopes,
        or creates attestations. Self-service app registration cannot set it.
        An identical pending proposal is reused. Featuring requires an active
        app at proposal and execution time; unfeaturing a revoked app is allowed.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appDid, featured]
              properties:
                appDid: { type: string, minLength: 1 }
                featured: { type: boolean }
      responses:
        "200":
          description: Identical pending proposal reused
        "201":
          description: New proposal staged; app metadata is unchanged until countersigned approval
          content:
            application/json:
              schema:
                type: object
                required: [status, proposalId]
                properties:
                  status: { type: string, enum: [pending] }
                  proposalId: { type: string }
        "400":
          description: Invalid JSON, missing appDid, or featured is not a boolean
        "401":
          description: Not authenticated
        "403":
          description: Not the real node operator, or acting as/for another identity
        "404":
          description: Unknown app DID
        "409":
          description: Cannot feature an inactive app
        "500":
          description: Failed to raise proposal

  /api/apps/service-scopes:
    post:
      tags: [apps]
      operationId: proposeAppServiceScopes
      summary: Propose operator-approved service scopes for an app (#2711)
      description: >-
        The app's owner or the node operator may propose. Stages an
        `apps:service-scopes` proposal ("App X requests service scopes [..]")
        on the same operator-approvals table `GET /api/operator-approvals`
        lists; the operator countersigns on /jin. The approved set is stored
        on the app and the session-less service token
        (`POST /auth/api/apps/token/service`) then carries
        `requestedScopes ∩ (serviceEligible ∪ approved)`. A scope in
        `requestedScopes` alone never reaches a service token; the global
        `serviceEligible` list is unchanged. `action: revoke` removes scopes
        from the approved set (also countersigned) so the next mint drops them.
        An identical already-pending proposal is reused.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppServiceScopesRequest" }
      responses:
        "200":
          description: Already approved, or an identical pending proposal was reused
        "201":
          description: New proposal raised
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [pending] }
                  proposalId: { type: string }
        "400":
          description: Malformed body or a scope outside the vocabulary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Caller is neither the app owner nor the node operator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown app DID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Grant for a non-active app, or revoke of scopes that are not approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: No node operator configured, or failed to raise the proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [apps]
      operationId: getAppServiceScopes
      summary: Read app scopes or discover registered apps (#2711, #2822, #2976)
      description: >-
        With appDid, retains the owner/operator single-app read. Without appDid,
        only the directly authenticated node operator may discover all registry
        apps, including self-registered apps without a slug or provisioning row
        and inactive apps. Returns at most 50 apps ordered by appDid. Pass the
        opaque nextCursor as cursor for the next page; null ends pagination.
        Both reads use Cache-Control no-store. Scope sets are normalized;
        requested scopes are not approvals. No keys, credentials, callback URLs,
        secrets or provisioning records are returned.
      security:
        - cookieAuth: []
      parameters:
        - name: appDid
          in: query
          required: false
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 2048 }
          description: Opaque continuation from nextCursor; used only without appDid.
      responses:
        "200":
          description: Targeted app metadata or an operator-only registry page
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AppServiceScopesMetadata"
                  - type: object
                    required: [apps, nextCursor]
                    additionalProperties: false
                    properties:
                      apps:
                        type: array
                        maxItems: 50
                        items:
                          allOf:
                            - $ref: "#/components/schemas/AppServiceScopesMetadata"
                            - type: object
                              required: [name, status]
                              properties:
                                name: { type: string }
                                status: { type: string }
                      nextCursor: { type: string, nullable: true }
        "400":
          description: Invalid discovery cursor
        "401":
          description: Not authenticated
        "403":
          description: Discovery requires the node operator; targeted reads require the owner or operator
        "404":
          description: Unknown app DID on targeted read
        "503":
          description: Registry discovery unavailable; not an empty app list

  /api/apps/claim:
    post:
      tags: [apps]
      operationId: claimAppSigningKey
      summary: Exchange a one-time claim code for the app's vault-minted signing key (#2411, #2444)
      description: >-
        First-boot exchange for a third-party app provisioned via
        `apps.provision`. Deliberately NOT session-gated — the app has no
        identity yet; the single-use, ~15-minute claim code shown once on the
        /jin approval card IS the authentication. The caller also submits an
        Ed25519 `bootstrapPublicKey`, which the kernel binds to the claim and
        which every later boot re-authenticates with via
        `POST /api/apps/signing-key/fetch` (no claim code spent).

        **Target-app binding (#2444).** `expectedAppDid` (optional) binds the
        code to the requesting app: if present and it does not match the app
        the code was issued for, the route answers `409` BEFORE spending the
        code — nothing is claimed, bound, or audited as a claim, no key
        material is returned, and the code stays redeemable by its rightful
        app. The check runs ahead of the expired/already-claimed checks, so a
        foreign code's lifecycle state is neither disclosed nor mutated.
        Omitted, behavior is unchanged.

        **Attestation id (#2444).** A successful response carries the id of
        the `apps.signing-key.claimed` attestation minted for the redemption
        (kernel-signed, mechanical), so the operator-facing success page can
        show "app DID + attestation id". It is `null` only if attestation
        forwarding was unavailable — the code is already spent by then, so
        that never fails the exchange.

        Neither the claim code nor any private key ever appears on the bus,
        in an attestation payload, or in a non-2xx response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claimCode, bootstrapPublicKey]
              properties:
                claimCode: { type: string, description: "The one-time plaintext claim code (`claim_...`)." }
                bootstrapPublicKey:
                  type: string
                  pattern: "^[0-9a-fA-F]{64}$"
                  description: Hex-encoded Ed25519 public key (64 hex chars) the app minted and persisted locally.
                hostHint:
                  type: string
                  maxLength: 200
                  description: Caller-reported, best-effort label (e.g. hostname). Recorded for the /jin timeline only — never trusted for authorization.
                expectedAppDid:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: >-
                    The app DID the caller expects the code to belong to
                    (`IMAJIN_APP_DID`). On mismatch the route returns 409
                    without spending the code.
      responses:
        "200":
          description: Code redeemed; key material returned (held in memory only by the caller)
          content:
            application/json:
              schema:
                type: object
                required: [appDid, privateKey, publicKey, attestationId]
                properties:
                  appDid: { type: string }
                  privateKey: { type: string, description: The app's vault-minted Ed25519 private key. Never persisted by the kernel route or the SDK. }
                  publicKey: { type: string }
                  attestationId:
                    type: [string, "null"]
                    description: Id of the `apps.signing-key.claimed` attestation minted for this redemption; `null` if attestation forwarding was unavailable.
        "400":
          description: Malformed body (missing claimCode, bad bootstrapPublicKey, oversized hostHint, invalid expectedAppDid) or an otherwise unredeemable code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unrecognized claim code, or the underlying app-signing-key grant no longer exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            `expectedAppDid` does not match the app this code was issued for.
            The code was NOT spent and no key material is returned (#2444).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: The claim code has expired or was already redeemed (or its one-time grant was already consumed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Unexpected failure redeeming the code, or the grant resolved with an unexpected purpose
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/loops:
    post:
      tags: [loops]
      operationId: ingestLoopEvent
      summary: Signed ingest for loop lifecycle, surface and horizon step observations
      description: >-
        Any publisher (Warp's own dispatch loop, the OpenClaw plugin
        translating gateway-side lifecycle hooks, a review sub-agent) posts
        a `loop.started | loop.progress | loop.blocked | loop.finished`
        envelope here, signed with its own DID key. The kernel verifies
        `signature` against `publisherDid`'s currently registered key
        (unknown, mismatched, or revoked key all reject with 400) before
        publishing the event onto the bus — an unsigned or forged event is
        never persisted. On success, `kernel.loops` / `kernel.loop_events`
        are durable before this call returns (read-after-write).
        Optional payload.output records typed session output. Verification
        covers the original envelope; secrets are redacted before any bus
        or artifact persistence. Output above 16384 UTF-8 JSON bytes is
        replaced by an artifact reference and truncated preview.
        Maximum complete HTTP request size is 1048576 bytes.
        Horizon step.* facts share this authorization/signature boundary and add
        stepId plus type-specific data (StepEnvelope). The owning loop must already
        exist under this principal. Step facts append history without changing the
        loop lifecycle. Exact signed retries deduplicate. Code exit evidence must
        match the item's issue/repository and the same production release tag;
        manual attestations must come from the declared completing DID.
        step.updated.issue requires only ref; optional outcome must match
        /^OUTCOME\b/ and is never invented. Matching issue_closed evidence
        satisfies a ref-only binding. Stale envelopes still reject with 400;
        reconcile ambiguous stale deliveries via POST /api/loops/receipts,
        signing a separate fresh lookup without modifying the original at.
        See docs/loops-rail-contract.md for the complete type-to-block contract.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, payload, publisherDid, signature]
              properties:
                type: { type: string, enum: [loop.started, loop.progress, loop.blocked, loop.finished, surface.acquired, surface.released, surface.conflicted, step.queued, step.updated, step.claimed, step.started, step.progress, step.blocked, step.finished, step.observed, step.attested] }
                payload:
                  anyOf:
                    - $ref: "#/components/schemas/LoopEnvelope"
                    - $ref: "#/components/schemas/StepEnvelope"
                    - $ref: "#/components/schemas/SurfaceEnvelope"
                publisherDid: { type: string, description: "The signing agent's own DID." }
                signature: { $ref: "#/components/schemas/LoopPublisherSignature" }
      responses:
        "201":
          description: Event ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  loopId: { type: string }
        "400":
          description: Malformed envelope, or signature rejected (unknown/mismatched/revoked key, invalid signature, stale timestamp)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Verified event failed to publish or store an output artifact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "403":
          description: Publisher has no loops:publish authority for the principal
        "409":
          description: Loop owner or step declaration missing/mismatched; never returned for lease contention
        "413":
          description: Complete request exceeds 1048576 bytes

    get:
      tags: [loops]
      operationId: listLoops
      summary: List the caller's own loops (or a lineage tree)
      description: >-
        Scoped to the caller's effective DID (`requireAuth` +
        `resolveActingDid` — the same delegation precedence every other
        authenticated route uses): an operator sees their own loops, and an
        agent authenticated with `X-Acting-For` sees the principal it acts
        for. `?ancestor=` returns the full descendant lineage tree rooted at
        that loopId instead of the flat list (recursive on `parentLoopId`).
      security:
        - cookieAuth: []
      parameters:
        - name: principal
          in: query
          required: false
          schema: { type: string }
          description: Must equal the caller's own effective DID when supplied (403 otherwise) — never a broader lookup.
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: kind
          in: query
          required: false
          schema: { type: string }
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: ancestor
          in: query
          required: false
          schema: { type: string }
          description: A loopId — returns its full descendant lineage tree instead of the caller's flat loop list.
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  loops:
                    type: array
                    items: { $ref: "#/components/schemas/LoopRecord" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "?principal= does not match the caller's effective DID"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/loops/receipts:
    post:
      tags: [loops]
      operationId: lookupLoopReceipt
      summary: Reconcile an ambiguous signed envelope without restamping or replaying it
      description: >-
        Kernel-root route, no /jin prefix. Sign canonicalize({type:"loop.receipt",
        payload:{loopId,principal,envelopeHash,at}}) with the same publisher DID
        key and signature shape as ingest. Uses the current registered key and
        current loops:publish authorization, including self/node-witness paths.
        Only rows matching the authenticated publisher, owning loop, principal
        and signed envelope hash can return accepted. Unknown, foreign-publisher
        (even another delegate of the same principal), wrong-loop/principal and
        unauthorized scope all return identical 404 not_found.
        Original envelope age does not affect lookup; the separate lookup at
        must be fresh. No writes, lease renewal, bus publication or harness reads.
        On accepted, reconcile the unchanged durable outbox using eventId.
        On not_found retain the original and fail closed: never restamp an
        ambiguous envelope, and a lookup cannot rule out a still-in-flight ingest.
        Storage/auth failures return 500, never not_found.
        Every new signed ingest uses a deterministic signed-loop:<hash> id;
        existing steps/surfaces/completions already used it. Legacy random-id
        lifecycle history is not backfilled. Ingest freshness is unchanged,
        including for stored exact stale retries. Discoverable in /jin/api/spec.
      servers:
        - url: https://{node}.imajin.ai
          variables:
            node:
              default: jin
        - url: http://localhost:3000
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoopReceiptRequest" }
      responses:
        "200":
          description: Accepted envelope, with the original stored event id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoopReceipt" }
        "404":
          description: Non-disclosing not-found for unknown or out-of-scope envelope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoopReceiptNotFound" }
        "400":
          description: Malformed request, invalid/current-key-mismatched signature or stale/future lookup timestamp
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Complete request exceeds 1048576 bytes
        "500":
          description: Receipt lookup or authorization storage unavailable; not a not-found result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/loops/spend:
    get:
      tags: [loops]
      operationId: getLoopSpend
      summary: Read the caller's registry-attributed spend in USD
      description: >-
        Kernel-root route (no /jin prefix). Uses `requireAuth`: session cookie
        first, otherwise Bearer token. The cookie is imajin_session in
        production, or imajin_session_dev when IMAJIN_ENV=dev or
        NODE_ENV=development. Scoped to `resolveActingDid` with
        precedence actingFor, actingAs, then the authenticated identity's DID;
        delegation must be authorized. An optional principal must match that
        effective DID, never broaden the lookup. Both registry and usage
        reads are principal-scoped. Usage matches exact run ids before unique
        sessionKey aliases; ambiguous aliases are not allocated, each usage
        row counts at most once, and error-status usage is excluded. No
        external provider calls, pagination, row limit, or window-length cap.
      servers:
        - url: https://{node}.imajin.ai
          variables:
            node:
              default: jin
        - url: http://localhost:3000
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: principal
          in: query
          required: false
          schema: { type: string }
          description: Defaults to the caller's effective DID; if supplied (even empty), must equal it or returns 403.
        - name: window
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$|^\d{4}-\d{2}-\d{2}\.\.\d{4}-\d{2}-\d{2}$'
            example: "2026-10"
          description: >-
            Defaults to the current UTC calendar month when absent. Accepts
            YYYY-MM (month 01–12) or YYYY-MM-DD..YYYY-MM-DD with an inclusive
            end date, converted to a half-open UTC interval ending at midnight
            the following day. Range dates use JavaScript Date parsing; invalid
            dates or an exclusive upper bound not after the start return 400.
            Empty or malformed values return 400. No maximum range length.
      responses:
        "200":
          description: Registry spend, with unknown USD represented as null rather than 0
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrySpend" }
        "400":
          description: "Invalid window — error: window must be YYYY-MM or YYYY-MM-DD..YYYY-MM-DD"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not authenticated, or invalid/expired session or Bearer token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "Unauthorized delegation, or error: principal must match the authenticated caller"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: "Registry spend read failed — error: Registry spend unavailable"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "Authentication service unavailable — error: Auth service unavailable"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/loops/{loopId}:
    get:
      tags: [loops]
      operationId: getLoop
      summary: One loop's lifecycle, ordered history and derived horizon
      description: >-
        Same per-principal scoping as `GET /api/loops`: a loop that exists
        but belongs to a different principal is reported as 404, identical
        to one that doesn't exist at all — never confirms existence to a
        caller who isn't allowed to see it.
        Events are ordered by occurredAt then id ascending. Each event's
        payload.output is a typed inline output or StoredLoopOutput.
        Responses are private and no-store.
        horizon derives zones and checks declared exit conditions from signed step
        observations, with no harness lookups. Done/exited items disappear only
        from horizon.steps by default; their signed events remain. includeExited=true
        opts into completed-step audit projections with state exited and zone done.
        Depth always counts only non-done entries and targetDepth is 12.
        Claim references are not lease enforcement.
      security:
        - cookieAuth: []
      parameters:
        - name: includeExited
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: "Only literal true includes exited audit projections; does not change depth or principal scope."
        - name: loopId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [loop, events, horizon]
                properties:
                  loop: { $ref: "#/components/schemas/LoopRecord" }
                  horizon: { $ref: "#/components/schemas/Horizon" }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/LoopEventRecord" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Loop not found (or not scoped to this principal)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/loops/{loopId}/artifacts/{artifactId}:
    get:
      tags: [loops]
      operationId: getLoopOutputArtifact
      summary: Retrieve full redacted oversized output for the caller's loop
      description: >-
        Authenticated by the same effective principal as loop history.
        The hash is not a bearer capability. Wrong-principal, wrong-loop,
        and nonexistent artifacts all return 404. Private, no-store.
      security:
        - cookieAuth: []
      parameters:
        - { name: loopId, in: path, required: true, schema: { type: string } }
        - { name: artifactId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Full redacted output and content-address metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/LoopOutputArtifactRef"
                  - type: object
                    required: [output]
                    properties:
                      output: { $ref: "#/components/schemas/LoopOutput" }
        "400":
          description: Empty route identifier
        "401":
          description: Not authenticated
        "404":
          description: Artifact not found within this principal and loop
