                  tier: { type: string }
        "404":
          description: No Imajin identity linked to this DFOS DID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/attestations:
    post:
      tags: [auth]
      operationId: createAttestation
      summary: Issue a new attestation
      description: |
        Caller must be the issuer (session cookie or Bearer token). The signature must be an
        Ed25519 signature over the canonical JSON of `{subject_did, type, context_id, context_type, payload, issued_at}`.

        `payload.delegator_did` (intro-funnel envelope, #1885) asserts that `delegator_did`
        authorized `issuer_did` to act on its behalf. When present and different from
        `issuer_did`, the write is rejected with 403 unless a live (unexpired, unrevoked)
        delegation grant from `delegator_did` to `issuer_did` covers the capability implied
        by `type` (#1895, #1897) — a self-asserted `delegator_did` is never trusted on its
        own. The verified grant id is recorded on the attestation as `delegationGrantId`.

        `payload.supersedes` (amendment-by-supersession, #1790) names a bilateral attestation
        this one proposes to amend. Once this attestation itself goes bilateral via
        POST /api/attestations/countersign, the referenced attestation atomically flips to
        `superseded` — it stays authoritative until then and remains readable afterwards.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer_did, subject_did, type, signature]
              properties:
                issuer_did: { type: string }
                subject_did: { type: string }
                type: { type: string, description: "Attestation type (from ATTESTATION_TYPES registry)" }
                context_id: { type: string }
                context_type: { type: string }
                payload:
                  type: object
                  description: |
                    May carry the intro-funnel envelope fields (#1885): delegator_did,
                    disclosure_scope, prev_event_ref. May also carry `supersedes` (#1790,
                    amendment-by-supersession) — the id of a bilateral attestation this one
                    proposes to amend. Accepted only when the caller (issuer_did) is a party
                    (issuer or subject) to that attestation and it is currently `bilateral`;
                    rejected with 400 otherwise. Deliberately independent of prev_event_ref.
                signature: { type: string, description: "Ed25519 signature over canonical payload (hex)" }
                issued_at: { type: number, description: "Unix timestamp ms (defaults to now)" }
                author_jws: { type: string, description: "Optional JWS for bilateral attestation flow" }
      responses:
        "201":
          description: Attestation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  cid: { type: string }
                  issuerDid: { type: string }
                  subjectDid: { type: string }
                  type: { type: string }
                  attestationStatus: { type: string, enum: [pending, bilateral, declined, superseded, "null"] }
                  supersedes: { type: string, nullable: true, description: "Bilateral attestation this one proposes to amend, if any (#1790)" }
                  delegationGrantId: { type: string, nullable: true, description: "Grant verified against payload.delegator_did, if any (#1895, #1897)" }
                  issuedAt: { type: string, format: date-time }
        "400":
          description: Invalid request or signature, or an invalid/ineligible payload.supersedes reference (#1790)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: payload.delegator_did asserted but no live delegation grant covers this action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [auth]
      operationId: listAttestations
      summary: List non-revoked attestations for a subject DID
      description: Returns attestations newest first. subject_did is required.
      parameters:
        - name: subject_did
          in: query
          required: true
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
        - name: issuer_did
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [pending, bilateral, declined, superseded] }
        - name: history_of
          in: query
          schema: { type: string }
          description: |
            (#1790) Given any attestation id in a v1<-v2<-... supersession chain, returns
            `{ chain, openDisputes }` instead of the normal list — the whole chain (root
            first) plus any still-pending amendments against its current end. Bypasses
            subject_did (not required with this param).
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Attestation list (or, with `history_of`, a `{ chain, openDisputes }` chain-history object)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    cid: { type: string }
                    issuerDid: { type: string }
                    subjectDid: { type: string }
                    type: { type: string }
                    contextId: { type: string }
                    contextType: { type: string }
                    payload: { type: object }
                    attestationStatus: { type: string }
                    supersedes: { type: string, nullable: true, description: "Bilateral attestation this one proposes to amend, if any (#1790)" }
                    issuedAt: { type: string, format: date-time }
        "400":
          description: subject_did required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: history_of does not resolve to an existing attestation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/attestations/{did}:
    get:
      tags: [auth]
      operationId: getAttestationsByDid
      summary: Shorthand — list attestations for a subject DID (path param)
      description: Equivalent to GET /api/attestations?subject_did={did}
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Attestation list
          content:
            application/json:
              schema:
                type: array
                items: { type: object }

  /api/attestations/countersign:
    post:
      tags: [auth]
      operationId: countersignAttestation
      summary: Countersign a pending attestation (witness/subject signs to make it bilateral)
      description: |
        Only the attestation subject can countersign. Transitions status from `pending` to
        `bilateral`.

        Amendment-by-supersession (#1790): when the attestation being countersigned carries
        `supersedes`, this atomically also flips the referenced attestation to `superseded`
        (both updates happen in one db transaction, re-verifying eligibility against a fresh
        read to close the window since creation-time validation). Returns 404/409 without
        countersigning either row if the referenced attestation no longer exists or is no
        longer bilateral/party-eligible by the time this runs.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attestationId, witnessJws]
              properties:
                attestationId: { type: string }
                witnessJws: { type: string, description: "JWS from the subject's chain key" }
      responses:
        "200":
          description: Attestation is now bilateral
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  cid: { type: string }
                  status: { type: string, enum: [bilateral] }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Only the subject can countersign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Attestation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Attestation is not in pending state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/attestations/decline:
    post:
      tags: [auth]
      operationId: declineAttestation
      summary: Decline a pending attestation
      description: Only the attestation subject can decline. Transitions status from `pending` to `declined`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attestationId]
              properties:
                attestationId: { type: string }
      responses:
        "200":
          description: Attestation declined
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [declined] }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Only the subject can decline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Attestation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Attestation is not in pending state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/attestations/internal:
    post:
      tags: [auth]
      operationId: issueAttestationInternal
      summary: Internal — issue a platform-signed attestation (service-to-service)
      description: |
        Signs the attestation using the platform keypair (AUTH_PRIVATE_KEY).
        Requires `ATTESTATION_INTERNAL_API_KEY` as Bearer token. No session cookie.

        `payload.delegator_did` is subject to the same live-grant verification as
        POST /api/attestations (#1895, #1897): present and different from `issuer_did`
        requires a live delegation grant from `delegator_did` to `issuer_did` covering
        the capability implied by `type`, or the write is rejected with 403.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer_did, subject_did, type]
              properties:
                issuer_did: { type: string }
                subject_did: { type: string }
                type: { type: string }
                context_id: { type: string }
                context_type: { type: string }
                payload:
                  type: object
                  description: |
                    May carry the intro-funnel envelope fields (#1885): delegator_did,
                    disclosure_scope, prev_event_ref.
      responses:
        "201":
          description: Attestation issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  cid: { type: string }
                  issuerDid: { type: string }
                  subjectDid: { type: string }
                  type: { type: string }
                  delegationGrantId: { type: string, nullable: true, description: "Grant verified against payload.delegator_did, if any (#1895, #1897)" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized (invalid API key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: payload.delegator_did asserted but no live delegation grant covers this action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

