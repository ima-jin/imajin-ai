openapi: "3.1.0"
info:
  title: imajin auth
  version: "2.0.0"
  description: Identity registration, DID-based challenge-response authentication, session management, magic-link flows, attestations, and DFOS chain identity. Runs as a kernel service at /{service}/api/... on a shared node domain.
servers:
  - url: https://{node}.imajin.ai/{service}
    description: production node
    variables:
      node:
        default: jin
      service:
        default: auth
  - url: http://localhost:3000/{service}
    description: local development

tags:
  - name: auth
    description: imajin auth service
  - name: grants
    description: Scoped delegation grants for external agents (#1882)
  - name: knock
    description: External-agent knock onboarding path (#1883) — relationship-anchored, zero-authority contact requests

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: imajin_session
    bearerAuth:
      type: http
      scheme: bearer
      description: "Bearer token (imajin_tok_* API token)"
    internalKeyAuth:
      type: apiKey
      in: header
      name: x-internal-key
      description: "Service-to-service key (AUTH_INTERNAL_API_KEY)"
  schemas:
    DelegationAudience:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [all, dids] }
        values:
          type: array
          items: { type: string, example: "did:imajin:abc123" }
          description: Required and non-empty when type=dids; absent when type=all. No DID patterns/wildcards.
    DelegationGrant:
      type: object
      properties:
        grantId: { type: string, example: "grant_xxx" }
        agentDid: { type: string }
        delegatorDid: { type: string }
        capabilities:
          type: array
          items: { type: string, example: "messages:write" }
        audience: { $ref: "#/components/schemas/DelegationAudience" }
        issuedAt: { type: string, format: date-time }
        expiry: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
        onBehalfOf:
          type: array
          items: { type: string }
    Identity:
      type: object
      properties:
        did: { type: string, example: "did:imajin:abc123" }
        handle: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [human, agent, presence, org, device, service, event]
        tier:
          type: string
          enum: [soft, preliminary, established]
        role: { type: string }
        chainVerified: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        onboarding:
          type: string
          description: |
            Present on 401/403 responses (#1899). Points at this node's
            `/.well-known/agent.json` agent card, whose `onboarding` block
            documents the knock flow — the front door for an unrecognized or
            ungranted caller to become a known one. Never changes the status
            code or weakens the underlying auth check; it is purely a
            discovery affordance.
    ExternalDidVerification:
      type: string
      nullable: true
      enum: [verified, declared_unverified, resolution_failed]
      description: |
        Verification state for `externalDid` (#1900). Null when no
        external_did was declared. Computed once, at knock-submission
        time, and never silently upgraded:
          - verified: the knock's Ed25519 public key was found among the
            resolved did:web document's verification methods.
          - declared_unverified: never checked (non-did:web method — out
            of scope for v1) or checked and the key was not found. Never
            a rejection, only a label.
          - resolution_failed: resolving the did:web document itself
            failed (timeout, missing did.json, parse error). Never fatal
            to the knock.
    Knock:
      type: object
      properties:
        knockId: { type: string, example: "knock_xxx" }
        agentDid: { type: string, description: "did:imajin derived from the escrowed publicKey — prospective until accept" }
        declaredTarget: { type: string }
        selfDescription: { type: string, nullable: true }
        requestedCapabilities:
          type: array
          items: { type: string }
          description: Advisory preview only — never auto-granted.
        externalDid: { type: string, nullable: true }
        externalDidVerification: { $ref: "#/components/schemas/ExternalDidVerification" }
        externalDidVerifiedAt: { type: string, format: date-time, nullable: true, description: "When externalDidVerification was computed. Null when no external_did was declared." }
        status: { type: string, enum: [pending, accepted, declined] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

paths:
  /api/health:
    get:
      tags: [auth]
      operationId: healthCheck
      summary: Service health check
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
                  timestamp: { type: string, format: date-time }

  /api/challenge:
    post:
      tags: [auth]
      operationId: createChallenge
      summary: Create a signing challenge (API token flow)
      description: Request a random challenge to be signed by the identity's private key. Part of the low-level token-based auth flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: "DID of the identity requesting the challenge" }
      responses:
        "200":
          description: Challenge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeId: { type: string }
                  challenge: { type: string }
                  expiresAt: { type: string, format: date-time }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Identity not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/authenticate:
    post:
      tags: [auth]
      operationId: authenticate
      summary: Submit signed challenge and receive an API token
      description: Verify an Ed25519 signature over the challenge string and issue an imajin_tok_* API token with expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, challengeId, signature]
              properties:
                id: { type: string, description: "DID" }
                challengeId: { type: string }
                signature: { type: string, description: "Ed25519 signature of challenge bytes (hex)" }
      responses:
        "200":
          description: Authenticated — returns API token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: "imajin_tok_..." }
                  expiresAt: { type: string, format: date-time }
                  identity: { $ref: "#/components/schemas/Identity" }
        "400":
          description: Invalid or expired challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/login/challenge:
    post:
      tags: [auth]
      operationId: createLoginChallenge
      summary: Create a login challenge by handle or DID (session cookie flow)
      description: Request a challenge for the cookie-based login flow. Rate-limited to 10 req/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                handle: { type: string }
                did: { type: string }
      responses:
        "200":
          description: Challenge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeId: { type: string }
                  challenge: { type: string }
                  expiresAt: { type: string, format: date-time }
        "400":
          description: handle or did required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Identity not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/login/verify:
    post:
      tags: [auth]
      operationId: verifyLogin
      summary: Verify signed challenge and set session cookie
      description: |
        Verify Ed25519 signature over the challenge. On success, sets the `imajin_session` HttpOnly cookie.
        Optionally bridges a DFOS chain on login by passing `dfosChain`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, signature]
              properties:
                challengeId: { type: string }
                signature: { type: string, description: "Ed25519 signature of the challenge (hex)" }
                dfosChain: { type: array, items: { type: string }, description: "Optional DFOS chain log to bridge at login" }
      responses:
        "200":
          description: Login successful — sets imajin_session cookie
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "imajin_session=<jwt>; HttpOnly; Secure; SameSite=Lax"
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  handle: { type: string }
                  type: { type: string }
                  name: { type: string }
        "400":
          description: Invalid challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Clear session cookie
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /api/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Get current session from cookie
      description: Reads the imajin_session cookie, verifies the JWT, and returns the full identity record including tier and chain status.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/session/soft:
    post:
      tags: [auth]
      operationId: createSoftSession
      summary: Create or retrieve a soft DID session from email
      description: |
        Mints a stable `did:imajin:*` for the email (or retrieves existing) and sets a session cookie.
        Soft DIDs have no keypair — email is the credential. Rate-limited to 10 req/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                name: { type: string }
      responses:
        "200":
          description: Soft session created — sets imajin_session cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  handle: { type: string }
                  type: { type: string }
                  name: { type: string }
                  tier: { type: string, enum: [soft] }
        "400":
          description: Invalid email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a new keypair-backed DID identity
      description: |
        Register a new identity with an Ed25519 public key. Requires an invite code for human
        registrations (unless NEXT_PUBLIC_DISABLE_INVITE_GATE=true). Non-human types bypass the
        invite gate. If the public key already exists, returns the existing identity (login-via-register).
        Rate-limited to 5 req/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicKey, type, signature]
              properties:
                publicKey: { type: string, description: "Ed25519 public key (hex)" }
                handle: { type: string, description: "3-30 chars: lowercase letters, numbers, underscores" }
                name: { type: string }
                type:
                  type: string
                  enum: [human, agent, presence, org, device, service, event]
                signature: { type: string, description: "Ed25519 signature of the registration payload (hex)" }
                inviteCode: { type: string, description: "Required for human type when invite gate is enabled" }
                email: { type: string, format: email }
                phone: { type: string }
                optInUpdates: { type: boolean }
                dfosChain: { type: array, items: { type: string }, description: "Optional DFOS chain to bridge at registration" }
      responses:
        "201":
          description: Identity registered — sets imajin_session cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  handle: { type: string }
                  type: { type: string }
                  created: { type: boolean }
                  inviteAccepted: { type: boolean }
        "200":
          description: Public key already registered — returns existing identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  handle: { type: string }
                  type: { type: string }
                  created: { type: boolean }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Invite required or invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Handle already taken by a different key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/onboard:
    post:
      tags: [auth]
      operationId: initiateOnboard
      summary: Initiate email-based onboarding or login — sends verification email
      description: |
        Sends a verification email with a magic link. The link calls `/api/onboard/verify` to
        complete the flow.

        Default behavior (no `mode`): mints or reuses a soft DID for any email. Used by
        purchase/signup flows.

        `mode: "login"`: only sends to existing accounts. Returns `{ sent: true }` for
        unknown emails (anti-enumeration). Returns 403 for hard-DID accounts — those must
        authenticate by key, not by email.

        Set `wantPolling: true` to receive a `pollHandle` for cross-tab handoff via
        `/api/onboard/poll`. Rate-limited to 5 req/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                redirectUrl: { type: string }
                context: { type: string, description: "Context label shown in email (e.g. event name, 'log back in')" }
                scopeDid: { type: string, description: "Optional scope DID to bind the resulting session to" }
                wantPolling: { type: boolean, description: "Return a pollHandle for cross-tab session handoff" }
                mode:
                  type: string
                  enum: [login]
                  description: "login = require existing account, reject hard DIDs, silent success on unknown email"
      responses:
        "200":
          description: Verification email sent (or silently suppressed in login mode for unknown emails)
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  pollHandle: { type: string, description: "Present when wantPolling=true" }
        "400":
          description: Invalid email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "mode=login only — account requires private key authentication (hard DID)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/onboard/verify:
    get:
      tags: [auth]
      operationId: verifyOnboard
      summary: Complete email verification — mints soft DID and sets session cookie
      description: |
        Consumes the one-time onboard token from the email link. Mints or retrieves a soft DID,
        sets the imajin_session cookie, and redirects to the configured redirectUrl.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirects to redirectUrl (or default) after setting session cookie
        "400":
          description: Missing or expired token (returns HTML error page)

  /api/lookup/{id}:
    get:
      tags: [auth]
      operationId: lookupIdentity
      summary: Look up identity by DID
      description: Public endpoint returning public identity fields by DID.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: "DID (URL-encoded, e.g. did%3Aimajin%3Aabc123)"
      responses:
        "200":
          description: Identity found
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  handle: { type: string }
                  name: { type: string }
                  type: { type: string }
                  tier: { type: string }
                  avatarUrl: { type: string }
                  metadata: { type: object }
                  createdAt: { type: string, format: date-time }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/validate:
    post:
      tags: [auth]
      operationId: validateToken
      summary: Validate an API token and return identity
      description: Validates an imajin_tok_* token, updates its last-used timestamp, and returns the associated identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  identity: { $ref: "#/components/schemas/Identity" }
                  error: { type: string }

  /api/verify:
    post:
      tags: [auth]
      operationId: verifySignedMessage
      summary: Stateless verification of a signed message
      description: Resolves the signer's public key from DB and verifies an imajin SignedMessage envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: object
                  required: [from, type, timestamp, payload, signature]
                  properties:
                    from: { type: string, description: "DID of signer" }
                    type: { type: string }
                    timestamp: { type: number }
                    payload: { type: object }
                    signature: { type: string }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  identity: { $ref: "#/components/schemas/Identity" }
                  error: { type: string }

  /api/access/{did}:
    get:
      tags: [auth]
      operationId: checkAccess
      summary: Check whether the authenticated requester has access to a resource DID
      description: |
        Supports three DID namespaces:
        - `did:imajin:event:*` / `did:imajin:evt_*` — ticket-holder or organizer check
        - `did:imajin:dm:*` — deterministic DM membership check
        - `did:imajin:group:*` — group participant check
      security:
        - cookieAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
          description: "URL-encoded resource DID"
      responses:
        "200":
          description: Access result
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: { type: boolean }
                  role: { type: string, description: "attendee | organizer | participant | <pod role>" }
                  governance: { type: string, description: "ticket | owner | dm | group" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/identity/{did}:
    get:
      tags: [auth]
      operationId: resolveIdentity
      summary: Resolve a DID to its public key and metadata
      description: Public endpoint. Returns did, publicKey, type, tier, and dfosDid (if chain exists).
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Identity resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  publicKey: { type: string, description: "Ed25519 public key (hex)" }
                  type: { type: string }
                  tier: { type: string }
                  dfosDid: { type: string }
        "404":
          description: Identity not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/identity/{did}/chain:
    get:
      tags: [auth]
      operationId: getIdentityChain
      summary: Get the DFOS identity chain for a DID
      description: Public endpoint. Returns the portable, self-verifying chain log and integrity metadata.
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Chain log
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  dfosDid: { type: string }
                  log: { type: array, items: { type: string } }
                  headCid: { type: string }
                  keyCount: { type: number }
                  isDeleted: { type: boolean }
        "404":
          description: No DFOS chain found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/identity/{did}/keys:
    get:
      tags: [auth]
      operationId: getIdentityKeys
      summary: Get current key state for the authenticated identity
      description: Authenticated — returns multi-role key state (auth/assert/controller) from the DFOS chain, or single-key state if no chain.
      security:
        - cookieAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Key state
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  dfosDid: { type: string }
                  singleKey: { type: boolean }
                  keyCount: { type: number }
                  chainLength: { type: number }
                  authKeys: { type: array, items: { type: string } }
                  assertKeys: { type: array, items: { type: string } }
                  controllerKeys: { type: array, items: { type: string } }
                  lastRotated: { type: string, format: date-time }
        "401":
          description: Unauthorized (must be the DID owner)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/identity/{did}/rotate:
    post:
      tags: [auth]
      operationId: rotateKeys
      summary: Rotate keys by submitting an updated DFOS chain log
      description: |
        Accepts a client-signed chain update (signed with the controller key) and stores the
        updated chain. Invalidates all existing sessions/tokens for this DID.
        Rate-limited to 1 rotation per hour.
      security:
        - cookieAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [log]
              properties:
                log:
                  type: array
                  items: { type: string }
                  description: "Full updated chain log (existing entries + new rotation entry)"
      responses:
        "200":
          description: Keys rotated — all sessions invalidated
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  keyCount: { type: number }
                  headCid: { type: string }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No existing chain found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limit — max 1 rotation per hour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/identity/{did}/sign:
    post:
      tags: [auth]
      operationId: nodeSignPayload
      summary: Internal — node signs a payload on behalf of a chain-verified identity
      description: |
        Service-to-service endpoint (INTERNAL_API_KEY required). Signs a canonical payload using
        AUTH_PRIVATE_KEY as node witness. Only signs for identities with a valid DFOS chain.
      security:
        - bearerAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload: { type: string }
      responses:
        "200":
          description: Signature result
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      signature: { type: string }
                  - type: object
                    properties:
                      signed: { type: boolean, enum: [false] }
                      reason: { type: string }
        "401":
          description: Unauthorized (invalid INTERNAL_API_KEY)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/identity/{did}/verify:
    get:
      tags: [auth]
      operationId: verifyIdentityChain
      summary: Verify DFOS chain and check DB consistency for a DID
      description: Public endpoint. Verifies chain cryptographic integrity and checks that the DB public key matches the chain.
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  hasDfosChain: { type: boolean }
                  chain:
                    type: object
                    properties:
                      valid: { type: boolean }
                      keyCount: { type: number }
                      isDeleted: { type: boolean }
                      publicKeyMatches: { type: boolean }
        "404":
          description: Identity not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/identity/present-chain:
    post:
      tags: [auth]
      operationId: presentChain
      summary: External onboarding — present a DFOS chain log to create or retrieve a did:imajin alias
      description: |
        An external user presents their chain log. Auth verifies it cryptographically, creates a
        `did:imajin:*` alias (or returns existing), and sets a session cookie.
        Trust tier: `preliminary` — chain proves keypair ownership, not standing on this network.
        Rate-limited to 10 req/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chainLog]
              properties:
                chainLog:
                  type: array
                  items: { type: string }
                  description: "Non-empty DFOS chain log"
                provider: { type: string, description: "Chain provider hint (e.g. dfos)" }
      responses:
        "200":
          description: Identity resolved or created — sets imajin_session cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  identity:
                    type: object
                    properties:
                      id: { type: string }
                      tier: { type: string, enum: [preliminary] }
                      chainVerified: { type: boolean, enum: [true] }
                  created: { type: boolean }
        "400":
          description: chainLog must be a non-empty array
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Chain verification failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/identity/verify-chain:
    post:
      tags: [auth]
      operationId: verifyChain
      summary: Internal — verify a DFOS chain log and resolve identity
      description: |
        Chain abstraction endpoint used by registry and other services. Verifies chain integrity
        and resolves a `did:imajin` alias if one exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
