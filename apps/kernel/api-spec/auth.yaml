openapi: "3.1.0"
info:
  title: imajin auth
  version: "2.0.0"
  description: |
    Identity registration, DID-based challenge-response authentication, session
    management, magic-link flows, attestations, and DFOS chain identity.
    Runs as a kernel service at /{service}/api/... on a shared node domain.
    For contacting one person, use the public reach-only OpenAPI 3.1 document
    at /reach/{handle}/openapi.json instead of importing this full auth surface.
servers:
  - url: https://{node}.imajin.ai/{service}
    description: production node
    variables:
      node:
        default: jin
      service:
        default: auth
  - url: http://localhost:3000/{service}
    description: local development

tags:
  - name: auth
    description: imajin auth service
  - name: grants
    description: Scoped delegation grants for external agents (#1882)
  - name: knock
    description: External-agent knock onboarding path (#1883) — relationship-anchored, zero-authority contact requests
  - name: reach
    description: Contact a person through their reach gate; public spec at /reach/{handle}/openapi.json

components:
  securitySchemes:
    reachBearer:
      type: http
      scheme: bearer
      description: Reach-only bearer issued by the knock at /reach/{handle}/knock. Bound to that recipient; not a general-purpose API token.
    cookieAuth:
      type: apiKey
      in: cookie
      name: imajin_session
    bearerAuth:
      type: http
      scheme: bearer
      description: "Bearer token (imajin_tok_* API token)"
    appServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Existing app-service+jwt from POST /auth/api/apps/token/service; the operation's token scope and live operator approval are required."
    internalKeyAuth:
      type: apiKey
      in: header
      name: x-internal-key
      description: "Service-to-service key (AUTH_INTERNAL_API_KEY)"
  schemas:
    DomainBinding:
      type: object
      required: [domain, zoneOwner, siteOwner, appDid, method, status, attestation, verifiedAt, checkedAt]
      properties:
        domain: { type: string, description: Normalized ASCII DNS hostname }
        zoneOwner: { type: string, description: DID proven by the exact public TXT value at _imajin.domain }
        siteOwner: { type: string, description: "Authoritative registry.apps.ownerDid for appDid; zoneOwner when no app is bound. Never supplied by a domain API caller." }
        appDid: { type: [string, "null"] }
        method: { type: string, enum: [dns-txt, imajin-issued, legacy] }
        status: { type: string, enum: [pending, verified, revoked, legacy] }
        attestation:
          type: [object, "null"]
          description: "Public signed domain.verified or domain.revoked evidence persisted in auth.attestations. No tokens, grants or secrets."
        verifiedAt: { type: [string, "null"], format: date-time }
        checkedAt: { type: [string, "null"], format: date-time }
    DomainList:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          items: { $ref: "#/components/schemas/DomainBinding" }
    DomainResult:
      type: object
      required: [domain]
      properties:
        domain: { $ref: "#/components/schemas/DomainBinding" }
    PendingOwnerTransfer:
      type: object
      required: [id, from, to, by, policy, createdAt]
      properties:
        id: { type: string }
        from: { type: string, description: Current owner DID }
        to: { type: string, description: Named human recipient DID }
        by: { type: string, description: Initiating owner DID }
        policy: { type: string, example: owner-only }
        createdAt: { type: string, format: date-time }
    GroupOwnership:
      type: object
      required: [groupDid, groupName, ownerDid, policy, pendingTransfer, viewerDid, viewerRole, canTransfer, canAccept, acceptanceUrl]
      properties:
        groupDid: { type: string }
        groupName: { type: [string, "null"] }
        ownerDid: { type: string }
        policy: { type: string, example: owner-only }
        pendingTransfer:
          oneOf:
            - { $ref: "#/components/schemas/PendingOwnerTransfer" }
            - { type: "null" }
        viewerDid: { type: string }
        viewerRole: { type: [string, "null"] }
        canTransfer: { type: boolean }
        canAccept: { type: boolean }
        acceptanceUrl: { type: string, description: Relative URL of the recipient acceptance page }
    ReachError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        onboarding: { type: string, description: "Public onboarding discovery URL, when supplied." }
    ReachCard:
      type: object
      required: [schemaVersion, principalDid, handle, name, reach, authentication, onboarding]
      properties:
        schemaVersion: { type: string }
        principalDid: { type: string }
        handle: { type: [string, "null"] }
        name: { type: [string, "null"] }
        url: { type: string, format: uri, description: Canonical unified card URL. }
        instructionsUrl: { type: string, format: uri, description: Public per-platform setup and share page. }
        transports:
          type: array
          description: Live transports only. Authentication describes supported credentials, not private admission policy.
          items:
            type: object
            required: [id, endpoint, protocol, authentication]
            properties:
              id: { type: string, enum: [mcp, openapi, signed] }
              endpoint: { type: string, format: uri }
              protocol: { type: string }
              authentication: { type: array, items: { type: string } }
              discovery: { type: string, format: uri }
              tools: { type: array, items: { type: string } }
        reach:
          type: object
          required: [endpoint, protocol, description]
          properties:
            endpoint: { type: string, format: uri }
            protocol: { type: string }
            description: { type: string }
            topics:
              type: array
              items: { type: string }
              description: Only topic labels the principal opted to publish. Omitted when none are published; never gate rules.
        authentication:
          type: object
          properties:
            schemes: { type: array, items: { type: string } }
            tiers:
              type: array
              description: Credential capabilities only. Anonymous access is discovery only; gate admission is never published.
              items:
                type: object
                required: [id, description, transports]
                properties:
                  id: { type: string }
                  description: { type: string }
                  transports: { type: array, items: { type: string } }
        onboarding:
          type: object
          description: Reach-only bearer clients knock without owner registration or per-agent acceptance.
          properties:
            flow: { type: string, const: knock }
            endpoint: { type: string, format: uri }
            flowDocument: { type: string, format: uri, description: Per-recipient reach-only onboarding contract. }
            description: { type: string }
    ReachOnBehalfOf:
      type: object
      required: [platform, externalRef]
      properties:
        platform: { type: string, minLength: 1 }
        externalRef: { type: string, minLength: 1, description: "Opaque platform-scoped human reference, not an email or other PII." }
        selfDescription: { type: string, description: "An unverified claim, not authority to act as the human." }
    ReachDeliveryFields:
      type: object
      description: |
        All-or-nothing delivery bundle: omit all three for a boolean ask, or
        supply message, topic and replyHandle together. Delivery requires
        agent.reach / contact_topics / contains with arg equal to topic.
        The topic must be admitted, published and in deliver mode; unpublished
        topics remain boolean-only. replyHandle is opaque and is never fetched.
      properties:
        message: { type: string, minLength: 1, maxLength: 16000, pattern: '\S' }
        topic: { type: string, minLength: 1, maxLength: 200, pattern: '\S' }
        replyHandle: { type: string, minLength: 1, maxLength: 2000, pattern: '\S' }
      dependentRequired:
        message: [topic, replyHandle]
        topic: [message, replyHandle]
        replyHandle: [message, topic]
    ReachSignedInput:
      allOf:
        - { $ref: "#/components/schemas/ReachDeliveryFields" }
        - type: object
          required: [requesterDid, onBehalfOf, purpose, field, predicate, issuedAt, signature]
          properties:
            requesterDid: { type: string, pattern: '^(did:imajin:|did:web:).+' }
            publicKey: { type: string, pattern: '^[0-9a-fA-F]{64}$', description: did:web proof key verified against the DID document. }
            onBehalfOf: { $ref: "#/components/schemas/ReachOnBehalfOf" }
            purpose: { type: string, minLength: 1 }
            field: { type: string, minLength: 1 }
            predicate: { type: string, enum: [contains, overlaps, is_empty, eq, gte, lte] }
            arg: {}
            issuedAt: { type: string, format: date-time }
            signature: { type: string, minLength: 1, description: Hex Ed25519 signature over the canonical reach transcript. }
          if:
            required: [message]
          then:
            required: [arg]
            properties:
              purpose: { const: agent.reach }
              field: { const: contact_topics }
              predicate: { const: contains }
    ReachBearerInput:
      allOf:
        - { $ref: "#/components/schemas/ReachDeliveryFields" }
        - type: object
          description: |
            With Authorization Bearer, identity and onBehalfOf come from the
            credential. For an ask send arg; for delivery send the full bundle.
            If arg is also supplied with the bundle it must equal topic.
            purpose, field and predicate default to the constants below.
          anyOf:
            - required: [arg]
            - required: [message, topic, replyHandle]
          properties:
            arg: { type: string, minLength: 1, maxLength: 200, pattern: '\S' }
            purpose: { type: string, const: agent.reach }
            field: { type: string, const: contact_topics }
            predicate: { type: string, const: contains }
            issuedAt: { type: string }
            requesterDid: { type: string, description: "If supplied, must equal the credential subject; never selects the caller." }
    ReachAnswer:
      type: object
      required: [answer, transcriptHash, issuedAt]
      properties:
        answer: { type: boolean }
        transcriptHash: { type: string }
        issuedAt: { type: string, format: date-time }
    ReachDelivered:
      type: object
      required: [delivered, reachId]
      properties:
        delivered: { type: boolean, const: true }
        reachId: { type: string }
    ReachSignedStatusInput:
      type: object
      required: [requesterDid, issuedAt, signature]
      properties:
        requesterDid: { type: string, pattern: '^did:' }
        publicKey: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        issuedAt: { type: string, format: date-time }
        signature: { type: string, pattern: '^[0-9a-fA-F]{128}$' }
    ReachStatus:
      type: object
      required: [reachId, state, reply]
      properties:
        reachId: { type: string }
        state: { type: string, enum: [delivered, replied, blocked] }
        reply:
          type: [object, "null"]
          description: |
            Exact principal-signed agent.reach.replied event or null. Issuer
            and subject are the principal DID; scope is agent. payload binds
            reachId, principalDid, requesterDid, transcriptHash, message,
            issuedAt, state=replied, context_id=reachId, context_type=agent.reach.
            payload.signature is {keyId,alg:ed25519,sig}, covering canonical
            JSON of {type,issuer,subject,scope,payload} without signature itself.
            The private delivery envelope and replyHandle are never returned.
    DirectoryApp:
      type: object
      required: [slug, name, icon, description, placements, featured, added, authorized, available]
      properties:
        slug: { type: string }
        name: { type: string }
        icon: { type: [string, "null"] }
        description: { type: [string, "null"] }
        entryUrl: { type: [string, "null"] }
        placements:
          type: array
          items: { type: string, enum: [launcher, home, auth-submenu] }
        requiredScope: { type: [string, "null"] }
        tier: { type: string }
        featured: { type: boolean, description: "Operator recommendation only; never enables an app." }
        added: { type: boolean, description: "Explicit profile enabledApps membership (enabled_services for a group)." }
        authorized: { type: boolean, description: "A live, unrevoked and unexpired app.authorized from this person to the app DID." }
        available: { type: boolean, description: "Whether the identity passes the app's scope gate." }
    AppDirectory:
      type: object
      required: [apps]
      properties:
        apps:
          type: array
          items: { $ref: "#/components/schemas/DirectoryApp" }
    TurnEvidencePayload:
      type: object
      description: |
        Closed, redaction-safe vocabulary (#1978): hashes, DIDs and short identifiers only.
        Any other key is rejected. `inputHash`/`outputHash` are `sha256:` + 64 lowercase hex
        over the tool call's input/output (string -> UTF-8 bytes; structured value -> canonical
        JSON with sorted keys; see `hashToolIo` in `@imajin/auth`).
      required: [type, turnEventId, turnOutputHash, agentDid, principalDid, tool, inputHash, outputHash, observedAt, seq]
      additionalProperties: false
      properties:
        type: { type: string, enum: [agent.turn.evidence] }
        turnEventId: { type: string, description: "Id of the turn event this evidence supports (the #1970 mention-ledger event)." }
        turnOutputHash: { type: string, description: "outputHash of the turn itself — the claim this evidence supports; what GET /api/verify/turn/{hash} resolves." }
        agentDid: { type: string }
        principalDid: { type: string }
        tool:
          type: object
          required: [name, provider]
          additionalProperties: false
          properties:
            name: { type: string, example: web_fetch, description: "[A-Za-z0-9_.:-]{1,64}" }
            provider: { type: string, example: openclaw }
        inputHash: { type: string }
        outputHash: { type: string }
        outputRef: { type: string, description: "Optional media asset id of the retained raw output. Only for evidentiary tools (config allowlist); the asset must be owned by principalDid and hash to outputHash." }
        usageRef: { type: string, description: "Optional id of the turn's agent.turn.usage attestation (#1863)." }
        observedAt: { type: string, format: date-time, description: "ISO 8601 UTC, e.g. 2026-09-04T03:54:12Z" }
        seq: { type: integer, minimum: 0, maximum: 9999, description: "Orders evidence within the turn; unique per (agent, turn)." }
    TurnEvidenceIngestResult:
      type: object
      properties:
        ok: { type: boolean }
        turnEventId: { type: string }
        attestations:
          type: array
          items:
            type: object
            properties:
              id: { type: string, example: "att_xxx" }
              seq: { type: integer }
        duplicateSeqs:
          type: array
          items: { type: integer }
          description: Items skipped as idempotent replays.
    TurnVerification:
      type: object
      properties:
        hash: { type: string }
        matches:
          type: array
          description: One entry per (turn, signer) with evidence committed under the hash.
          items:
            type: object
            properties:
              turnEventId: { type: string }
              agentDid: { type: string }
              signer:
                type: object
                properties:
                  did: { type: string }
                  keyId: { type: string, nullable: true, description: "Signer's current registered Ed25519 public key (hex); null if it no longer resolves." }
              turn:
                type: object
                nullable: true
                description: Minimal view of the resolved turn event; null until it exists.
                properties:
                  id: { type: string }
                  eventType: { type: string }
                  issuer: { type: string }
                  occurredAt: { type: string, format: date-time }
              linkage:
                type: object
                properties:
                  turn: { type: string, enum: [resolved, unresolved, mismatch] }
                  usage: { type: string, enum: [resolved, unresolved, none] }
              signatureValid: { type: boolean, description: "Every evidence row's signature verifies." }
              rejectedRows: { type: integer, description: "Rows under the hash that could not be read as valid evidence." }
              valid: { type: boolean, description: "signatureValid, no rejected rows, and the turn event (if resolvable) agrees on the hash." }
              evidence:
                type: array
                items:
                  type: object
                  properties:
                    attestationId: { type: string }
                    seq: { type: integer }
                    tool:
                      type: object
                      properties:
                        name: { type: string }
                        provider: { type: string }
                    inputHash: { type: string }
                    outputHash: { type: string }
                    observedAt: { type: string, format: date-time }
                    issuedAt: { type: string, format: date-time }
                    retained: { type: boolean, description: "Raw output is retained as a media asset (the reference is not disclosed)." }
                    signatureValid: { type: boolean }
    DelegationAudience:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [all, dids] }
        values:
          type: array
          items: { type: string, example: "did:imajin:abc123" }
          description: Required and non-empty when type=dids; absent when type=all. No DID patterns/wildcards.
    DelegationGrant:
      type: object
      properties:
        grantId: { type: string, example: "grant_xxx" }
        agentDid: { type: string }
        delegatorDid: { type: string }
        capabilities:
          type: array
          items: { type: string, example: "messages:write" }
        audience: { $ref: "#/components/schemas/DelegationAudience" }
        issuedAt: { type: string, format: date-time }
        expiry: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
        onBehalfOf:
          type: array
          items: { type: string }
    Identity:
      type: object
      properties:
        did: { type: string, example: "did:imajin:abc123" }
        handle: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [human, agent, presence, org, device, service, event]
        tier:
          type: string
          enum: [soft, preliminary, established]
        role: { type: string }
        chainVerified: { type: boolean }
    IdentitySearchResult:
      type: object
      required: [did, handle, name, scope, subtype, avatarUrl, avatarAssetId]
      additionalProperties: false
      properties:
        did: { type: string, example: "did:imajin:abc123" }
        handle: { type: [string, "null"] }
        name: { type: [string, "null"] }
        scope: { type: string }
        subtype: { type: [string, "null"] }
        avatarUrl:
          type: [string, "null"]
          description: Identity avatar URL, falling back to the profile avatar, or null.
        avatarAssetId:
          type: [string, "null"]
          description: Identity avatar asset ID, falling back to the profile avatar asset ID, or null.
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        onboarding:
          type: string
          description: |
            Present on 401/403 responses (#1899). Points at this node's
            `/.well-known/agent.json` agent card, whose `onboarding` block
            documents the knock flow — the front door for an unrecognized or
            ungranted caller to become a known one. Never changes the status
            code or weakens the underlying auth check; it is purely a
            discovery affordance.
    ExternalDidVerification:
      type: string
      nullable: true
      enum: [verified, declared_unverified, resolution_failed]
      description: |
        Verification state for `externalDid` (#1900). Null when no
        external_did was declared. Computed once, at knock-submission
        time, and never silently upgraded:
          - verified: the knock's Ed25519 public key was found among the
            resolved did:web document's verification methods.
          - declared_unverified: never checked (non-did:web method — out
            of scope for v1) or checked and the key was not found. Never
            a rejection, only a label.
          - resolution_failed: resolving the did:web document itself
            failed (timeout, missing did.json, parse error). Never fatal
            to the knock.
    Knock:
      type: object
      properties:
        knockId: { type: string, example: "knock_xxx" }
        agentDid: { type: string, description: "did:imajin derived from the escrowed publicKey — prospective until accept" }
        declaredTarget: { type: string }
        selfDescription: { type: string, nullable: true }
        requestedCapabilities:
          type: array
          items: { type: string }
          description: Advisory preview only — never auto-granted.
        externalDid: { type: string, nullable: true }
        externalDidVerification: { $ref: "#/components/schemas/ExternalDidVerification" }
        externalDidVerifiedAt: { type: string, format: date-time, nullable: true, description: "When externalDidVerification was computed. Null when no external_did was declared." }
        status: { type: string, enum: [pending, accepted, declined] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    AppTokenMintResult:
      type: object
      description: Shape returned by every app-token mint endpoint (#1069).
      properties:
        token: { type: string, description: "Short-lived EdDSA-signed app token" }
        expiresIn: { type: integer, example: 600, description: "Seconds until expiry" }
        scopes:
          type: array
          items: { type: string }
    AppNotRegisteredError:
      type: object
      description: |
        Stable 403 body (#1990) returned by every scoped app-token mint/verify
        route when an `aud` does not resolve to an active `registry.apps` row —
        "apps are identities the kernel refuses to serve unregistered." The
        `error` value is always the literal string `app_not_registered`, so
        callers can branch on it without parsing `error_description`.
      required: [error, error_description]
      properties:
        error: { type: string, enum: [app_not_registered] }
        error_description: { type: string, example: "This app is not registered with the kernel, or its registration has been revoked." }

paths:
  /api/identities/{did}/domains:
    parameters:
      - { name: did, in: path, required: true, schema: { type: string } }
    get:
      tags: [auth]
      operationId: listIdentityDomains
      summary: List domain bindings for an identity owner or active admin
      description: |
        Individuals may access their own identity. Collective identities require a
        persisted, active owner/admin membership for the authenticated caller DID.
        actingAs is context only; actingAsRole is never accepted as authority.
        actingFor does not turn a delegate into the owner. Includes pending,
        revoked and routing-only legacy bindings; response is private/no-store.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Identity domain bindings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainList" }
        "401": { description: Authentication required }
        "403": { description: Active owner/admin access required or conflicting identity context }
        "500": { description: Redacted domain operation failure }
    post:
      tags: [auth]
      operationId: addIdentityDomain
      summary: Add a pending DNS ownership binding
      description: |
        Same persisted owner/admin gate as GET, plus shared #2360 value-moving
        delegation policy: delegated agents cannot execute ownership mutations
        (403 AGENT_APPROVAL_REQUIRED). The service resolves appDid ownership
        from the active registry.apps.ownerDid, which may differ from zoneOwner.
        When they differ for a custom DNS domain, that app must already advertise
        the exact host in its authoritative entryUrl, callbackUrl or homepageUrl.
        DNS control alone cannot put an unrelated app's owner on a site's record.
        zoneOwner is the path DID, never a body
        claim; arbitrary zoneOwner/siteOwner/other body fields are rejected.
        TXT proof is the exact zoneOwner DID at _imajin.<normalized-domain>.
        Imajin subdomains are issued only by the actual Imajin organization
        identity during provisioning, not self-asserted by the node.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              additionalProperties: false
              properties:
                domain: { type: string, minLength: 1, maxLength: 253 }
                appDid: { type: [string, "null"], maxLength: 256, pattern: "^did:imajin:" }
      responses:
        "201":
          description: Pending domain binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainResult" }
        "400": { description: Invalid JSON/domain/appDid or prohibited ownership fields }
        "401": { description: Authentication required }
        "403": { description: Owner/admin required, missing app-host authorization, reserved Imajin domain, or agent countersign required }
        "404": { description: Active registered app or identity not found }
        "409": { description: Conflicting domain binding }
        "500": { description: Redacted domain operation failure }
  /api/identities/{did}/domains/{domain}/verify:
    parameters:
      - { name: did, in: path, required: true, schema: { type: string } }
      - { name: domain, in: path, required: true, schema: { type: string } }
    post:
      tags: [auth]
      operationId: verifyIdentityDomain
      summary: Check public TXT proof and persist signed domain verification
      description: |
        Active owner/admin only; shared #2360 value-moving delegation policy
        requires the owner to execute, never their delegated agent. Public
        TXT chunks are joined and must equal the zoneOwner DID exactly.
        Signed domain.verified evidence is persisted in attestations.
        Periodic checks revoke proof when DNS no longer matches.
        App ownership and cross-owner hostname authorization are revalidated;
        withdrawn app-host authorization revokes an existing verified binding.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Checked binding and its current signed evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainResult" }
        "400": { description: Invalid domain }
        "401": { description: Authentication required }
        "403": { description: Owner/admin required or AGENT_APPROVAL_REQUIRED }
        "404": { description: No binding for the requested zone owner }
        "409": { description: TXT proof absent/mismatched, revoked claim, ownership change or conflicting binding }
        "503": { description: DNS or signing service unavailable }
        "500": { description: Redacted domain operation failure }
  /api/identities/{did}/domains/{domain}:
    parameters:
      - { name: did, in: path, required: true, schema: { type: string } }
      - { name: domain, in: path, required: true, schema: { type: string } }
    delete:
      tags: [auth]
      operationId: removeIdentityDomain
      summary: Revoke and remove a domain binding
      description: |
        Active owner/admin only. Shared #2360 irreversible delegation policy
        refuses execution by delegated agents. Retains signed domain.revoked
        attestation history; does not expose any vault credential.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Binding revoked and retained for audit; no response body }
        "400": { description: Invalid domain }
        "401": { description: Authentication required }
        "403": { description: Owner/admin required or AGENT_APPROVAL_REQUIRED }
        "404": { description: No binding for the requested zone owner }
        "500": { description: Redacted domain operation failure }
  /api/identities/{did}/domains/public:
    parameters:
      - { name: did, in: path, required: true, schema: { type: string } }
    get:
      tags: [auth]
      operationId: listPublicIdentityDomainEvidence
      summary: Public verified domains and signed ownership evidence for profiles
      description: |
        Unauthenticated, no-store. Calls listDomains(did, true). Only verified
        bindings with a signed attestation are returned. Pending, revoked,
        legacy and unsigned bindings are never public ownership evidence.
        Stale DNS evidence, changed app ownership or withdrawn cross-owner
        app-host authorization are hidden immediately.
        Signed evidence is public data only; no credential or grant material.
      security: []
      parameters:
        - name: domain
          in: query
          description: Optional normalized hostname filter for a signed-evidence link
          schema: { type: string }
      responses:
        "200":
          description: Verified signed bindings, or an empty list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainList" }
        "400": { description: Invalid domain filter }
        "500": { description: Redacted domain operation failure }
  /.well-known/imajin.json:
    servers:
      - url: /
    get:
      tags: [auth]
      operationId: getHostDomainEvidence
      summary: Discover the current host's verified ownership
      description: |
        Host-scoped public evidence, no-store, Access-Control-Allow-Origin *.
        Only a verified signed domain binding is accepted. Never promotes a
        pending/revoked or grandfathered routing-only domain to ownership.
        siteOwner is authoritative registry app ownership, distinct from DNS
        zoneOwner. No secrets or vault/grant material are returned.
      security: []
      responses:
        "200":
          description: Current host ownership and signed domain evidence
          content:
            application/json:
              schema:
                type: object
                required: [siteOwner, zoneOwner, appDid, attestation]
                properties:
                  siteOwner: { type: string }
                  zoneOwner: { type: string }
                  appDid: { type: [string, "null"] }
                  attestation: { type: object }
        "400": { description: Invalid Host header }
        "404": { description: No verified domain binding }
  /api/domain-check:
    servers:
      - url: /
    get:
      tags: [auth]
      operationId: checkRoutableDomain
      summary: On-demand TLS/routing authorization check
      description: |
        A verified domain is allowed. An explicitly grandfathered legacy
        mapping may be allowed for routing only with a logged warning and
        verified:false. Legacy mappings never authorize credentials or public
        ownership claims. Pending and revoked mappings are refused.
      security: []
      parameters:
        - { name: domain, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Routing allowed; verified distinguishes signed ownership from legacy routing only
          content:
            application/json:
              schema:
                type: object
                required: [allowed, verified]
                properties:
                  allowed: { type: boolean, const: true }
                  verified: { type: boolean }
        "400": { description: Missing or invalid domain }
        "404":
          description: Domain is not routable
          content:
            application/json:
              schema:
                type: object
                required: [allowed, verified]
                properties:
                  allowed: { type: boolean, const: false }
                  verified: { type: boolean, const: false }
  /api/groups/{groupDid}/transfer-owner:
    parameters:
      - { name: groupDid, in: path, required: true, schema: { type: string } }
    get:
      tags: [auth]
      operationId: getGroupOwnership
      summary: Current owner and pending ownership invitation
      description: |
        Active members and the named pending recipient may read this state.
        A recipient does not need act-as permission or prior membership to review
        their DID-bound invitation. Never changes ownership.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current ownership and caller-specific available actions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupOwnership" }
        "401": { description: Authentication required }
        "403": { description: Not an active member or the named recipient, or OWNERSHIP_POLICY_UNKNOWN }
        "404": { description: Group identity not found }
    post:
      tags: [auth]
      operationId: proposeGroupOwnerTransfer
      summary: Owner invites another person to take ownership
      description: |
        The current owner names an existing, unsuspended human actor DID.
        Existing members must explicitly accept too. For a non-member, the
        pending transfer is a DID-bound membership invitation: acceptance joins
        them and transfers ownership in one transaction. The DID, profile and
        keys are preserved. Only one pending proposal is allowed.

        Every proposal, cancel and acceptance consults the node's replaceable
        ownership-policy hook. Operators configure registry.node_config key
        identity.ownership.policy through PUT /api/admin/config with
        {key:"identity.ownership.policy",value:"owner-only"} (or a registered policy id);
        absent configuration defaults to owner-only. Unknown policies fail closed.
        No quorum, controller consent or cooling-off is implemented.

        Independently, #2360's value-moving delegation rule rejects delegated
        agents with 403 AGENT_APPROVAL_REQUIRED. The owner approves by executing
        from their own session; a request-body flag or header grants no approval.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newOwnerDid]
              properties:
                newOwnerDid: { type: string }
      responses:
        "201":
          description: Pending acceptance; owner remains unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupOwnership" }
        "400": { description: Invalid JSON, invalid recipient, or transfer to self }
        "401": { description: Authentication required }
        "403": { description: Ownership policy denied, OWNERSHIP_POLICY_UNKNOWN, or AGENT_APPROVAL_REQUIRED }
        "404": { description: Group or recipient not found }
        "409": { description: A pending transfer already exists or ownership is inconsistent }
    delete:
      tags: [auth]
      operationId: cancelGroupOwnerTransfer
      summary: Owner cancels the matching pending transfer
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transferId]
              properties:
                transferId: { type: string }
      responses:
        "200": { description: Pending transfer cancelled; owner unchanged }
        "400": { description: Invalid JSON or missing transferId }
        "401": { description: Authentication required }
        "403": { description: Ownership policy denied, OWNERSHIP_POLICY_UNKNOWN, or AGENT_APPROVAL_REQUIRED }
        "404": { description: Group not found }
        "409": { description: Proposal no longer pending or transferId is stale }
  /api/groups/{groupDid}/transfer-owner/accept:
    parameters:
      - { name: groupDid, in: path, required: true, schema: { type: string } }
    post:
      tags: [auth]
      operationId: acceptGroupOwnerTransfer
      summary: Named person accepts ownership and any required membership invitation
      description: |
        Requires the named recipient's own authenticated session and the exact
        pending transferId. Rechecks the current owner and node policy under a
        group identity row lock; cancel, replacement and replay cannot execute
        a stale proposal. The previous owner becomes an unrestricted admin and
        may leave through DELETE /api/groups/{groupDid}/controllers/{controllerDid}.

        The role changes, pending-proposal removal and signed
        identity.owner.transferred attestation are committed atomically.
        Signing or attestation-write failure leaves ownership unchanged.
        Attestation payload includes from, to, by and policy. This mechanical
        record is signed by the node over canonical JSON
        {subject_did,type,context_id,context_type,payload,issued_at}, with
        issued_at in milliseconds; verify the Ed25519 signature against the
        issuer's published public key. The group DID is subject and context.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transferId]
              properties:
                transferId: { type: string }
      responses:
        "200":
          description: Ownership transferred without recreating the identity
          content:
            application/json:
              schema:
                type: object
                required: [ok, ownerDid, attestationId]
                properties:
                  ok: { type: boolean, const: true }
                  ownerDid: { type: string }
                  attestationId: { type: string }
        "400": { description: Invalid JSON or missing transferId }
        "401": { description: Authentication required }
        "403": { description: Not the named human recipient, ownership policy denied, OWNERSHIP_POLICY_UNKNOWN, or AGENT_APPROVAL_REQUIRED }
        "404": { description: Group or recipient not found }
        "409": { description: Stale, cancelled, accepted or otherwise invalid proposal }
        "500": { description: Transfer or attestation could not be committed; no ownership change }
  /.well-known/agent/{id}:
    get:
      tags: [reach]
      operationId: reach_card
      summary: Read a person's public reach card
      description: |
        Resolve a handle, @handle or DID to the per-person unified card and live
        transports. Disabled reach returns 404. Only opted-in published topic
        labels appear, never gate rules.
        The card is public; the two action operations below document current
        signed and reach-only bearer authentication independently of card prose.
      servers:
        - url: https://{node}.imajin.ai
          variables:
            node: { default: jin }
        - url: http://localhost:3000
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Handle or URL-encoded DID. }
      responses:
        "200":
          description: Public card with published topic labels only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReachCard" }
        "404":
          description: Principal not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReachError" }
        "500":
          description: Failed to resolve principal agent card
  /api/agents/{did}/reach:
    post:
      tags: [reach]
      operationId: reach_ask_send
      summary: Ask the boolean reach gate or deliver a message
      description: |
        One combined POST, not separate ask and send endpoints. Without a
        delivery bundle returns {answer,transcriptHash,issuedAt}; with the full
        message/topic/replyHandle bundle returns {delivered:true,reachId} only
        when delivery is admitted. A declined delivery returns answer:false.
        Never returns underlying gate rules or unpublished topic values.

        Authentication alternatives: supply the reach-only bearer issued by
        POST /reach/{handle}/knock, or OMIT Authorization and sign the request
        body with the requester's registered Ed25519 key (did:imajin or verified
        did:web). An Authorization header always selects bearer authentication;
        an invalid bearer never falls back to a signed body.

        Signed clients sign canonical sorted-key JSON of
        {principalDid:did,requesterDid,onBehalfOf,purpose,field,predicate,
        arg:arg??null,issuedAt}. When delivering, also include message,topic,
        replyHandle. Exclude signature and publicKey from that transcript.
        Freshness uses the standard signed-message clock window.
        The empty security alternative below means body-signature auth, NOT
        anonymous access; ReachSignedInput is required without a bearer.
      security:
        - reachBearer: []
        - {}
      parameters:
        - { name: did, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - { $ref: "#/components/schemas/ReachBearerInput" }
                - { $ref: "#/components/schemas/ReachSignedInput" }
            examples:
              bearerAsk:
                summary: Bearer boolean ask (no delivery bundle)
                value: { arg: collaboration }
              bearerDelivery:
                summary: Bearer delivery (all three fields)
                value: { topic: collaboration, message: Hello, replyHandle: muse-thread-opaque-reference }
      responses:
        "200":
          description: Boolean answer or delivery receipt
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ReachAnswer" }
                  - { $ref: "#/components/schemas/ReachDelivered" }
        "400": { description: "Invalid principal DID, JSON, signed input or incomplete delivery bundle" }
        "401": { description: "Invalid or unknown credential, stale signature or malformed Authorization header" }
        "403": { description: "Reach not authorized, sender blocked or invalid bearer topic/predicate" }
        "404": { description: Principal not found }
        "429": { description: Reach delivery rate limit or daily cap exceeded }
  /api/agents/{did}/reach/{reachId}/status:
    post:
      tags: [reach]
      operationId: reach_status
      summary: Read your own reach receipt and principal-signed reply
      description: |
        Supply this recipient's reach-only bearer with no body required; the
        requester comes only from that credential and any body is ignored.
        Alternatively OMIT Authorization and sign canonical JSON of
        {type:"reach_status",principalDid:did,reachId,requesterDid,issuedAt}
        plus publicKey when supplied, with the requester's registered Ed25519
        key (did:imajin or verified did:web). Freshness uses the standard
        signed-message clock window. An invalid Authorization header never
        falls back to signatures. A reachId alone grants nothing.
        The empty security alternative means body-signature auth, NOT anonymous
        access; ReachSignedStatusInput is required without a bearer.
        Only the authenticated sender's receipt is returned. An otherwise-valid
        blocked sender sees state:blocked and reply:null; revoked credentials
        fail authentication.
      security:
        - reachBearer: []
        - {}
      parameters:
        - { name: did, in: path, required: true, schema: { type: string } }
        - { name: reachId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReachSignedStatusInput"
      responses:
        "200":
          description: Requester-scoped receipt; blocked senders receive no reply content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReachStatus"
        "400": { description: Invalid JSON or malformed signed status request }
        "401": { description: "Invalid bearer, unknown key, invalid signature or stale request" }
        "404": { description: Unknown receipt or a receipt belonging to another caller }
  /api/health:
    get:
      tags: [auth]
      operationId: healthCheck
      summary: Service health check
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
                  timestamp: { type: string, format: date-time }

  /.well-known/kernel-signing-key:
    get:
      tags: [auth]
      operationId: getKernelSigningKey
      summary: Fetch the kernel's Ed25519 signing public key(s) (#2244)
      description: |
        Unauthenticated, cacheable publication of the public half of
        AUTH_PRIVATE_KEY — the same key CorpusAccessClaims are signed with.
        Intended for fetch-and-pin (TOFU) consumers, replacing the
        hand-copied CORPUS_KERNEL_PUBLIC_KEY env var (#2024). Never returns
        private key material.

        Serves a `keys` array rather than a single key so a rotation can
        publish both the current and a just-rotated-out key during a grace
        window (a `validUntil`-bounded entry) — consumers should trust every
        key in `keys`, not just the one named by `current`.

        Kernel-to-app HTTP callbacks use this same key set. The
        @ima-jin/auth verifyKernelWebhook helper pins the first set, adds
        rotation keys only when the fetched set overlaps the pin by kid AND
        public key, and accepts only currently published non-expired keys.
        Detached Ed25519 headers: x-kernel-audience (recipient app DID),
        x-kernel-kid, x-kernel-timestamp (Unix seconds), x-kernel-nonce,
        x-kernel-signature (hex). The signature binds audience, timestamp,
        nonce, uppercase method, pathname plus query, and SHA-256 of raw body.
        The verifier requires an audience option equal to its own registered
        app DID and rejects another app's delivery with AUDIENCE_MISMATCH.
        Verified discovery sets are cached for at most 60 seconds by default;
        unknown-key refreshes are rate limited and key expiry is checked per request.
        Default timestamp window is ±300 seconds; nonces are consumed atomically.
        SDK failures are typed KernelWebhookError values; see
        docs/security/kernel-webhooks.md for codes and persistent replay stores.
      security: []
      responses:
        "200":
          description: Current signing public key set
          content:
            application/json:
              schema:
                type: object
                required: [keys, current]
                properties:
                  current: { type: string, description: "kid of the key AUTH_PRIVATE_KEY signs with right now" }
                  keys:
                    type: array
                    items:
                      type: object
                      required: [kid, publicKey, algorithm, validFrom]
                      properties:
                        kid: { type: string, description: "Stable identifier for this key — changes iff the key does" }
                        publicKey: { type: string, description: "Hex-encoded Ed25519 public key" }
                        algorithm: { type: string, enum: [Ed25519] }
                        validFrom: { type: string, format: date-time }
                        validUntil: { type: string, format: date-time, description: "Present only on a grace-window previous key" }
        "503":
          description: AUTH_PRIVATE_KEY not configured on this node
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/challenge:
    post:
      tags: [auth]
      operationId: createChallenge
      summary: Create a signing challenge (API token flow)
      description: Request a random challenge to be signed by the identity's private key. Part of the low-level token-based auth flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: "DID of the identity requesting the challenge" }
      responses:
        "200":
          description: Challenge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeId: { type: string }
                  challenge: { type: string }
                  expiresAt: { type: string, format: date-time }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Identity not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/authenticate:
    post:
      tags: [auth]
      operationId: authenticate
      summary: Submit signed challenge and receive an API token
      description: Verify an Ed25519 signature over the challenge string and issue an imajin_tok_* API token with expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, challengeId, signature]
              properties:
                id: { type: string, description: "DID" }
                challengeId: { type: string }
                signature: { type: string, description: "Ed25519 signature of challenge bytes (hex)" }
      responses:
        "200":
          description: Authenticated — returns API token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: "imajin_tok_..." }
                  expiresAt: { type: string, format: date-time }
                  identity: { $ref: "#/components/schemas/Identity" }
        "400":
          description: Invalid or expired challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/login/challenge:
    post:
      tags: [auth]
      operationId: createLoginChallenge
      summary: Create a login challenge by handle or DID (session cookie flow)
      description: Request a challenge for the cookie-based login flow. Rate-limited to 10 req/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                handle: { type: string }
                did: { type: string }
      responses:
        "200":
          description: Challenge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeId: { type: string }
                  challenge: { type: string }
                  expiresAt: { type: string, format: date-time }
        "400":
          description: handle or did required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Identity not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/login/verify:
    post:
      tags: [auth]
      operationId: verifyLogin
      summary: Verify signed challenge and set session cookie
      description: |
        Verify Ed25519 signature over the challenge. On success, sets the `imajin_session` HttpOnly cookie.
        Optionally bridges a DFOS chain on login by passing `dfosChain`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, signature]
              properties:
                challengeId: { type: string }
                signature: { type: string, description: "Ed25519 signature of the challenge (hex)" }
                dfosChain: { type: array, items: { type: string }, description: "Optional DFOS chain log to bridge at login" }
      responses:
        "200":
          description: Login successful — sets imajin_session cookie
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "imajin_session=<jwt>; HttpOnly; Secure; SameSite=Lax"
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  handle: { type: string }
                  type: { type: string }
                  name: { type: string }
        "400":
          description: Invalid challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Clear session cookie
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /api/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Get current session from cookie
      description: Reads the imajin_session cookie, verifies the JWT, and returns the full identity record including tier and chain status.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/session/soft:
    post:
      tags: [auth]
      operationId: createSoftSession
      summary: Create or retrieve a soft DID session from email
      description: |
        Mints a stable `did:imajin:*` for the email (or retrieves existing) and sets a session cookie.
        Soft DIDs have no keypair — email is the credential. Rate-limited to 10 req/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                name: { type: string }
      responses:
        "200":
          description: Soft session created — sets imajin_session cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  handle: { type: string }
                  type: { type: string }
                  name: { type: string }
                  tier: { type: string, enum: [soft] }
        "400":
          description: Invalid email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a new keypair-backed DID identity
      description: |
        Register a new identity with an Ed25519 public key. Requires an invite code for human
        registrations (unless NEXT_PUBLIC_DISABLE_INVITE_GATE=true). Non-human types bypass the
        invite gate. If the public key already exists, returns the existing identity (login-via-register).
        Rate-limited to 5 req/min per IP.
        Omit Authorization for signed self-registration (including when a session cookie
        is present). With any Authorization header, even an empty one, the route takes
        only the existing app-service JWT path (token type app-service+jwt), with identity:write,
        an active app registration, and live operator approval of identity:write.
        This optional app credential records registering-app provenance on new identities;
        it does not replace the registration signature.
        Invalid/expired tokens, session bearers and malformed Authorization return 401;
        verified delegated app tokens or app-service tokens lacking permission return 403.
        Neither falls back to self-registration or session authentication.
      security:
        - {}
        - appServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicKey, type, signature]
              properties:
                publicKey: { type: string, description: "Ed25519 public key (hex)" }
                handle: { type: string, description: "3-30 chars: lowercase letters, numbers, underscores" }
                name: { type: string }
                type:
                  type: string
                  enum: [human, agent, presence, org, device, service, event]
                signature: { type: string, description: "Ed25519 signature of the registration payload (hex)" }
                inviteCode: { type: string, description: "Required for human type when invite gate is enabled" }
                email: { type: string, format: email }
                phone: { type: string }
                optInUpdates: { type: boolean }
                dfosChain: { type: array, items: { type: string }, description: "Optional DFOS chain to bridge at registration" }
      responses:
        "201":
          description: Identity registered — sets imajin_session cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  handle: { type: string }
                  type: { type: string }
                  created: { type: boolean }
                  inviteAccepted: { type: boolean }
        "200":
          description: Public key already registered — returns existing identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  handle: { type: string }
                  type: { type: string }
                  created: { type: boolean }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid signature, or invalid/expired/non-app Authorization credential (no fallback)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Invite required or invalid, or app-service credential lacks required authority (no fallback)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Handle already taken by a different key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/onboard:
    post:
      tags: [auth]
      operationId: initiateOnboard
      summary: Initiate email-based onboarding or login — sends verification email
      description: |
        Sends a verification email with a magic link. The link calls `/api/onboard/verify` to
        complete the flow.

        Default behavior (no `mode`): mints or reuses a soft DID for any email. Used by
        purchase/signup flows.

        `mode: "login"`: only sends to existing accounts. Returns `{ sent: true }` for
        unknown emails (anti-enumeration). Returns 403 for hard-DID accounts — those must
        authenticate by key, not by email.

        Set `wantPolling: true` to receive a `pollHandle` for cross-tab handoff via
        `/api/onboard/poll`. Rate-limited to 5 req/min per IP.

        A 502 with error `mail_audit_failed_after_delivery_do_not_retry`,
        retryable=false and deliveredMayHaveOccurred=true means provider
        acceptance preceded an audit failure. Do not retry or claim audited
        success. The verification bearer is never returned in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                redirectUrl: { type: string }
                context: { type: string, description: "Context label shown in email (e.g. event name, 'log back in')" }
                scopeDid: { type: string, description: "Optional scope DID to bind the resulting session to" }
                wantPolling: { type: boolean, description: "Return a pollHandle for cross-tab session handoff" }
                mode:
                  type: string
                  enum: [login]
                  description: "login = require existing account, reject hard DIDs, silent success on unknown email"
      responses:
        "200":
          description: Verification email sent (or silently suppressed in login mode for unknown emails)
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  pollHandle: { type: string, description: "Present when wantPolling=true" }
        "502":
          description: Email delivery or audit failure; do not retry a post-delivery audit failure
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  retryable: { type: boolean, const: false }
                  deliveredMayHaveOccurred: { type: boolean, const: true }
        "400":
          description: Invalid email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "mode=login only — account requires private key authentication (hard DID)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/onboard/send:
    post:
      tags: [auth]
      operationId: sendOrderOnboard
      summary: Ask the node to privately email an app-owned order's buyer an onboarding link
      security:
        - appServiceAuth: []
      description: |
        Kernel-private delivery (#2537): the app never receives a verification token,
        URL, buyer email, poll handle, handoff token or session cookie. The node sends
        the ordinary 15-minute /auth/api/onboard/verify link on behalf of the app.
        No new token type is introduced.

        Supply the kernel transactionId returned by POST /pay/api/checkout, not the
        standalone app's order id, Stripe session id, or an arbitrary buyer DID.
        The transaction must be completed, bound to the calling app DID and on the
        stripe-byo hosted-checkout rail (a recorded cs_ external reference).
        The recorded seller must be the registry app owner or have a live per-owner
        app authorization grant for onboard:send. App-service authentication alone
        is not authority over another owner's order. Both active registration and
        operator-approved onboard:send scope are rechecked on every call.

        For an identified buyer the kernel uses only a verified email credential
        belonging to the recorded buyer DID. The credentials schema has no primary
        designation: the most recently verified email wins, with credential id
        ascending as a stable tie-breaker. Unverified credentials are excluded;
        missing verified credentials never fall back to billing metadata.
        For anonymous checkout it reads the customer from the
        recorded seller's own Stripe checkout session. No request-supplied email,
        buyer, owner, redirect, scopeDid, inviteCode or polling option is accepted.
        The verified browser lands on the kernel auth root, not an app-supplied URL.
        Email name, context and on-behalf-of labels are HTML-escaped and rendered
        as text, never interpreted as caller-supplied markup.

        Unknown, unbound, cross-app, unauthorized-owner and unsupported resources
        return the same 404 without contact disclosure. Standalone free/EMT orders
        without a kernel-bound checkout reference are not eligible; do not invent a
        transaction or fall back to kernel SQL.

        Before delivery the node persists an onboard.link.requested mechanical attestation
        and prepares an onboard.link.sent record. After the mail provider accepts delivery
        it persists the sent record, linked by requestId, before returning sent.
        Its issuer is the node; subject/onBehalfOf is the authenticated app DID;
        contextId/transactionId is the order reference and ownerDid the recorded seller.
        The signed payload contains no email, token, verification URL or provider body.
        Provider acceptance is not proof of inbox delivery or completed verification.
        Signing/recording failures return 503, never a false audited success. If audit
        persistence fails after mail acceptance, the email may already have been sent;
        the durable request record remains with an unknown outcome, never a false sent
        claim. Do not automatically retry 5xx responses.

        Rate limits: 20/minute per app, 3/hour per app/order, and the shared
        onboarding 3/hour per recipient. All responses use Cache-Control: no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transactionId]
              properties:
                transactionId:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Kernel pay.transactions id for this app's completed hosted checkout.
      responses:
        "200":
          description: Mail provider accepted delivery and the node-signed send record is durable.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, enum: [sent] }
        "400":
          description: Invalid JSON or fields other than transactionId.
        "401":
          description: Missing or invalid strict app-service JWT (type, audience, expiry, signature, sub/azp binding).
        "403":
          description: Missing token scope, inactive registration or revoked operator approval.
        "404":
          description: Order unavailable, unauthorized, unsupported or without a kernel-verifiable buyer email.
        "429":
          description: App, order or recipient rate limit exceeded.
          headers:
            Retry-After:
              schema: { type: integer }
        "502":
          description: Mail provider did not accept delivery; no sent event is recorded.
        "503":
          description: Registration/contact lookup, rail, node signing, delivery or durable audit is unavailable.

  /api/onboard/verify:
    get:
      tags: [auth]
      operationId: verifyOnboard
      summary: Complete email verification — mints soft DID and sets session cookie
      description: |
        Consumes the one-time onboard token from the email link. Mints or retrieves a soft DID,
        sets the imajin_session cookie, and redirects to the configured redirectUrl.
        With no stored destination, verification and used-token recovery return to this
        kernel's public origin, never to a default app. Optional ticket migration uses
        the active events registration's entryUrl and is skipped when absent.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirects to redirectUrl (or default) after setting session cookie
        "400":
          description: Missing or expired token (returns HTML error page)

  /api/onboard/poll:
    get:
      tags: [auth]
      operationId: onboardPoll
      summary: Poll for verification status of an onboard token (cross-tab handoff)
      description: |
        Used by the events magic-link flow (`MagicLinkButton`) and any other cross-tab
        onboarding UI: after `POST /api/onboard` with `wantPolling: true` returns a
        `pollHandle`, the originating tab polls this endpoint until the link is clicked
        in another tab. Rate-limited to 200 req/min per IP (generous — clients poll every
        ~2s for up to the token's 15-min TTL).

        An unknown or expired `handle` resolves to `status: expired` rather than 404, so
        pollers do not need to special-case a missing record.
      parameters:
        - name: handle
          in: query
          required: true
          schema: { type: string }
          description: "pollHandle returned by POST /api/onboard"
      responses:
        "200":
          description: Poll result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [pending, completed, claimed, expired] }
                  handoffToken:
                    type: string
                    description: "Present only when status=completed — single-use, exchanged via POST /api/onboard/claim"
        "400":
          description: handle is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Poll failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/onboard/claim:
    post:
      tags: [auth]
      operationId: onboardClaim
      summary: Claim a session via one-shot handoff token (cross-tab handoff)
      description: |
        The other half of the `/api/onboard/poll` handoff: exchanges the single-use
        `handoffToken` (surfaced by poll once the magic link has been clicked in another
        tab) for a real `imajin_session` cookie set on THIS response — the tab that
        initiated onboarding is the one that ends up logged in. The handoff token expires
        5 minutes after the link was clicked, independent of the original onboard token's
        own TTL. Rate-limited to 60 req/min per IP (defense-in-depth only — the token
        itself is single-use, nanoid(24), and short-lived).

        Also sets the `x-acting-as` cookie when the onboard record carried a `scopeDid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handoffToken]
              properties:
                handoffToken: { type: string }
      responses:
        "200":
          description: Session claimed — sets imajin_session cookie (and x-acting-as, if scoped)
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "imajin_session=<jwt>; HttpOnly; Secure; SameSite=Lax"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        "400":
          description: handoffToken missing, the handoff record is unknown/already used, or it has no usedAt yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No identity resolves for the email or DID behind this handoff token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Handoff token expired (more than 5 minutes since the link was clicked)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Claim failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/search:
    get:
      tags: [auth]
      operationId: searchIdentities
      summary: Search public identities by handle, display name, or DID
      description: |
        Public endpoint served at `/auth/api/search`. Case-insensitive substring
        search across handle, display name, and DID; soft-tier identities are
        excluded. Handle-prefix matches sort first, then results sort by name.
        No authentication is required.
      security: []
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 2 }
          description: |
            Search text, trimmed before matching. At least 2 characters after
            trimming are needed to search. Missing, empty, whitespace-only, or
            shorter queries return 200 with `{ results: [] }`, not an error.
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 5, minimum: 1, maximum: 20 }
          description: |
            Maximum results. Parsed with base-10 parseInt and clamped to 1–20;
            omitted defaults to 5. Non-numeric input is not explicitly rejected
            with a 400; failures during search return the 500 response below.
      responses:
        "200":
          description: Matching non-soft identities, or an empty results array
          content:
            application/json:
              schema:
                type: object
                required: [results]
                additionalProperties: false
                properties:
                  results:
                    type: array
                    maxItems: 20
                    items: { $ref: "#/components/schemas/IdentitySearchResult" }
        "500":
          description: Failed to search identities
          content:
            application/json:
              schema:
                type: object
                required: [error]
                additionalProperties: false
                properties:
                  error: { type: string, const: "Failed to search identities" }

  /api/lookup/{id}:
    get:
      tags: [auth]
      operationId: lookupIdentity
      summary: Look up identity by DID
      description: Public endpoint returning public identity fields by DID.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: "DID (URL-encoded, e.g. did%3Aimajin%3Aabc123)"
      responses:
        "200":
          description: Identity found
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  handle: { type: string }
                  name: { type: string }
                  type: { type: string }
                  tier: { type: string }
                  avatarUrl: { type: string }
                  metadata: { type: object }
                  createdAt: { type: string, format: date-time }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/validate:
    post:
      tags: [auth]
      operationId: validateToken
      summary: Validate an API token and return identity
      description: Validates an imajin_tok_* token, updates its last-used timestamp, and returns the associated identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  identity: { $ref: "#/components/schemas/Identity" }
                  error: { type: string }

  /api/apps:
    get:
      tags: [auth]
      operationId: listIdentityNavApps
      summary: List apps this identity has added or authorized
      description: |
        Active registry apps with a nav placement intersected with explicit
        enabledApps union live app.authorized grants, then the scope gate.
        Unconfigured people get no apps. Groups use enabled_services.
        Wallet and Media are kernel navigation, not registry apps.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: for
          in: query
          schema: { type: string }
          description: Must match the authenticated effective DID; defaults to it.
        - name: placement
          in: query
          schema: { type: string, enum: [launcher, home, auth-submenu] }
      responses:
        "200":
          description: Enabled apps, optionally narrowed to one placement
        "400":
          description: Invalid placement
        "401":
          description: Authentication required
        "403":
          description: Cannot read another identity's navigation

  /api/apps/directory:
    get:
      tags: [auth]
      operationId: listAppDirectory
      summary: Browse every active app registered on this node with a nav placement
      description: |
        Featured apps sort first. Each row distinguishes explicit Added state
        from live authorization. Featuring never adds anything to navigation.
        Apps outside this identity's scope are listed as unavailable.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Directory and current identity's membership state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppDirectory" }
        "401":
          description: Authentication required
        "403":
          description: Cannot read another identity's directory state

  /api/apps/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [auth]
      operationId: addNavApp
      summary: Add a registered app to your navigation in one click
      description: |
        Writes only the caller's enabledApps. An acting group requires an active
        admin or owner membership and writes enabled_services instead.
        No authorization is issued. Unrelated profile settings are preserved.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Updated directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppDirectory" }
        "401":
          description: Authentication required
        "403":
          description: Not permitted to edit this identity or app scope
        "404":
          description: Active nav-capable app not found
    delete:
      tags: [auth]
      operationId: removeNavApp
      summary: Remove explicit membership without revoking app authorization
      description: |
        Drops the slug from enabledApps (enabled_services for an authorized group
        admin). A live app.authorized keeps a person's app in nav after removal;
        the directory reports Authorized — manage in Grants. Revocation remains
        in /jin Grants, not this endpoint.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Updated directory, including retained live authorization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppDirectory" }
        "401":
          description: Authentication required
        "403":
          description: Not permitted to edit this identity
        "404":
          description: Active nav-capable app not found

  /api/apps/token:
    post:
      tags: [auth]
      operationId: mintAppToken
      summary: Mint a short-lived, scoped app token for a third-party app holding a user's app.authorized attestation (#1069, #799 P3)
      description: |
        Front door of the registered-app contract (#1993): replaces passing the raw
        `attestationId` around as a long-lived bearer. The app proves possession of its
        keypair — an Ed25519 signature over `${appDid}:${attestationId}:${nonce}:${timestamp}`
        — and the kernel validates the user's `app.authorized` attestation for that app
        before minting. No cookie or bearer auth: the signature IS the authentication.

        `nonce` must be at least 16 characters (client-generated); `timestamp` must be an
        ISO-8601 string within 60s of server time (replay-window bound). The app's public
        key is resolved from `registry.apps`, not `auth.identities` — see the route source
        for why. Narrowing to a single `scope` is optional; when omitted, all scopes on the
        attestation are granted. The minted token is verified downstream via
        `POST /api/apps/token/verify`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appDid, attestationId, nonce, timestamp, signature]
              properties:
                appDid: { type: string, description: "The app's registered DID" }
                attestationId: { type: string, description: "The user's app.authorized attestation for this app" }
                scope: { type: string, description: "Optional single scope to narrow to (must already be granted)" }
                aud: { type: string, description: "Optional target service" }
                nonce: { type: string, minLength: 16, description: "Client-generated, >= 16 chars" }
                timestamp: { type: string, format: date-time, description: "Must be within 60s of server time" }
                signature: { type: string, description: "Ed25519 hex signature over `${appDid}:${attestationId}:${nonce}:${timestamp}`" }
      responses:
        "200":
          description: App token minted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppTokenMintResult" }
        "400":
          description: Missing required field, or nonce shorter than 16 chars
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Timestamp outside the 60s replay window, or invalid proof-of-possession signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            App is not active, the app.authorized attestation was revoked, the
            requested scope was not granted, or (#1990) an explicitly supplied
            `aud` does not resolve to an active registry.apps row — in the
            latter case the body is the stable AppNotRegisteredError shape.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Error" }
                  - { $ref: "#/components/schemas/AppNotRegisteredError" }
        "404":
          description: Unknown app DID, or no matching app.authorized attestation found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/apps/token/service:
    post:
      tags: [auth]
      operationId: mintAppServiceToken
      summary: Mint an app-tier (keyholder) service token — no user delegation (#1141)
      description: |
        For registered daemons (e.g. broker-agent) that authenticate as the app itself
        rather than on behalf of a specific user. Proof-of-possession only: an Ed25519
        signature over `${appDid}:${nonce}:${timestamp}`, verified against the app's
        registered public key in `registry.apps`.

        Service tokens carry no `userDid` and cannot impersonate a user — routes that
        accept them must resolve the effective user separately (e.g. via `X-Acting-For`).
        Granted scopes are the app's registered `requestedScopes`, clamped first to the
        SCOPES vocabulary and then to the service-eligible fence (#1803); today that fence
        ships empty, so no scope currently materialises on a service token. Verified
        downstream via `POST /api/apps/token/verify`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appDid, nonce, timestamp, signature]
              properties:
                appDid: { type: string, description: "The app's registered DID" }
                nonce: { type: string, minLength: 16, description: "Client-generated, >= 16 chars" }
                timestamp: { type: string, format: date-time, description: "Must be within 60s of server time" }
                signature: { type: string, description: "Ed25519 hex signature over `${appDid}:${nonce}:${timestamp}`" }
      responses:
        "200":
          description: Service token minted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppTokenMintResult" }
        "400":
          description: Missing required field, or nonce shorter than 16 chars
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Timestamp outside the 60s replay window, or invalid proof-of-possession signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: App is not active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown app DID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/apps/token/verify:
    post:
      tags: [auth]
      operationId: verifyAppToken
      summary: Stateless verification of an app token minted by /api/apps/token or /api/apps/token/service (#1069)
      description: |
        Checks the EdDSA signature and expiry locally against the kernel's public key —
        no DB lookup. Accepts both user-delegated (`app+jwt`) and keyholder service
        (`app-service+jwt`) tokens; for service tokens `userDid` is returned as `""` and
        `isServiceToken` is `true`. Optionally enforces that `scope` is among the token's
        granted scopes. This is the transport `requireAppAuth` (`@imajin/auth`) calls into.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                scope: { type: string, description: "Optional scope that must be present in the token" }
      responses:
        "200":
          description: Token is valid — AppAuthContext shape
          content:
            application/json:
              schema:
                type: object
                properties:
                  appDid: { type: string }
                  userDid: { type: string, description: "Empty string for service tokens" }
                  scopes: { type: array, items: { type: string } }
                  attestationId: { type: string }
                  isServiceToken: { type: boolean, description: "Present and true only for app-service+jwt tokens" }
        "400":
          description: token is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid or expired app token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: scope was not granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/tokens/app:
    post:
      tags: [auth]
      operationId: mintSessionAppToken
      summary: Mint a short-lived, host-scoped app token from the caller's own session (#1069 Phase 1)
      description: |
        The other half of the app-token model: `/api/apps/token` mints a token for a
        THIRD-PARTY app that already holds a user's `app.authorized` attestation; this
        endpoint mints one for a FIRST-PARTY app the signed-in user is about to visit, so
        that app can stop reading the shared session cookie directly (see
        `docs/security/cookie-isolation.md`, "Path A" / "Path B"). Requires the
        `imajin_session` cookie. `scopes` are clamped to the SCOPES vocabulary (default:
        none). Verified downstream via `POST /api/tokens/app/verify`.

        A Phase 1 primitive: shipping it does not change any existing app's default auth
        behavior. Nothing calls it unless an app explicitly opts in via
        `requireSessionOrAppToken` (`@imajin/auth`), e.g. the standalone coffee app behind
        `SESSION_COOKIE_SCOPE=host`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aud]
              properties:
                aud: { type: string, description: "Target app host this token is scoped to" }
                scopes:
                  type: array
                  items: { type: string }
                  description: "Requested scopes, clamped to the SCOPES vocabulary (default: [])"
      responses:
        "200":
          description: Session-scoped app token minted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppTokenMintResult" }
        "400":
          description: aud is missing or not a string, or the request body is invalid JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not authenticated, or the session cookie is invalid/expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            (#1990) `aud` does not resolve to an active `registry.apps` row —
            the kernel refuses to mint a token for an unregistered or revoked
            audience. Stable body: `{ error: "app_not_registered", error_description }`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppNotRegisteredError" }

  /api/tokens/app/verify:
    post:
      tags: [auth]
      operationId: verifySessionAppToken
      summary: Stateless verification of a session-scoped app token minted by /api/tokens/app (#1069 Phase 1)
      description: |
        Checks the EdDSA signature, expiry, and `typ` locally (no DB hit). When `aud` is
        supplied, also enforces that the token was minted for that exact host, so a token
        minted for one app can never verify for another. This is the transport
        `verifyAppToken` (`@imajin/auth`) calls into.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                aud: { type: string, description: "Expected audience (host) — checked exactly when supplied" }
                scope: { type: string, description: "Optional scope that must be present in the token" }
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub: { type: string, description: "DID of the session that minted this token" }
                  aud: { type: string }
                  scopes: { type: array, items: { type: string } }
        "400":
          description: token is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid, expired, or mismatched-audience token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            scope was not granted, or (#1990) the token's `aud` no longer
            resolves to an active `registry.apps` row — in the latter case
            the body is the stable AppNotRegisteredError shape, making
            revocation take effect within one verify cycle.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Error" }
                  - { $ref: "#/components/schemas/AppNotRegisteredError" }

  /api/verify:
    post:
      tags: [auth]
      operationId: verifySignedMessage
      summary: Stateless verification of a signed message
      description: Resolves the signer's public key from DB and verifies an imajin SignedMessage envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: object
                  required: [from, type, timestamp, payload, signature]
                  properties:
                    from: { type: string, description: "DID of signer" }
                    type: { type: string }
                    timestamp: { type: number }
                    payload: { type: object }
                    signature: { type: string }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  identity: { $ref: "#/components/schemas/Identity" }
                  error: { type: string }

  /api/access/{did}:
    get:
      tags: [auth]
      operationId: checkAccess
      summary: Check whether the authenticated requester has access to a resource DID
      description: |
        Supports three DID namespaces:
        - `did:imajin:event:*` / `did:imajin:evt_*` — ticket-holder or organizer check
        - `did:imajin:dm:*` — deterministic DM membership check
        - `did:imajin:group:*` — group participant check
      security:
        - cookieAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
          description: "URL-encoded resource DID"
      responses:
        "200":
          description: Access result
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: { type: boolean }
                  role: { type: string, description: "attendee | organizer | participant | <pod role>" }
                  governance: { type: string, description: "ticket | owner | dm | group" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/identity/{did}:
    get:
      tags: [auth]
      operationId: resolveIdentity
      summary: Resolve a DID to its public key and metadata
      description: |
        Public endpoint. Returns did, publicKey, scope, subtype, tier, and dfosDid (if chain exists).

        An agent is a first-class DID: `scope: actor`, `subtype: agent` (RFC-31 v2, #1758). For
        such a DID, an **authenticated party to the relation** also receives `serviceOf` (#2407) —
        the principal DID(s) that have bound it as an agent. Parties are the agent itself (its own
        session DID) and a principal it serves (the session DID, or the group DID under
        `X-Acting-As`); a principal sees only its own entry. Anonymous callers and third parties
        do not get the field (it is omitted, not empty). `X-Acting-For` never widens visibility:
        only the session DID is checked, never the principal being acted for. `serviceOf` is a
        read-only view over active `role='agent'` `identity_members` rows; it confers no authority.
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Identity resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  publicKey: { type: string, description: "Ed25519 public key (hex)" }
                  scope: { type: string, example: actor }
                  subtype: { type: string, nullable: true, example: agent }
                  tier: { type: string }
                  dfosDid: { type: string }
                  serviceOf:
                    type: array
                    items: { type: string, example: "did:imajin:abc123" }
                    description: Present only for an actor/agent, and only to a party to the relation (see above).
        "404":
          description: Identity not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/identity/{did}/agents:
    get:
      tags: [auth]
      operationId: listServingAgents
      summary: A principal's serving agents and their live connection state (#2407, RFC-31 Phase 1)
      description: |
        Resolves a principal DID to the `actor/agent` DID(s) bound to it via `serviceOf`, each with
        the live state of that agent DID's own authenticated WebSocket to the kernel — the
        plugin's outbound connection. The kernel addresses the agent DID, never a gateway.

        `connection.state` is `connected`, `disconnected`, or `unknown`. `unknown` means the check
        itself could not be completed and MUST NOT be treated as `disconnected`.

        Read-only, no new authority. Only the principal itself may call this: the caller's own
        session DID, or the group DID it operates as via `X-Acting-As`. Calls under
        `X-Acting-For` are refused, and an `actor/agent` session can only ever read the list for
        its own DID. Suspended agents, removed bindings, and `role='agent'` rows whose member is
        not an `actor/agent` are not listed.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Serving agents (possibly empty)
          content:
            application/json:
              schema:
                type: object
                properties:
                  principal: { type: string }
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        did: { type: string }
                        handle: { type: string, nullable: true }
                        name: { type: string, nullable: true }
                        scope: { type: string, enum: [actor] }
                        subtype: { type: string, enum: [agent] }
                        servingSince: { type: string, format: date-time, nullable: true }
                        connection:
                          type: object
                          properties:
                            state: { type: string, enum: [connected, disconnected, unknown] }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Caller is not the principal, or is acting under X-Acting-For
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Resolution failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/identity/{did}/chain:
    get:
      tags: [auth]
      operationId: getIdentityChain
      summary: Get the DFOS identity chain for a DID
      description: Public endpoint. Returns the portable, self-verifying chain log and integrity metadata.
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Chain log
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  dfosDid: { type: string }
                  log: { type: array, items: { type: string } }
                  headCid: { type: string }
                  keyCount: { type: number }
                  isDeleted: { type: boolean }
        "404":
          description: No DFOS chain found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/identity/{did}/keys:
    get:
      tags: [auth]
      operationId: getIdentityKeys
      summary: Get current key state for the authenticated identity
      description: Authenticated — returns multi-role key state (auth/assert/controller) from the DFOS chain, or single-key state if no chain.
      security:
        - cookieAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Key state
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  dfosDid: { type: string }
                  singleKey: { type: boolean }
                  keyCount: { type: number }
                  chainLength: { type: number }
                  authKeys: { type: array, items: { type: string } }
                  assertKeys: { type: array, items: { type: string } }
                  controllerKeys: { type: array, items: { type: string } }
                  lastRotated: { type: string, format: date-time }
        "401":
          description: Unauthorized (must be the DID owner)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/identity/{did}/rotate:
    post:
      tags: [auth]
      operationId: rotateKeys
      summary: Rotate keys by submitting an updated DFOS chain log
      description: |
        Accepts a client-signed chain update (signed with the controller key) and stores the
        updated chain. Invalidates all existing sessions/tokens for this DID.
        Rate-limited to 1 rotation per hour.
      security:
        - cookieAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [log]
              properties:
                log:
                  type: array
                  items: { type: string }
                  description: "Full updated chain log (existing entries + new rotation entry)"
      responses:
        "200":
          description: Keys rotated — all sessions invalidated
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  keyCount: { type: number }
                  headCid: { type: string }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No existing chain found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limit — max 1 rotation per hour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/identity/{did}/sign:
    post:
      tags: [auth]
      operationId: nodeSignPayload
      summary: Internal — node signs a payload on behalf of a chain-verified identity
      description: |
        Service-to-service endpoint (INTERNAL_API_KEY required). Signs a canonical payload using
        AUTH_PRIVATE_KEY as node witness. Only signs for identities with a valid DFOS chain.
      security:
        - bearerAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload: { type: string }
      responses:
        "200":
          description: Signature result
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      signature: { type: string }
                  - type: object
                    properties:
                      signed: { type: boolean, enum: [false] }
                      reason: { type: string }
        "401":
          description: Unauthorized (invalid INTERNAL_API_KEY)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/identity/{did}/verify:
    get:
      tags: [auth]
      operationId: verifyIdentityChain
      summary: Verify DFOS chain and check DB consistency for a DID
      description: Public endpoint. Verifies chain cryptographic integrity and checks that the DB public key matches the chain.
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  hasDfosChain: { type: boolean }
                  chain:
                    type: object
                    properties:
                      valid: { type: boolean }
                      keyCount: { type: number }
                      isDeleted: { type: boolean }
                      publicKeyMatches: { type: boolean }
        "404":
          description: Identity not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/identity/present-chain:
    post:
      tags: [auth]
      operationId: presentChain
      summary: External onboarding — present a DFOS chain log to create or retrieve a did:imajin alias
      description: |
        An external user presents their chain log. Auth verifies it cryptographically, creates a
        `did:imajin:*` alias (or returns existing), and sets a session cookie.
        Trust tier: `preliminary` — chain proves keypair ownership, not standing on this network.
        Rate-limited to 10 req/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chainLog]
              properties:
                chainLog:
                  type: array
                  items: { type: string }
                  description: "Non-empty DFOS chain log"
                provider: { type: string, description: "Chain provider hint (e.g. dfos)" }
      responses:
        "200":
          description: Identity resolved or created — sets imajin_session cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  identity:
                    type: object
                    properties:
                      id: { type: string }
                      tier: { type: string, enum: [preliminary] }
                      chainVerified: { type: boolean, enum: [true] }
                  created: { type: boolean }
        "400":
          description: chainLog must be a non-empty array
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Chain verification failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/identity/verify-chain:
    post:
      tags: [auth]
      operationId: verifyChain
      summary: Internal — verify a DFOS chain log and resolve identity
      description: |
        Chain abstraction endpoint used by registry and other services. Verifies chain integrity
        and resolves a `did:imajin` alias if one exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chainLog]
              properties:
                chainLog:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  did: { type: string, description: "Canonical DID (did:imajin alias or chain DID)" }
                  chainDid: { type: string }
                  publicKey: { type: string }
                  keyCount: { type: number }
                  error: { type: string }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/resolve/dfos/{dfosDid}:
    get:
      tags: [auth]
      operationId: resolveDfosDid
      summary: Resolve a did:dfos to its linked did:imajin identity
      description: Public endpoint.
      parameters:
        - name: dfosDid
          in: path
          required: true
          schema: { type: string }
          description: "URL-encoded did:dfos:... identifier"
      responses:
        "200":
          description: Identity found
          content:
            application/json:
              schema:
                type: object
                properties:
                  imajinDid: { type: string }
                  dfosDid: { type: string }
                  type: { type: string }
                  tier: { type: string }
        "404":
          description: No Imajin identity linked to this DFOS DID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/attestations:
    post:
      tags: [auth]
      operationId: createAttestation
      summary: Issue a new attestation
      description: |
        Caller must be authenticated: a session cookie, a legacy full-identity Bearer token,
        or (#2394) a scoped app-token minted by `POST /auth/api/tokens/app` — this is how a
        registered third-party app authenticates its own inbound call while acting for the
        user who minted the token. The `issuer_did`'s signature must be an Ed25519 signature
        over the canonical JSON of `{subject_did, type, context_id, context_type, payload, issued_at}`.
        `issuer_did`'s public key resolves from `auth.identities` first, then (#2394) from
        `registry.apps` — a registered app never has an `auth.identities` row of its own, so
        this is what lets an app act as `issuer_did`.

        An app may also call as itself with its own `app-service+jwt` (#2747,
        `POST /auth/api/apps/token/service`). Since #2764 that token must carry the
        `attestations:write` scope — not service-eligible, so it reaches the token only once the
        operator approves it for the app via the countersigned `apps:service-scopes` card
        (#2711) — otherwise the create is a 403 and nothing is written. Reads and lists are
        unchanged, and user sessions and `session-app+jwt` tokens are not scope-gated here.

        `payload.delegator_did` (intro-funnel envelope, #1885; generalized #2394) asserts that
        `delegator_did` authorized `issuer_did` to act on its behalf. When present and different
        from `issuer_did`, the write is rejected with 403 unless a live (unexpired, unrevoked)
        delegation grant from `delegator_did` to `issuer_did` covers the capability implied by
        `type` — a self-asserted `delegator_did` is never trusted on its own. For the
        platform-seeded intro-funnel types that capability is the closed `intros:propose`
        scope (#1895, #1897); for any other type, `issuer_did` must name a live, active
        `registry.apps` row and the capability is that app's own namespaced
        `attest:<appId>:<type>` slot (#2394) — see `POST /api/grants`. The verified grant id
        is recorded on the attestation as `delegationGrantId`, and both `issuerDid` (the app)
        and `delegatorDid` (the user) are persisted, so a delegated attestation is always
        distinguishable from a self-signed one.

        `payload.supersedes` (amendment-by-supersession, #1790) names a bilateral attestation
        this one proposes to amend. Once this attestation itself goes bilateral via
        POST /api/attestations/countersign, the referenced attestation atomically flips to
        `superseded` — it stays authoritative until then and remains readable afterwards.

        Same-issuer supersede of a one-sided attestation (#2649): `payload.supersedes` may also
        name a one-sided (single-signer: `attestationStatus` null, no `author_jws`) attestation
        whose `issuerDid` equals this request's `issuer_did`. There is no counterparty to wait
        for, so the old row flips to `superseded` immediately, in the same db transaction as the
        insert of the replacement (a failure rolls both back). The replacement must itself be
        one-sided — combining `author_jws` with a one-sided `supersedes` is rejected with 400 —
        and a revoked target is rejected with 400. If the target stops being an active one-sided
        attestation between validation and the write (e.g. a concurrent supersede or revoke),
        the request fails with 409 and nothing is written. This is how a respondent replaces
        their earlier answers (e.g. a dykil survey response); to withdraw an attestation without
        replacing it, see `POST /api/attestations/{id}/revoke`. No schema change.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer_did, subject_did, type, signature]
              properties:
                issuer_did: { type: string }
                subject_did: { type: string }
                type: { type: string, description: "Attestation type (from ATTESTATION_TYPES registry)" }
                context_id: { type: string }
                context_type: { type: string }
                ref:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: |
                    (#2534) Optional, indexed, app-specific lookup key linking the attestation to an
                    identifier the issuing app owns (e.g. a `ticketId`). Stored verbatim and read back
                    with `GET /api/attestations?ref=`. A pointer only: it is NOT part of the signed
                    canonical form (the signed `payload` stays the source of truth), it does not
                    change `disclosure_scope` enforcement on reads, and there is no querying of
                    `payload`. Omit or send null for none; an empty, non-string or over-long value is
                    rejected with 400.
                payload:
                  type: object
                  description: |
                    May carry the intro-funnel envelope fields (#1885): delegator_did,
                    disclosure_scope, prev_event_ref. May also carry `supersedes` (#1790,
                    amendment-by-supersession) — the id of a bilateral attestation this one
                    proposes to amend. Accepted only when the caller (issuer_did) is a party
                    (issuer or subject) to that attestation and it is currently `bilateral`;
                    rejected with 400 otherwise. Deliberately independent of prev_event_ref.
                    `supersedes` may alternatively (#2649) name a one-sided attestation issued by
                    the same `issuer_did`; the old row is then marked `superseded` immediately.
                signature: { type: string, description: "Ed25519 signature over canonical payload (hex)" }
                issued_at: { type: number, description: "Unix timestamp ms (defaults to now)" }
                author_jws: { type: string, description: "Optional JWS for bilateral attestation flow" }
      responses:
        "201":
          description: Attestation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  cid: { type: string }
                  issuerDid: { type: string }
                  subjectDid: { type: string }
                  type: { type: string }
                  attestationStatus: { type: string, enum: [pending, bilateral, declined, superseded, "null"] }
                  supersedes: { type: string, nullable: true, description: "Attestation this one amends (#1790, bilateral) or replaces (#2649, one-sided, same issuer), if any" }
                  ref: { type: string, nullable: true, description: "App-specific lookup key supplied at creation, if any (#2534)" }
                  delegationGrantId: { type: string, nullable: true, description: "Grant verified against payload.delegator_did, if any (#1895, #1897, #2394)" }
                  delegatorDid: { type: string, nullable: true, description: "DID that authorized issuerDid to act on its behalf, if any (#2394 — distinguishes a delegated attestation from a self-signed one)" }
                  issuedAt: { type: string, format: date-time }
        "400":
          description: Invalid request or signature, an invalid/ineligible payload.supersedes reference (#1790), or an invalid `ref` (#2534)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            Either payload.delegator_did was asserted but no live delegation grant covers this
            action, or (#2764) the caller authenticated with an app's own `app-service+jwt` that
            does not carry the `attestations:write` scope. Nothing was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            The one-sided attestation named by `payload.supersedes` (#2649) was superseded or
            revoked concurrently, so it can no longer be replaced. Nothing was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [auth]
      operationId: listAttestations
      summary: List non-revoked attestations for a subject DID
      description: |
        Returns attestations newest first, in the stable order `(issued_at DESC, id DESC)` — the
        id breaks ties between rows with the same `issued_at`. subject_did is required.

        **Cursor paging (#2533).** There is no offset paging. Pass `before=<issued_at,id>` to get
        the next, older page. When more rows exist, the response carries the cursor for that page
        in the `X-Next-Cursor` header (exposed to browsers via `Access-Control-Expose-Headers`);
        the header is absent on the last page. The body stays a bare array so existing callers are
        unaffected. Loop until `X-Next-Cursor` is absent to read everything. The cursor is taken
        from the last row of the underlying page *before* `disclosure_scope` filtering, so a page
        with hidden rows can come back short (even empty) while still carrying a cursor — keep
        following it rather than treating a short page as the end.

        `disclosure_scope` enforcement applies to every filter, including `ref`: filters only
        narrow the result set, they never widen who may read a row.
      parameters:
        - name: subject_did
          in: query
          required: true
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
        - name: issuer_did
          in: query
          schema: { type: string }
        - name: context_id
          in: query
          schema: { type: string }
          description: |
            (#2396) Exact-match filter on the attestation's `context_id` (e.g. a survey's asset id).
            Combined with `subject_did` and any other filters using AND. Omit for unchanged behaviour.
        - name: ref
          in: query
          schema: { type: string }
          description: |
            (#2534) Exact-match filter on the attestation's indexed `ref` (e.g. a `ticketId` set at
            creation). ANDed with the other filters. Matches `ref` only — never `payload`.
        - name: before
          in: query
          schema: { type: string, example: "2026-10-06T10:00:02.123Z,att_abc123" }
          description: |
            (#2533) Keyset cursor `<issued_at>,<id>`: `issued_at` is an ISO-8601 timestamp and `id`
            the attestation id; returns rows strictly older than that position in
            `(issued_at DESC, id DESC)` order. Use the `X-Next-Cursor` value from the previous page
            verbatim. Omit for the first (newest) page. A malformed value is rejected with 400.
        - name: status
          in: query
          schema: { type: string, enum: [pending, bilateral, declined, superseded] }
        - name: history_of
          in: query
          schema: { type: string }
          description: |
            (#1790) Given any attestation id in a v1<-v2<-... supersession chain, returns
            `{ chain, openDisputes }` instead of the normal list — the whole chain (root
            first) plus any still-pending amendments against its current end. Bypasses
            subject_did (not required with this param).
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
          description: Page size (1-100).
      responses:
        "200":
          description: Attestation list (or, with `history_of`, a `{ chain, openDisputes }` chain-history object)
          headers:
            X-Next-Cursor:
              description: |
                (#2533) Cursor for the next (older) page — pass as `before`. Present only when more
                rows exist beyond this page.
              schema: { type: string, example: "2026-10-06T10:00:02.123Z,att_abc123" }
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    cid: { type: string }
                    issuerDid: { type: string }
                    subjectDid: { type: string }
                    type: { type: string }
                    contextId: { type: string }
                    contextType: { type: string }
                    ref: { type: string, nullable: true, description: "App-specific lookup key, if set at creation (#2534)" }
                    payload: { type: object }
                    attestationStatus: { type: string }
                    supersedes: { type: string, nullable: true, description: "Bilateral attestation this one proposes to amend, if any (#1790)" }
                    delegatorDid: { type: string, nullable: true, description: "DID that authorized issuerDid to act on its behalf, if any (#2394)" }
                    issuedAt: { type: string, format: date-time }
        "400":
          description: subject_did required, or `before` is not a well-formed `<issued_at>,<id>` cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: history_of does not resolve to an existing attestation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/attestations/{did}:
    get:
      tags: [auth]
      operationId: getAttestationsByDid
      summary: Shorthand — list attestations for a subject DID (path param)
      description: Equivalent to GET /api/attestations?subject_did={did}
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Attestation list
          content:
            application/json:
              schema:
                type: array
                items: { type: object }

  /api/attestations/{id}/revoke:
    post:
      tags: [auth]
      operationId: revokeAttestation
      summary: Revoke an attestation (issuer-only)
      description: |
        (#2649) Stamps `revokedAt` on the attestation, withdrawing it: revoked attestations are
        excluded from `GET /api/attestations`. Only the attestation's issuer may revoke. Callable
        with a session cookie, a legacy full-identity Bearer token, or (#2394) a scoped app-token
        minted by `POST /auth/api/tokens/app`. An app-token resolves to the user who minted it, so
        for an app-issued (delegated) attestation — `issuerDid` is the app, `delegatorDid` the
        user — the delegator the issuer acted for is accepted as the issuer. No schema change.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Attestation id (`att_...`)
      responses:
        "200":
          description: Attestation revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  revokedAt: { type: string, format: date-time }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Caller is not the attestation's issuer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Attestation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Attestation is already revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/attestations/countersign:
    post:
      tags: [auth]
      operationId: countersignAttestation
      summary: Countersign a pending attestation (witness/subject signs to make it bilateral)
      description: |
        Only the attestation subject can countersign. Transitions status from `pending` to
        `bilateral`.

        Amendment-by-supersession (#1790): when the attestation being countersigned carries
        `supersedes`, this atomically also flips the referenced attestation to `superseded`
        (both updates happen in one db transaction, re-verifying eligibility against a fresh
        read to close the window since creation-time validation). Returns 404/409 without
        countersigning either row if the referenced attestation no longer exists or is no
        longer bilateral/party-eligible by the time this runs.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attestationId, witnessJws]
              properties:
                attestationId: { type: string }
                witnessJws:
                  type: string
                  description: |
                    Compact JWS (#2083), `alg: EdDSA` only, signed by the subject's (witness's)
                    resolved DID key. Payload MUST be `{ attestationId, cid }` matching this
                    exact attestation, or the countersign is rejected with 422.
      responses:
        "200":
          description: Attestation is now bilateral
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  cid: { type: string }
                  status: { type: string, enum: [bilateral] }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Only the subject can countersign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Attestation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Attestation is not in pending state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            witnessJws failed verification (#2083) — bad or unresolvable `alg`, an unresolvable
            witness DID, an invalid signature, or a payload that doesn't bind to this
            attestation's id/CID. The countersign is never persisted when this is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/attestations/decline:
    post:
      tags: [auth]
      operationId: declineAttestation
      summary: Decline a pending attestation
      description: Only the attestation subject can decline. Transitions status from `pending` to `declined`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attestationId]
              properties:
                attestationId: { type: string }
      responses:
        "200":
          description: Attestation declined
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [declined] }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Only the subject can decline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Attestation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Attestation is not in pending state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/attestations/internal:
    post:
      tags: [auth]
      operationId: issueAttestationInternal
      summary: Internal — issue a platform-signed attestation (service-to-service)
      description: |
        Signs the attestation using the platform keypair (AUTH_PRIVATE_KEY).
        Requires `ATTESTATION_INTERNAL_API_KEY` as Bearer token. No session cookie.

        `payload.delegator_did` is subject to the same live-grant verification as
        POST /api/attestations (#1895, #1897): present and different from `issuer_did`
        requires a live delegation grant from `delegator_did` to `issuer_did` covering
        the capability implied by `type`, or the write is rejected with 403.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer_did, subject_did, type]
              properties:
                issuer_did: { type: string }
                subject_did: { type: string }
                type: { type: string }
                context_id: { type: string }
                context_type: { type: string }
                payload:
                  type: object
                  description: |
                    May carry the intro-funnel envelope fields (#1885): delegator_did,
                    disclosure_scope, prev_event_ref.
      responses:
        "201":
          description: Attestation issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  cid: { type: string }
                  issuerDid: { type: string }
                  subjectDid: { type: string }
                  type: { type: string }
                  delegationGrantId: { type: string, nullable: true, description: "Grant verified against payload.delegator_did, if any (#1895, #1897)" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized (invalid API key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: payload.delegator_did asserted but no live delegation grant covers this action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/eligibility/evaluate:
    post:
      tags: [auth]
      operationId: evaluateEligibility
      summary: Internal — (re-)evaluate hard-tier eligibility for a DID (service-to-service)
      description: |
        Re-runs the hard (established) verification eligibility rule for `did`
        — connections ≥25, handle claimed ≥4 weeks ago, ≥1 `event.attendance`
        attestation — and atomically upgrades the tier + emits
        `identity.verified.hard` when eligible (#1999). This is the single
        owner of the rule; apps must call this instead of re-deriving it or
        reading/writing `auth.identities` directly.

        Requires `ATTESTATION_INTERNAL_API_KEY` as Bearer token. No session
        cookie — the caller acts on its own service identity, not on behalf
        of a session belonging to `did`.

        Idempotent: calling this repeatedly for the same DID is safe. Once
        already at `established` tier (or never eligible), the response
        reports `upgraded: false` and performs no writes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [did]
              properties:
                did: { type: string, example: "did:imajin:abc123" }
      responses:
        "200":
          description: Evaluation complete (may or may not have upgraded the tier)
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  tier:
                    type: string
                    enum: [soft, preliminary, established, steward, operator]
                    description: The identity's tier after this evaluation.
                  upgraded:
                    type: boolean
                    description: True only when this call performed the tier upgrade (not a prior call).
        "400":
          description: Invalid request (missing/invalid did)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized (invalid API key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No identity found for did
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/account/methods:
    get:
      tags: [auth]
      operationId: getAccountMethods
      summary: List auth methods available for the current account
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Available auth methods (password, totp, email-mfa, passkey, etc.)
        "401":
          description: Unauthorized

  /api/devices:
    get:
      tags: [auth]
      operationId: listDevices
      summary: List registered devices for the current identity
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Device list
        "401":
          description: Unauthorized
    post:
      tags: [auth]
      operationId: registerDevice
      summary: Register a new device
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Device registered

  /api/devices/{id}:
    get:
      tags: [auth]
      operationId: getDevice
      summary: Get a specific registered device
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Device details
        "404":
          description: Not found
    delete:
      tags: [auth]
      operationId: deleteDevice
      summary: Remove a registered device
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Device removed

  /api/devices/trust:
    post:
      tags: [auth]
      operationId: trustDevice
      summary: Mark a device as trusted (extends session lifetime)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: { type: string }
      responses:
        "200":
          description: Device trusted

  /api/groups:
    get:
      tags: [auth]
      operationId: listGroups
      summary: List DID groups the current identity belongs to
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Group list
    post:
      tags: [auth]
      operationId: createGroup
      summary: Create a new DID group
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Group created

  /api/groups/{groupDid}:
    get:
      tags: [auth]
      operationId: getGroup
      summary: Get a DID group by its DID
      description: Returns the live controllers roster plus viewerDid and viewerRole for member-management controls.
      security:
        - cookieAuth: []
      parameters:
        - name: groupDid
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Group details
        "404":
          description: Not found
    delete:
      tags: [auth]
      operationId: deleteGroup
      summary: Delete a DID group
      security:
        - cookieAuth: []
      parameters:
        - name: groupDid
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Group deleted

  /api/groups/{groupDid}/controllers:
    get:
      tags: [auth]
      operationId: listGroupControllers
      summary: List controllers of a DID group
      security:
        - cookieAuth: []
      parameters:
        - name: groupDid
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Controller list
    post:
      tags: [auth]
      operationId: addGroupController
      summary: Add an authority member to a DID group
      description: |
        Owner/admin only. Only owners may assign admin; owner is reserved to
        accepted ownership transfer. Records group.member.added with the actual
        role (a plain member is never called a controller), memberDid, by,
        actingAs and actingFor. The node-signed record and membership commit
        atomically. The event includes oldAllowedServices (null for a new
        membership) and allowedServices. Existing audit history is never rewritten.
        Only owners may grant All services (null). Admins must choose a finite
        subset of their own live allowed_services for add or reactivation.
      security:
        - cookieAuth: []
      parameters:
        - name: groupDid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [did]
              properties:
                did: { type: string }
                role: { type: string, enum: [admin, maintainer, member, agent], default: member }
                allowedServices:
                  type: [array, "null"]
                  minItems: 1
                  items: { type: string }
                  description: Names from the canonical manifest plus the group's available registry apps, for admin/maintainer/member/agent. Null or omitted means All services (owner-only grant); an empty or unknown list is rejected. Owners are always unrestricted and cannot be assigned here.
      responses:
        "201":
          description: Controller added
        "400": { description: Invalid role or service list; choose at least one known service or null for All services }

  /api/groups/{groupDid}/controllers/{controllerDid}:
    patch:
      tags: [auth]
      operationId: updateGroupMember
      summary: Edit an existing authority member's role and service scope in place
      description: |
        Active owner/admin only; membership is re-read under the identity row
        lock on every request, so a downgrade applies on the next call, even
        with stale session claims. Admins may edit ordinary members or demote
        themselves, but may not assign admin or edit other higher-role members.
        Owner changes (including demotion) must use the accepted transfer-owner
        policy from #2892. Missing/removed targets are never re-added by PATCH.

        allowedServices follows the add contract for admin, maintainer, member
        and agent. Omitted fields preserve existing values, including across
        role changes; null means All services. A nonempty list must contain
        known app-service names from the canonical manifest plus the group's
        available registry apps. Empty lists are
        rejected to prevent accidental lockout. Owners remain unrestricted
        and cannot be edited here.
        Non-owners may only narrow services to a finite subset of both the
        target's current scope and their own live allowed_services, including
        self-edits and role changes. Only owners may widen or grant null.

        Each actual role or scope change commits exactly one node-signed
        group.member.role.changed attestation atomically with the membership.
        Subject is the member DID; context is the group DID. Payload contains
        memberDid, oldRole, newRole, oldAllowedServices, allowedServices,
        by (the authenticated principal DID), actingAs and actingFor (nullable).
        No-op saves return changed:false without emitting another event.
        Signing or evidence insertion failure rolls back the mutation.
        Verify Ed25519 against the issuer's published key over canonical JSON
        {subject_did,type,context_id,context_type,payload,issued_at}, with
        issued_at in milliseconds. Never rewrites prior event history.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - { name: groupDid, in: path, required: true, schema: { type: string } }
        - { name: controllerDid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                role: { type: string, enum: [admin, maintainer, member, agent] }
                allowedServices:
                  type: [array, "null"]
                  minItems: 1
                  items: { type: string, minLength: 1 }
      responses:
        "200":
          description: Membership updated or unchanged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  memberDid: { type: string }
                  role: { type: string }
                  allowedServices:
                    type: [array, "null"]
                    items: { type: string }
                  changed: { type: boolean }
                  attestationId: { type: string }
        "400": { description: Invalid JSON, role, service list, fields, or attempted owner mutation }
        "401": { description: Authentication required }
        "403": { description: Not authorized by live membership, or group suspended }
        "404": { description: Group or active member not found }
        "500": { description: Mutation or signed evidence failed; no changes committed }
    delete:
      tags: [auth]
      operationId: removeGroupController
      summary: Remove a controller or leave as a former-owner admin
      description: |
        Active owners may remove non-owner controllers. Admins may remove members
        or leave themselves. An active owner can never be removed: transfer
        ownership first. Removal serializes with ownership acceptance to prevent
        deleting a newly promoted owner. A successful self-removal expires the
        matching selected-group x-acting-as cookie.
        Atomically writes a node-signed group.member.removed attestation with
        memberDid, actual role, allowedServices, by, actingAs and actingFor.
        Signing or evidence-write failure leaves membership unchanged.
      security:
        - cookieAuth: []
      parameters:
        - name: groupDid
          in: path
          required: true
          schema: { type: string }
        - name: controllerDid
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Membership soft-deleted }
        "400": { description: Cannot remove an active owner }
        "401": { description: Authentication required }
        "403": { description: Caller lacks membership-management authority }
        "404": { description: Group or controller not found }
        "500": { description: Membership removal failed }

  /api/identity/{did}/contact:
    get:
      tags: [auth]
      operationId: getIdentityContact
      summary: Get contact information for an identity
      description: Internal-only vault Bearer contract. App-service scopes do not authorize this GET; apps use POST /profile/api/resolve.
      security:
        - bearerAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Contact details
        "404":
          description: Not found
    post:
      tags: [auth]
      operationId: backfillIdentityContactEmail
      summary: Backfill missing contact email for a DID
      description: |
        Atomic, independently NULL-guarded backfill of auth.identities.contact_email
        and an existing profile.profiles.contact_email. Normalizes by trimming and
        lowercasing; never overwrites either column, creates a profile, or writes
        verified credentials. A missing profile address uses the existing identity
        contact email when present, not a conflicting posted address, so a backfill
        cannot change the effective email through the higher-precedence profile
        fallback. backfilled is true if either column was filled.
        Repeated calls are safe no-ops when both existing rows already have email.

        Accepts the existing vault-only ATTESTATION_INTERNAL_API_KEY Bearer, or a
        registered app's own app-service+jwt (aud imajin:apps, sub=azp) carrying
        profile:contact:backfill. App calls require an active registration and
        current operator approval of that scope, plus an active app-authorization
        grant of profile:contact:backfill from the target person to the exact app,
        or a completed pay.transactions row bound to that app whose fromDid is
        the target DID. Anonymous/unbound payments, caller metadata, profile:read
        and an ordinary app login are not sufficient.

        App responses always return contactEmail: null, even on a no-op, so a
        write-only scope cannot reveal an existing address. Read email separately
        through POST /profile/api/resolve with profile:email:read and its per-person
        relationship gate. GET on this contact route remains internal-only.

        Does not emit an attestation: contact_email is an unverified
        billing/notification address, not a verification-state change.
      security:
        - bearerAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Backfill complete (may or may not have written the value)
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  contactEmail: { type: string, nullable: true, description: "Always null for registered-app callers; internal callers retain the existing identity contactEmail response." }
                  backfilled:
                    type: boolean
                    description: True only when this call filled at least one of the two NULL contact columns.
        "400":
          description: Invalid request (missing/invalid email)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized (invalid internal key or app-service token)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: App scope not granted or no relationship to the target person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Contact authorization unavailable; no contact read or write performed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No identity found for did
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/credentials/resolve:
    post:
      tags: [auth]
      operationId: resolveCredential
      summary: Internal — resolve email/DID credential pairs (service-to-service)
      description: |
        Single-item counterpart to the profile service's batched
        `POST /profile/api/resolve` (#1998): serves the two directions that
        route does not cover. Exactly one of `did` or `email` is required.

        - `did` -> `{ email }`: looks up `auth.credentials` (type='email')
          only, no `profile.profiles`/`auth.identities` fallback.
        - `email` -> `{ did }`: `mode: "credential"` queries
          `auth.credentials` only; `mode: "full"` (default) additionally
          falls back to `profile.profiles.contact_email` then
          `auth.identities.contact_email`, in that precedence order
          (#1834/#1858).

        Replaces the raw SQL that `packages/auth/src/credentials.ts` used
        to run directly against these tables — the last direct DB reach in
        the published `@imajin/auth` SDK (#1992, closing the #1983 audit
        finding on this file).

        Requires `ATTESTATION_INTERNAL_API_KEY` as Bearer token. No session
        cookie — mirrors POST /api/eligibility/evaluate's reasoning: the
        caller acts on its own service identity, not on behalf of a
        session belonging to `did`/`email`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                did: { type: string, description: "Resolve this DID's email credential. Mutually exclusive with email." }
                email: { type: string, format: email, description: "Resolve the DID that owns this email. Mutually exclusive with did." }
                mode:
                  type: string
                  enum: [credential, full]
                  default: full
                  description: "Only applies to an email lookup. credential = auth.credentials only; full = 3-tier fallback (default)."
      responses:
        "200":
          description: Resolution result — whichever field was requested is populated (or null), the other is omitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string, nullable: true, description: "Present when did was provided" }
                  did: { type: string, nullable: true, description: "Present when email was provided" }
        "400":
          description: Invalid request (neither or both of did/email provided, or an unknown mode)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized (invalid API key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/keys/retrieve:
    post:
      tags: [auth]
      operationId: retrieveKey
      summary: Retrieve an encrypted key from secure storage
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keyId: { type: string }
      responses:
        "200":
