  /api/mfa/email/send:
    post:
      tags: [auth]
      operationId: mfaEmailSend
      summary: Send an email MFA code (during login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                did: { type: string }
      responses:
        "200":
          description: Code sent

  /api/mfa/email/disable:
    post:
      tags: [auth]
      operationId: mfaEmailDisable
      summary: Disable email MFA for the current identity
      security:
        - cookieAuth: []
      responses:
        "200":
