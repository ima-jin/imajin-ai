        "200":
          description: Key stored

  /api/keys/stored:
    get:
      tags: [auth]
      operationId: listStoredKeys
      summary: List key IDs stored for the current identity
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of stored key IDs

  /api/login/mfa:
    post:
      tags: [auth]
      operationId: loginMfa
      summary: Complete MFA step during login flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                method: { type: string, enum: [totp, email] }
