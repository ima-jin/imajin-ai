  /api/onboard/generate:
    post:
      tags: [auth]
      operationId: onboardGenerate
      summary: Generate onboarding materials (keys, DID document) before registration
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Generated onboarding data

  /api/stored-keys:
    get:
      tags: [auth]
      operationId: getStoredKeys
      summary: Get stored key bundles for the current identity (legacy alias)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Stored key bundles

  /api/spec:
    get:
      tags: [auth]
      operationId: getSpec
      summary: Serve the OpenAPI spec YAML
      responses:
        "200":
          description: OpenAPI YAML
          content:
            text/yaml:
              schema: { type: string }

  /api/grants:
    post:
      tags: [grants]
      operationId: issueGrant
      summary: Issue a scoped delegation grant to an external agent (#1882)
      description: |
        User-push only: the caller must be a directly authenticated delegator
        principal. A caller acting under `X-Acting-For` agent delegation is
        rejected — authority flows delegator -> agent only, never the reverse.

        `capabilities` accepts two shapes: (1) a member of the closed
        `domain:verb` GRANT_SCOPE_REGISTRY vocabulary (`@imajin/auth`'s
        `validateGrantCapabilities`), or (2) an app-delegated attestation
        capability `attest:<appId>:<type>` (#2394) — `appId` must name a
        live, active `registry.apps` row whose OWN `app_did` is exactly this
        request's `agentDid` (so a delegator can never be tricked into
        granting one app's slot to a different app's DID), and `type` must
        be a known attestation type (a compile-time `ATTESTATION_TYPES`
        entry or a live `attestation_type_registry` entry, #1885). Granting
        this authorizes `agentDid` (the app) to submit a `POST
        /api/attestations` on the caller's behalf via `payload.delegator_did`
        for that exact `type` — see that route's own description.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentDid, capabilities, audience]
              properties:
                agentDid: { type: string }
                capabilities:
                  type: array
                  items: { type: string, example: "attest:app_dykil123:survey_response" }
                audience: { $ref: "#/components/schemas/DelegationAudience" }
                onBehalfOf:
                  type: array
                  items: { type: string }
                ttlMs: { type: integer, description: "Lease length in ms; clamped to [default, max]." }
      responses:
        "201":
          description: Grant issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  grant: { $ref: "#/components/schemas/DelegationGrant" }
        "400":
          description: Invalid capabilities, audience, or onBehalfOf chain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Caller is acting under agent delegation and may not issue grants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [grants]
      operationId: listGrants
      summary: List the authenticated delegator's own grants
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The delegator's grants
          content:
            application/json:
              schema:
                type: object
                properties:
                  grants:
                    type: array
                    items: { $ref: "#/components/schemas/DelegationGrant" }

  /api/grants/{grantId}:
    delete:
      tags: [grants]
      operationId: revokeGrant
      summary: Revoke an entire grant
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: grantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revocation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
        "403":
          description: Caller is not the delegator who issued this grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Grant not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/grants/{grantId}/capabilities/{capability}:
    put:
      tags: [grants]
      operationId: addGrantCapability
      summary: Add one capability to an existing, active grant (#2108), the additive mirror of DELETE below
      description: |
        Idempotent: adding a capability the grant already actively holds is a
        no-op 200 (`added: false`). Re-adding a capability previously revoked
        on this grant reactivates it on the same grant rather than issuing a
        sibling grant. Validated against the same closed capability registry
        as `POST /api/grants`. Same auth as the DELETE below — only the
        delegator who issued the grant may add to it.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: grantId
          in: path
          required: true
          schema: { type: string }
        - name: capability
          in: path
          required: true
          schema: { type: string, example: "operator:approvals" }
      responses:
        "200":
          description: Add result
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: boolean }
        "400":
          description: Unknown capability — not in the closed registry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Caller is not the delegator who issued this grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Grant not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Cannot add a capability to a revoked grant — issue a new one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [grants]
      operationId: revokeGrantCapability
      summary: Revoke exactly one capability, without touching its siblings (#1882 item 4)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: grantId
          in: path
          required: true
          schema: { type: string }
        - name: capability
          in: path
          required: true
          schema: { type: string, example: "messages:write" }
      responses:
        "200":
          description: Revocation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
        "403":
          description: Caller is not the delegator who issued this grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Grant not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/grants/{grantId}/renew:
    post:
      tags: [grants]
      operationId: renewGrant
      summary: Extend a grant's lease (grants are leases with expiry)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: grantId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlMs: { type: integer }
      responses:
        "200":
          description: Renewed grant
          content:
            application/json:
              schema:
                type: object
                properties:
                  grant:
                    type: object
                    properties:
                      grantId: { type: string }
                      expiresAt: { type: string, format: date-time }
        "403":
          description: Caller is not the delegator who issued this grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Grant not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A revoked grant cannot be renewed — issue a new one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/internal/verify-delegation:
    post:
      tags: [auth]
      operationId: internalVerifyDelegation
      summary: Internal — may agentDid act for principalDid? (#1887 dual-read acting-for check)
      description: |
        Internal-only, guarded by `AUTH_INTERNAL_API_KEY` via the `x-internal-key` header
        (same convention as `/api/internal/grants/introspect`). Answers a single coarse
        question — not capability-specific like grant introspection — used to bootstrap
        `X-Acting-For` delegation and `register_also` (ws-server.js).

        Resolution is grants-first with a logged fallback to the legacy `role='agent'`
        membership check (#1887 migration window): checks for any active, unexpired grant
        from `principalDid` to `agentDid` first, and only falls back to membership when no
        grant is found — so `via` tells you which path answered. Fails closed: a lookup
        error resolves `allowed: false` with a 500, never a silent allow.

        Called by `packages/auth`'s `requireAuth` (via `resolveAgentDelegationAuthority`)
        whenever a caller sends `X-Acting-For`, and by `ws-server.js` to authorize
        `register_also` — every service that imports `@imajin/auth` hits this
        transitively (#1995).
      security:
        - internalKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentDid, principalDid]
              properties:
                agentDid: { type: string }
                principalDid: { type: string }
      responses:
        "200":
          description: Resolution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: { type: boolean }
                  via: { type: string, enum: [grant, membership, none] }
                  grantId: { type: string, description: "Present only when via=grant" }
        "400":
          description: Missing agentDid or principalDid, or invalid JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or invalid x-internal-key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Lookup failed — treated as denied by every caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/internal/grants/introspect:
    post:
      tags: [grants]
      operationId: introspectGrant
      summary: Resolve delegated authority at execution time (internal, fail-closed)
      description: |
        Services call this per delegated action instead of trusting a cached
        grant. Fails closed: an unauthenticated caller, a malformed body, or a
        storage error all resolve `authorized: false`; only a genuinely
        active, unexpired, audience-matching grant returns `true`. Successful
        responses are cacheable for a short TTL (`Cache-Control: private,
        max-age=<seconds>`).
      security:
        - internalKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentDid, capability]
              properties:
                agentDid: { type: string }
                capability: { type: string, example: "messages:write" }
                targetDid: { type: string, description: "Required to satisfy a type=dids audience." }
      responses:
        "200":
          description: Introspection result
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorized: { type: boolean }
                  grantId: { type: string }
                  delegatorDid: { type: string }
                  agentDid: { type: string }
                  expiresAt: { type: string, format: date-time }
                  reason: { type: string }
        "401":
          description: Missing or invalid x-internal-key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Lookup failed (treated as denied by every caller)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/knock:
    post:
      tags: [knock]
      operationId: submitKnock
      summary: External agent knocks, declaring the principal it wants to serve (#1883)
      description: |
        Public, unauthenticated. `declared_target` must resolve to an
        existing principal (DID or handle) or the knock is rejected outright
        — no stub-minting. Carries zero authority: `requested_capabilities`
        are an advisory preview only, never auto-granted. No identity is
        minted here; the public key sits in escrow until the declared target
        accepts (see POST /api/knock/{knockId}/accept). Rate-limited per-IP
        and per-target.

        When `external_did` is a `did:web` DID (#1900), its DID document is
        resolved synchronously here and checked for the knock's own Ed25519
        public key among its verification methods — domain control is the
        trust anchor. The resulting `externalDidVerification` /
        `externalDidVerifiedAt` are recorded on the knock immediately (so
        the pending-review surface can label the claim before accept) and
        never block or fail the knock itself; resolution problems surface
        as `resolution_failed`. Non-`did:web` methods are always
        `declared_unverified` in v1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicKey, declared_target, self_description, requested_capabilities]
              properties:
                publicKey: { type: string, description: "64-char hex Ed25519 public key" }
                declared_target: { type: string, description: "DID or handle of an existing principal" }
                self_description: { type: string }
                requested_capabilities:
                  type: array
                  items: { type: string, example: "intros:propose" }
                  description: Advisory only — never becomes authority.
                external_did: { type: string, description: "Optional bring-your-own DID, e.g. did:web:boardy.ai. Recorded as an attestation on accept, never used for auth." }
      responses:
        "201":
          description: Knock submitted (or refreshed, if already pending from this keypair to this target)
          content:
            application/json:
              schema:
                type: object
                properties:
                  knock: { $ref: "#/components/schemas/Knock" }
        "400":
          description: Invalid publicKey, self_description, requested_capabilities, or external_did
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: declared_target does not resolve to an existing principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Per-IP or per-target rate limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/knock/pending:
    get:
      tags: [knock]
      operationId: listPendingKnocks
      summary: List the authenticated principal's own pending, unexpired knocks
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Pending knocks addressed to this principal
          content:
            application/json:
              schema:
                type: object
                properties:
                  knocks:
                    type: array
                    items: { $ref: "#/components/schemas/Knock" }

  /api/knock/{knockId}/accept:
    post:
      tags: [knock]
      operationId: acceptKnock
      summary: Mint-on-accept — zero grants (#1883)
      description: |
        Only the declared target may accept. Mints a new did:imajin agent
        identity (or, for a returning multi-tenant agent keypair, reuses the
        existing one) and links it to the accepting principal. Grants zero
        authority — issue capabilities separately via POST /api/grants
        (#1882) after this call.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: knockId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  agentDid: { type: string }
                  minted: { type: boolean, description: "True only when this accept minted a brand-new identity." }
        "403":
          description: Caller is not the declared target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Knock not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Knock already responded to, or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/knock/{knockId}/decline:
    post:
      tags: [knock]
      operationId: declineKnock
      summary: Discard a pending knock — no identity was ever created
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: knockId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                type: object
                properties:
                  declined: { type: boolean }
        "403":
          description: Caller is not the declared target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Knock not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Knock already responded to, or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/attestations/turn-evidence:
    post:
      tags: [auth]
      operationId: ingestTurnEvidence
      summary: Signed batch ingest of agent.turn.evidence — tool I/O as the committed boundary of a turn (#1978)
      description: |
        Called once at turn finalization by the agent's harness hook (the OpenClaw Imajin
        plugin) — never per tool call. Each item is one `agent.turn.evidence` attestation:
        hashes of one tool call's input and output plus a timestamp, signed locally with the
        agent's DID key over `turnEvidenceSigningMessage(payload, issued_at)` (`@imajin/auth`).
        The signature is the credential; there is no session. The payload is a closed
        vocabulary of hashes, DIDs and short identifiers — any other key is rejected, so raw
        tool input/output and secrets cannot be persisted.

        All-or-nothing: a bad signature, an agent with no authority over `principalDid`
        (self, or an active `evidence:publish` delegation grant), an unresolvable `usageRef`,
        or an `outputRef` that is not principal-owned / does not hash to `outputHash` /
        names a tool outside the evidentiary allowlist rejects the whole batch before
        anything is written. Replays are idempotent on (agent, turn, `seq`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence]
              properties:
                evidence:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: One item per tool call; all items name the same turnEventId, turnOutputHash, agentDid and principalDid, with distinct `seq`.
                  items:
                    type: object
                    required: [payload, issued_at, signature]
                    properties:
                      payload: { $ref: "#/components/schemas/TurnEvidencePayload" }
                      issued_at: { type: integer, description: Unix epoch milliseconds the agent signed at (part of the signed form) }
                      signature: { type: string, description: Ed25519 hex (128 chars) }
      responses:
        "201":
          description: At least one evidence row was stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TurnEvidenceIngestResult" }
        "200":
          description: Every row was an idempotent replay; nothing new stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TurnEvidenceIngestResult" }
        "400":
          description: Malformed batch, unknown key in the payload, unresolvable agent DID, or invalid signature (`code` evidence_signature_invalid / evidence_agent_unknown)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Agent is not authorized to publish evidence for principalDid (`code` evidence_publisher_unauthorized)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: usageRef or outputRef check failed (`code` evidence_usage_ref_unresolved / evidence_tool_not_evidentiary / evidence_output_ref_invalid / evidence_output_ref_mismatch)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limited (per client IP); see Retry-After
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/verify/turn/{hash}:
    get:
      tags: [auth]
      operationId: verifyTurnByHash
      summary: Public, no-auth verification of a turn claim against its signed tool-call evidence (#1978)
      description: |
        `hash` is the turn's `outputHash` — the claim — as `sha256:<hex>` (bare 64-char hex is
        accepted). Anyone can recompute the hash of the text they were shown and look it up
        here without an account. Returns, per matching turn: the evidence chain (tool name,
        input/output hashes, observed-at), the signer's DID and key id, per-row and overall
        signature validity, and linkage status to the turn event and `agent.turn.usage`
        attestation (`unresolved` until those records exist — never fabricated).

        Signatures are re-verified from the stored row, so altering any stored byte reports
        `signatureValid: false`. A hash nothing is committed under — including a claim altered
        by one byte — is 404. Redaction-safe: hashes, tool names, timestamps and agent DIDs
        only; never the principal, retained-output references, or turn payloads.
      security: []
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string, example: "sha256:2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae" }
      responses:
        "200":
          description: Evidence chain(s) committed under the hash
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TurnVerification" }
        "400":
          description: Malformed hash
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No evidence is committed under this hash
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limited (per client IP, 30 requests/minute); see Retry-After
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
