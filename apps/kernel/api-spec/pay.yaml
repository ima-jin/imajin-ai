openapi: "3.1.0"
info:
  title: imajin pay
  version: "2.0.0"
  description: Payments, balances, Stripe Connect onboarding, .fair multi-party settlement, escrow, and webhooks. Runs as a kernel service at /{service}/api/... on a shared node domain.
servers:
  - url: https://{node}.imajin.ai/{service}
    description: production node
    variables:
      node:
        default: jin
      service:
        default: pay
  - url: http://localhost:3000/{service}
    description: local development

tags:
  - name: pay
    description: imajin pay service

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: imajin_session
    bearerAuth:
      type: http
      scheme: bearer
      description: "Bearer token (internal service-to-service or user API token)"
    apiKeyAuth:
      type: http
      scheme: bearer
      description: "PAY_SERVICE_API_KEY — internal service-to-service calls only"
    stripeWebhook:
      type: apiKey
      in: header
      name: stripe-signature
      description: "Stripe webhook signature verification (HMAC-SHA256)"
  schemas:
    Balance:
      type: object
      description: |
        #2016: balances is an explicit array of one entry per wallet unit —
        MJN (receipt-backed, fiat-minted, withdrawable) and MJNx (emitted
        platform unit, in-platform only, never withdrawable, never silently
        convertible to MJN). `total`/`currency` are kept for backward
        compatibility with the events/coffee/market/learn app proxies.
      properties:
        did: { type: string }
        balances:
          type: array
          items:
            type: object
            properties:
              unit: { type: string, enum: [MJN, MJNx] }
              amount: { type: number }
              withdrawable: { type: boolean, description: "true only for the MJN entry" }
        total: { type: number, description: "MJN amount + MJNx amount" }
        currency: { type: string, default: USD, description: "The MJN row's fiat reference currency" }
        updatedAt: { type: string, format: date-time }
    Transaction:
      type: object
      properties:
        id: { type: string }
        fromDid: { type: string }
        toDid: { type: string }
        amount: { type: number }
        currency: { type: string }
        service: { type: string }
        type: { type: string }
        status: { type: string }
        metadata: { type: object }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    PaymentRequest:
      type: object
      description: |
        #2206/#2207: an invoice / money request as a first-class receivable
        on the business DID. `fair_manifest` is always non-null — every
        payment_request carries a .fair manifest (the simple case is a
        single-payee manifest, built via `buildFairManifest` when the
        caller supplies none).
      properties:
        id: { type: string }
        kind: { type: string, enum: [invoice, request] }
        issuerDid: { type: string }
        payeeAccount: { type: string }
        recipientDid: { type: string, nullable: true }
        recipientStubId: { type: string, nullable: true }
        payHandle: { type: string, description: "Opaque handle for the unauthenticated GET /api/payment-requests/by-handle/{handle} read (#2210)" }
        lineItems:
          type: array
          items:
            type: object
            required: [name, amount, quantity]
            properties:
              name: { type: string }
              description: { type: string }
              amount: { type: integer, description: "Unit price in minor units" }
              quantity: { type: integer }
        currency: { type: string }
        totalAmount: { type: integer, description: "Minor units" }
        fairManifest: { type: object, description: ".fair manifest — never null" }
        dueAt: { type: string, format: date-time, nullable: true }
        allowOnPlatform: { type: boolean }
        status: { type: string, enum: [issued, paid, settled_manual, void] }
        settlementRef:
          type: object
          nullable: true
          description: "Stripe checkout session id | mjnx tx | manual { method, note, asserted_by, settled_at }"
        contentHash: { type: string, description: "Attestations bind this, never bytes" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaymentRequestPublicView:
      type: object
      description: |
        #2210 — the minimum-necessary, unauthenticated view returned by
        GET /api/payment-requests/by-handle/{handle}. No issuer DID, no
        recipient PII, no fair_manifest/settlement_ref/content_hash.
      properties:
        kind: { type: string, enum: [invoice, request] }
        lineItems:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              description: { type: string }
              amount: { type: integer }
              quantity: { type: integer }
        totalAmount: { type: integer, description: "Minor units" }
        currency: { type: string }
        issuerDisplayName: { type: string }
        status: { type: string, enum: [issued, paid, settled_manual, void] }
    PaymentRequestInvite:
      type: object
      description: "Present on the create response only when the recipient was resolved via recipient_invite (#2210)."
      properties:
        id: { type: string }
        code: { type: string }
        url: { type: string }

paths:
  /api/health:
    get:
      tags: [pay]
      operationId: healthCheck
      summary: Service health check — checks all configured payment providers
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [healthy, degraded, unhealthy] }
                  providers: { type: object }
                  timestamp: { type: string, format: date-time }
        "503":
          description: One or more providers unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  providers: { type: object }
                  timestamp: { type: string, format: date-time }

  /api/balance/{did}:
    get:
      tags: [pay]
      operationId: getBalance
      summary: Get current balance for a DID
      description: |
        Returns the MJN (withdrawable) and MJNx (emitted, never withdrawable)
        balances as an explicit array (#2016). The authenticated identity
        must match the requested DID.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
          description: "URL-encoded DID"
      responses:
        "200":
          description: Balance retrieved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Balance" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden — can only access your own balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/balance/gift:
    post:
      tags: [pay]
      operationId: giftCredits
      summary: Bulk gift credits from a business DID to multiple recipients
      description: |
        A funded transfer, never a mint (#2018): debits `from_did`'s MJN (cash) balance for
        the total gifted `cash_amount` and its MJNx (credit) balance for the total gifted
        `credit_amount`, then atomically credits each recipient's cash and credit buckets.
        Insufficient balance in either unit returns 402 and writes nothing.
        The authenticated identity must match `from_did`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_did, recipients]
              properties:
                from_did: { type: string }
                recipients:
                  type: array
                  items:
                    type: object
                    required: [did, cash_amount, credit_amount]
                    properties:
                      did: { type: string }
                      cash_amount: { type: number }
                      credit_amount: { type: number }
                metadata: { type: object }
      responses:
        "200":
          description: Credits gifted
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchId: { type: string }
                  count: { type: number }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "402":
          description: Insufficient MJN or MJNx balance — never a mint (#2018)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden — can only gift from your own DID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/balance/event-topup:
    post:
      tags: [pay]
      operationId: eventTopup
      summary: Multiplier-based credit gifting for event attendees
      description: |
        A funded transfer, never a mint (#2018): debits `from_did`'s MJN (cash) balance for
        `ticket_price × recipient count` and its MJNx (credit) balance for the total bonus
        credited. Credits each recipient with `ticket_price` cash (refund) and
        `ticket_price × (multiplier - 1)` credits (bonus).
        multiplier 1.0 = refund only; multiplier 10.0 = refund + 9× credits.
        Insufficient balance in either unit returns 402 and writes nothing.
        Authenticated via Bearer token; `from_did` must match session.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_did, event_id, multiplier, recipient_dids, metadata]
              properties:
                from_did: { type: string }
                event_id: { type: string }
                multiplier: { type: number, minimum: 1.0, description: "Credit multiplier (≥ 1.0)" }
                recipient_dids:
                  type: array
                  items: { type: string }
                  minItems: 1
                metadata:
                  type: object
                  required: [ticket_price]
                  properties:
                    ticket_price: { type: number, description: "Per-recipient ticket price (USD)" }
      responses:
        "200":
          description: Event credits applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchId: { type: string }
                  count: { type: number }
                  cashPerRecipient: { type: number }
                  creditPerRecipient: { type: number }
        "400":
          description: Invalid multiplier or missing ticket_price
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "402":
          description: Insufficient MJN or MJNx balance — never a mint (#2018)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden — can only top up from your own DID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/balance/withdraw:
    post:
      tags: [pay]
      operationId: withdraw
      summary: Withdraw cash balance to an external payout destination
      description: |
        Only MJN (receipt-backed, withdrawable) can be withdrawn — MJNx cannot be
        withdrawn. Minimum withdrawal is $1.00 (100 cents). Rail-agnostic (#2172),
        reserve -> external -> confirm instead of one transaction. The guarded
        conditional UPDATE debit (#2166) is committed together with a durable
        withdrawal-intent row BEFORE the external rail is ever called — insufficient
        balance returns 402 and no external transfer is ever attempted. If the rail
        call itself fails, the reservation is released before this endpoint returns
        a 500. A rail transfer that succeeds but whose confirmation never commits
        (crash, network partition) is caught by the reconciliation sweep
        (`GET /api/cron/withdrawal-reconcile`, not part of this per-app spec) and
        surfaced via `GET /api/admin/reconciliation`, never silently lost.

        `account_id` is optional (#2190) and is only ever a *selection hint* —
        the destination is always resolved server-side from the caller's own
        connected Stripe account. Omitted -> the caller's connected account is
        used. Supplied -> it must match the caller's own connected account, else
        403 (fail-closed; never falls back to the supplied value).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, description: "Amount in cents (minimum 100)" }
                currency: { type: string, default: usd }
                account_id:
                  type: string
                  description: >-
                    Optional Stripe connected account ID. Must belong to the caller;
                    omit to use the caller's default connected account.
      responses:
        "200":
          description: Withdrawal initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  transactionId: { type: string }
                  transferId: { type: string }
                  amount: { type: number }
                  currency: { type: string }
        "400":
          description: >-
            Invalid amount (below minimum or not a positive number), a non-string
            account_id, or no connected Stripe account exists for the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "402":
          description: Insufficient MJN balance (#2166) — the guarded debit never reaches Stripe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: account_id does not belong to the caller's own connected account (#2190) — fail-closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/balance/transfer:
    post:
      tags: [pay]
      operationId: transferBalance
      summary: Transfer balance from one DID to another
      description: |
        Moves a single wallet unit (#2016) — `unit` defaults to `MJN` and must be
        `MJN` or `MJNx`; both legs of the transfer touch the SAME unit, so
        cross-unit movement (e.g. sending MJNx and having it arrive as MJN)
        is impossible by construction. An unknown unit is a 400, never a
        conversion. The sender's debit is a guarded conditional UPDATE (#2166)
        in the same transaction as the recipient credit — insufficient balance
        returns 402 and writes nothing. The authenticated identity must match
        `from_did`. Accepts either a session cookie or a Bearer token (app
        token or session JWT) — the route resolves the caller via
        `resolveEffectiveDid`, same as `GET /api/balance/{did}` (#2002).
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_did, to_did, amount]
              properties:
                from_did: { type: string }
                to_did: { type: string }
                amount: { type: number, description: "Amount in the given unit" }
                unit: { type: string, enum: [MJN, MJNx], default: MJN }
                metadata: { type: object }
      responses:
        "200":
          description: Transfer complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionId: { type: string }
                  fromDid: { type: string }
                  toDid: { type: string }
                  amount: { type: number }
                  unit: { type: string, enum: [MJN, MJNx] }
        "400":
          description: Invalid request — missing fields, non-positive amount, self-transfer, unknown unit, or currency mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "402":
          description: Insufficient balance in the requested unit (#2166) — never a partial write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden — can only transfer from your own DID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/balance/topup:
    post:
      tags: [pay]
      operationId: topupBalance
      summary: Credit cash balance — internal service-to-service only
      description: |
        Represents real money received (e.g. from Stripe webhook). Always credits `cash_amount`.
        Authenticated via PAY_SERVICE_API_KEY Bearer token.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [did, amount, service, type]
              properties:
                did: { type: string }
                amount: { type: number, description: "Amount in dollars" }
                service: { type: string, description: "Originating service (e.g. coffee, events)" }
                type: { type: string, description: "Transaction type label" }
                metadata: { type: object }
      responses:
        "200":
          description: Balance topped up
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionId: { type: string }
                  did: { type: string }
                  amount: { type: number }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized (invalid API key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/charge:
    post:
      tags: [pay]
      operationId: createCharge
      summary: Create a direct payment charge
      description: |
        For Stripe: creates a PaymentIntent (requires frontend to confirm with `clientSecret`).
        For Solana: returns an unsigned transaction (requires wallet signature).
        Auth is optional — if provided, the charged DID is linked to the transaction.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency, to]
              properties:
                amount: { type: integer, description: "Cents for fiat; lamports for SOL; base units for tokens" }
                currency:
                  type: string
                  enum: [USD, CAD, SOL, USDC, MJN]
                to:
                  type: object
                  description: "Recipient — at least one field required"
                  properties:
                    stripeCustomerId: { type: string }
                    solanaAddress: { type: string }
                    did: { type: string }
                description: { type: string }
                metadata:
                  type: object
                  additionalProperties: { type: string }
                idempotencyKey: { type: string }
      responses:
        "200":
          description: Charge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  provider: { type: string, enum: [stripe, solana] }
                  status: { type: string, enum: [pending, requires_action, succeeded, failed] }
                  amount: { type: number }
                  currency: { type: string }
                  clientSecret: { type: string, description: "Stripe PaymentIntent client secret" }
                  signature: { type: string, description: "Solana — if pre-signed" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/checkout:
    post:
      tags: [pay]
      operationId: createCheckout
      summary: Create a hosted Stripe Checkout session
      description: |
        Returns a URL to redirect the customer to Stripe Checkout. Supports `.fair` manifests for
        multi-party revenue splits via `fairManifest`. Rate-limited to 10 req/min per IP.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, currency, successUrl, cancelUrl]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, amount, quantity]
                    properties:
                      name: { type: string }
                      description: { type: string }
                      amount: { type: integer, description: "Price in cents" }
                      quantity: { type: integer }
                      image: { type: string }
                currency:
                  type: string
                  enum: [USD, CAD, EUR, GBP]
                mode: { type: string, enum: [payment, subscription], default: payment }
                customerEmail: { type: string, format: email }
                successUrl: { type: string, format: uri }
                cancelUrl: { type: string, format: uri }
                metadata:
                  type: object
                  additionalProperties: { type: string }
                fairManifest: { type: object, description: ".fair multi-party split manifest" }
                connectedAccountId: { type: string, description: "Stripe Connect account for platform fees" }
                sellerDid: { type: string }
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
                  transactionId: { type: string }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/settle:
    post:
      tags: [pay]
      operationId: fairSettle
      summary: Execute a .fair multi-party settlement
      description: |
        Validates `from_did` has sufficient balance in the settlement's `unit`
        (#2016 — defaults to `MJN`, no more mixed credit-then-cash burn), then
        atomically:
        - Debits `from_did` in that single unit
        - Credits each recipient in the fair_manifest chain in that same unit
        - Logs all transactions
        - Emits attestations (customer + transaction.settled)

        `unit` must be present in `accepted_units` (default MJN-only) or the
        settlement is rejected with a 400 before any balance is touched —
        never silently converted. Externally-funded settlements (`funded:
        true`) are hard-pinned to `unit: MJN`: there is no receipt for an
        externally-funded MJNx mint.

        Set `funded: true` for externally-funded payments (e.g. Stripe) to skip the balance
        check and debit step.

        Authenticated via PAY_SERVICE_API_KEY Bearer token (internal service-to-service).
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_did, total_amount, service, type, fair_manifest]
              properties:
                from_did: { type: string }
                total_amount: { type: number }
                service: { type: string }
                type: { type: string }
                unit: { type: string, enum: [MJN, MJNx], default: MJN }
                accepted_units:
                  type: array
                  items: { type: string, enum: [MJN, MJNx] }
                  default: [MJN]
                funded: { type: boolean, description: "true = externally funded (Stripe etc.) — skip balance check, unit must be MJN" }
                funded_provider: { type: string, description: "stripe | solana — for audit log" }
                fair_manifest:
                  type: object
                  required: [chain]
                  properties:
                    chain:
                      type: array
                      items:
                        type: object
                        required: [did, amount, role]
                        properties:
                          did: { type: string }
                          amount: { type: number }
                          role: { type: string }
                metadata: { type: object }
      responses:
        "200":
          description: Settlement complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchId: { type: string }
                  transactionIds: { type: array, items: { type: string } }
                  recipients: { type: integer }
        "400":
          description: Insufficient balance or invalid manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized (invalid API key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/escrow:
    post:
      tags: [pay]
      operationId: createEscrow
      summary: Create an escrow — hold funds until released
      description: |
        Holds funds from `from` until conditions are met (time-based auto-release or
        multi-signature release). Requires Bearer auth.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency, from, to]
              properties:
                amount: { type: number }
                currency: { type: string }
                from: { type: string, description: "DID of depositor" }
                to: { type: string, description: "DID of recipient" }
                arbiter: { type: string, description: "DID of dispute resolver" }
                conditions:
                  type: object
                  properties:
                    releaseAfter: { type: string, format: date-time, description: "ISO date for auto-release" }
                    requireSignatures:
                      type: array
                      items: { type: string }
                      description: "DIDs that must sign to release"
                metadata:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "201":
          description: Escrow created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  provider: { type: string, enum: [stripe, solana] }
                  status: { type: string, enum: [held] }
                  amount: { type: number }
                  currency: { type: string }
                  from: { type: string }
                  to: { type: string }
                  createdAt: { type: string, format: date-time }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [pay]
      operationId: releaseEscrow
      summary: Release or refund an escrow
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, escrowId]
              properties:
                action: { type: string, enum: [release, refund] }
                escrowId: { type: string }
      responses:
        "200":
          description: Escrow settled
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [released, refunded] }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/connect/onboard:
    post:
      tags: [pay]
      operationId: stripeConnectOnboard
      summary: Start Stripe Connect Express onboarding for the authenticated DID
      description: |
        Creates a Stripe Express account for the authenticated DID (if not exists) and returns
        an onboarding URL. Only human (hard) DIDs — not agents. If already has an account,
        generates a new Account Link for re-onboarding.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [return_url, refresh_url]
              properties:
                return_url: { type: string, format: uri }
                refresh_url: { type: string, format: uri }
      responses:
        "200":
          description: Onboarding link created
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId: { type: string }
                  onboardingUrl: { type: string, format: uri }
                  isNew: { type: boolean }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Agents cannot onboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/connect/status:
    get:
      tags: [pay]
      operationId: stripeConnectStatus
      summary: Check Stripe Connect account status for a DID
      description: Returns the connected account status from DB (kept fresh by webhook).
      parameters:
        - name: did
          in: query
          required: true
          schema: { type: string }
          description: "DID to check"
      responses:
        "200":
          description: Account status
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  did: { type: string }
                  stripeAccountId: { type: string }
                  chargesEnabled: { type: boolean }
                  payoutsEnabled: { type: boolean }
                  detailsSubmitted: { type: boolean }
                  onboardingComplete: { type: boolean }
        "404":
          description: No connected account for this DID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/connect/dashboard:
    get:
      tags: [pay]
      operationId: stripeConnectDashboard
      summary: Generate a Stripe Express Dashboard login link
      description: Generates a one-time login link for the Stripe Express dashboard for the connected account. Auth required.
      security:
        - cookieAuth: []
      parameters:
        - name: did
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dashboard URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No connected account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/connect/webhook:
    post:
      tags: [pay]
      operationId: stripeConnectWebhook
      summary: Stripe Connect webhook — connected account events
      description: |
        Handles Stripe Connect webhook events:
        - `account.updated` — refresh onboarding status in DB
        - `payout.paid` — log successful payout
        - `payout.failed` — log failed payout
      security:
        - stripeWebhook: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Event received

  /api/transactions/{did}:
    get:
      tags: [pay]
      operationId: listTransactions
      summary: List transactions for a DID
      description: Returns paginated transactions. The authenticated identity must match the requested DID.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
        - name: service
          in: query
          schema: { type: string, description: "Filter by originating service (e.g. coffee)" }
        - name: type
          in: query
          schema: { type: string, description: "Filter by transaction type" }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items: { $ref: "#/components/schemas/Transaction" }
                  limit: { type: integer }
                  offset: { type: integer }
                  count: { type: integer }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden — can only access your own transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/transactions/{did}/summary:
    get:
      tags: [pay]
      operationId: transactionSummary
      summary: Aggregated transaction summary grouped by service
      description: Returns earned/spent breakdown by service. The authenticated identity must match the requested DID.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        earned: { type: number }
                        spent: { type: number }
                        net: { type: number }
                  total:
                    type: object
                    properties:
                      earned: { type: number }
                      spent: { type: number }
                      net: { type: number }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/webhook:
    post:
      tags: [pay]
      operationId: stripeWebhook
      summary: Stripe webhook — payment events
      description: |
        Handles Stripe webhook events:
        - `payment_intent.succeeded` — record successful charge, trigger balance update
        - `payment_intent.payment_failed` — record failure
        - `checkout.session.completed` — fulfill order, trigger settlement
        - `customer.subscription.created/updated/deleted` — provision/revoke access
        - `invoice.paid` — recurring payment received
        Idempotent — skips already-processed events.
      security:
        - stripeWebhook: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Event received

  /api/refund:
    post:
      tags: [pay]
      operationId: refund
      summary: Issue a refund for a transaction
      description: Refund a charge or payment. Requires auth (cookieAuth or bearerAuth). May require internal service key for some refund types.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId]
              properties:
                transactionId: { type: string }
                amount: { type: number, description: "Partial refund amount (omit for full refund)" }
                reason: { type: string }
      responses:
        "200":
          description: Refund issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  refundId: { type: string }
                  status: { type: string }
        "400":
          description: Invalid refund request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized

  /api/admin/reconciliation:
    get:
      tags: [pay]
      operationId: payReconciliation
      summary: MJN/MJNx reconciliation report (#2016 decision 4) + withdrawal discrepancies (#2172)
      description: |
        Circulating MJNx (emitted, in-platform unit), backed MJN (withdrawable
        liability), and per-DID lifetime emitted vs receipted totals. Adapted
        from the #2012 audit's §6 SQL sketch to the row-per-(did, unit)
        `pay.balances` shape. Single-node only — no cross-node breakdown
        (#738 Decision 2). Also surfaces withdrawal-reconciliation discrepancies
        (#2172), grouped by rail — signed `pay.reconciliation.discrepancy`
        attestations the reconciliation sweep emitted, proposing but never
        applying a resolution.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Reconciliation totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  circulatingMjnx: { type: number }
                  backedMjn: { type: number }
                  perDid:
                    type: array
                    items:
                      type: object
                      properties:
                        did: { type: string }
                        currency: { type: string }
                        mjn_amount: { type: number }
                        mjnx_amount: { type: number }
                        lifetime_emitted: { type: number }
                        lifetime_receipted: { type: number }
                  discrepancies:
                    type: array
                    description: Withdrawal reconciliation discrepancies (#2172), grouped by rail.
                    items:
                      type: object
                      properties:
                        rail: { type: string }
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              bucket: { type: string, enum: [external_without_ledger, pending_timeout] }
                              externalRef: { type: string, nullable: true }
                              intentId: { type: string, nullable: true }
                              amount: { type: number }
                              unit: { type: string }
                              issuedAt: { type: string, format: date-time }
        "401":
          description: Unauthorized (not an admin)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/payment-requests:
    post:
      tags: [pay]
      operationId: createPaymentRequest
      summary: Create a payment_request (invoice / money request) — issuer-only
      description: |
        #2206/#2207/#2208/#2210. `issuer_did` must resolve to the
        authenticated principal (`requireAuth`/`actingFor`). Exactly one
        of `recipient_did` / `recipient_stub_id` / `recipient_invite` is
        required:
          - `recipient_did` must be a DID the issuer has an existing
            connection with (403 otherwise).
          - `recipient_stub_id` passes a pre-resolved claimable-stub DID
            through directly.
          - `recipient_invite` (`{ email, delivery?: 'link'|'email',
            note? }`) creates-or-reuses a claimable stub (#1834) for that
            email and a connections invite carrying this request as its
            opaque reason (#1839 no-PII-pre-claim posture); the response's
            `invite` field carries the resulting invite id/code/url.
        `total` is computed from `line_items`. When `fair_manifest` is
        omitted, a default single-payee manifest is built via
        `buildFairManifest`; a caller-supplied manifest is rejected (400)
        when its `total` does not match the computed request total. Mints
        exactly ONE `payment_request.issued` attestation (signed by the
        issuer, binding `content_hash`) and publishes
        `payment_request.issued`. Every request also gets an opaque
        `payHandle` for the unauthenticated by-handle read.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer_did, line_items]
              properties:
                issuer_did: { type: string }
                payee_account: { type: string, description: "Defaults to issuer_did" }
                kind: { type: string, enum: [invoice, request], default: invoice }
                recipient_did: { type: string }
                recipient_stub_id: { type: string }
                recipient_invite:
                  type: object
                  description: "New-counterparty path (#2210) — exactly one of recipient_did/recipient_stub_id/recipient_invite is required"
                  required: [email]
                  properties:
                    email: { type: string, format: email }
                    delivery: { type: string, enum: [link, email], default: email }
                    note: { type: string }
                line_items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, amount, quantity]
                    properties:
                      name: { type: string }
                      description: { type: string }
                      amount: { type: integer, description: "Unit price in minor units" }
                      quantity: { type: integer }
                currency: { type: string, default: CAD }
                due_at: { type: string, format: date-time }
                allow_on_platform: { type: boolean, default: true }
                fair_manifest: { type: object, description: "Optional — defaulted via buildFairManifest when omitted" }
      responses:
        "201":
          description: payment_request created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaymentRequest"
                  - type: object
                    properties:
                      invite: { $ref: "#/components/schemas/PaymentRequestInvite" }
        "400":
          description: Invalid request (bad recipient/line_items, or fair_manifest.total mismatch)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: issuer_did does not match the authenticated principal, or recipient_did is not an existing connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [pay]
      operationId: listPaymentRequests
      summary: List payment_requests by issuer and/or recipient
      description: |
        At least one of `issuer_did` / `recipient_did` is required and must
        match the authenticated principal — a caller may only list their
        own issued or received payment_requests.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: issuer_did
          in: query
          schema: { type: string }
        - name: recipient_did
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [issued, paid, settled_manual, void] }
        - name: kind
          in: query
          schema: { type: string, enum: [invoice, request] }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: payment_requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentRequests:
                    type: array
                    items: { $ref: "#/components/schemas/PaymentRequest" }
        "400":
          description: Neither issuer_did nor recipient_did was supplied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: issuer_did/recipient_did does not match the authenticated principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/payment-requests/{id}:
    get:
      tags: [pay]
      operationId: getPaymentRequest
      summary: Get a payment_request — issuer or recipient only
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: payment_request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequest" }
        "403":
          description: Not the issuer or recipient
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/payment-requests/by-handle/{handle}:
    get:
      tags: [pay]
      operationId: getPaymentRequestByHandle
      summary: Unauthenticated minimum-necessary read for the opaque pay-link handle (#2210)
      description: |
        Used by both recipient orderings: pay-first (before any account/
        connection exists) and claim-first (after claiming). No
        recipient PII, no issuer DID. Hidden (404) once `void`, same as an
        unknown handle.
      parameters:
        - name: handle
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Minimum-necessary payment_request view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequestPublicView" }
        "404":
          description: Not found, or void
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/payment-requests/{id}/void:
    post:
      tags: [pay]
      operationId: voidPaymentRequest
      summary: Void a payment_request — issuer-only, only valid from `issued`
      description: Publishes `payment_request.voided`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: payment_request voided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequest" }
        "403":
          description: Not the issuer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Not in `issued` status (already void/settled_manual/paid), or a concurrent status change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/payment-requests/{id}/checkout:
    post:
      tags: [pay]
      operationId: createPaymentRequestCheckout
      summary: Create (or reuse) a Stripe Checkout session for a payment_request — issuer or recipient (#2209)
      description: |
        Composes the existing `POST /api/checkout` code path with the
        payment_request's own `line_items`/`currency`/`fair_manifest`
        (always present — #2207 NOT NULL)/`issuer_did`, and
        `metadata.payment_request_id`. Refuses when the request isn't
        `issued` or doesn't `allow_on_platform`. Idempotent: reuses an
        already-open Stripe session for the same request instead of
        creating a duplicate. Auth required — an anonymous pay-link
        checkout (no recipient DID) is deferred to #2210.

        On `checkout.session.completed`, the Stripe webhook
        (`POST /api/webhook`) reads `metadata.payment_request_id`: status
        → `paid`, `settlement_ref = { method: 'stripe', checkout_session_id,
        payment_intent_id }`, publishes `payment_request.paid`, ALWAYS
        settles via the canonical `settlePayment()` primitive (the manifest
        is guaranteed present), mints exactly ONE kernel-signed
        `payment_request.settled` attestation, and publishes
        `payment_request.settled`. Idempotent on webhook replay.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_email: { type: string, format: email }
      responses:
        "200":
          description: Checkout session created (or reused)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
                  reused: { type: boolean, description: "true when an existing open Stripe session was reused" }
        "400":
          description: Invalid request, allow_on_platform is false, or the seller hasn't completed Stripe Connect setup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not the issuer or recipient
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Not in `issued` status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/payment-requests/{id}/settle:
    post:
      tags: [pay]
      operationId: settlePaymentRequestManual
      summary: Record an off-platform manual settlement — issuer-only, only valid from `issued`
      description: |
        Sets `status` to `settled_manual` and `settlement_ref = { method:
        'manual', note, asserted_by, settled_at }`. Mints exactly ONE
        `payment_request.settled` attestation (`method: 'manual'`, signed
        by the issuer) and publishes `payment_request.settled`. On-platform
        settlement (`stripe`) transitions to `paid` (not `settled_manual`)
        instead — see `POST /api/payment-requests/{id}/checkout` (#2209).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [manual] }
                note: { type: string }
      responses:
        "200":
          description: payment_request settled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequest" }
        "400":
          description: Invalid method/note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not the issuer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Not in `issued` status, or a concurrent status change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/spec:
    get:
      tags: [pay]
      operationId: getSpec
      summary: Serve the OpenAPI spec YAML
      responses:
        "200":
          description: OpenAPI YAML
          content:
            text/yaml:
              schema: { type: string }
