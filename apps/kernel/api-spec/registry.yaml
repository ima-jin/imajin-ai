  /api/health:
    get:
      servers:
        - url: /
      tags: [registry]
      operationId: kernelHealth
      summary: Check kernel routes and active registered app destinations
      description: >-
        Registry entryUrl values must pass entry URL validation. Root-relative
        destinations resolve against the node URL; absolute HTTPS destinations
        retain their registered hosts. Revoked, missing and unsafe destinations
        are omitted. App environment URL overrides and inferred app subdomains
        are not used. Fetches do not follow redirects. Known registry app bases
        (origin root or /slug without query/fragment) are probed at their
        /api/health endpoint for migration reporting; custom deep links are
        probed as registered. The displayed url remains the app entry URL.
      responses:
        "503":
          description: Registry unavailable; no partial inventory is advertised as operational
          content:
            application/json:
              schema:
                type: object
                required: [status, error]
                properties:
                  status: { type: string, const: degraded }
                  error: { type: string, const: registry_unavailable }
        "200":
          description: Aggregate health, including kernel migrations and vault metadata
          content:
            application/json:
              schema:
                type: object
                required: [status, version, build, timestamp, services, migrations, vault]
                properties:
                  status: { type: string, enum: [operational, degraded] }
                  version: { type: string }
                  build: { type: string }
                  timestamp: { type: string, format: date-time }
                  migrations: { type: object }
                  vault: { type: object }
                  services:
                    type: array
                    items:
                      $ref: "#/components/schemas/KernelServiceCheck"
  /.well-known/apple-app-site-association:
    get:
      servers:
        - url: /
      tags: [registry]
      operationId: kernelAppleAssociation
      summary: Apple association discovery
      description: >-
        Lists the deduplicated node host and validated active registry entry
        hosts, not synthetic slug.node hosts. Registration does not install an
        app in anyone's navigation. The existing wildcard appID placeholders
        are retained; no native bundle identifiers are configured here.
      responses:
        "200":
          description: Association document (public cache max-age 86400)
          content:
            application/json:
              schema:
                type: object
                required: [webcredentials, applinks]
                properties:
                  webcredentials:
                    type: object
                    properties:
                      apps: { type: array, items: { type: string } }
                  applinks:
                    type: object
                    properties:
                      apps: { type: array, items: { type: string } }
                      details:
                        type: array
                        items:
                          type: object
                          properties:
                            appID: { type: string }
                            paths: { type: array, items: { type: string } }
                            components:
                              type: array
                              items:
                                type: object
                                properties:
                                  "/": { type: string }
                                  comment: { type: string }
  /.well-known/assetlinks.json:
    get:
      servers:
        - url: /
      tags: [registry]
      operationId: kernelAndroidAssociation
      summary: Android association discovery
      description: Lists deduplicated node and active registered entry origins; excludes revoked and unsafe entries.
      responses:
        "200":
          description: Association document (public cache max-age 86400)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [relation, target]
                  properties:
                    relation: { type: array, items: { type: string } }
                    target:
                      type: object
                      properties:
                        namespace: { type: string, const: web }
                        site: { type: string, format: uri }
