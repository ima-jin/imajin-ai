openapi: "3.1.0"
info:
  title: imajin registry
  version: "2.0.0"
  description: Node registration, heartbeat, build attestation, audience scopes, interests, preferences, and specs for the imajin.ai network. Runs as a kernel service at /{service}/api/... on a shared node domain.
servers:
  - url: https://{node}.imajin.ai/{service}
    description: production node
    variables:
      node:
        default: jin
      service:
        default: registry
  - url: http://localhost:3000/{service}
    description: local development

tags:
  - name: registry

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: imajin_session
    bearerAuth:
      type: http
      scheme: bearer
    attestation:
      type: http
      scheme: bearer
      description: "Ed25519-signed NodeAttestation or NodeHeartbeat payload. The payload itself carries the signature field; no separate HTTP auth header is used — the node's registered public key is used to verify the signature embedded in the request body."
    dfosAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        DFOS protocol proof (#2132): `Authorization: DFOS <proof>`, where
        `<proof>` is a DID-signed auth-token JWT (protocol 0.2.0) naming this
        relay's own DFOS DID as audience. Verified against the peer identity's
        current auth keys as already known to this relay. A cryptographically
        valid proof alone does not authorize a write — the peer DID must
        additionally hold a live `relay.peer` attestation issued by this node
        (dark-forest admission; see docs/relay-dfos-peer-admission.md). Checked
        before, and independently of, cookieAuth/bearerAuth — any other
        `Authorization` scheme (or none) falls through to those unchanged.
  schemas:
    KernelServiceCheck:
      type: object
      required: [name, label, kind, url, status, responseTime, statusCode]
      properties:
        name: { type: string, description: Kernel route name or registered slug (registry id when slugless). }
        label: { type: string }
        kind: { type: string, enum: [core, app], description: Server-derived grouping for health clients. }
        url: { type: string, format: uri }
        status: { type: string, enum: [up, down, degraded] }
        responseTime: { type: [number, "null"] }
        statusCode: { type: [integer, "null"] }
        error: { type: string }
        migrations: { type: object }
    ProfileWidget:
      type: [object, "null"]
      additionalProperties: false
      required: [path, label]
      description: >-
        Optional link-only profile contribution, also accepted in imajin.app.json.
        Path is root-relative on the validated registered entryUrl origin (node
        origin for a relative entryUrl). A registered slug is required so the
        profile owner can explicitly enable the app. No independent origin, HTML, scripts,
        or iframe content. Protocol-relative URLs, backslashes, encoded
        separators and controls are rejected. The link receives URL-encoded did
        and optional handle query parameters naming the profile owner.
        Active registration alone never enables the widget or installs an app.
        Rendering requires owner enabledApps (actor) or forest enabled_services
        (business/community/family); family visibility remains member-only.
      properties:
        path: { type: string, maxLength: 2048, pattern: "^/(?!/)", example: "/profile/studio" }
        label: { type: string, minLength: 1, maxLength: 80 }
        icon: { type: string, minLength: 1, maxLength: 32 }
    AppPresentation:
      type: object
      properties:
        entryUrl:
          type: [string, "null"]
          description: Validated root-relative path or HTTPS URL without credentials. Required when profileWidget is non-null.
        profileWidget: { $ref: "#/components/schemas/ProfileWidget" }
        icon: { type: [string, "null"], maxLength: 32 }
        placements:
          type: array
          default: []
          items: { type: string, enum: [launcher, home, auth-submenu] }
        requiredScope: { type: [string, "null"], enum: [actor, business, community, family, null] }
    AppVisibility:
      type: string
      enum: [public, unlisted, private, internal]
      default: public
      description: |
        Directory and adding policy, never public web access.
        public: listed; anyone can add.
        unlisted: hidden from directories; add by direct link or invite
        (/auth/app-directory?app=<slug>, backed by GET /auth/api/apps/<slug>
        and PUT /auth/api/apps/<slug>).
        private: owning identity and its members only; appears automatically
        on joining the identity and disappears on leaving it.
        internal: API-only; no tile and launcher returns 404.
        Public web pages are served regardless of this value.
    AppWrite:
      type: object
      properties:
        name: { type: string }
        description: { type: [string, "null"] }
        callbackUrl: { type: string, format: uri }
        homepageUrl: { type: [string, "null"], format: uri }
        logoUrl: { type: [string, "null"], format: uri }
        requestedScopes: { type: array, items: { type: string } }
        providesScopes: { type: array, items: { type: string } }
        visibility: { $ref: "#/components/schemas/AppVisibility" }
    App:
      allOf:
        - $ref: "#/components/schemas/AppWrite"
        - type: object
          required: [id, ownerDid, appDid, visibility]
          properties:
            id: { type: string }
            ownerDid: { type: string }
            appDid: { type: string }
            publicKey: { type: string }
            status: { type: string, enum: [active, revoked] }
            createdAt: { type: [string, "null"], format: date-time }
            updatedAt: { type: [string, "null"], format: date-time }
    Node:
      type: object
      properties:
        id: { type: string, description: "Node DID (did:imajin:...)" }
        hostname: { type: string }
        subdomain: { type: string, example: "jin.imajin.ai" }
        services: { type: array, items: { type: string } }
        capabilities: { type: array, items: { type: string } }
        status: { type: string, enum: [active, stale, unreachable, expired, revoked] }
        version: { type: string }
        lastHeartbeat: { type: string, format: date-time }
        registeredAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ApprovedBuild:
      type: object
      properties:
        version: { type: string }
        buildHash: { type: string }
        architecture: { type: string }
        releaseDate: { type: string, format: date-time }
        deprecated: { type: boolean }
    NodeAttestation:
      type: object
      required: [nodeId, publicKey, buildHash, hostname, signature, timestamp]
      properties:
        nodeId: { type: string }
        publicKey: { type: string, description: "Ed25519 public key (base64)" }
        buildHash: { type: string }
        hostname: { type: string }
        version: { type: string }
        sourceCommit: { type: string }
        services: { type: array, items: { type: string } }
        capabilities: { type: array, items: { type: string } }
        timestamp: { type: number }
        signature: { type: string }
    NodeHeartbeat:
      type: object
      required: [nodeId, timestamp, buildHash, version, signature]
      properties:
        nodeId: { type: string }
        timestamp: { type: number }
        buildHash: { type: string }
        version: { type: string }
        health: { type: object }
        signature: { type: string }
    NodeSelf:
      type: object
      required: [did, nodeOperatorDid, nodeFeeBps, buyerCreditBps]
      properties:
        did: { type: string, description: "This node's own DID (did:imajin:...)", example: "did:imajin:jin" }
        nodeOperatorDid: { type: [string, "null"], description: "DID of the human/entity operating this node, if configured" }
        nodeFeeBps: { type: [integer, "null"], description: "Node fee, in basis points, applied to .fair settlements on this node", example: 50 }
        buyerCreditBps: { type: [integer, "null"], description: "Buyer credit, in basis points, applied to .fair settlements on this node", example: 25 }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

paths:
  /api/registry/apps:
    # Unlike the service APIs below, app registration is rooted at /api.
    servers:
      - url: /
        description: Current node root (not /registry)
    get:
      tags: [registry]
      operationId: listRegistryApps
      summary: List discoverable active apps, or the acting owner's apps
      parameters:
        - name: owner
          in: query
          schema: { type: string, enum: [me] }
          description: Requires authentication; includes all apps owned by the acting identity.
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: App list filtered by directory visibility
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps: { type: array, items: { $ref: "#/components/schemas/App" } }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { description: Authentication required for owner=me }
    post:
      tags: [registry]
      operationId: registerApp
      summary: Register an app owned by the authenticated acting identity
      description: |
        Visibility defaults to public. Only the four documented values are
        accepted. Self-service registration is always third_party.
        dependsOn and emittableEvents are operator-only and rejected.
        A supplied Ed25519 publicKey keeps private key material client-side;
        otherwise the generated keypair is returned once and never stored.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AppWrite"
                - type: object
                  required: [name, callbackUrl]
                  properties:
                    publicKey: { type: string, description: Optional Ed25519 public key }
      responses:
        "201":
          description: Registered app, including visibility and optional one-time keypair
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/App"
                  - type: object
                    properties:
                      keypair:
                        type: object
                        properties:
                          publicKey: { type: string }
                          privateKey: { type: string }
        "400": { description: Invalid JSON, visibility, URL, key or declarations }
        "401": { description: Not authenticated }

  /api/registry/apps/{appId}:
    servers:
      - url: /
        description: Current node root (not /registry)
    parameters:
      - name: appId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [registry]
      operationId: getRegistryApp
      summary: Read an app by registration id
      responses:
        "200":
          description: App detail, including visibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "404": { description: App absent or its listing is not accessible to this identity }
    patch:
      tags: [registry]
      operationId: updateRegistryApp
      summary: Update an app (owner only, compared against the acting DID)
      description: |
        Omitted visibility is preserved; null and unknown values are rejected.
        Reversible metadata edits and narrowing may be executed by a delegate
        with an active grant. Widening visibility requires the owner's own
        countersign/session: internal -> private/unlisted/public,
        private -> unlisted/public, unlisted -> public.
        A delegate receives 403 AGENT_APPROVAL_REQUIRED and may propose but
        never execute widening. This never changes public web serving.
        providesScopes and provisioned requestedScopes may narrow, not exceed
        the previously approved scope ceiling. dependsOn and emittableEvents
        are operator-only and rejected.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppWrite" }
      responses:
        "200":
          description: Updated app including persisted visibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "400": { description: Invalid JSON, visibility or scope declaration }
        "401": { description: Not authenticated }
        "403": { description: Not the owner, or widening requires owner countersign (AGENT_APPROVAL_REQUIRED) }
        "404": { description: App not found }
        "409": { description: Owner or visibility changed concurrently; reload before saving }
    delete:
      tags: [registry]
      operationId: revokeRegistryApp
      summary: Soft revoke an owned app (owner countersign required)
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200": { description: App revoked }
        "401": { description: Not authenticated }
        "403": { description: Not the owner or delegate needs owner countersign }
        "404": { description: App not found }

  /api/admin/registry/apps:
    servers:
      - url: /
    get:
      operationId: adminListRegistryApps
      summary: List all registry apps including presentation declarations
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: "{apps} including entryUrl, slug, icon, placements, requiredScope and nullable profileWidget" }
        "401": { description: Admin session required }
    post:
      operationId: adminRegisterRegistryApp
      summary: Register an app and optional safe profile contribution
      description: >-
        Admin session required. Registry metadata only; never writes enabledApps,
        enabled_services, authorization grants, or featured. A widget does not
        require any nav placement. Provisioned apps accept the same optional
        profileWidget in imajin.app.json, snapshotted on the signed approval card.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AppPresentation"
                - type: object
                  required: [name, ownerDid, callbackUrl]
                  properties:
                    name: { type: string }
                    ownerDid: { type: string }
                    callbackUrl: { type: string, format: uri }
                    slug: { type: string, pattern: "^[a-z][a-z0-9-]{0,38}$" }
                    tier: { type: string, enum: [first_party, third_party], default: third_party }
                    description: { type: string }
                    homepageUrl: { type: string }
                    logoUrl: { type: string }
                    publicKey: { type: string }
                    requestedScopes: { type: array, items: { type: string } }
                    providesScopes: { type: array, items: { type: string } }
                    dependsOn: { type: array, items: { type: object } }
                    emittableEvents: { type: array, items: { type: string } }
                    allowedRedirectHosts: { type: array, items: { type: string } }
                    tokenAudiences: { type: array, items: { type: string } }
      responses:
        "201": { description: Registered app including presentation fields and one-time generated keypair when applicable }
        "400": { description: Invalid registration or unsafe widget declaration }
        "401": { description: Admin session required }
        "409": { description: Slug already registered }
  /api/admin/registry/apps/{appId}:
    servers:
      - url: /
    parameters:
      - { name: appId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: adminUpdateRegistryApp
      summary: Update app presentation or approved emittable events
      description: >-
        Partial presentation update preserves omitted fields. profileWidget:null
        removes the contribution. Validated and audited, without installation
        or grants. Do not mix presentation and emittableEvents in one request.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AppPresentation"
                - type: object
                  required: [emittableEvents]
                  properties:
                    emittableEvents: { type: array, items: { type: string } }
      responses:
        "200": { description: "{ok:true,app} with updated metadata" }
        "400": { description: Invalid declaration or mixed update }
        "401": { description: Admin session required }
        "404": { description: App not found }
  /registry/api/health:
    get:
      servers:
        - url: /
      tags: [registry]
      operationId: healthCheck
      summary: Service health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
                  timestamp: { type: string, format: date-time }

  /api/spec:
    get:
      tags: [registry]
      operationId: getSpec
      summary: Serve OpenAPI spec (YAML)
      responses:
        "200":
          description: OpenAPI YAML spec
          content:
            text/yaml:
              schema: { type: string }

  /api/specs:
    get:
      tags: [registry]
      operationId: listServices
      summary: List all registered imajin services with their spec URLs
      responses:
        "200":
          description: Service list
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }
                        icon: { type: string }
                        label: { type: string }
                        visibility: { $ref: "#/components/schemas/AppVisibility" }
                        category: { type: string }
                        url: { type: string }
                        spec: { type: string }

  /api/specs/{service}:
    get:
      tags: [registry]
      operationId: getServiceSpec
      summary: Proxy and return the OpenAPI spec for a named service
      parameters:
        - name: service
          in: path
          required: true
          schema: { type: string }
          description: "Service name (e.g. profile, events, auth)"
      responses:
        "200":
          description: Service spec (YAML or JSON as returned by service)
          content:
            text/yaml:
              schema: { type: string }
        "404":
          description: Unknown service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Could not reach service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/builds/verify:
    get:
      tags: [registry]
      operationId: listApprovedBuilds
      summary: List all approved builds
      parameters:
        - name: version
          in: query
          schema: { type: string }
        - name: deprecated
          in: query
          schema: { type: boolean }
          description: "Include deprecated builds (default: false)"
      responses:
        "200":
          description: Approved builds list
          content:
            application/json:
              schema:
                type: object
                properties:
                  builds:
                    type: array
                    items: { $ref: "#/components/schemas/ApprovedBuild" }
    post:
      tags: [registry]
      operationId: verifyBuild
      summary: Check if a build hash is approved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buildHash]
              properties:
                buildHash: { type: string }
                version: { type: string }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  source: { type: string, enum: [official, fork, unknown] }
                  version: { type: string }
                  architecture: { type: string }
                  releaseDate: { type: string, format: date-time }
                  deprecated: { type: boolean }
                  error: { type: string }
        "400":
          description: Missing buildHash
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/node/self:
    get:
      tags: [registry]
      operationId: getNodeSelf
      summary: >-
        Public lookup for this node's own DID and minimal public config.
        Single source of truth for the node DID lookup previously
        re-implemented via raw `relay.relay_config` SQL in coffee, learn,
        events, and market (#2000).
      responses:
        "200":
          description: Node self metadata
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=30" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeSelf" }
              example:
                did: "did:imajin:jin"
                nodeOperatorDid: "did:imajin:operator"
                nodeFeeBps: 50
                buyerCreditBps: 25
        "503":
          description: Node identity not configured yet (relay_config singleton row missing and no RELAY_DID fallback)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/node/register:
    post:
      tags: [registry]
      operationId: registerNode
      summary: Register a new node — verifies Ed25519 attestation and provisions subdomain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attestation]
              properties:
                attestation: { $ref: "#/components/schemas/NodeAttestation" }
                chainLog:
                  type: array
                  items: { type: string }
                  description: "Optional chain verification log"
      responses:
        "201":
          description: Node registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [verified] }
                  subdomain: { type: string, example: "jin.imajin.ai" }
                  expiresAt: { type: number }
                  chainVerified: { type: boolean }
        "200":
          description: Node renewed (existing node)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [verified] }
                  subdomain: { type: string }
                  expiresAt: { type: number }
                  renewed: { type: boolean }
                  chainVerified: { type: boolean }
        "400":
          description: Invalid attestation structure or hostname format
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [rejected] }
                  error: { type: string }
                  hint: { type: string }
        "401":
          description: Invalid signature
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [rejected] }
                  error: { type: string }
        "403":
          description: Unknown or deprecated build hash
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [rejected] }
                  error: { type: string }
                  hint: { type: string }
        "409":
          description: Hostname taken or in grace period
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [rejected] }
                  error: { type: string }

  /api/node/heartbeat:
    post:
      tags: [registry]
      operationId: nodeHeartbeat
      summary: Node liveness ping — verifies Ed25519 signature against registered public key
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeHeartbeat" }
      responses:
        "200":
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ack: { type: boolean }
                  nextHeartbeat: { type: number, description: "Unix ms timestamp for next expected heartbeat" }
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [renew, reattest, upgrade] }
                        reason: { type: string }
                        expiresIn: { type: number }
                        targetVersion: { type: string }
        "400":
          description: Missing required fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Node expired or revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Node not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/node/list:
    get:
      tags: [registry]
      operationId: listNodes
      summary: List registered nodes
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, stale, all], default: active }
        - name: service
          in: query
          schema: { type: string }
          description: "Filter by service capability"
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Node list
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/Node" }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
    head:
      tags: [registry]
      operationId: nodeStats
      summary: Network statistics in response headers
      responses:
        "200":
          description: Stats in headers
          headers:
            X-Total-Nodes:
              schema: { type: integer }
            X-Active-Nodes:
              schema: { type: integer }
            X-Stale-Nodes:
              schema: { type: integer }
            X-Unreachable-Nodes:
              schema: { type: integer }

  /api/node/lookup/{id}:
    get:
      tags: [registry]
      operationId: lookupNode
      summary: Look up a node by DID or hostname
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: "Node DID (did:imajin:...), hostname (jin), or full subdomain (jin.imajin.ai)"
      responses:
        "200":
          description: Node found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "404":
          description: Node not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/node/resolve/{did}:
    get:
      tags: [registry]
      operationId: resolveNodeByDid
      summary: Resolve any DID (node DID or chain DID) to a node endpoint
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
          description: "did:imajin:... (node DID) or did:dfos:... (chain DID)"
      responses:
        "200":
          description: Node resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  node:
                    type: object
                    properties:
                      hostname: { type: string }
                      subdomain: { type: string }
                      status: { type: string }
                      services: { type: array, items: { type: string } }
        "400":
          description: DID is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No node found for this DID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /relay/{path}:
    get:
      tags: [registry]
      operationId: relayGet
      summary: DFOS web relay — catch-all GET handler
      description: |
        Reads are open — no authentication required, so the proof log stays
        publicly verifiable.
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
          description: "Relay sub-path (catch-all)"
      responses:
        "200":
          description: Relay response
    post:
      tags: [registry]
      operationId: relayPost
      summary: DFOS web relay — catch-all POST handler
      description: |
        Writes require either a verified Imajin DID (#454) or an attested
        DFOS peer proof (#2132, dfosAuth). The effective DID is forwarded to
        the relay as `x-imajin-relay-writer` for audit; any client-supplied
        value for that header is discarded.
      security:
        - cookieAuth: []
        - bearerAuth: []
        - dfosAuth: []
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
          description: "Relay sub-path (catch-all)"
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Relay response
        "401":
          description: Not authenticated, or an invalid/expired/replayed DFOS proof — relay writes require a verified DID or a valid DFOS proof
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not authorized to act as the delegated identity, or a valid DFOS proof from a DID with no live `relay.peer` attestation (`peer_not_attested`, #2132)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Auth service unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [registry]
      operationId: relayPut
      summary: DFOS web relay — catch-all PUT handler
      description: |
        Writes require either a verified Imajin DID (#454) or an attested
        DFOS peer proof (#2132, dfosAuth). The effective DID is forwarded to
        the relay as `x-imajin-relay-writer` for audit; any client-supplied
        value for that header is discarded.
      security:
        - cookieAuth: []
        - bearerAuth: []
        - dfosAuth: []
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
          description: "Relay sub-path (catch-all)"
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Relay response
        "401":
          description: Not authenticated, or an invalid/expired/replayed DFOS proof — relay writes require a verified DID or a valid DFOS proof
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not authorized to act as the delegated identity, or a valid DFOS proof from a DID with no live `relay.peer` attestation (`peer_not_attested`, #2132)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Auth service unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

