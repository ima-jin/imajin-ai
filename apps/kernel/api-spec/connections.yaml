  /api/pods/{id}/resolve:
    get:
      tags: [connections]
      operationId: resolvePodMembers
      summary: Resolve full recursive member set via trust graph
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resolved members
          content:
            application/json:
              schema:
                type: object
                properties:
                  podId: { type: string }
                  members: { type: array, items: { type: string } }

  /api/trust/distance:
    get:
      tags: [connections]
      operationId: getTrustDistance
      summary: Get trust distance between two DIDs (internal — requires Bearer TRUST_INTERNAL_API_KEY)
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Trust distance result
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string }
                  to: { type: string }
                  distance: { type: integer, description: "-1 if not connected" }
                  connected: { type: boolean }
        "400":
          description: Missing from or to params
        "401":
          description: Unauthorized

  /api/nicknames/resolve:
    get:
      tags: [connections]
      operationId: resolveNickname
      summary: Resolve a DID to its nickname (as set by the current user)
      security:
        - cookieAuth: []
      parameters:
        - name: did
          in: query
          required: true
          schema: { type: string }
          description: DID to resolve nickname for
      responses:
        "200":
          description: Nickname resolution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  nickname: { type: string, nullable: true }
        "400":
          description: Missing did param

  /api/auth/session:
    get:
      tags: [connections]
      operationId: getAuthSession
      summary: Proxy to auth service session
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Session data
        "401":
          description: Not authenticated

  /api/auth/logout:
    post:
      tags: [connections]
      operationId: authLogout
      summary: Proxy logout to auth service — forwards Set-Cookie header to clear session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
