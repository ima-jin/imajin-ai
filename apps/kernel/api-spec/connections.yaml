      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [decline] }
      responses:
        "200":
          description: Declined, no connection created; returns ok=true
        "403":
          description: Not the recipient
        "410":
          description: No longer pending
    get:
      tags: [connections]
      operationId: getConnectionInvite
      summary: Get invite by code (public, CORS-enabled — for preview before accepting)
      description: Email/link previews remain public; direct previews require connections:read authentication as the sender or recipient.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invite details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  code: { type: string }
                  fromDid: { type: string }
                  fromHandle: { type: string, nullable: true }
                  note: { type: string, nullable: true }
                  used: { type: boolean }
                  createdAt: { type: string, format: date-time }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [connections]
      operationId: deleteConnectionInvite
      summary: Revoke (soft-delete) an invite — only the creator can revoke; email invite clears cooldown
      description: Direct requests use connections:write and act-as, serialize against acceptance, and can only be cancelled by their sender while pending.
      security:
        - cookieAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          description: Cannot revoke non-pending invite
        "403":
          description: Not authorized

  /api/invites/{code}/accept:
    post:
      tags: [connections]
      operationId: acceptConnectionInvite
      summary: Accept an invite — creates a 2-person personal pod; emits connection.accepted and vouch attestations
      description: >-
        Direct requests require connections:write authentication as the named
        recipient (including act-as); a leaked code grants no authority.
        Pod, pair connection, pending-to-accepted transition and signed
        connection.accepted evidence commit together. No membership authority
        is granted. Repeat/declined/cancelled direct requests return 410.
      security:
        - cookieAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Connected — 2-person pod created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  pod:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
        "400":
          description: Cannot accept own invite
        "403":
          description: Email invite is not for this user
        "404":
          description: Invite not found
        "410":
          description: Invite expired, already used, or revoked

