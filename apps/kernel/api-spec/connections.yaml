openapi: "3.1.0"
info:
  title: imajin connections
  version: "2.0.0"
  description: Pod-based social graph — connections, invite codes, trust graph, group pods, nickname management. Runs as a kernel service at /{service}/api/... on a shared node domain.
servers:
  - url: https://{node}.imajin.ai/{service}
    description: production node
    variables:
      node:
        default: jin
      service:
        default: connections
  - url: http://localhost:3000/{service}
    description: local development

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: imajin_session
    bearerAuth:
      type: http
      scheme: bearer
    appServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: app-service+jwt
      description: >-
        Existing POST /auth/api/apps/token/service credential. Requires
        connections:read in the token and current operator-approved service
        scopes of an active registry app. Not a session or delegated app token.
  schemas:
    ConnectorConnection:
      type: object
      required: [slot, label, accountEmail, connected]
      properties:
        slot: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$" }
        label: { type: string, description: "Editable display label; selectors use the stable slot identifier." }
        accountEmail: { type: [string, "null"], description: "Connected account identity, when supplied by the provider." }
        connected: { type: boolean }
        configured: { type: boolean }
        scopes: { type: array, items: { type: string } }
    Pod:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        ownerDid: { type: string }
        type: { type: string, enum: [personal, shared, event] }
        visibility: { type: string, enum: [public, private] }
        avatar: { type: string, nullable: true }
        conversationDid: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PodMember:
      type: object
      properties:
        podId: { type: string }
        did: { type: string }
        role: { type: string, enum: [owner, member] }
        addedBy: { type: string }
        joinedAt: { type: string, format: date-time }
        removedAt: { type: string, format: date-time, nullable: true }
        handle: { type: string, nullable: true }
        name: { type: string, nullable: true }
    Invite:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        fromDid: { type: string }
        fromHandle: { type: string, nullable: true }
        toEmail: { type: string, nullable: true }
        toDid: { type: string, nullable: true }
        note: { type: string, nullable: true }
        delivery: { type: string, enum: [link, email] }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        maxUses: { type: integer }
        usedCount: { type: integer }
        expiresAt: { type: string, format: date-time, nullable: true }
        acceptedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        reasonContextId: { type: string, nullable: true, description: "Opaque reference to why this invite exists, e.g. a pay.payment_request id (#2210)" }
        reasonContextType: { type: string, nullable: true }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

tags:
  - name: connections
    description: imajin connections service

paths:
  /api/apps/pods:
    get:
      tags: [connections]
      operationId: listAppMemberPodIds
      summary: List active direct member pod IDs by DID within the app's owner grants
      description: >-
        Requires a live app-authorization channel_links grant of connections:read
        from each pod owner to this exact app (channel=app, status=active,
        revokedAt=null). The existing OAuth consent flow creates this grant.
        Registration, operator approval, an ownerDid/appDid query parameter,
        X-Acting-For, or a forwarded cookie alone never grants access.
        Only entitled pods are returned, of any type; no recursive membership,
        removed membership, names, or unrelated owners' pods. No matches returns
        an empty list. Responses are Cache-Control: no-store.
      security:
        - appServiceAuth: []
      parameters:
        - name: did
          in: query
          required: true
          schema: { type: string, pattern: "^did:", maxLength: 2048 }
          description: Target member DID, not an impersonated owner
      responses:
        "200":
          description: Active direct memberships visible to this app, ordered by pod ID
          content:
            application/json:
              schema:
                type: object
                required: [podIds]
                properties:
                  podIds: { type: array, items: { type: string } }
        "400":
          description: Missing or invalid DID
        "401":
          description: Missing, invalid, expired, or wrong-type/audience app-service credential
        "403":
          description: Missing scope, inactive/unregistered app, or revoked operator approval
        "503":
          description: Membership or authorization store unavailable (fails closed)
  /api/apps/pods/{id}/members:
    get:
      tags: [connections]
      operationId: listAppPodMembers
      summary: Read active direct pod members with the pod owner's grant to this app
      description: >-
        Same service credential and live owner-grant gates as GET /api/apps/pods.
        Missing pods and pods without the owner's active connections:read grant
        to this exact app both return 404; registration or sharing an app owner
        never substitutes for the grant. Empty entitled pods return members=[].
        All active direct roles are returned (including owner and cohost);
        callers enforce their own organizer-role policy. Removed members are
        excluded. No pod metadata or addedBy is disclosed. Cache-Control: no-store.
      security:
        - appServiceAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Minimal active direct membership records
          content:
            application/json:
              schema:
                type: object
                required: [podId, members]
                properties:
                  podId: { type: string }
                  members:
                    type: array
                    items:
                      type: object
                      required: [podId, did, role, joinedAt]
                      properties:
                        podId: { type: string }
                        did: { type: string }
                        role: { type: string, examples: [owner, cohost, member] }
                        joinedAt: { type: string, format: date-time }
        "401":
          description: Missing, invalid, expired, or wrong-type/audience app-service credential
        "403":
          description: Missing scope, inactive/unregistered app, or revoked operator approval
        "404":
          description: Pod not found or not entitled
        "503":
          description: Membership or authorization store unavailable (fails closed)
  /api/connectors/{id}/connections:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, examples: [google, github, quickbooks] }
    get:
      tags: [connections]
      operationId: listConnectorConnections
      summary: List the authenticated owner's labelled connector connections
      description: >-
        Returns non-secret metadata only. Existing unsuffixed credentials resolve
        as primary without re-sealing. Disconnected slots may remain available
        for reconnecting. Labels are not unique identifiers: ambiguous label
        selectors fail with an error listing matching slots.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Connections for this connector and owner
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items: { $ref: "#/components/schemas/ConnectorConnection" }
        "401":
          description: Not authenticated
        "404":
          description: Unknown connector
    post:
      tags: [connections]
      operationId: createConnectorConnection
      summary: Create a named connection slot before configuring or authorizing it
      description: >-
        Creating a slot grants no capabilities and copies no primary tokens,
        credentials or grants. App-owned OAuth configuration may be shared;
        BYO configuration remains per-slot.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot]
              properties:
                slot: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$" }
                label: { type: string, maxLength: 80 }
      responses:
        "201":
          description: Connection slot created
        "400":
          description: Invalid slot or label
        "401":
          description: Not authenticated
        "409":
          description: Slot already exists
    patch:
      tags: [connections]
      operationId: renameConnectorConnection
      summary: Update a connection's display label without changing its stable slot
      security:
        - cookieAuth: []
      parameters:
        - name: slot
          in: query
          required: false
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$", default: primary }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: Label updated
        "400":
          description: Invalid slot or label
        "401":
          description: Not authenticated
        "404":
          description: Connection not found
  /api/health:
    get:
      tags: [connections]
      operationId: connectionsHealthCheck
      summary: Service health check
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
                  timestamp: { type: string, format: date-time }

  /api/connections:
    get:
      tags: [connections]
      operationId: listConnections
      summary: List 2-person connection pods for authenticated user — resolves handles from auth service
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Connections list
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      type: object
                      properties:
                        did: { type: string }
                        podId: { type: string }
                        joinedAt: { type: string, format: date-time }
                        podName: { type: string }
                        handle: { type: string, nullable: true }
                        name: { type: string, nullable: true }

  /api/connections/{podId}:
    delete:
      tags: [connections]
      operationId: disconnect
      summary: Disconnect from a 2-person connection pod — removes user from pod; deletes pod if empty
      security:
        - cookieAuth: []
      parameters:
        - name: podId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  disconnected: { type: boolean }
        "404":
          description: Not a member of this connection

  /api/connections/{did}/nickname:
    get:
      tags: [connections]
      operationId: getConnectionNickname
      summary: Get the nickname set for a connection (by DID)
      security:
        - cookieAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
          description: DID of the connected person
      responses:
        "200":
          description: Nickname
          content:
            application/json:
              schema:
                type: object
                properties:
                  did: { type: string }
                  nickname: { type: string, nullable: true }
        "404":
          description: Not found
    put:
      tags: [connections]
      operationId: setConnectionNickname
      summary: Set or update the nickname for a connection
      security:
        - cookieAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string }
      responses:
        "200":
          description: Nickname updated
    delete:
      tags: [connections]
      operationId: deleteConnectionNickname
      summary: Remove the nickname for a connection
      security:
        - cookieAuth: []
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Nickname removed

  /api/connections/status/{did}:
    get:
      tags: [connections]
      operationId: checkGraphMembership
      summary: Check if a DID is in the trust graph — inGraph = has at least one accepted 2-person connection
      parameters:
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Graph membership status
          content:
            application/json:
              schema:
                type: object
                properties:
                  inGraph: { type: boolean }
                  connectionCount: { type: integer }

  /api/invites:
    get:
      tags: [connections]
      operationId: listConnectionInvites
      summary: List all invites sent by authenticated user — includes quota info per role
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Invites list with quota
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items: { $ref: "#/components/schemas/Invite" }
                  role: { type: string }
                  limit: { type: integer, nullable: true }
                  pending: { type: integer }
                  remaining: { type: integer, nullable: true }
    post:
      tags: [connections]
      operationId: createConnectionInvite
      summary: Create a connection invite — link or email delivery; email requires hard DID + trust graph; 7-day cooldown
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delivery:
                  type: string
                  enum: [link, email]
                  default: link
                toEmail:
                  type: string
                  format: email
                  description: "Required when delivery=email"
                note: { type: string }
                maxUses: { type: integer, default: 1 }
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite: { $ref: "#/components/schemas/Invite" }
                  url: { type: string }
                  remaining: { type: integer, nullable: true }
        "403":
          description: Not in trust graph or not hard DID (email delivery)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Cooldown active, pending invite exists, or invite limit reached
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  nextAvailableAt: { type: string, format: date-time }
                  limit: { type: integer }
                  pending: { type: integer }

  /api/invites/invited-by:
    get:
      tags: [connections]
      operationId: getInvitedBy
      summary: Get who invited the current user — null for founding members
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Inviter info or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitedBy:
                    nullable: true
                    type: object
                    properties:
                      did: { type: string }
                      handle: { type: string, nullable: true }
                      name: { type: string, nullable: true }
                      avatar: { type: string, nullable: true }
                      date: { type: string, format: date-time, nullable: true }

  /api/invites/{code}:
    get:
      tags: [connections]
      operationId: getConnectionInvite
      summary: Get invite by code (public, CORS-enabled — for preview before accepting)
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invite details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  code: { type: string }
                  fromDid: { type: string }
                  fromHandle: { type: string, nullable: true }
                  note: { type: string, nullable: true }
                  used: { type: boolean }
                  createdAt: { type: string, format: date-time }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [connections]
      operationId: deleteConnectionInvite
      summary: Revoke (soft-delete) an invite — only the creator can revoke; email invite clears cooldown
      security:
        - cookieAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          description: Cannot revoke non-pending invite
        "403":
          description: Not authorized

  /api/invites/{code}/accept:
    post:
      tags: [connections]
      operationId: acceptConnectionInvite
      summary: Accept an invite — creates a 2-person personal pod; emits connection.accepted and vouch attestations
      security:
        - cookieAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Connected — 2-person pod created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  pod:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
        "400":
          description: Cannot accept own invite
        "403":
          description: Email invite is not for this user
        "404":
          description: Invite not found
        "410":
          description: Invite expired, already used, or revoked

  /api/groups:
    get:
      tags: [connections]
      operationId: listGroups
      summary: List non-personal (shared/event) pods the user is a member of — includes member counts
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Groups list
          content:
            application/json:
              schema:
                type: object
                properties:
                  pods:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Pod"
                        - type: object
                          properties:
                            memberCount: { type: integer }
    post:
      tags: [connections]
      operationId: createGroup
      summary: Create a shared group pod — creator becomes owner; optionally add initial members
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                conversationDid: { type: string }
                memberDids:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: Group pod created
          content:
            application/json:
              schema:
                type: object
                properties:
                  pod:
                    allOf:
                      - $ref: "#/components/schemas/Pod"
                      - type: object
                        properties:
                          memberCount: { type: integer }
        "400":
          description: Name is required

  /api/groups/{id}:
    get:
      tags: [connections]
      operationId: getGroup
      summary: Get a group pod with members (requester must be a member) — resolves member profiles
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pod with members
          content:
            application/json:
              schema:
                type: object
                properties:
                  pod:
                    allOf:
                      - $ref: "#/components/schemas/Pod"
                      - type: object
                        properties:
                          memberCount: { type: integer }
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/PodMember" }
        "403":
          description: Not a member
        "404":
          description: Pod not found
    patch:
      tags: [connections]
      operationId: updateGroup
      summary: Update group pod — conversationDid update requires only membership (first-write wins); all other updates require ownership
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                conversationDid: { type: string }
      responses:
        "200":
          description: Pod updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  pod: { $ref: "#/components/schemas/Pod" }
        "404":
          description: Pod not found or unauthorized
    delete:
      tags: [connections]
      operationId: deleteGroup
      summary: Delete a group pod (owner only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "404":
          description: Pod not found or unauthorized

  /api/groups/{id}/members:
    post:
      tags: [connections]
      operationId: addGroupMember
      summary: Add a member to a group pod (owner only) — emits pod.member.added attestation if chain-verified
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [did]
              properties:
                did: { type: string }
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { $ref: "#/components/schemas/PodMember" }
        "403":
          description: Only the owner can add members
        "409":
          description: Already a member
    patch:
      tags: [connections]
      operationId: updateGroupMemberRole
      summary: Change a member's role (owner only) — emits pod.role.changed attestation
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [did, role]
              properties:
                did: { type: string }
                role: { type: string }
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { $ref: "#/components/schemas/PodMember" }
        "403":
          description: Only the owner can change roles
        "404":
          description: Member not found
    delete:
      tags: [connections]
      operationId: removeGroupMember
      summary: Remove a member from a group pod (owner only) — emits pod.member.removed attestation
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [did]
              properties:
                did: { type: string }
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: boolean }
        "400":
          description: Cannot remove yourself as owner
        "403":
          description: Only the owner can remove members
        "404":
          description: Member not found

  /api/pods:
    get:
      tags: [connections]
      operationId: listPods
      summary: List all pods for authenticated user (all types)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Pods list
          content:
            application/json:
              schema:
                type: object
                properties:
                  pods:
                    type: array
                    items: { $ref: "#/components/schemas/Pod" }
    post:
      tags: [connections]
      operationId: createPod
      summary: Create a pod — requires trust graph membership
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                avatar: { type: string }
                type: { type: string, enum: [personal, shared, event], default: personal }
                visibility: { type: string, enum: [public, private], default: private }
      responses:
        "201":
          description: Pod created
          content:
            application/json:
              schema:
                type: object
                properties:
                  pod: { $ref: "#/components/schemas/Pod" }

  /api/pods/{id}:
    get:
      tags: [connections]
      operationId: getPod
      summary: Get pod by ID with current members
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pod with members
          content:
            application/json:
              schema:
                type: object
                properties:
                  pod: { $ref: "#/components/schemas/Pod" }
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/PodMember" }
        "404":
          description: Pod not found
    patch:
      tags: [connections]
      operationId: updatePod
      summary: Update pod (owner only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                avatar: { type: string }
                visibility: { type: string, enum: [public, private] }
      responses:
        "200":
          description: Pod updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  pod: { $ref: "#/components/schemas/Pod" }
        "404":
          description: Pod not found or unauthorized
    delete:
      tags: [connections]
      operationId: deletePod
      summary: Delete pod (owner only)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "404":
          description: Pod not found or unauthorized

  /api/pods/{id}/members:
    post:
      tags: [connections]
      operationId: addPodMember
      summary: Add a member to a pod (owner only, chain verification required) — emits pod.member.added attestation
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [did]
              properties:
                did: { type: string }
                role: { type: string, default: member }
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { $ref: "#/components/schemas/PodMember" }
        "403":
          description: Only the owner can add members
    patch:
      tags: [connections]
      operationId: updatePodMemberRole
      summary: Change a pod member's role (owner only, chain verification required)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [did, role]
              properties:
                did: { type: string }
                role: { type: string }
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { $ref: "#/components/schemas/PodMember" }
        "403":
          description: Only the owner can change roles
        "404":
          description: Member not found
    delete:
      tags: [connections]
      operationId: removePodMember
      summary: Remove a member from a pod (owner only, chain verification required)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [did]
              properties:
                did: { type: string }
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: boolean }
        "403":
          description: Only the owner can remove members
        "404":
          description: Member not found

  /api/pods/{id}/links:
    post:
      tags: [connections]
      operationId: linkPod
      summary: Link a child pod to this pod
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [childPodId]
              properties:
                childPodId: { type: string }
      responses:
        "201":
          description: Pod linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  link: { type: object }
    delete:
      tags: [connections]
      operationId: unlinkPod
      summary: Unlink a child pod (soft delete)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [childPodId]
              properties:
                childPodId: { type: string }
      responses:
        "200":
          description: Pod unlinked
          content:
            application/json:
              schema:
                type: object
                properties:
                  unlinked: { type: boolean }
