  /api/invites:
    get:
      tags: [connections]
      operationId: listConnectionInvites
      summary: List all invites sent by authenticated user — includes quota info per role
      description: >-
        Uses connections:read and the effective act-as DID. direction=incoming
        returns only direct pending requests addressed to that DID, including
        fromDid/fromHandle/fromName/toDid/toHandle and no email fields.
        Default outgoing retains existing invites and quotas, with effectiveDid
        and effectiveName; direct targets are public before acceptance, but
        pending email targets remain masked.
      parameters:
        - name: direction
          in: query
          schema: { type: string, enum: [outgoing, incoming], default: outgoing }
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Invites list with quota
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items: { $ref: "#/components/schemas/Invite" }
                  role: { type: string }
                  tier: { type: string }
                  effectiveDid: { type: string }
                  effectiveName: { type: string }
                  limit: { type: integer, nullable: true }
                  pending: { type: integer }
                  remaining: { type: integer, nullable: true }
    post:
      tags: [connections]
      operationId: createConnectionInvite
      summary: Create a connection invite — link or email delivery; email requires hard DID + trust graph; 7-day cooldown
      description: >-
        Supply exactly one of toDid or handle (optional leading @, exact
        case-insensitive match) to request an existing non-soft active identity.
        This creates delivery=direct, maxUses=1 without creating a connection.
        connections:write honors act-as. Missing targets return 404, self returns
        400, already connected or pending in either direction returns 409.
        Request and acceptance persist node-signed connection.invited and
        connection.accepted events atomically with state; signing failure is 503
        and rolls back. Direct responses contain public DID/name/handle, no email.
        Direct creation is limited to 20 requests per minute for both the
        authenticated actor and effective DID; 429 includes Retry-After.
        After commit, connection.requested routes through the generic notify
        reactor at scope connection:request-received for in-app and optional
        email delivery. It carries only public requester/act-as actor identity,
        invite references, note and an absolute /connections#incoming-requests
        link; no email address or delivery result is returned to the sender.
        Verified email credentials and notification preferences govern email;
        at most one successful email per sender/recipient pair in 24 hours.
        Delivery failure never rolls back a saved request or changes its 201.
        This delivery event creates no additional connection.invited attestation
        and grants no membership authority. Link and email invites are unchanged.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delivery:
                  type: string
                  enum: [link, email, direct]
                  default: link
                toDid:
                  type: string
                  description: Existing target DID, mutually exclusive with handle and email delivery
                handle:
                  type: string
                  description: Exact existing handle, optional leading @, case insensitive
                toEmail:
                  type: string
                  format: email
                  description: "Required when delivery=email"
                note: { type: string }
                maxUses: { type: integer, default: 1 }
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite: { $ref: "#/components/schemas/Invite" }
                  url: { type: string }
                  remaining: { type: integer, nullable: true }
        "403":
          description: Not in trust graph or not hard DID (email delivery)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Cooldown active, pending invite exists, or invite limit reached
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  nextAvailableAt: { type: string, format: date-time }
                  limit: { type: integer }
                  pending: { type: integer }

  /api/invites/invited-by:
