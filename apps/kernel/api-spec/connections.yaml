openapi: "3.1.0"
info:
  title: imajin connections
  version: "2.0.0"
  description: Pod-based social graph — connections, invite codes, trust graph, group pods, nickname management. Runs as a kernel service at /{service}/api/... on a shared node domain.
servers:
  - url: https://{node}.imajin.ai/{service}
    description: production node
    variables:
      node:
        default: jin
      service:
        default: connections
  - url: http://localhost:3000/{service}
    description: local development

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: imajin_session
    bearerAuth:
      type: http
      scheme: bearer
    appServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: app-service+jwt
      description: >-
        Existing POST /auth/api/apps/token/service credential. Requires
        the operation's documented scope in the token and current operator-approved
        service scopes of an active registry app. Not a session or delegated app token.
  schemas:
    AppUpstream:
      type: object
      additionalProperties: false
      required: [id, origin, paths]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{0,63}$' }
        origin: { type: string, description: "Exact HTTPS origin only, without userinfo." }
        credentialHeader: { type: string, enum: [Authorization, X-API-Key], default: Authorization }
        credentialPrefix: { type: string, enum: ["Bearer ", ""], default: "Bearer " }
        paths:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [path, methods]
            properties:
              path: { type: string, maxLength: 1024, description: "Exact canonical path; no query, fragment, escapes, traversal or double slashes." }
              methods:
                type: array
                minItems: 1
                maxItems: 7
                items: { type: string, enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS] }
    AppUpstreamSelector:
      type: object
      additionalProperties: false
      required: [appDid, upstreamId]
      properties:
        appDid: { type: string }
        upstreamId: { type: string, pattern: '^[a-z][a-z0-9-]{0,63}$' }
    AppUpstreamConnection:
      type: object
      additionalProperties: false
      required: [provider, connected, orgContextDid, permissions]
      properties:
        provider: { type: string }
        connected: { type: boolean }
        orgContextDid: { type: [string, "null"] }
        permissions:
          type: array
          uniqueItems: true
          items: { type: string, example: "GET /me" }
          description: >-
            Sorted plain-text METHOD /path list for the current declaration, shown
            to the member at this API-only connect step. When connected=false this
            is a review list, not evidence that the member approved the changed list.
    ConnectorConnection:
      type: object
      required: [slot, label, accountEmail, connected]
      properties:
        slot: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$" }
        label: { type: string, description: "Editable display label; selectors use the stable slot identifier." }
        accountEmail: { type: [string, "null"], description: "Connected account identity, when supplied by the provider." }
        connected: { type: boolean }
        configured: { type: boolean }
        scopes: { type: array, items: { type: string } }
    Pod:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        ownerDid: { type: string }
        type: { type: string, enum: [personal, shared, event] }
        visibility: { type: string, enum: [public, private] }
        avatar: { type: string, nullable: true }
        conversationDid: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PodMember:
      type: object
      properties:
        podId: { type: string }
        did: { type: string }
        role: { type: string, enum: [owner, member] }
        addedBy: { type: string }
        joinedAt: { type: string, format: date-time }
        removedAt: { type: string, format: date-time, nullable: true }
        handle: { type: string, nullable: true }
        name: { type: string, nullable: true }
    Invite:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        fromDid: { type: string }
        fromHandle: { type: string, nullable: true }
        toEmail: { type: string, nullable: true }
        toDid: { type: string, nullable: true }
        note: { type: string, nullable: true }
        delivery: { type: string, enum: [link, email, direct] }
        status: { type: string, enum: [pending, accepted, declined, revoked, expired] }
        fromName: { type: string, nullable: true }
        toHandle: { type: string, nullable: true }
        toName: { type: string, nullable: true }
        maxUses: { type: integer }
        usedCount: { type: integer }
        expiresAt: { type: string, format: date-time, nullable: true }
        acceptedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        reasonContextId: { type: string, nullable: true, description: "Opaque reference to why this invite exists, e.g. a pay.payment_request id (#2210)" }
        reasonContextType: { type: string, nullable: true }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

tags:
  - name: connections
    description: imajin connections service

paths:
  /api/upstreams:
    get:
      tags: [connections]
      operationId: getAppUpstreamDeclaration
      summary: Review an app's destination before connecting a personal credential
      security:
        - cookieAuth: []
      parameters:
        - { name: appDid, in: query, required: true, schema: { type: string } }
        - { name: upstreamId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Non-secret declaration; personal human session only, no-store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUpstream" }
        "400": { description: Invalid selector }
        "401": { description: Personal session required }
        "403": { description: App inactive, not operator-approved, or upstream absent }
        "503": { description: Store unavailable }
    put:
      tags: [connections]
      operationId: declareAppUpstreams
      summary: Replace the authenticated registered app's upstream declarations
      description: >-
        App-service+jwt with connectors:upstream:read and live operator approval.
        Verified app DID only, no body override. Extends registry.apps.upstreams;
        grants neither member consent nor key access. [] withdraws declarations.
        Old/new declarations are atomically node-attested. Origin/header/prefix
        and canonical path/method pairs are bound to the member connection.
        Any addition, change or removal invalidates it until explicit reconnection;
        reordering or repeating equivalent pairs does not.
        Request body limit 16 KiB. No rows deleted.
      security:
        - appServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [upstreams]
              properties:
                upstreams:
                  type: array
                  maxItems: 16
                  description: Unique IDs within the app.
                  items: { $ref: "#/components/schemas/AppUpstream" }
      responses:
        "200": { description: Declarations saved without credentials }
        "400": { description: Invalid or duplicate declarations }
        "401": { description: Scoped app authentication required }
        "403": { description: Not an active operator-approved app service }
        "413": { description: Body exceeds 16 KiB }
        "503": { description: Signing or store unavailable }
  /api/upstreams/connection:
    get:
      tags: [connections]
      operationId: getPersonalAppUpstreamConnection
      summary: Read your destination-bound status without unsealing
      security:
        - cookieAuth: []
      parameters:
        - { name: appDid, in: query, required: true, schema: { type: string } }
        - { name: upstreamId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: "Non-secret status plus current plain-text permissions; no-store"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUpstreamConnection" }
        "400": { description: Invalid selector }
        "401": { description: Personal session required }
        "403": { description: App or declaration unavailable }
        "503": { description: Store unavailable }
    post:
      tags: [connections]
      operationId: connectPersonalAppUpstream
      summary: Seal a member-owned key for one reviewed app upstream
      description: >-
        Personal human session only, never app/agent/org act-as lifecycle.
        Explicit origin must match the declaration. Reuses private external-mcp-key
        sealing with member subject and kernel-only custody; generic vault fetch,
        export and renewal cannot disclose it. Stores destination/header/prefix
        and canonical path/method binding, optional org_context_did and signed
        lifecycle history. Any path/method addition or removal requires reconnecting;
        ordering alone does not. Earlier destination-only bindings require one reconnect.
        This connect step is API-only: connect/status responses return a sorted,
        deduplicated permissions list such as ["GET /me"] for member review. Tier 0 only.
        Connecting grants no app authority: use existing OAuth consent for
        connectors:upstream:read and optionally connectors:upstream:write.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [appDid, upstreamId, origin, secret]
              properties:
                appDid: { type: string }
                upstreamId: { type: string, pattern: '^[a-z][a-z0-9-]{0,63}$' }
                origin: { type: string }
                secret: { type: string, writeOnly: true, minLength: 1, maxLength: 4096, pattern: '^[!-~]+$' }
                orgContextDid: { type: string }
      responses:
        "201":
          description: "connected=true and the plain-text approved permissions; never key material"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUpstreamConnection" }
        "400": { description: Invalid input or unsafe metadata }
        "401": { description: Personal session required }
        "403": { description: Not a personal human or active org member, or declaration unavailable }
        "409": { description: Destination changed or Tier 1 unsupported }
        "413": { description: Body exceeds 16 KiB }
        "503": { description: Signing or vault/store unavailable }
    delete:
      tags: [connections]
      operationId: disconnectPersonalAppUpstream
      summary: Revoke your connection, retaining signed tombstones and history
      description: >-
        Personal human only. Works after app/declaration removal. No rows deleted.
        The next call fails; already-admitted calls may finish under the existing
        member MCP snapshot contract. Idempotent when no connection exists.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppUpstreamSelector" }
      responses:
        "200": { description: disconnected=true }
        "400": { description: Invalid selector }
        "401": { description: Personal session required }
        "403": { description: Not a personal human }
        "413": { description: Body exceeds 16 KiB }
        "503": { description: Signing or vault/store unavailable }
  /api/upstreams/call:
    post:
      tags: [connections]
      operationId: invokeAppUpstream
      summary: Call a declared API on behalf of a member with kernel credential injection
      description: >-
        App-service+jwt as its registered DID, connectors:upstream:read in token and
        live operator ceiling. Every call checks member per-app OAuth consent, active
        connection/custody, destination binding, member/org standing and active org
        membership through authorizeMemberConnection, shared with member MCP
        (the #3167 suspension hook). GET/HEAD are reads; all other methods require
        connectors:upstream:write in token, operator ceiling AND live member grant,
        plus a reason code. No automatic writes. Exact declared paths/methods only;
        no URL, header, query or app DID override. HTTPS public egress with DNS connect
        pinning; local-inference private allowlist never applies. Redirects refused.
        Kernel injects the key, buffers at most 2 MiB, refuses credential echoes and
        strips all upstream headers. No raw provider exceptions or streams returned.
        Connect timeout and body deadline each 30 seconds. Existing shared member/app
        quotas and concurrency cap apply before any database read. Successful calls
        are recorded, as are authorized upstream failures, with node-signed memberDid,
        appDid, orgContextDid,
        upstream ID, method, outcome and reason; never body, arguments or credential.
        Admission, validation and permission refusals write nothing permanent and
        make no upstream call.
        Invalid/authentication-rejected requests cannot invoke or impersonate a member.
      security:
        - appServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [memberDid, upstreamId, path, method]
              properties:
                memberDid: { type: string }
                upstreamId: { type: string, pattern: '^[a-z][a-z0-9-]{0,63}$' }
                path: { type: string, maxLength: 1024 }
                method: { type: string, enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS] }
                body: { type: string, maxLength: 12000, description: "JSON text; forbidden for GET/HEAD." }
                reason: { type: string, enum: [member-request, app-workflow, scheduled-task], description: "Required for non-GET/HEAD; codes only, not free text." }
      responses:
        "200":
          description: Upstream status and bounded text body only; no-store
          content:
            application/json:
              schema:
                type: object
                required: [status, body]
                properties:
                  status: { type: integer }
                  body: { type: string }
        "400": { description: Invalid input or missing mutation reason }
        "401": { description: Scoped app authentication required }
        "403": { description: Grant, standing, custody, destination or declaration refused }
        "413": { description: Body exceeds 16 KiB }
        "429": { description: Member or app rate exceeded }
        "502": { description: Generic upstream failure, redirect, oversized body or credential echo }
        "503": { description: Capacity or signing/vault/store unavailable }
  /api/external-mcp/postman:
    get:
      tags: [connections]
      operationId: externalMcpPostmanStatus
      summary: Read your personal Postman connection status without unsealing
      security:
        - cookieAuth: []
      responses:
        "200":
          description: provider=postman, connected boolean and nullable orgContextDid only; no-store
        "401":
          description: Personal member session required
        "403":
          description: Organization act-as and agent/delegated sessions refused
        "503":
          description: Connection store unavailable
    post:
      tags: [connections]
      operationId: connectExternalMcpPostman
      summary: Seal your own Postman API key for kernel-only outbound use
      description: >-
        Personal human member session only; no app or org act-as lifecycle authority.
        The optional org tag requires active membership and is attribution, not key ownership.
        Fixed official target https://mcp.postman.com/mcp; URLs and headers are not configurable.
        Tier 0 node-delegated custody, not zero custody. Tier 1 returns 409 before writing.
        Each save uses an immutable private vault field with member subject and kernel grantee,
        revokes prior custody and records node-signed connector.external-mcp history.
        After the new seal is written, reconnect writes a signed tombstone for the old field.
        Body limit 16 KiB; never echo parser/driver/provider messages or credentials.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [secret]
              properties:
                secret: { type: string, writeOnly: true, minLength: 1, maxLength: 4096, pattern: '^[!-~]+$' }
                orgContextDid: { type: string, maxLength: 256, pattern: '^did:[a-z0-9]+:[a-zA-Z0-9._:-]+$' }
      responses:
        "201":
          description: provider=postman, connected=true, orgContextDid only; no-store
        "400":
          description: Invalid input; unknown properties refused
        "401":
          description: Personal member session required
        "403":
          description: Not a personal member or no active org membership
        "409":
          description: Kernel vault custody required
        "413":
          description: Request exceeds 16 KiB
        "503":
          description: Signing, vault or persistence unavailable
    delete:
      tags: [connections]
      operationId: disconnectExternalMcpPostman
      summary: Revoke custody and write a signed vault tombstone, retaining history
      description: >-
        Same member-only lifecycle gate. Serializes against connects and short custody snapshots.
        An already-admitted outbound call may finish after disconnect; new calls are refused.
        Erases wrapped grant material, marks the connection revoked and records
        a node-signed lifecycle attestation. No database rows are deleted.
        No connection is an idempotent success. Org removal does not prevent personal disconnect.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: disconnected=true; no-store
        "401":
          description: Personal member session required
        "403":
          description: Not a personal human member
        "503":
          description: Signing, vault or persistence unavailable
  /api/external-mcp/postman/rpc:
    post:
      tags: [connections]
      operationId: invokeExternalMcpPostman
      summary: List or call allowlisted read-only Postman MCP tools through the kernel
      description: >-
        JSON-RPC-shaped kernel invocation facade, not a transparent MCP server:
        accepts tools/list and tools/call only. The kernel handles a fresh upstream
        initialize/initialized handshake for each invocation and keeps session IDs private.
        Injects the current member credential as Authorization Bearer on every outbound hop.
        Redirects disabled, 30s total deadline, 2 MiB response budget; JSON and SSE supported.
        No upstream headers, errors or credential echoes are returned; upstream failure is generic 502.
        Exact allowlist: getWorkspaces, getWorkspace, getCollections, getCollection,
        getCollectionRequest, getEnvironments, getEnvironment. Arguments are validated
        against reviewed per-tool schemas; no URLs, headers or protocol metadata accepted.
        Write, unknown and live-request tools (including runCollection) are refused with 403,
        regardless of upstream readOnlyHint. tools/list filters out nonallowlisted tools.
        Personal human session may use its own connection. Registered app callers need
        connectors:mcp:read plus the member's live OAuth app consent on every call.
        An app-service token also needs current operator approval of this service scope
        and supplies memberDid; a delegated app cannot select a different userDid.
        No session fallback after app-auth refusal. Connection, custody, member identity,
        app registration, tagged org identity and current org membership are checked each call.
        Admission uses the existing in-memory sliding-window limiter: 20 calls per member
        and 60 calls per app in 60 seconds, plus a process-wide cap of 4 in-flight calls.
        Limits are per process (not a distributed quota); restart resets the in-memory budgets.
        Limit refusal is generic 429, capacity refusal generic 503; neither starts a database
        transaction, calls Postman or writes an attestation/row. Capacity is released on every exit.
        Authorization and unseal run in one short transaction, then the outbound exchange runs
        with no database transaction or lock held. A second short transaction records each
        admitted attempt (including successful use) as a signed member/org/app/method/tool event;
        no arguments, RPC IDs, credential or provider error is stored.
        Org controls and org-wide revocation remain separate work.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [jsonrpc, id, method]
              properties:
                jsonrpc: { type: string, const: "2.0" }
                id: { oneOf: [{ type: string, maxLength: 128 }, { type: integer }] }
                memberDid: { type: string, maxLength: 256, description: "Required for app-service, otherwise must match authenticated member." }
                method: { type: string, enum: [tools/list, tools/call] }
                params:
                  type: object
                  additionalProperties: false
                  properties:
                    name: { type: string, maxLength: 128 }
                    arguments: { type: object }
                    cursor: { type: string, maxLength: 1024, description: "tools/list pagination only" }
      responses:
        "200":
          description: JSON-RPC 2.0 id and sanitized result; no-store
        "400":
          description: Invalid RPC envelope, arguments or selector
        "401":
          description: Authentication required
        "403":
          description: Tool refused or no current member/app/custody authorization
        "413":
          description: Request exceeds 16 KiB
        "429":
          description: Generic per-member or per-app rate limit refusal; nothing permanent written
        "502":
          description: Generic upstream failure, including credential echo refusal
        "503":
          description: In-flight capacity exhausted (nothing permanent written), or authorization, signing or custody unavailable
  /api/apps/pods:
    get:
      tags: [connections]
      operationId: listAppMemberPodIds
      summary: List active direct member pod IDs by DID within the app's owner grants
      description: >-
        Requires a live app-authorization channel_links grant of connections:read
        from each pod owner to this exact app (channel=app, status=active,
        revokedAt=null). The existing OAuth consent flow creates this grant.
        Consent label: "View your connections and member lists of all pods you own
        (including other people)". This owner-wide grant exposes other people's
        membership in every pod the granting owner owns, not just the owner's
        own membership or one selected pod.
        Registration, operator approval, an ownerDid/appDid query parameter,
        X-Acting-For, or a forwarded cookie alone never grants access.
        Only entitled pods are returned, of any type; no recursive membership,
        removed membership, names, or unrelated owners' pods. No matches returns
        an empty list. Responses are Cache-Control: no-store.
      security:
        - appServiceAuth: []
      parameters:
        - name: did
          in: query
          required: true
          schema: { type: string, pattern: "^did:", maxLength: 2048 }
          description: Target member DID, not an impersonated owner
      responses:
        "200":
          description: Active direct memberships visible to this app, ordered by pod ID
          content:
            application/json:
              schema:
                type: object
                required: [podIds]
                properties:
                  podIds: { type: array, items: { type: string } }
        "400":
          description: Missing or invalid DID
        "401":
          description: Missing, invalid, expired, or wrong-type/audience app-service credential
        "403":
          description: Missing scope, inactive/unregistered app, or revoked operator approval
        "503":
          description: Membership or authorization store unavailable (fails closed)
  /api/apps/pods/{id}/members:
    get:
      tags: [connections]
      operationId: listAppPodMembers
      summary: Read active direct pod members with the pod owner's grant to this app
      description: >-
        Same service credential and live owner-grant gates as GET /api/apps/pods.
        The connections:read grant covers member lists of all pods owned by the
        granting owner, including other people's DIDs, roles, and join timestamps.
        Missing pods and pods without the owner's active connections:read grant
        to this exact app both return 404; registration or sharing an app owner
        never substitutes for the grant. Empty entitled pods return members=[].
        All active direct roles are returned (including owner and cohost);
        callers enforce their own organizer-role policy. Removed members are
        excluded. No pod metadata or addedBy is disclosed. Cache-Control: no-store.
      security:
        - appServiceAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Minimal active direct membership records
          content:
            application/json:
              schema:
                type: object
                required: [podId, members]
                properties:
                  podId: { type: string }
                  members:
                    type: array
                    items:
                      type: object
                      required: [podId, did, role, joinedAt]
                      properties:
                        podId: { type: string }
                        did: { type: string }
                        role: { type: string, examples: [owner, cohost, member] }
                        joinedAt: { type: string, description: "Database timestamp string, matching the existing pod membership API." }
        "401":
          description: Missing, invalid, expired, or wrong-type/audience app-service credential
        "403":
          description: Missing scope, inactive/unregistered app, or revoked operator approval
        "404":
          description: Pod not found or not entitled
        "503":
          description: Membership or authorization store unavailable (fails closed)
  /api/connectors/{id}/connections:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, examples: [google, github, quickbooks] }
    get:
      tags: [connections]
      operationId: listConnectorConnections
      summary: List the authenticated owner's labelled connector connections
      description: >-
        Returns non-secret metadata only. Existing unsuffixed credentials resolve
        as primary without re-sealing. Disconnected slots may remain available
        for reconnecting. Labels are not unique identifiers: ambiguous label
        selectors fail with an error listing matching slots.
        ownerDid is derived from authentication, never from a caller selector.
        It scopes dependency warnings to this owner's slots; removed slot
        history is excluded from live listings.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Connections for this connector and owner
          content:
            application/json:
              schema:
                type: object
                required: [ownerDid, connections]
                properties:
                  ownerDid: { type: string, description: "Authenticated effective owner; metadata, not removal authority." }
                  connections:
                    type: array
                    items: { $ref: "#/components/schemas/ConnectorConnection" }
        "401":
          description: Not authenticated
        "404":
          description: Unknown connector
    post:
      tags: [connections]
      operationId: createConnectorConnection
      summary: Create a named connection slot before configuring or authorizing it
      description: >-
        Creating a slot grants no capabilities and copies no primary tokens,
        credentials or grants. App-owned OAuth configuration may be shared;
        BYO configuration remains per-slot.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot]
              properties:
                slot: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$" }
                label: { type: string, maxLength: 80 }
      responses:
        "201":
          description: Connection slot created
        "400":
          description: Invalid slot or label
        "401":
          description: Not authenticated
        "409":
          description: Slot already exists
    patch:
      tags: [connections]
      operationId: renameConnectorConnection
      summary: Update a connection's display label without changing its stable slot
      security:
        - cookieAuth: []
      parameters:
        - name: slot
          in: query
          required: false
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$", default: primary }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
