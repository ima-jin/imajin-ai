  /api/invites/{code}:
    patch:
      tags: [connections]
      operationId: declineDirectConnectionInvite
      summary: Decline a pending direct request as its named recipient
      description: Uses connections:write and the effective act-as DID; terminal requests return 410.
      security:
        - cookieAuth: []
      parameters:
        - name: code
          in: path
          required: true
