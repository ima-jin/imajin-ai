name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - cid
          - tokens
          - config
          - ui
          - vault-core
          - db
          - fair
          - pay
          - auth-client
          - all
      version_bump:
        description: "Version bump type (none publishes the version in package.json as-is)"
        required: true
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: patch
      registries:
        # npmjs.org is canonical; GitHub Packages is a visibility-only mirror
        # that populates the repo's Packages sidebar. The single-registry
        # options exist because a version already live on one registry makes
        # that registry's publish fail with a 409 — backfilling existing
        # versions to GitHub Packages requires skipping npmjs entirely.
        description: "Registries to publish to"
        required: true
        type: choice
        options:
          - both
          - npmjs
          - github-packages
        default: both
      dry_run:
        description: "Dry run (skip actual publish)"
        required: false
        type: boolean
        default: false

env:
  # Publish order matters — a package must be published before anything that
  # depends on it, since workspace:* deps resolve against the sibling versions.
  # cid → vault-core; tokens → config → ui; fair → ui; db/pay/auth-client are
  # independent (the "Build workspace type dependencies" step below builds
  # each selected package's @imajin/* deps automatically, regardless of order).
  ALL_PACKAGES: "cid tokens config ui vault-core db fair pay auth-client"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required to publish to npm.pkg.github.com with the ephemeral
      # GITHUB_TOKEN. Publishing from a workflow in this repo is also what
      # auto-connects each package to the repo (and so renders the sidebar).
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine packages to publish
        id: packages
        run: |
          if [ "${{ inputs.package }}" = "all" ]; then
            echo "list=${{ env.ALL_PACKAGES }}" >> $GITHUB_OUTPUT
          else
            echo "list=${{ inputs.package }}" >> $GITHUB_OUTPUT
          fi

      - name: Bump versions
        if: inputs.version_bump != 'none'
        run: |
          for pkg in ${{ steps.packages.outputs.list }}; do
            echo "::group::Bumping $pkg"
            cd packages/$pkg
            # Use npm version to bump (modifies package.json in place)
            NEW_VERSION=$(npm version ${{ inputs.version_bump }} --no-git-tag-version | tr -d 'v')
            echo "Bumped @imajin/$pkg to $NEW_VERSION"
            cd ../..
            echo "::endgroup::"
          done

      # A selected package's dts build resolves its @imajin/* workspace
      # deps' types (e.g. vault-core → cid, config → tokens, ui → config/fair).
      # A single-package dispatch checks out fresh and never builds those
      # siblings otherwise, so the dts step fails with "Cannot find module
      # '@imajin/<dep>'". `^...` selects only a package's dependencies
      # (topologically ordered), not the package itself — harmless/idempotent
      # if a dependency is also in the selected list below.
      - name: Build workspace type dependencies
        run: |
          for pkg in ${{ steps.packages.outputs.list }}; do
            echo "::group::Building workspace deps for $pkg"
            # --if-present tolerates workspace deps with no build script
            # (e.g. @imajin/auth is an optional peer dep of pay that ships
            # raw src/ with no dist/ build step). It must precede the script
            # name -- pnpm forwards anything listed after the script name to
            # the script itself, which broke tsup with 'Unknown option
            # --ifPresent' when this was written as '... run build --if-present'.
            pnpm --filter "@imajin/$pkg^..." run --if-present build
            echo "::endgroup::"
          done

      - name: Build packages
        run: |
          for pkg in ${{ steps.packages.outputs.list }}; do
            echo "::group::Building $pkg"
            cd packages/$pkg
            if grep -q '"build"' package.json; then
              pnpm build
              echo "Built $pkg"
            else
              echo "No build script for $pkg, skipping"
            fi
            cd ../..
            echo "::endgroup::"
          done

      # npmjs.org first: it is the canonical registry and the only install path
      # for consumers, so a GitHub Packages failure must never be able to block
      # it. Each registry gets its own step so its token is scoped to just that
      # step — NPM_TOKEN is never present while publishing to GitHub Packages,
      # and vice versa.
      - name: Publish to npmjs.org
        if: inputs.registries != 'github-packages'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in ${{ steps.packages.outputs.list }}; do
            echo "::group::Publishing @ima-jin/$pkg to npmjs.org"
            bash scripts/publish-package.sh "$pkg" "https://registry.npmjs.org" "${{ inputs.dry_run }}"
            echo "::endgroup::"
          done

      # Visibility-only mirror. This is what populates the repo's Packages
      # sidebar; no consumer installs from here. Auth is the ephemeral
      # GITHUB_TOKEN — deliberately not a PAT.
      - name: Publish to GitHub Packages
        if: inputs.registries != 'npmjs'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in ${{ steps.packages.outputs.list }}; do
            echo "::group::Publishing @ima-jin/$pkg to GitHub Packages"
            bash scripts/publish-package.sh "$pkg" "https://npm.pkg.github.com" "${{ inputs.dry_run }}"
            echo "::endgroup::"
          done

      # Version bumps are local to the workflow run only.
      # package.json versions in main are updated manually when needed.
      # This avoids branch protection conflicts with push-back commits.
