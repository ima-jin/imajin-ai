name: Publish Packages

on:
  # A `packages-vX.Y.Z` tag always publishes exactly the four out-of-repo SDK
  # packages (#1982: auth, config, logger, ui) to GitHub Packages only, using
  # the ephemeral GITHUB_TOKEN — never NPM_TOKEN, so tagging this way cannot
  # depend on (or consume) the npmjs-publish secret. There is no in-workflow
  # version bump anywhere in this file (#2286's tag-as-truth philosophy): bump
  # each package's version in package.json via a normal PR, merge it, *then*
  # push the tag — see docs/packages/PUBLISHING.md.
  push:
    tags:
      - 'packages-v*'
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - cid
          - tokens
          - config
          - ui
          - vault-core
          - db
          - fair
          - pay
          - auth-client
          - auth
          - logger
          - all
      registries:
        # npmjs.org is canonical; GitHub Packages is a visibility-only mirror
        # that populates the repo's Packages sidebar. The single-registry
        # options exist because a version already live on one registry makes
        # that registry's publish fail with a 409 — backfilling existing
        # versions to GitHub Packages requires skipping npmjs entirely.
        description: "Registries to publish to"
        required: true
        type: choice
        options:
          - both
          - npmjs
          - github-packages
        default: both
      dry_run:
        description: "Dry run (skip actual publish)"
        required: false
        type: boolean
        default: false

env:
  # Publish order matters — a package must be published before anything that
  # depends on it, since workspace:* deps resolve against the sibling versions.
  # cid → vault-core; tokens → config → ui; fair → ui; auth/logger → config;
  # db/pay/auth-client are independent (the "Build workspace type dependencies"
  # step below builds each selected package's @imajin/* deps automatically,
  # regardless of order).
  ALL_PACKAGES: "cid tokens config ui vault-core db fair pay auth-client auth logger"
  # The four packages that make up the out-of-repo SDK surface (#1982) — the
  # only ones a `packages-v*` tag ever publishes.
  SDK_PACKAGES: "auth config logger ui"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to publish to npm.pkg.github.com with the ephemeral
      # GITHUB_TOKEN. Publishing from a workflow in this repo is also what
      # auto-connects each package to the repo (and so renders the sidebar).
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # A tag push carries no `inputs.*` context at all (that only exists for
      # `workflow_dispatch`), so every dispatch-only input is resolved here,
      # once, into plain step outputs that the rest of the job reads uniformly
      # regardless of which trigger fired. Tag pushes always mean: publish the
      # four SDK packages, as-is, GitHub Packages only, for real (never a dry
      # run). Every publish — tag path and manual dispatch alike, for every
      # package — publishes exactly the version already committed in that
      # package's package.json. There is no in-workflow version bump (#2286's
      # tag-as-truth philosophy: one way to change a version, a normal PR);
      # see docs/packages/PUBLISHING.md.
      #
      # This branching used to live entirely as inline bash here, untested —
      # no `packages-v*` tag had ever actually been pushed in this repo, so
      # the tag-push branch was unverified except by reading the YAML.
      # scripts/resolve-publish-params.mjs is the same logic, pulled out so
      # scripts/__tests__/resolve-publish-params.test.mjs can assert every
      # branch (#1982).
      - name: Resolve run parameters
        id: params
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_REGISTRIES: ${{ inputs.registries }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/resolve-publish-params.mjs

      # A selected package's dts build resolves its @imajin/* workspace
      # deps' types (e.g. vault-core → cid, config → tokens, ui → config/fair).
      # A single-package dispatch checks out fresh and never builds those
      # siblings otherwise, so the dts step fails with "Cannot find module
      # '@imajin/<dep>'". `^...` selects only a package's dependencies
      # (topologically ordered), not the package itself — harmless/idempotent
      # if a dependency is also in the selected list below.
      - name: Build workspace type dependencies
        run: |
          for pkg in ${{ steps.params.outputs.list }}; do
            echo "::group::Building workspace deps for $pkg"
            # --if-present tolerates workspace deps with no build script
            # (e.g. @imajin/auth is an optional peer dep of pay that ships
            # raw src/ with no dist/ build step). It must precede the script
            # name -- pnpm forwards anything listed after the script name to
            # the script itself, which broke tsup with 'Unknown option
            # --ifPresent' when this was written as '... run build --if-present'.
            pnpm --filter "@imajin/$pkg^..." run --if-present build
            echo "::endgroup::"
          done

      - name: Build packages
        run: |
          for pkg in ${{ steps.params.outputs.list }}; do
            echo "::group::Building $pkg"
            cd packages/$pkg
            if grep -q '"build"' package.json; then
              pnpm build
              echo "Built $pkg"
            else
              echo "No build script for $pkg, skipping"
            fi
            cd ../..
            echo "::endgroup::"
          done

      # npmjs.org first: it is the canonical registry and the only install path
      # for consumers, so a GitHub Packages failure must never be able to block
      # it. Each registry gets its own step so its token is scoped to just that
      # step — NPM_TOKEN is never present while publishing to GitHub Packages,
      # and vice versa. Never runs for a tag push (do_npmjs is always 'false'
      # there) — a `packages-v*` tag never touches NPM_TOKEN.
      - name: Publish to npmjs.org
        if: steps.params.outputs.do_npmjs == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in ${{ steps.params.outputs.list }}; do
            echo "::group::Publishing @ima-jin/$pkg to npmjs.org"
            bash scripts/publish-package.sh "$pkg" "https://registry.npmjs.org" "${{ steps.params.outputs.dry_run }}"
            echo "::endgroup::"
          done

      # Visibility-only mirror for manually-dispatched packages; the only
      # install path for the four `packages-v*`-tagged SDK packages. Auth is
      # the ephemeral GITHUB_TOKEN — deliberately not a PAT, and never a new
      # secret.
      - name: Publish to GitHub Packages
        if: steps.params.outputs.do_ghp == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in ${{ steps.params.outputs.list }}; do
            echo "::group::Publishing @ima-jin/$pkg to GitHub Packages"
            bash scripts/publish-package.sh "$pkg" "https://npm.pkg.github.com" "${{ steps.params.outputs.dry_run }}"
            echo "::endgroup::"
          done

      # No version-bump step exists here on purpose: every publish ships
      # exactly the version already committed in main. Bump via a normal PR,
      # merge it, then dispatch/tag — see docs/packages/PUBLISHING.md.
