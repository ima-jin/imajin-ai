name: Release

# Tag is truth (#2285): package.json "version" fields are bumped ONLY here,
# in lockstep, ONLY via a normal reviewed PR into main — this workflow never
# pushes to main directly and never bypasses branch protection. Merging the
# PR this workflow opens is what actually cuts the release:
# .github/workflows/tag-release.yml tags that merge commit and dispatches
# deploy-prod.yml, which is gated by the `production` GitHub Environment's
# required reviewer (see deploy-prod.yml) — the same approval gate every
# other prod deploy already goes through, not a new one.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        # Patch is the default and the only bump that runs without an explicit
        # human call. minor/major are deliberate choices: pick them only when
        # Ryan has said so for this release.
        options:
          - patch
          - minor
        default: patch

# One release in flight at a time — two concurrent runs racing to read/bump
# root package.json would corrupt each other's version math.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # GITHUB_TOKEN is read-only; all release writes use the scoped App token.
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Releases are dispatched from main only. workflow_dispatch can
    # technically be run against any ref from the Actions UI; refuse
    # anything else rather than silently opening a release PR whose base
    # content isn't main's current tip.
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Refuse to run off main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Release must be dispatched against main (got ${{ github.ref }})."
          exit 1

      - name: Require release App configuration
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          missing=0
          if [ -z "$RELEASE_APP_ID" ]; then
            echo "::error::RELEASE_APP_ID (Actions variable) is missing."
            missing=1
          fi
          if [ -z "$RELEASE_APP_PRIVATE_KEY" ]; then
            echo "::error::RELEASE_APP_PRIVATE_KEY (Actions secret) is missing."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Mint release App installation token
        id: release-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: imajin-ai
          permission-contents: write
          permission-pull-requests: write

      # A scoped installation token, NOT a bypass actor: pushes go only to
      # release/vX.Y.Z, never main. Ryan's PR approval and the production gate
      # remain required. App-authored pushes/PRs trigger normal CI events.
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.release-app.outputs.token }}
          ref: main
          # Full history: `git describe --tags` (scripts/build.sh) and this
          # workflow's own duplicate-tag guard both need to see every
          # existing tag, not just the tip commit.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bump every package.json to the same new version (lockstep)
        id: bump
        # See scripts/bump-workspace-version.mjs for why this is not the
        # literal `pnpm -r version <bump>` — that command is a silent no-op
        # on the pnpm version this repo pins (packageManager: pnpm@9.15.0),
        # and even a working recursive bump wouldn't produce lockstep given
        # this repo's current per-package version divergence.
        run: |
          NEW_VERSION=$(node scripts/bump-workspace-version.mjs "${{ inputs.bump }}")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # From here on, everything reads the version from $VERSION (a plain
      # env var) rather than repeating the `${{ steps.bump.outputs.* }}`
      # expression inline in each run block.
      - name: Guard against re-using an existing tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        # Out of scope (#2285): existing tags (v0.7.0, v0.7.1, v0.8.0, ...)
        # must never be touched. This is a hard stop, not a silent skip — a
        # collision here means the bump math or the base ref is wrong.
        run: |
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Refusing to open a release PR for a version already tagged."
            exit 1
          fi

      - name: Create the release branch and commit the version bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v$VERSION"
          # The commit message prefix "release:" is load-bearing, not just a
          # label: scripts/ci-guard-version-bump.mjs (ci.yml's "CI Guards"
          # job) is what lets this commit past the guard that blocks every
          # other PR from touching package.json versions, and
          # tag-release.yml keys off this exact prefix (read off the real
          # merge parent, not the merge commit's own generic message) to
          # decide whether a push to main is a release.
          #
          # `git add -A` with no pathspec, not `*/package.json`: git
          # pathspec globs don't recurse across directory levels the way a
          # shell glob does (`*/package.json` matches `apps/package.json`
          # but NOT `apps/www/package.json`), and `**/package.json` needs
          # glob pathspec magic to behave. scripts/bump-workspace-version.mjs
          # only ever rewrites package.json files, so an unrestricted `-A`
          # is safe.
          git add -A
          git commit -m "release: v$VERSION"

      - name: Push the release branch
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        # A new branch, never main — this does not touch branch protection.
        run: git push origin "release/v$VERSION"

      - name: Open the release pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # Body written to a temp file rather than inlined into `--body`:
          # avoids fighting shell/YAML quoting for a multi-line, backtick-
          # and-punctuation-heavy message (see AGENTS.md's "GitHub CLI"
          # convention for the same reasoning, applied here to bash instead
          # of PowerShell).
          BODY_FILE="$(mktemp)"
          cat > "$BODY_FILE" <<EOF
          Lockstep version bump to \`v$VERSION\`, opened by the [Release workflow](../actions/workflows/release.yml).

          Merging this PR (keeping its \`release: v$VERSION\` commit message intact) is what cuts the release: [\`tag-release.yml\`](../actions/workflows/tag-release.yml) tags the resulting merge commit as \`v$VERSION\` and dispatches [\`deploy-prod.yml\`](../actions/workflows/deploy-prod.yml) against that tag, which is gated by the \`production\` GitHub Environment's required reviewer — no separate approval step exists here, it's the same gate every other prod deploy already goes through.

          See \`docs/npm-publishing.md\`'s "Cutting a release" section for the full mechanism.
          EOF
          PR_URL=$(gh pr create \
            --title "release: v$VERSION" \
            --base main \
            --head "release/v$VERSION" \
            --body-file "$BODY_FILE")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Opened $PR_URL"
