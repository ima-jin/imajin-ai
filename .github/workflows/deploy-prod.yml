name: Deploy to Prod

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/SHA to deploy'
        required: false
        default: 'main'

# Prod deploys are gated by the GitHub Environment `production` (required
# reviewer: repo admin). Anyone with write access can dispatch; the job holds
# until a reviewer approves the pending deployment — from anywhere, no ssh.
# The run log is the record of what was deployed, by whom, approved by whom.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, imajin]
    environment: production
    defaults:
      run:
        working-directory: /home/jin/prod/imajin-ai
    env:
      PATH: /home/jin/.nvm/versions/node/v22.22.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Live pm2 config location. The source of truth is deploy/ecosystem.prod.config.js
      # in this repo; the Sync step below copies it here on every deploy.
      ECOSYSTEM_FILE: /home/jin/prod/ecosystem.config.js

    steps:
      - name: Pull latest
        run: |
          # --prune/--prune-tags: stale remote-tracking refs (e.g. a deleted
          # `docs` branch) block fetching a new nested branch like `docs/foo`
          # with a D/F ref conflict (see #2239).
          git fetch --prune --prune-tags origin --tags
          git reset --hard ${{ github.event.inputs.ref || github.ref_name }}

      - name: Sync pm2 ecosystem config
        # Copied before the build so any cold start during build.sh uses current
        # config. Previously this was a manual `cp` an operator had to remember,
        # which is the same "someone forgets" failure class as #1520 itself.
        run: |
          cp deploy/ecosystem.prod.config.js "$ECOSYSTEM_FILE"
          echo "✅ Synced ecosystem config to $ECOSYSTEM_FILE"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      # --ignore-scripts above blocks install/postinstall scripts for every
      # dependency (githubactions:S6505). apps/corpus's better-sqlite3 is the
      # one dependency prod-corpus can't run without: its install script
      # compiles/fetches the native binding pm2 loads at runtime, so it's
      # rebuilt individually here rather than re-enabling scripts globally.
      - name: Rebuild native dependencies
        run: pnpm rebuild -r better-sqlite3

      # Service bootstrap identities (#2442). Runs only after the `production`
      # environment approval (this whole job is gated on it), so the gate tap is
      # the human countersign from #2245. It must come BEFORE check-env, which
      # build-changed.sh -> build.sh runs first thing: a service whose
      # *_VAULT_BOOTSTRAP_DID/_PRIVATE_KEY pair is missing stops the deploy
      # there. A failure here fails the deploy before any restart.
      #
      # The script imports the kernel's source, which imports workspace
      # packages by their built dist, so build them first (build.sh rebuilds
      # them again later; the cost is a few seconds of duplicated work).
      - name: Build workspace packages (provisioning prerequisite)
        run: pnpm -r --filter './packages/**' build

      - name: Provision service bootstrap identities
        env:
          # pm2 sets NODE_ENV for prod-jin in the ecosystem file, not .env.local.
          NODE_ENV: production
        # Loads the kernel's env exactly like pm2 starts prod-jin
        # (`--env-file=<repo>/apps/kernel/.env.local`); --env prod takes VAULT_PATH
        # from deploy/ecosystem.prod.config.js, where pm2 sets it.
        run: node --env-file=apps/kernel/.env.local scripts/provision-service-bootstrap.mjs --all --env prod

      - name: Build changed apps
        # build-changed.sh walks the pnpm graph and only rebuilds apps affected
        # by the diff since the last successful build (tracked via .last-build-sha).
        # Falls back to full rebuild if .last-build-sha doesn't exist.
        run: ./scripts/build-changed.sh

      - name: Run migrations
        run: node scripts/migrate.mjs

      - name: Reap orphaned port squatters
        run: ./scripts/reap-orphans.sh prod

      - name: Restart prod services
        run: |
          # prod-jin is restarted from the ecosystem FILE, deliberately not by name.
          #
          # `pm2 restart <name>` reuses pm2's saved process definition, so changes to
          # the ecosystem file (notably prod-jin's `--env-file` node_args) are
          # silently ignored. That is exactly the #1520 failure mode: the process
          # came back up without AUTH_PRIVATE_KEY, signed vault entries with a
          # deterministic dev key, and reported nothing wrong.
          #
          # startOrRestart also covers the case where prod-jin is not running yet.
          pm2 startOrRestart "$ECOSYSTEM_FILE" --only prod-jin --update-env
          echo "✅ prod-jin restarted from $ECOSYSTEM_FILE"

          # Everything else (prod-events, prod-dykil, prod-coffee, prod-market, prod-learn, …).
          # links (#1986 phase 2) runs from its own repo/pm2 process now, so it is no
          # longer among these.
          #
          # Services declared in the ecosystem file are restarted FROM the file for
          # the same reason as prod-jin: a name-based `pm2 restart` reuses the saved
          # definition, so a service pm2 still has saved as `npm start` would keep
          # the npm wrapper that orphans next-server on restart (#2447) and never
          # pick up the direct-exec config. Anything pm2 runs that is NOT in the file
          # keeps the name-based restart.
          source scripts/lib/pm2-owned.sh
          PROD_PROCS=$(pm2 jlist | node -e "const procs = JSON.parse(require('fs').readFileSync(0)); console.log(procs.filter(p => p.name && p.name.startsWith('prod-')).map(p => p.name).join(' '));")
          # prod-kernel-cron (#2550) is the scheduler for the kernel's cron jobs.
          # PROD_PROCS only lists what pm2 already runs, so on the first deploy
          # that ships it (or after it was deleted) it would never be started and
          # no job would ever fire. Always include it: startOrRestart below starts
          # it from the ecosystem file when pm2 doesn't know it yet.
          case " $PROD_PROCS " in
            *" prod-kernel-cron "*) ;;
            *) PROD_PROCS="$PROD_PROCS prod-kernel-cron" ;;
          esac
          FILE_PROCS=""
          NAME_PROCS=""
          for proc in $PROD_PROCS; do
            [ "$proc" = "prod-jin" ] && continue
            if ecosystem_has_app "$proc" "$ECOSYSTEM_FILE"; then
              FILE_PROCS="${FILE_PROCS:+$FILE_PROCS,}$proc"
            else
              NAME_PROCS="$NAME_PROCS $proc"
            fi
          done
          if [ -n "$FILE_PROCS" ]; then
            echo "Restarting from $ECOSYSTEM_FILE: $FILE_PROCS"
            pm2 startOrRestart "$ECOSYSTEM_FILE" --only "$FILE_PROCS" --update-env
          fi
          if [ -n "$NAME_PROCS" ]; then
            echo "Restarting by name:$NAME_PROCS"
            pm2 restart $NAME_PROCS
          fi
          if [ -z "$FILE_PROCS" ] && [ -z "$NAME_PROCS" ]; then
            echo "ℹ️  No other prod-* pm2 processes to restart"
          fi

          # Persist the process list so a server reboot resurrects prod-jin WITH its
          # node_args, instead of the stale saved definition that lacks them.
          pm2 save
          echo "✅ Prod services restarted"

      # #2447: the restart above can leave an orphan holding a port while pm2's
      # own copy crash-loops on EADDRINUSE. Fail the deploy unless every port's
      # listener is the pm2-managed process (or its child).
      - name: Assert pm2 owns every service port
        run: ./scripts/assert-pm2-listeners.sh prod "$ECOSYSTEM_FILE"
