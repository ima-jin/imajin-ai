name: Deploy to Prod

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/SHA to deploy'
        required: false
        default: 'main'

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /home/jin/prod/imajin-ai
    env:
      PATH: /home/jin/.nvm/versions/node/v22.22.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Live pm2 config location. The source of truth is deploy/ecosystem.prod.config.js
      # in this repo; the Sync step below copies it here on every deploy.
      ECOSYSTEM_FILE: /home/jin/prod/ecosystem.config.js

    steps:
      - name: Pull latest
        run: |
          git fetch origin --tags
          git reset --hard ${{ github.event.inputs.ref || github.ref_name }}

      - name: Sync pm2 ecosystem config
        # Copied before the build so any cold start during build.sh uses current
        # config. Previously this was a manual `cp` an operator had to remember,
        # which is the same "someone forgets" failure class as #1520 itself.
        run: |
          cp deploy/ecosystem.prod.config.js "$ECOSYSTEM_FILE"
          echo "✅ Synced ecosystem config to $ECOSYSTEM_FILE"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build changed apps
        # build-changed.sh walks the pnpm graph and only rebuilds apps affected
        # by the diff since the last successful build (tracked via .last-build-sha).
        # Falls back to full rebuild if .last-build-sha doesn't exist.
        run: ./scripts/build-changed.sh

      - name: Run migrations
        run: node scripts/migrate.mjs

      - name: Reap orphaned port squatters
        run: ./scripts/reap-orphans.sh prod

      - name: Restart prod services
        run: |
          # prod-jin is restarted from the ecosystem FILE, deliberately not by name.
          #
          # `pm2 restart <name>` reuses pm2's saved process definition, so changes to
          # the ecosystem file (notably prod-jin's `--env-file` node_args) are
          # silently ignored. That is exactly the #1520 failure mode: the process
          # came back up without AUTH_PRIVATE_KEY, signed vault entries with a
          # deterministic dev key, and reported nothing wrong.
          #
          # startOrRestart also covers the case where prod-jin is not running yet.
          pm2 startOrRestart "$ECOSYSTEM_FILE" --only prod-jin --update-env
          echo "✅ prod-jin restarted from $ECOSYSTEM_FILE"

          # Everything else keeps the previous name-based restart
          # (prod-events, prod-dykil, prod-coffee, prod-market, prod-learn, prod-links, …).
          PROD_PROCS=$(pm2 jlist | node -e "const procs = JSON.parse(require('fs').readFileSync(0)); console.log(procs.filter(p => p.name && p.name.startsWith('prod-')).map(p => p.name).join(' '));")
          OTHER_PROCS=$(echo "$PROD_PROCS" | tr ' ' '\n' | grep -v '^prod-jin$' | grep -v '^$' | tr '\n' ' ')
          if [ -n "$OTHER_PROCS" ]; then
            echo "Restarting: $OTHER_PROCS"
            pm2 restart $OTHER_PROCS
          else
            echo "ℹ️  No other prod-* pm2 processes to restart"
          fi

          # Persist the process list so a server reboot resurrects prod-jin WITH its
          # node_args, instead of the stale saved definition that lacks them.
          pm2 save
          echo "✅ Prod services restarted"
