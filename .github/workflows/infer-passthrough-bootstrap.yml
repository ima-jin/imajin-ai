name: Bootstrap inference gateway

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: infer-passthrough-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    # This dedicated host runner may invoke only the fixed root-owned service.
    # Never check out or execute repository code as root on this runner.
    runs-on: [self-hosted, infer-passthrough-gateway]
    environment: production
    steps:
      - name: Run trusted bootstrap
        run: sudo -n /usr/bin/systemctl start infer-passthrough-bootstrap.service
