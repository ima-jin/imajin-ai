name: Deploy to Dev

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# One dev deploy at a time. Two merges in quick succession produce two CI runs
# and therefore two Deploy to Dev runs; without this they run concurrently in
# the same /home/jin/dev/imajin-ai checkout (two pnpm installs + builds racing).
# cancel-in-progress stays false so a running deploy is never killed mid-pm2
# restart; GitHub still collapses older *pending* runs in the group, so the
# duplicate simply never starts. Mirrors deploy-prod's `concurrency: deploy-prod`.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, imajin]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: /home/jin/dev/imajin-ai
    env:
      PATH: /home/jin/.nvm/versions/node/v22.22.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      ECOSYSTEM_FILE: /home/jin/dev/ecosystem.config.js

    steps:
      - name: Pull latest
        run: |
          # --prune: stale remote-tracking refs (e.g. a deleted `docs` branch)
          # block fetching a new nested branch like `docs/foo` with a D/F ref
          # conflict (see #2239).
          git fetch --prune origin main
          git reset --hard origin/main

      - name: Sync pm2 ecosystem config
        # Mirrors deploy-prod. Without this ~/dev/ecosystem.config.js is a
        # hand-copied snapshot (last touched 2026-07-16) — build.sh cold-starts
        # new services from it, so dev-corpus never existed on the box.
        run: |
          cp deploy/ecosystem.dev.config.js "$ECOSYSTEM_FILE"
          echo "✅ Synced ecosystem config to $ECOSYSTEM_FILE"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      # --ignore-scripts above blocks install/postinstall scripts for every
      # dependency (githubactions:S6505). apps/corpus's better-sqlite3 is the
      # one dependency dev-corpus can't run without: its install script
      # compiles/fetches the native binding pm2 loads at runtime, so it's
      # rebuilt individually here rather than re-enabling scripts globally.
      - name: Rebuild native dependencies
        run: pnpm rebuild -r better-sqlite3

      # VAULT_PATH single source of truth (#2487), same check as deploy-prod: the
      # provisioning step below must write to the vault file dev-jin reads. See
      # deploy-prod.yml for why pm2's jlist goes through a 0600 temp file.
      - name: Check VAULT_PATH single source of truth
        run: |
          umask 077
          PM2_JLIST="$(mktemp)"
          trap 'rm -f "$PM2_JLIST"' EXIT
          pm2 jlist > "$PM2_JLIST"
          node scripts/check-vault-path-consistency.mjs --env dev --pm2-jlist-file "$PM2_JLIST" --ecosystem-file "$ECOSYSTEM_FILE"

      # Service bootstrap identities (#2442), same step as deploy-prod. Before
      # check-env (build-changed.sh -> build.sh); a failure fails the deploy
      # before any restart. See deploy-prod.yml for the reasoning.
      - name: Build workspace packages (provisioning prerequisite)
        run: pnpm -r --filter './packages/**' build

      - name: Provision service bootstrap identities
        env:
          # pm2 sets NODE_ENV for dev-jin in the ecosystem file, not .env.local.
          NODE_ENV: production
        # dev-jin is `npm start` in apps/kernel, which loads apps/kernel/.env.local;
        # --env dev takes VAULT_PATH from deploy/ecosystem.dev.config.js (the step
        # above fails the deploy if .env.local sets a different one, #2487).
        run: node --env-file=apps/kernel/.env.local scripts/provision-service-bootstrap.mjs --all --env dev

      - name: Build changed apps
        run: ./scripts/build-changed.sh

      - name: Run migrations
        run: node scripts/migrate.mjs

      - name: Reap orphaned port squatters
        run: ./scripts/reap-orphans.sh dev

      - name: Restart dev services
        run: |
          DEV_PROCS=$(pm2 jlist | node -e "const procs = JSON.parse(require('fs').readFileSync(0)); console.log(procs.filter(p => p.name && p.name.startsWith('dev-')).map(p => p.name).join(' '));")
          if [ -z "$DEV_PROCS" ]; then
            echo "⚠️  No dev-* pm2 processes found to restart"
            exit 0
          fi
          # Services declared in the ecosystem file are restarted FROM the file: a
          # name-based `pm2 restart` reuses the saved definition, so a service pm2
          # still has saved as `npm start` would keep the npm wrapper that orphans
          # next-server on restart (#2447). Anything not in the file keeps the
          # name-based restart.
          source scripts/lib/pm2-owned.sh
          # dev-kernel-cron (#2550) is the scheduler for the kernel's cron jobs.
          # DEV_PROCS only lists what pm2 already runs, so on the first deploy
          # that ships it (or after it was deleted) it would never be started and
          # no job would ever fire. Always include it: startOrRestart below starts
          # it from the ecosystem file when pm2 doesn't know it yet.
          case " $DEV_PROCS " in
            *" dev-kernel-cron "*) ;;
            *) DEV_PROCS="$DEV_PROCS dev-kernel-cron" ;;
          esac
          FILE_PROCS=""
          NAME_PROCS=""
          for proc in $DEV_PROCS; do
            if ecosystem_has_app "$proc" "$ECOSYSTEM_FILE"; then
              FILE_PROCS="${FILE_PROCS:+$FILE_PROCS,}$proc"
            else
              NAME_PROCS="$NAME_PROCS $proc"
            fi
          done
          if [ -n "$FILE_PROCS" ]; then
            echo "Restarting from $ECOSYSTEM_FILE: $FILE_PROCS"
            pm2 startOrRestart "$ECOSYSTEM_FILE" --only "$FILE_PROCS" --update-env
          fi
          if [ -n "$NAME_PROCS" ]; then
            echo "Restarting by name:$NAME_PROCS"
            pm2 restart $NAME_PROCS
          fi
          echo "✅ Dev services restarted"

      # #2447: fail the deploy unless every port's listener is the pm2-managed
      # process (or its child), not an orphan surviving the restart.
      - name: Assert pm2 owns every service port
        run: ./scripts/assert-pm2-listeners.sh dev "$ECOSYSTEM_FILE"
