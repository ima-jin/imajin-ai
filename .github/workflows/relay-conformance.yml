name: DFOS Relay Conformance

on:
  workflow_dispatch:
    inputs:
      relay_url:
        description: 'Relay URL to test against'
        required: false
        # dev-registry.imajin.ai was retired when services moved to the
        # one-domain-per-env, path-prefixed layout (#2116): it now 301s to
        # dev-jin.imajin.ai/registry/..., and a 301 on a POST is followed as
        # a GET by both curl -L and Go's net/http, landing on a route the
        # relay never registered for GET — hence the 404 on every request.
        # The relay is mounted at apps/kernel/app/registry/relay/[[...path]]
        # under the registry service's own path prefix, so the correct
        # target is the new host with that prefix baked in, no redirect hop.
        default: 'https://dev-jin.imajin.ai/registry/relay'
        type: string
  schedule:
    # Weekly safety net (Mondays 08:00 UTC) against the default dev relay.
    # Manual `workflow_dispatch` remains the primary way we run these from live.
    - cron: '0 8 * * 1'

jobs:
  conformance:
    name: DFOS Conformance Suite
    runs-on: imajin-self-hosted
    # `imajin-ci:latest` was a runner-local tag on the imajin-self-hosted host
    # that was never actually produced by any Dockerfile or publish workflow
    # in this repo — there was no image to pin a digest from, and the
    # scheduled run had been silently failing at "Initialize containers" for
    # three weeks straight (2026-08-24, 08-31, 09-07) because the tag simply
    # didn't exist on the runner. Switching to the same `ci-runner` image
    # ci.yml already uses: it only needs git (to clone dfos) plus whatever
    # actions/setup-go@v5 needs to unpack its own toolchain (curl + tar),
    # all of which .github/docker/Dockerfile.ci installs.
    container:
      # Pinned to the immutable digest `build-ci-image.yml` published on main
      # for commit 30643d7f (githubactions:S6596 — no floating tags). Bump by
      # re-running that workflow (push to .github/docker/Dockerfile.ci or
      # workflow_dispatch) and copying the new `containerimage.digest` here.
      image: ghcr.io/ima-jin/ci-runner@sha256:fcc0fb4320e709976a93ac9f940bb2f532a82d3e7f953798c48dc4b0d8435681
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Clone DFOS repo
        run: git clone --depth 1 https://github.com/metalabel/dfos.git

      - name: Run conformance tests
        # Conformance suite moved to its own Go module: packages/relay-conformance
        # (was packages/dfos-web-relay/conformance — that path is now empty and
        # silently passed zero tests).
        working-directory: dfos/packages/relay-conformance
        env:
          RELAY_URL: ${{ github.event.inputs.relay_url || 'https://dev-jin.imajin.ai/registry/relay' }}
        run: |
          echo "🔍 Testing relay at: $RELAY_URL"
          go test -v -count=1 ./... 2>&1 | tee results.txt

          # Summary
          echo ""
          echo "=== SUMMARY ==="
          PASS=$(grep -c "^--- PASS:" results.txt || true) # ci-guard: allow grep -c returns 1 when count is zero; value is used in arithmetic below
          FAIL=$(grep -c "^--- FAIL:" results.txt || true) # ci-guard: allow grep -c returns 1 when count is zero; value is used in arithmetic below
          TOTAL=$((PASS + FAIL))
          echo "✅ Passed: $PASS"
          echo "❌ Failed: $FAIL"
          echo "📊 Total: $TOTAL"

          # Fail if zero tests ran — an empty/moved suite must NOT report green.
          # (This is the silent-green guard: no tests == broken CI, not success.)
          if [ "$TOTAL" -eq 0 ]; then
            echo ""
            echo "=== ERROR: no conformance tests ran (0 total) ==="
            echo "The suite path may have moved again, or 'go test' failed to build."
            echo "Check dfos/packages/relay-conformance and the go.mod there."
            exit 1
          fi

          # Fail the job if any tests failed.
          if [ "$FAIL" -gt 0 ]; then
            echo ""
            echo "=== FAILING TESTS ==="
            grep "^--- FAIL:" results.txt
            exit 1
          fi
