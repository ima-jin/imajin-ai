name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  check-migrations:
    name: Check Migrations
    runs-on: imajin-self-hosted
    container:
      image: ghcr.io/ima-jin/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify migration artifacts
        run: ./scripts/check-migrations.sh

  audit:
    name: Security Audit
    runs-on: imajin-self-hosted
    container:
      image: ghcr.io/ima-jin/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9

      # Deliberately no `cache: 'pnpm'` here, unlike every other job. This job
      # never runs `pnpm install` (see below), so the pnpm store is never
      # populated — and setup-node's post-job cache *save* step then hard-fails
      # with "Path Validation Error: Path(s) specified in the action for caching
      # do(es) not exist". That failure is invisible while the lockfile is
      # untouched, because a cache hit skips the save entirely; it only appears
      # on PRs that change pnpm-lock.yaml, which is what made it look like a
      # security finding on #1569. `pnpm audit` reads the lockfile and needs
      # neither node_modules nor a warm store, so there is nothing to cache.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `pnpm install` here on purpose. `pnpm audit` resolves from the
      # lockfile and does not need node_modules — and installing was the ONLY
      # step that had ever failed this job: all 57 historical "Security Audit"
      # failures were `Install dependencies`, never a finding (#1559). Dropping
      # it removes a failure mode that masqueraded as a security signal, and
      # takes the job's runtime with it.
      #
      # Blocking, but only on advisories NOT already in .github/audit-baseline.json.
      # This step previously ended in `|| echo "::warning::..."`, which swallowed
      # the exit code, so the job could not fail on a finding at all. Simply
      # removing the `|| echo` would red-light every unrelated PR the next time an
      # upstream CVE lands, which is how the suppression got added in the first
      # place. The gate ratchets instead: known debt is listed in the baseline,
      # anything new fails here.
      - name: Audit dependencies (critical/high)
        run: |
          # `pnpm audit` exits non-zero whenever it reports anything at all, so
          # its exit code carries no signal we are not already reading out of the
          # JSON. The gate decides; a missing or unparseable report still hard-
          # fails (exit 2) inside audit-gate.mjs, so a broken pipeline cannot
          # quietly pass.
          pnpm audit --prod --audit-level high --json > audit-report.json || true # ci-guard: allow pnpm audit exits non-zero on any finding; gate decides below
          node scripts/audit-gate.mjs audit-report.json

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: imajin-self-hosted
    container:
      image: ghcr.io/ima-jin/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # cid, vault-core, db, fair, config, ui, and pay resolve via their
      # built dist/ types (not source), so they must be built before any
      # consumer's typecheck can resolve them. cid first — vault-core's
      # declarations reference it.
      - name: Build workspace type dependencies
        run: pnpm --filter @imajin/cid --filter @imajin/vault-core --filter @imajin/db --filter @imajin/fair --filter @imajin/config --filter @imajin/ui --filter @imajin/pay build

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: imajin-self-hosted
    container:
      image: ghcr.io/ima-jin/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      # Handed to the SonarCloud job rather than re-running the suite there.
      # Without a coverage report the scanner reports new_coverage=0.0 and fails
      # the quality gate on every PR that adds code.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build
    runs-on: imajin-self-hosted
    container:
      image: ghcr.io/ima-jin/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING || 'postgresql://ci:ci@localhost:5432/ci_build' }}

  ci-guards:
    name: CI Guards
    runs-on: imajin-self-hosted
    container:
      image: ghcr.io/ima-jin/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Producer checks (every required context has a job that emits it) are a
      # real gate and run offline against .github/required-checks.json.
      #
      # The drift check against the LIVE ruleset is advisory: reading rulesets
      # needs an admin-scoped token, which secrets.GITHUB_TOKEN is not, so it
      # emits a ::warning:: and continues. Until RULESET_READ_TOKEN is
      # provisioned, this workflow does NOT verify that GitHub's actual branch
      # protection matches what the repo declares. Set CI_GUARD_REQUIRE_RULESET=1
      # to promote that half to blocking once the token exists.
      - name: Required-context producer guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RULESET_READ_TOKEN: ${{ secrets.RULESET_READ_TOKEN }}
        run: node scripts/ci-guard-required-contexts.mjs

      - name: Swallowed-assertion guard
        run: node scripts/ci-guard-no-swallowed-assertions.mjs

  sonarcloud:
    name: SonarCloud
    runs-on: imajin-self-hosted
    container:
      image: ghcr.io/ima-jin/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Needs the coverage artifact produced by the Test job. This also means a
    # failing suite short-circuits the scan, which is fine — the gate would be
    # judging an incomplete picture anyway.
    needs: [test]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so SonarCloud can assign blame and compute new-code accurately.
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          # sonar.javascript.lcov.reportPaths points here, relative to the repo root.
          path: coverage

      - name: Verify coverage report is present
        # Fail loudly rather than let the scan proceed and silently report 0%
        # coverage, which reads as "untested code" instead of "broken pipeline".
        run: |
          test -s coverage/lcov.info || {
            echo "::error::coverage/lcov.info missing or empty — SonarCloud would report 0% coverage"
            exit 1
          }
          echo "lcov.info: $(grep -c '^SF:' coverage/lcov.info) source files"

      # A missing token must not be a silent pass. On a fork the secret is
      # genuinely unavailable and skipping is correct. On a same-repo run it
      # means the token was never set, was rotated, or expired — and the job
      # would go green having analysed nothing. That is #1539's failure mode
      # with a different cause, and it is the last silent no-op #1559 found in
      # this file, so it fails loudly instead.
      - name: Require SONAR_TOKEN on same-repo runs
        if: ${{ env.SONAR_TOKEN == '' && github.event.pull_request.head.repo.fork != true }}
        run: |
          echo "::error::SONAR_TOKEN is not set on a same-repo run — the quality gate would pass having scanned nothing."
          exit 1

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6

      - name: Skip note (fork without SONAR_TOKEN)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::notice::SONAR_TOKEN not set — skipping SonarCloud scan (expected on forks)."
