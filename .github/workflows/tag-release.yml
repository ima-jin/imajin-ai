name: Tag Release

# Runs on every push to main, but only actually does anything when that push
# is a merged release PR (see release.yml) — i.e. its real commit message
# starts with "release: v". Everything else is a no-op after one cheap
# `git log` check.
#
# No bypass token, no new approval gate: this only ever pushes a TAG (never
# to main), and the actual prod deploy still goes through deploy-prod.yml's
# existing `production` GitHub Environment required-reviewer gate — the same
# gate every other prod deploy already uses.
#
# After tagging, the `publish-npm` job publishes every publishable package to
# npmjs at that version (#2578) by calling publish-packages.yml — the same
# publish logic as a manual dispatch, idempotent per package. It runs as its
# own job, parallel to (not behind) the prod-deploy approval, so a pending
# `production` review never delays it and a publish failure never touches the
# deploy dispatch.
#
# Manual recovery (#2622): `workflow_dispatch` with the release MERGE commit's
# sha runs the very same steps against that commit (its HEAD^2 carries the
# release message), for a release whose automatic tagging step failed. It
# still only pushes a tag and dispatches deploy-prod.yml, so the `production`
# environment gate applies unchanged. The sha must already be on main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Release merge commit on main to tag and deploy (its HEAD^2 must be the `release: vX.Y.Z` commit)'
        required: true
        type: string

# Read-only by default; the one job that writes (tagging) and the publish call
# each declare exactly what they need at job level.
permissions:
  contents: read

jobs:
  tag-and-deploy:
    name: Tag Release
    runs-on: ubuntu-latest
    permissions:
      # Pushes the annotated release tag (never to main).
      contents: write
      # Only used to dispatch deploy-prod.yml (a workflow_dispatch call, not a
      # push) — see the "Dispatch the prod deploy" step for why that's needed
      # and why it doesn't bypass anything.
      actions: write
    # Job-level (was workflow-level before #2578): the group only needs to
    # serialize tagging + deploy dispatch. Held across the minutes-long npm
    # publish below, GitHub's single pending-run slot could cancel a queued
    # release-commit run behind it, and that release would never be tagged.
    concurrency:
      group: tag-release
      cancel-in-progress: false
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: need every existing tag (to check for a
          # collision) and, when this push is a merge commit, its second
          # parent (see the next step).
          fetch-depth: 0
          fetch-tags: true

      - name: Determine whether this push is a release commit
        id: check
        # main is merged via GitHub's default "create a merge commit"
        # strategy in this repo (see `git log --merges` on main), so on a
        # merged PR, `github.event.head_commit.message` is the generic
        # "Merge pull request #N from ..." message — NOT the release PR's
        # own "release: vX.Y.Z" commit message. Read the real commit the
        # same way scripts/ci-guard-version-bump.mjs does: when HEAD is a
        # two-parent merge commit, HEAD^2 is the actual tip of the merged
        # branch (release/vX.Y.Z has exactly one commit); fall back to HEAD
        # itself for a fast-forward/squash/direct push.
        #
        # On a workflow_dispatch the commit to inspect (and later tag) is the
        # `sha` input instead of the checked-out HEAD. The input reaches the
        # script through env only (never interpolated into the shell text),
        # must look like a git sha, and must already be on main.
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$DISPATCH_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "::error::sha input is not a git commit sha: $DISPATCH_SHA"
              exit 1
            fi
            TARGET="$(git rev-parse --verify "${DISPATCH_SHA}^{commit}")"
            if ! git merge-base --is-ancestor "$TARGET" origin/main; then
              echo "::error::$TARGET is not on main — refusing to tag it."
              exit 1
            fi
          else
            TARGET="$(git rev-parse HEAD)"
          fi
          echo "target_sha=$TARGET" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "${TARGET}^2" >/dev/null 2>&1; then
            MESSAGE="$(git log -1 --format=%B "${TARGET}^2")"
          else
            MESSAGE="$(git log -1 --format=%B "$TARGET")"
          fi
          FIRST_LINE="$(head -n1 <<< "$MESSAGE")"
          echo "first_line=$FIRST_LINE" >> "$GITHUB_OUTPUT"
          if [[ "$FIRST_LINE" == "release: v"* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release commit (first line: \"$FIRST_LINE\") — nothing to do."
          fi

      - name: Extract the version
        id: version
        if: steps.check.outputs.is_release == 'true'
        env:
          FIRST_LINE: ${{ steps.check.outputs.first_line }}
        # The version is the leading `vX.Y.Z` token; trailing text after
        # whitespace (e.g. " (re-stamp after main merge into release branch)")
        # is allowed, a malformed version still fails (#2622). The parser lives
        # in scripts/lib/parse-release-version.sh so a test can cover it.
        run: |
          # shellcheck source=scripts/lib/parse-release-version.sh
          source scripts/lib/parse-release-version.sh
          if ! VERSION="$(parse_release_version "$FIRST_LINE")"; then
            echo "::error::Could not parse a vX.Y.Z version out of commit message: $FIRST_LINE"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create the annotated tag (idempotent)
        if: steps.check.outputs.is_release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.check.outputs.target_sha }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ℹ️  Tag $TAG already exists — skipping creation (still checking dispatch below)."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "release: $TAG" "$TARGET_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Check for an existing prod-deploy dispatch of this tag
        id: guard
        if: steps.check.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        # Idempotency for re-runs of this job (e.g. a later step failed and
        # someone re-runs it): don't dispatch a second prod deploy for a tag
        # this workflow already dispatched one for.
        run: |
          EXISTING=$(gh run list --workflow deploy-prod.yml --json headBranch,event \
            --jq "[.[] | select(.headBranch == \"$TAG\" and .event == \"workflow_dispatch\")] | length")
          echo "existing=$EXISTING" >> "$GITHUB_OUTPUT"

      - name: Dispatch the prod deploy
        if: ${{ steps.check.outputs.is_release == 'true' && steps.guard.outputs.existing == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        # The tag push above used the default GITHUB_TOKEN, so it does NOT
        # fire deploy-prod.yml's `push: tags: ['v*']` trigger — GitHub
        # suppresses further workflow runs from GITHUB_TOKEN-authored
        # activity to prevent recursive workflow chains. `workflow_dispatch`
        # is exempt from that suppression, so dispatch it explicitly.
        # `-f ref=` sets deploy-prod.yml's own `ref` input explicitly (its
        # declared default is 'main', which would deploy the wrong thing
        # here) in addition to `--ref`, which selects which commit to run
        # the workflow definition from. This still goes through
        # deploy-prod.yml's `environment: production` required-reviewer
        # gate — nothing here bypasses that approval.
        run: gh workflow run deploy-prod.yml --ref "$TAG" -f ref="$TAG"

  publish-npm:
    name: Publish packages to npmjs
    needs: tag-and-deploy
    if: ${{ needs.tag-and-deploy.outputs.is_release == 'true' }}
    # A called workflow can't hold more permission than its caller grants.
    # publish-packages.yml's job declares `packages: write` (for its GitHub
    # Packages leg, which this call doesn't use), so it must be granted here
    # or the call is rejected at startup.
    permissions:
      contents: read
      packages: write
    # Publish exactly what the tag points at, to npmjs only. `package: all`
    # expands to ALL_PACKAGES in publish-packages.yml (the single source of
    # truth for what is publishable). Already-published versions are skipped
    # per package (scripts/publish-package.sh), so re-running this job after a
    # partial failure resumes instead of failing on the first package that
    # already went out. Any other publish failure fails this job, and with it
    # the run.
    uses: ./.github/workflows/publish-packages.yml
    with:
      package: all
      registries: npmjs
      ref: ${{ needs.tag-and-deploy.outputs.tag }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
